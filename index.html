<!-- Initialize theme-color synchronously before paint, based on the stored
     theme preference, so the status bar doesn't flash dark→light (or vice
     versa) for one frame during app launch. -->
<meta name="theme-color" content="#f5f2ed" id="themeColorMeta">
<script>
// Pre-IIFE flash-of-wrong-theme guard. Runs before stylesheet parse so the
// initial paint matches the user's saved theme. localStorage may throw in
// Safari Private Mode — we fall back to the default light theme silently
// because there is no error logging available this early in the page (the
// _devWarn helper is defined later, inside the main IIFE).
(function(){
  try{
    var dark=localStorage.getItem('ae_theme')==='dark';
    var col=dark?'#3a2c2a':'#f9e9d8';
    var m=document.getElementById('themeColorMeta');if(m)m.content=col;
    document.documentElement.style.colorScheme=dark?'dark':'light';
  }catch(e){/* localStorage unavailable — default theme is fine */}
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent makes the status bar transparent (time/WiFi/battery
     overlay the page bg) so the canvas can extend up under the notch /
     Dynamic Island instead of sitting BELOW an opaque white bar. The
     `safeTop` value (read from env(safe-area-inset-top) in JS) shifts game
     UI below the notch. Required for true edge-to-edge PWA on iOS. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stray Arrows">
<meta name="description" content="Untangle stray arrows! Tap arrows to escape in the right order.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;display:flex;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Nunito',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* No safe-area padding — canvas extends edge-to-edge under the notch.
   Body bg shows a faint dot pattern in the letterbox area on tablets /
   landscape, so the empty space doesn't feel empty. iPhone fills the
   viewport with canvas so the body bg isn't visible there. */
body.light{
  background-color:#ede7d7;
  background-image:radial-gradient(circle,rgba(0,0,0,.05) 1px,transparent 1px);
  background-size:22px 22px;
}
body.dark{
  background-color:#0d0d1f;
  background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:22px 22px;
}
canvas{display:block}
/* When the screen aspect ratio differs from 390:844 (iPad in either
   orientation, desktop browser, etc.) the canvas doesn't fill the viewport.
   Round its corners and lift it with a soft shadow so it reads as a
   deliberate "floating game window" instead of a cropped panel.
   resize() toggles `body.letterboxed` based on actual fit. */
body.letterboxed canvas{
  border-radius:18px;
  box-shadow:0 10px 50px rgba(0,0,0,.18);
}
</style>
</head>
<body class="light">
<canvas id="c"></canvas>
<!-- v2 retired levels-baked.js (4.5 MB of pre-baked procedural layouts).
     The Rush Hour import now densely covers levels 11-6000, so BAKED
     never won the lookup chain in practice. Removing it shaves ~1-2 s
     off cold start on low-end Android. The file is kept on disk but
     out of the bundle; rebuild it with `node tools/bake-levels-v2.js`
     if you ever need to fall back. -->
<!-- Handcrafted milestone levels — tutorial (1-10) plus picture/showcase
     levels at key milestones. These take priority over procedural / baked
     when their level number matches.
     `defer` lets the browser parse this 3.5 MB blob in parallel with the
     inline IIFE below instead of blocking initial render. By the time the
     player taps "play", DOMContentLoaded has fired and HANDCRAFTED_LEVELS
     is populated — generateLevel() never sees it undefined in practice. -->
<script src="handcrafted-levels.js?v=25" defer></script>
<!-- v1.0.19: removed the Rush Hour import chain entirely. Boards were a
     1:1 lift of a sliding-block puzzle dataset and didn't feel like
     OUR game once playtested — flat, repetitive, mid-game pacing
     broke. Level supply is now: handcrafted (~460 hand-tuned levels
     including the tutorial and milestones) → procedural baker for
     everything past that. Simpler, smaller bundle, content quality
     under our control. -->

<script>
// Surface any uncaught error visibly — without this a JS error gives a blank
// white screen with no clue. Persists in localStorage for post-mortem.
// The empty inner catches here are deliberate: if the error handler itself
// throws, re-throwing would cascade into the same handler, and since this
// runs before _devWarn is defined we have no central logger to call.
window.addEventListener('error', function(e){
  try{
    localStorage.setItem('ae_lasterror', (e.message||'?')+' @ '+(e.filename||'?')+':'+(e.lineno||'?')+':'+(e.colno||'?'));
    var div=document.createElement('div');
    div.style.cssText='position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font:12px monospace;padding:10px;z-index:99999;white-space:pre-wrap';
    div.textContent='JS ERROR: '+(e.message||'?')+'\n@ '+(e.filename||'?')+':'+(e.lineno||'?');
    document.body.appendChild(div);
  }catch(_){/* secondary failure inside the error reporter — give up to avoid recursion */}
});
window.addEventListener('unhandledrejection', function(e){
  try{ localStorage.setItem('ae_lastreject', String(e.reason||'?')); }catch(_){/* localStorage unusable */}
});
</script>
<script>
// Polyfill CanvasRenderingContext2D.roundRect for iOS 15.x and 16.0–16.3
// (only available natively in 16.4+). Without this the app instantly throws
// "X.roundRect is not a function" → white screen on older devices. Apple
// still allows iOS 15 in the App Store, so we ship the polyfill.
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r=[r,r,r,r];
    else if(r.length===1)r=[r[0],r[0],r[0],r[0]];
    else if(r.length===2)r=[r[0],r[1],r[0],r[1]];
    const [tl,tr,br,bl]=r;
    this.moveTo(x+tl,y);
    this.arcTo(x+w,y,   x+w,y+h, tr);
    this.arcTo(x+w,y+h, x,  y+h, br);
    this.arcTo(x,  y+h, x,  y,   bl);
    this.arcTo(x,  y,   x+w,y,   tl);
    this.closePath();
    return this;
  };
}
// Wrap everything in IIFE to prevent single-letter global variable conflicts
// with browser extensions (crypto wallets, ad blockers, etc.)
(function(){
// ================================================================
//  ARROW ESCAPE — Minimalist Puzzle Game
// ================================================================
const C=document.getElementById('c'),X=C.getContext('2d');
const W=390,H=844;

// Centralised swallow-and-record for non-fatal errors. Replaces what used
// to be 18 empty `catch(e){}` blocks scattered through this file. Each
// call records {time, stage, message} into localStorage (ring buffer of
// the last 20 entries) so a real-device crash report can pull recent
// pre-crash warnings, and surfaces to console when ae_debug='1' is set
// — which is how QA toggles verbose mode without a separate build flag.
// The inner try/catch is the one place an empty catch is justified: if
// localStorage itself is throwing (quota / private mode), there's nothing
// useful we can do, and re-throwing would brick the caller.
function _devWarn(stage, err){
  try{
    const msg = ((err && err.message) || err);
    if (localStorage.getItem('ae_debug') === '1') console.warn('[ae]', stage, msg);
    const log = JSON.parse(localStorage.getItem('ae_errlog') || '[]');
    log.push({t: Date.now(), s: stage, m: String(msg).slice(0, 200)});
    if (log.length > 20) log.splice(0, log.length - 20);
    localStorage.setItem('ae_errlog', JSON.stringify(log));
  } catch(_) { /* localStorage unusable — drop the warning silently */ }
}

// v1.0.19: removed the Rush Hour chunk loader (was here). All level
// supply now comes from handcrafted-levels.js or the procedural baker
// in generateLevel() — no on-demand network fetches required.

// Single source of truth for the displayed app version. Bump alongside
// CFBundleShortVersionString in ios/App/App.xcodeproj/project.pbxproj.
const APP_VERSION='v1.0.21';
// App Store deep link — used by the in-app "update available" nudge.
const APP_STORE_URL='https://apps.apple.com/app/stray-arrows/id6763406927';
const PI=Math.PI,TAU=PI*2,sin=Math.sin,cos=Math.cos,abs=Math.abs,floor=Math.floor,min=Math.min,max=Math.max,sqrt=Math.sqrt;
const rnd=(a=0,b=1)=>Math.random()*(b-a)+a;
const rndI=(a,b)=>floor(rnd(a,b+1));
const clp=(v,lo,hi)=>max(lo,min(hi,v));
const lrp=(a,b,t)=>a+(b-a)*t;

// ================================================================
//  THEME
// ================================================================
// Background cache dirty flag — flipped by applyTheme()/resize() so the next
// frame regenerates the offscreen background canvas instead of reusing it.
let _bgCacheDirty=true;
let darkMode=localStorage.getItem('ae_theme')==='dark';
// Optional accessibility toggle. When on, the theme palette flips to maximum
// contrast — pure black/white surfaces, saturated accents, no rgba overlays.
// Sits orthogonally to darkMode (you can have HC light or HC dark). Same idea
// as iOS Increase Contrast / WCAG AAA pairings. Persists in localStorage so
// the flag survives reload.
let highContrast=localStorage.getItem('ae_contrast')==='high';
// prefers-reduced-motion: when true, code paths that draw decorative motion
// (background floating arrows, hint pulse, confetti, slide-in animations)
// either skip or use a reduced variant. Game-essential motion (arrow swoosh
// when escaping, completion fade) still runs — without those the game state
// becomes unreadable.
let reducedMotion=false;
try{
  const _rm=matchMedia('(prefers-reduced-motion: reduce)');
  reducedMotion=_rm.matches;
  _rm.addEventListener?.('change',e=>{reducedMotion=e.matches});
}catch(e){_devWarn('prefers-reduced-motion',e);}
function applyTheme(){
  document.body.className=darkMode?'dark':'light';
  // color-scheme tells the browser to render native UI (scrollbars, form
  // inputs, text selection, cursor) in the matching theme. Prevents stray
  // light scrollbars in dark mode, etc.
  document.documentElement.style.colorScheme=darkMode?'dark':'light';
  _bgCacheDirty=true;
  // Match status bar / notch / nav bar to app theme
  const col=darkMode?'#3a2c2a':'#f9e9d8';
  const m=document.getElementById('themeColorMeta');
  if(m)m.content=col;
  // Capacitor StatusBar — full edge-to-edge.
  //   1. setOverlaysWebView({overlay:true}) — webview draws UNDER the status bar
  //      so the app gradient reaches the very top of the screen.
  //   2. setBackgroundColor({color:'#00000000'}) — transparent. With overlay=true,
  //      any non-transparent color would paint OVER our gradient on Android <15,
  //      re-introducing the visible top strip we're trying to remove.
  //   3. setStyle({DARK|LIGHT}) — controls only the icon/text color drawn by the
  //      system on top of our content (no background effect).
  // NavigationBar plugin similarly takes a transparent color so the gradient
  // shows through on devices with 3-button nav.
  try{
    if(typeof Capacitor!=='undefined'&&Capacitor.Plugins.StatusBar){
      Capacitor.Plugins.StatusBar.setOverlaysWebView({overlay:true}).catch(e=>_devWarn('StatusBar.setOverlaysWebView',e));
      Capacitor.Plugins.StatusBar.setBackgroundColor({color:'#00000000'}).catch(e=>_devWarn('StatusBar.setBackgroundColor',e));
      Capacitor.Plugins.StatusBar.setStyle({style:darkMode?'DARK':'LIGHT'});
    }
    if(typeof Capacitor!=='undefined'&&Capacitor.Plugins.NavigationBar){
      Capacitor.Plugins.NavigationBar.setColor({color:'#00000000'}).catch(e=>_devWarn('NavigationBar.setColor',e));
    }
  }catch(e){_devWarn('applyTheme.statusBar',e);}
}
applyTheme();

// Theme palette. Two MUTUALLY-CONSISTENT modes — light has cream bg + dark
// ink-on-paper buttons; dark has navy bg + lifted dark-grey buttons with
// light text (like iOS dark mode). No mixing of light buttons on dark bg.
//
// Supplemental tokens (radii, motion durations, letter-spacing, shadow
// scale) added in v2 — see design-research.md. Single source of truth for
// every visual constant in the canvas renderer; if you find yourself
// hardcoding a number in drawArrow/drawBtn, add a token here first.
const TH={
  // bg/surface/text/btn etc. all special-case `highContrast` so the toggle
  // is one-stop: flip the flag, palette inverts to pure-contrast variants.
  // Non-affected keys (success, warning, star, gridLine, cardBg, shadow
  // tokens) keep their normal-mode values — those are decoration, not
  // legibility-critical.
  // ----- v2.5 "Sunset Macaron" palette -----
  // Inspired by Monument Valley's macaron / pastille tones. Light mode
  // is warm peach cream + dusty coral; dark mode is deep aubergine
  // (warm brown-purple, not navy) + salmon. Accent stays gold-warm
  // because golden coins/stars need a saturated push to read against
  // these mid-toned bgs. Replaces the previous Bakery cream + cold
  // navy combo per user feedback ("ты всё в синих делаешь").
  get bg(){return highContrast?(darkMode?'#000000':'#ffffff'):(darkMode?'#3a2c2a':'#f9e9d8')},
  get surface(){return highContrast?(darkMode?'#0a0a0a':'#ffffff'):(darkMode?'#4a3a37':'#fef4e6')},
  get border(){return highContrast?(darkMode?'#ffffff':'#000000'):(darkMode?'rgba(255,255,255,.12)':'rgba(74,58,55,.12)')},
  // Screen-level text — espresso-brown on light, warm cream on dark
  get text(){return highContrast?(darkMode?'#ffffff':'#000000'):(darkMode?'#f5e8de':'#3a2c28')},
  get textSec(){return highContrast?(darkMode?'#cccccc':'#333333'):(darkMode?'#c2a9a0':'#8a6f66')},
  get textDim(){return highContrast?(darkMode?'#999999':'#666666'):(darkMode?'rgba(245,232,222,.40)':'rgba(58,44,40,.35)')},
  // Button-local
  get btnText(){return highContrast?(darkMode?'#ffffff':'#000000'):(darkMode?'#f5e8de':'#3a2c28')},
  get btnTextSec(){return highContrast?(darkMode?'#cccccc':'#333333'):(darkMode?'#c2a9a0':'#8a6f66')},
  // Accent — dusty coral on light, warm salmon on dark. Both sit
  // happily on the warm bgs without the previous gold-on-navy
  // "chocolate" muddiness.
  get accent(){return highContrast?(darkMode?'#ffd700':'#0033cc'):(darkMode?'#f0a890':'#d68f7a')},
  get accentDeep(){return darkMode?'#c47863':'#a86650'},
  // Decoration colours — kept warm-family (no cold blues anywhere)
  get success(){return darkMode?'#9ec79e':'#6e9c6e'},
  get warning(){return darkMode?'#e8b585':'#c08660'},
  get star(){return darkMode?'#f0c478':'#c89248'},
  get arrow(){return highContrast?(darkMode?'#ffffff':'#000000'):(darkMode?'#e8d5c0':'#3a2c28')},
  get arrowBlock(){return highContrast?'#ff0000':(darkMode?'#e88a78':'#bf5a44')},
  get arrowShadow(){return highContrast?'rgba(0,0,0,0)':(darkMode?'rgba(0,0,0,.32)':'rgba(74,58,55,.10)')},
  get arrowGlow(){return darkMode?'rgba(240,168,144,.22)':'rgba(214,143,122,.18)'},
  get gridLine(){return darkMode?'rgba(245,232,222,.05)':'rgba(74,58,55,.05)'},
  get cardBg(){return darkMode?'rgba(245,232,222,.05)':'rgba(74,58,55,.04)'},
  // Buttons: lifted surface above bg. Bumped dark-mode opacity from .08 to
  // .14 in v2 — the .08 sat right at WCAG AA borderline against the
  // #15152a navy and read as "JS-ish flat" instead of solid card.
  // High-contrast: solid surfaces, no transparency — required for AAA.
  get btnBg(){return highContrast?(darkMode?'#1a1a1a':'#f0f0f0'):(darkMode?'rgba(255,255,255,.14)':'rgba(255,255,255,.7)')},
  get btnHover(){return highContrast?(darkMode?'#2a2a2a':'#e0e0e0'):(darkMode?'rgba(255,255,255,.20)':'rgba(255,255,255,.95)')},

  // ----- v2 tokens (single source of truth) -----
  // Radii: small (badges, chips), medium (buttons), large (cards), pill.
  radiusSm: 6,
  radiusMd: 14,
  radiusLg: 22,
  radiusPill: 999,
  // Motion: keep 3 durations (fast tactile feedback, medium UI transitions,
  // slow ambient flows) — anything outside these should be reconsidered.
  motionFast: 80,
  motionMed: 200,
  motionSlow: 650,
  motionTitleCycle: 8000,
  // Letter spacing: title looks better with a touch of expansion;
  // bold buttons need a tiny opening so caps don't run together.
  letterSpacingTitle: 0.08,
  letterSpacingButton: 0.04,
  // Shadow strength scale used by canvas long-shadow / pressed states.
  // Drop them on iOS WebKit if shadowBlur shows up in Profiler.
  shadowSm: 4,
  shadowMd: 10,
  shadowLg: 24,
};

// ================================================================
//  ARROW SKINS — cosmetic, unlocked with coins. A skin's
//  `paint(ctx,x0,y0,x1,y1,i,t)` returns a fillStyle/strokeStyle for an arrow
//  whose tail→head runs (x0,y0)→(x1,y1): solid skins return a colour, gradient
//  skins (fire/ice/rainbow/…) build a CanvasLinearGradient along that line so
//  they look genuinely distinct, not just recoloured. arrowColor() returns a
//  deferred paint FUNCTION; the draw path resolves it with the real geometry
//  via _resolvePaint(). "Animated" skins use t (seconds) and MUST collapse to
//  their t=0 frame under reducedMotion (handled in _skinPaint).
//  No shadowBlur anywhere — it's the iOS WebKit perf cliff drawArrow avoids.
// ================================================================
function _hsl(h,s,l){h=((h%360)+360)%360;return 'hsl('+h+','+s+'%,'+l+'%)';}
// Build a linear gradient along the arrow's tail→head line from [offset,colour]
// stops. Lets skins look genuinely DIFFERENT (fire/ice/rainbow) rather than
// being one flat colour. No shadowBlur anywhere (iOS WebKit perf cliff).
function _grad(ctx,x0,y0,x1,y1,stops){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  for(const s of stops)g.addColorStop(s[0],s[1]);
  return g;
}
// A skin's paint(ctx,x0,y0,x1,y1,i,t) returns a fillStyle/strokeStyle for an
// arrow whose tail→head runs (x0,y0)→(x1,y1). Solid skins ignore the geometry;
// gradient skins use _grad. Animated skins use t (seconds) and are frozen to
// t=0 under reduced-motion by the caller.
const SKINS=[
  // Free default — the theme's own arrow colour (adapts to dark/contrast).
  {id:'classic', name:'Classic', price:0,    animated:false, paint:()=>TH.arrow},
  // --- solid tier ---
  {id:'ink',     name:'Mono Ink',price:1000, animated:false, paint:()=>darkMode?'#f2ece4':'#241c1a'},
  {id:'neon',    name:'Neon',    price:1500, animated:false, style:'glow',    paint:()=>'#19e6ff'},
  // --- shape/style tier (different rendering, not just colour) ---
  {id:'outline', name:'Outline', price:3000, animated:false, style:'outline', paint:()=>darkMode?'#f4ecdf':'#2a211c'},
  {id:'plasma',  name:'3D',      price:4500, animated:false, style:'bevel',   paint:()=>'#5b8cff'},
  // --- gradient tier (each looks distinct) ---
  {id:'gold',    name:'Gold',    price:2500, animated:false, paint:(c,x0,y0,x1,y1)=>_grad(c,x0,y0,x1,y1,[[0,'#8a5a16'],[.5,'#f4cf5a'],[.74,'#fff6d0'],[1,'#d8a838']])},
  {id:'ice',     name:'Ice',     price:3500, animated:false, paint:(c,x0,y0,x1,y1)=>_grad(c,x0,y0,x1,y1,[[0,'#1b63b3'],[.55,'#62d0ff'],[1,'#eafbff']])},
  {id:'toxic',   name:'Toxic',   price:4000, animated:false, paint:(c,x0,y0,x1,y1)=>_grad(c,x0,y0,x1,y1,[[0,'#1f6b1f'],[.5,'#7CFC00'],[1,'#eaff66']])},
  {id:'galaxy',  name:'Galaxy',  price:6000, animated:false, paint:(c,x0,y0,x1,y1)=>_grad(c,x0,y0,x1,y1,[[0,'#3a1d8a'],[.5,'#b13bd6'],[1,'#ff8ad0']])},
  // --- animated tier ---
  {id:'fire',    name:'Fire',    price:5000, animated:true,  paint:(c,x0,y0,x1,y1,i,t)=>{const k=Math.max(.22,Math.min(.78,.5+.16*Math.sin(t*8+i*1.7)));return _grad(c,x0,y0,x1,y1,[[0,'#6e1200'],[k,'#ef5a12'],[1,'#ffd14a']]);}},
  {id:'rainbow', name:'Rainbow', price:7000, animated:false, paint:(c,x0,y0,x1,y1)=>_grad(c,x0,y0,x1,y1,[[0,_hsl(0,85,58)],[.25,_hsl(75,85,58)],[.5,_hsl(150,85,58)],[.75,_hsl(225,85,58)],[1,_hsl(300,85,58)]])},
];
const SKIN_BY_ID={};
for(const s of SKINS)SKIN_BY_ID[s.id]=s;

// 'classic' is always owned. Persisted as a comma list in ae_skins.
let ownedSkins=(function(){
  const raw=(localStorage.getItem('ae_skins')||'').split(',').map(s=>s.trim()).filter(Boolean);
  const set=new Set(raw);set.add('classic');return set;
})();
// Active skin id — fall back to classic if the stored id is unknown (e.g. a
// skin removed in a later build, or a corrupted value).
let activeSkin=(function(){
  const id=localStorage.getItem('ae_skin')||'classic';
  return SKIN_BY_ID[id]?id:'classic';
})();
function _activeSkinDef(){return SKIN_BY_ID[activeSkin]||SKIN_BY_ID.classic;}

// Persist skin state immediately (a purchase must survive a crash, not wait
// for the next save()).
function _persistSkins(){
  _safeSet('ae_skins',Array.from(ownedSkins).join(','));
  _safeSet('ae_skin',activeSkin);
}
// Returns 'bought' | 'owned' | 'poor'. Caller handles SFX/feedback.
function buySkin(id){
  const sk=SKIN_BY_ID[id];
  if(!sk)return 'poor';
  if(ownedSkins.has(id))return 'owned';
  if(coins<sk.price)return 'poor';
  coins-=sk.price;
  ownedSkins.add(id);
  activeSkin=id;            // auto-equip on purchase
  _persistSkins();_safeSet('ae_coins',coins);
  return 'bought';
}
function setActiveSkin(id){
  if(!ownedSkins.has(id))return false;
  activeSkin=id;_persistSkins();
  return true;
}

// Returns a PAINT FUNCTION (ctx,x0,y0,x1,y1)->fillStyle for the given skin and
// arrow index. Deferred so gradient skins can build their gradient from the
// arrow's actual tail→head geometry at draw time. Animated skins freeze to
// t=0 under reduced-motion.
function _skinPaint(sk,i){
  const t=(sk.animated&&!reducedMotion)?gt:0;
  const fn=(ctx,x0,y0,x1,y1)=>{
    try{return sk.paint(ctx,x0,y0,x1,y1,i||0,t);}
    catch(e){_devWarn('skinPaint:'+sk.id,e);return TH.arrow;}
  };
  if(sk.style)fn._style=sk.style; // 'glow' | 'outline' | 'bevel' — drives drawArrowPolyline
  return fn;
}
function arrowColor(a,i){ return _skinPaint(_activeSkinDef(),i||0); }
// Resolve a `col` (string OR paint-function) to a concrete fillStyle/strokeStyle.
// Semantic overrides (TH.star hint, TH.arrowBlock shake) stay plain strings;
// skins arrive as functions and get the arrow geometry to build their gradient.
function _resolvePaint(col,ctx,x0,y0,x1,y1){

// ================================================================
//  DPR + RESIZE — canvas fills the FULL viewport (including under notch).
//  We render at logical W×H but stretch the bg to cover any letterbox so
//  the screen never shows phone chrome behind the canvas.
//  safeTop/safeBottom are exposed in logical pixels for UI offset.
// ================================================================
let dpr=1;
let safeTop=0,safeBottom=0,safeLeft=0,safeRight=0;
let scaleY=1; // CSS px per logical px on the Y axis (used to convert env() values)
function _readSafeArea(){
  try{
    let probe=document.getElementById('_sap');
    if(!probe){
      probe=document.createElement('div');
      probe.id='_sap';
      probe.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
      document.body.appendChild(probe);
    }
    const cs=getComputedStyle(probe);
    return {
      t:parseFloat(cs.paddingTop)||0,
      r:parseFloat(cs.paddingRight)||0,
      b:parseFloat(cs.paddingBottom)||0,
      l:parseFloat(cs.paddingLeft)||0
    };
  }catch(e){return {t:0,r:0,b:0,l:0}}
}
function resize(){
  dpr=window.devicePixelRatio||1;
  // Hybrid layout. Two regimes:
  //   1) Phones (aspect close to 390:844, ±25%): canvas fills the entire
  //      viewport edge-to-edge — the gradient bg reaches under the notch,
  //      no visible body strip. The slight stretch on phones with non-spec
  //      aspect (SE, etc.) is imperceptible.
  //   2) Tablets / desktop / strongly off-spec aspect (>25% diff): canvas
  //      keeps the 390:844 ratio with letterbox bars on the sides. On iPad
  //      portrait that means a centered "phone-shaped" board; on iPad
  //      landscape the same shape sits in the middle. The letterbox area
  //      shows the dot pattern from body bg, so the empty space reads as
  //      a deliberate frame instead of an obvious crop.
  const winW=innerWidth||W,winH=innerHeight||H;
  const wantRatio=W/H;
  const winRatio=winW/winH;
  const aspectDelta=Math.abs(winRatio-wantRatio)/wantRatio;
  let cw,ch;
  if(aspectDelta>.25){
    document.body.classList.add('letterboxed');
    // Strict 390:844 letterbox on tablet — canvas centered with side bars.
    // The earlier "stretch to 0.62" experiment filled more iPad screen but
    // broke iPhone proportions and made game elements look squashed; the
    // user prefers the original look with side bars.
    if(winRatio>wantRatio){ch=winH;cw=ch*wantRatio}
    else{cw=winW;ch=cw/wantRatio}
  }else{
    document.body.classList.remove('letterboxed');
    cw=winW;ch=winH;
  }
  C.width=W*dpr;C.height=H*dpr;
  C.style.width=cw+'px';C.style.height=ch+'px';
  X.setTransform(dpr,0,0,dpr,0,0);
  scaleY=ch/H||1;
  const sa=_readSafeArea();
  safeTop   =sa.t/scaleY;
  safeBottom=sa.b/scaleY;
  safeLeft  =sa.l/((cw/W)||1);
  safeRight =sa.r/((cw/W)||1);
  _bgCacheDirty=true;
}

// ================================================================
//  AUDIO — Web Audio API (NOT HTML5 <audio>).
// iOS WKWebView treats any HTMLAudioElement as media playback: it hijacks
// AVAudioSession, registers the app on the lock-screen Now Playing widget,
// and routes playback through the codec path (high latency). Web Audio is
// classified as in-app sound, plays through the ambient/mixWithOthers
// category set in AppDelegate, has near-zero latency, and never touches
// Now Playing. The AVAudioSession config in AppDelegate.swift only actually
// takes effect once we stop instantiating <audio>.
// ================================================================
let sndOn=localStorage.getItem('ae_sound')!=='0';
const SND_VOL=0.7;
let audioCtx=null,masterGain=null;
const sndBuf={}; // name -> AudioBuffer (decoded)

function initA(){
  // Must be called from a user-gesture handler on iOS to unlock the context.
  if(audioCtx){
    if(audioCtx.state==='suspended')audioCtx.resume().catch(e=>_devWarn('audioCtx.resume',e));
    return;
  }
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    audioCtx=new Ctx();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=SND_VOL;
    masterGain.connect(audioCtx.destination);
    // Decode any buffers fetched before the context existed.
    for(const item of _pendingDecode)_decodeInto(item.name,item.buf);
    _pendingDecode.length=0;
  }catch(e){_devWarn('initA.createContext',e);}
}

// Fetch at startup so bytes are in memory by the time the user taps.
// Decoding waits for the context (created on first tap).
const _pendingDecode=[];
function _decodeInto(name,buf){
  if(!audioCtx)return;
  // decodeAudioData on iOS Safari needs a fresh copy because the ArrayBuffer
  // is detached after the call. We already hold one reference so just pass it.
  audioCtx.decodeAudioData(buf,b=>{sndBuf[name]=b},e=>_devWarn('decodeAudioData:'+name,e));
}
function loadSnd(name,src){
  fetch(src).then(r=>r.arrayBuffer()).then(buf=>{
    if(audioCtx)_decodeInto(name,buf);
    else _pendingDecode.push({name,buf});
  }).catch(e=>_devWarn('loadSnd:'+name,e));
}
loadSnd('swoosh','sounds/whoosh-effect.mp3');
loadSnd('tap','sounds/click sound.mp3');
loadSnd('blocked','sounds/error.mp3');
loadSnd('complete','sounds/new-level.mp3');
loadSnd('gameover','sounds/Game over.mp3');
loadSnd('coin','sounds/coin reward.mp3');
loadSnd('achievement','sounds/coin reward.mp3');

function playSnd(name){
  if(!sndOn||!audioCtx||!sndBuf[name])return;
  const go=()=>{
    try{
      const src=audioCtx.createBufferSource();
      src.buffer=sndBuf[name];
      src.connect(masterGain);
      src.start(0);
    }catch(e){_devWarn('playSnd:'+name,e);}
  };
  // If iOS suspended the context (app backgrounded, inactivity), resume is
  // async — we must wait for it to complete before scheduling the buffer,
  // otherwise the first post-toggle play silently drops.
  if(audioCtx.state==='suspended')audioCtx.resume().then(go).catch(e=>_devWarn('audioCtx.resume(playSnd)',e));
  else go();
}

const sfx={

// ================================================================
//  AUTO-UPDATE CHECK
// Polls Apple's iTunes lookup API once per day to detect a newer App Store
// version. iOS auto-update is on by default for most users, but ~30% have
// it off OR are on cellular and it lags days. A small in-menu nudge gets
// critical fixes (AdMob, anti-farm) deployed faster.
// Android equivalent (Play Store) has no public lookup API — skipped there.
// ================================================================
let availableUpdate=null; // version string like "1.0.12" if newer is live
function _semverGt(a,b){
  const ap=a.split('.').map(n=>+n||0);
  const bp=b.split('.').map(n=>+n||0);
  for(let i=0;i<max(ap.length,bp.length);i++){
    if((ap[i]||0)>(bp[i]||0))return true;
    if((ap[i]||0)<(bp[i]||0))return false;
  }
  return false;
}
async function checkForUpdate(){
  // Only iOS — Android has no equivalent simple endpoint
  if(typeof Capacitor!=='undefined'&&Capacitor.getPlatform&&Capacitor.getPlatform()==='android')return;
  // 24h cache so we don't hammer iTunes on every launch
  const myVersion=APP_VERSION.replace(/^v/,'');
  const lastCheck=+localStorage.getItem('ae_update_check')||0;
  if(Date.now()-lastCheck<24*3600*1000){
    const cached=localStorage.getItem('ae_update_avail');
    // Bug fix: previously loaded cached value blindly. After the user
    // upgrades to the cached version, the banner kept showing because
    // we never re-compared. Only honor the cache if it's STRICTLY newer
    // than the running build; otherwise clear it.
    if(cached&&_semverGt(cached,myVersion)){
      availableUpdate=cached;
    }else if(cached){
      try{localStorage.removeItem('ae_update_avail')}catch(e){_devWarn('updateCache.clear',e);}
    }
    return;
  }
  try{
    const r=await fetch('https://itunes.apple.com/lookup?bundleId=strayarrows.puzzle');
    const data=await r.json();
    const storeVersion=data.results&&data.results[0]&&data.results[0].version;
    if(storeVersion&&_semverGt(storeVersion,myVersion)){
      availableUpdate=storeVersion;
      try{localStorage.setItem('ae_update_avail',storeVersion)}catch(e){_devWarn('updateCache.setAvail',e);}
    }else{
      try{localStorage.removeItem('ae_update_avail')}catch(e){_devWarn('updateCache.clearAfterCheck',e);}
    }
    try{localStorage.setItem('ae_update_check',String(Date.now()))}catch(e){_devWarn('updateCache.setLastCheck',e);}
  }catch(e){/* offline / blocked / iTunes lag — silent */}
}
// Defer so it doesn't compete with first-render or AdMob init
setTimeout(checkForUpdate,3000);

  // window.open redirects iOS to the App Store app via apps.apple.com URL
  try{window.open(APP_STORE_URL,'_blank')}catch(e){_devWarn('openAppStore',e);}
}

// ================================================================
// Architecture:
//   - Existing tap behavior (drawBtn, arrow tap) keeps screen-logical coords.
//   - On the Play screen the grid + arrows section is wrapped in
//     ctx.save/translate/scale/restore so the canvas itself zooms — pixels
//     stay crisp because we re-rasterize each frame at the new transform.
//   - Arrow tap detection inverts the transform via _screenToWorld() so
//     touches still hit the right arrow no matter how the player pans/zooms.
//   - UI elements (top bar, hint/skip, gear) are drawn OUTSIDE the transform
//     block — they don't zoom and stay readable.
let tapX=0,tapY=0,tapped=false,mx=W/2,my=H/2;
let lastClick=null; // {x,y,t} for button press scale feedback

// Zoom state (Play screen only, reset on each generateLevel)
let zoomLevel=1, panX=0, panY=0;
const MIN_ZOOM=0.4, MAX_ZOOM=4;
// User gestures (pinch / wheel) may not zoom OUT below 1.0 — the fit. Below
// that the grid is fully visible with empty margin AND _clampPan() hard-locks
// pan to centre, so the whole [0.4, 1.0] band was a dead zone where the board
// "stuck" and fingers couldn't move it until you zoomed back past 1.0. MIN_ZOOM
// stays 0.4 ONLY for the programmatic level-intro fly-in (_zoomFrom), which is
// non-interactive and pans nothing.
const PINCH_MIN_ZOOM=1;
// Intro zoom animation. On level start we set zoomLevel=startZoom (a wide
// view of the stage including padding) and animate toward _zoomTarget over
// _zoomIntroDur seconds — gives the player a sense of scale before the
// puzzle settles into its playable view.
let _zoomFrom=1, _zoomTarget=1, _zoomIntroT=0, _zoomIntroDur=0.65;
// Auto-fit zoom so the grid actually fills the play area regardless of
// how small the level is. Imported Rush Hour boards are all 6×6 — at the
// previous flat 14 px target they barely used a third of the canvas
// (cell size ~50 px on a 390-wide viewport, so the auto-zoom branch
// never fired). Now we compute a target cell size that lets the larger
// of {cols, rows} fill ~92% of the stage width, capped so even a 4×4
// doesn't blow up beyond the viewport edges.
// v2.6: target bumped 0.80 → 0.92 and cap 2.4 → 3.0 — players found the
// default board too small/cramped to read even after pinch-zooming. Now the
// board fills almost the full width by default (≈4% margin per side); tall
// grids stay vertical-limited so they don't overzoom past the play area, and
// genuinely huge boards (which already fill the width at zoom 1) are unchanged
// — pinch-zoom + pan handles those, now that the pan dead-zone is fixed.
const AUTO_ZOOM_CAP=3.0;
function _autoFitZoom(){
  const cs=getCellSize();
  if(cs<=0)return 1;
  const gridMax=max(gridCols,gridRows);
  // 96% of canvas width / grid dimension = ideal cell size
  const idealCs=(W*0.96)/gridMax;
  if(cs>=idealCs)return 1;
  return min(AUTO_ZOOM_CAP, idealCs/cs);
}
// Set up the level-start zoom intro: begin at a wide view, animate to the
// auto-fit zoom over _zoomIntroDur. The "start" zoom is chosen so the entire
// stage (including STAGE_PAD breathing room) is visible at once.
function _startZoomIntro(){
  _zoomTarget=_autoFitZoom();
  // Start a bit closer than before (0.55 → 0.75) so the player isn't
  // shown a full birds-eye that loses the puzzle structure — just a hint
  // of room before settling at the playable zoom.
  _zoomFrom=max(MIN_ZOOM, _zoomTarget*0.75);
  zoomLevel=_zoomFrom;
  _zoomIntroT=0;
}

// Pinch state — set on 2-finger touchstart, cleared on touchend.
let _pinchStartDist=0;
let _pinchStartZoom=1;

let _pinchStartWorld=null; // {x,y} world-coord point under that midpoint
let _pinchStartPan=null;   // {x,y} pan at gesture start

// 1-finger tap tracking. Tap fires on touchend if total movement stays
// within TAP_THRESHOLD. If movement exceeds threshold AND zoom is engaged
// (>1), the gesture promotes to a 1-finger pan via _onePanLast — the user
// can grab anywhere (arrow OR empty cell) and drag to scroll, exactly
// like Maps. At zoom=1 we keep the original "drag cancels tap" rule so
// a swipe never accidentally activates an arrow under the start point.
let _tapStart=null;        // {x,y,t} when 1-finger touch begins
let _onePanLast=null;      // {x,y} previous touchmove position during 1-finger pan
const TAP_THRESHOLD=10;    // px — drag beyond this cancels the tap

// Pivot for zoom is the GRID's geometric center, not the screen's. The grid
// sits above the screen midpoint (top edge ~y=127, bottom ~y=480 on level 50),
// so a screen-center pivot threw the grid further off-screen as the user
// zoomed in — could not pan back to see the top edge. Grid-center pivot
// keeps the grid anchored at its own middle and lets the player pan to
// either edge symmetrically.
function _gridCenter(){
  const cs=getCellSize();
  return{
    x:getGridX()+gridCols*cs/2,
    y:getGridY()+gridRows*cs/2,

}

function _clampPan(){

  // sliding around aimlessly when the player two-fingers without spreading.

  const gx=getGridX(),gy=getGridY();
  const gridW=gridCols*cs,gridH=gridRows*cs;

  // the CENTER of the viewport (not merely to the viewport edge), plus a
  // little overshoot — so they can comfortably aim a corner arrow without
  // the header or hint bar occluding it. Pan range = "edge at center" plus
  // a 12% overshoot of viewport size on each side.
  const overshootY=H*.12,overshootX=W*.12;

  //   screenY = panY + c.y + (worldY - c.y) * zoom
  // Pan that puts grid TOP at H/2 (+overshoot below):
  const panY_topAtMid=H/2+overshootY-c.y-(gy-c.y)*zoomLevel;
  // Pan that puts grid BOT at H/2 (-overshoot above):
  const panY_botAtMid=H/2-overshootY-c.y-(gy+gridH-c.y)*zoomLevel;
  panY=clp(panY,Math.min(panY_topAtMid,panY_botAtMid),Math.max(panY_topAtMid,panY_botAtMid));
  const panX_leftAtMid=W/2+overshootX-c.x-(gx-c.x)*zoomLevel;
  const panX_rightAtMid=W/2-overshootX-c.x-(gx+gridW-c.x)*zoomLevel;
  panX=clp(panX,Math.min(panX_leftAtMid,panX_rightAtMid),Math.max(panX_leftAtMid,panX_rightAtMid));
}

// Convert a screen-space point (logical W/H coords from gp()) to world-space
// accounting for the active pan+zoom transform around the grid. Inverse of
// translate(c.x+panX, c.y+panY) → scale(z,z) → translate(-c.x,-c.y).
function _screenToWorld(sx,sy){
  if(zoomLevel===1&&panX===0&&panY===0)return{x:sx,y:sy};
  const c=_gridCenter();
  return{
    x:(sx-panX-c.x)/zoomLevel+c.x,
    y:(sy-panY-c.y)/zoomLevel+c.y,
  };
}

function gp(e){
  const r=C.getBoundingClientRect(),t=e.touches?e.touches[0]||e.changedTouches[0]:e;
  return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};
}
function _gpTouch(t){
  const r=C.getBoundingClientRect();
  return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};
}

// Mouse — desktop testing only; tap fires on mouseup if movement was small.
// No mouse drag for pan (would conflict with 1-finger tap rule). Wheel +
// Cmd/Ctrl zooms the grid for desktop test.
C.addEventListener('mousedown',e=>{
  initA();
  const p=gp(e);
  _tapStart={x:p.x,y:p.y,t:gt};
  mx=p.x;my=p.y;
  lastClick={x:p.x,y:p.y,t:gt};
});
C.addEventListener('mousemove',e=>{
  const p=gp(e);mx=p.x;my=p.y;
});
C.addEventListener('mouseup',e=>{
  if(!_tapStart)return;
  const p=gp(e);
  const dx=p.x-_tapStart.x,dy=p.y-_tapStart.y;
  if(Math.hypot(dx,dy)<TAP_THRESHOLD){
    tapX=p.x;tapY=p.y;tapped=true;
  }
  _tapStart=null;
});
C.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  e.preventDefault();
  _zoomIntroT=1; // user took control — kill the intro lerp
  zoomLevel=clp(zoomLevel-e.deltaY*.005,PINCH_MIN_ZOOM,MAX_ZOOM);
  _clampPan();
},{passive:false});

// Touch — strict separation:
//   1 finger: tap on lift if movement < TAP_THRESHOLD. NO pan.
//   2 fingers: pinch (zoom around finger midpoint) + pan (midpoint moves).
//              Both happen simultaneously — natural Maps-app feel.
C.addEventListener('touchstart',e=>{
  e.preventDefault();initA();
  if(e.touches.length===2){
    // Pinch+pan start — record fingers' midpoint, distance, current zoom/pan,
    // and the WORLD coord under the midpoint. While the gesture runs we
    // pin that world point under the midpoint, so the area the user grabbed
    // stays under their fingers as zoom/pan change (canonical pinch-zoom
    // behavior — same as Maps, Photos).
    const p1=_gpTouch(e.touches[0]),p2=_gpTouch(e.touches[1]);
    _pinchStartDist=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    _zoomIntroT=1; // user took control — kill the intro lerp
    _pinchStartZoom=zoomLevel;
    const midX=(p1.x+p2.x)/2,midY=(p1.y+p2.y)/2;
    _pinchStartMid={x:midX,y:midY};
    _pinchStartWorld=_screenToWorld(midX,midY);
    _pinchStartPan={x:panX,y:panY};
    _tapStart=null; // 2 fingers down → not a tap, ever
    return;
  }
  // 1 finger — record tap candidate. tapped=false until lift confirms small
  // movement (so a swipe doesn't accidentally hit an arrow under the start
  // point).
  const p=gp(e);
  _tapStart={x:p.x,y:p.y,t:gt};
  mx=p.x;my=p.y;
  lastClick={x:p.x,y:p.y,t:gt};
},{passive:false});

C.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2&&_pinchStartMid){
    // Pinch+pan update
    const p1=_gpTouch(e.touches[0]),p2=_gpTouch(e.touches[1]);
    const d=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const midX=(p1.x+p2.x)/2,midY=(p1.y+p2.y)/2;
    // 1) Update zoom from finger spread
    if(_pinchStartDist>0){
      zoomLevel=clp(_pinchStartZoom*d/_pinchStartDist,PINCH_MIN_ZOOM,MAX_ZOOM);
    }
    // 2) Pin the world-point that was under the initial midpoint to the
    // current midpoint. Forward (grid-center pivot):
    //   screenX = panX + c.x + (worldX - c.x) * zoom
    // Solve panX so worldX=_pinchStartWorld.x lands at screen midX:
    const c=_gridCenter();
    panX=midX-c.x-(_pinchStartWorld.x-c.x)*zoomLevel;
    panY=midY-c.y-(_pinchStartWorld.y-c.y)*zoomLevel;
    _clampPan();
    return;
  }
  // 1-finger move. When zoom is in (>1) and the finger has moved past
  // the tap threshold, treat further motion as a one-finger pan — natural
  // map-app behaviour the user requested. While zoom=1 there's nothing to
  // pan, so we keep the original "drag cancels tap" semantics so a swipe
  // never accidentally fires an arrow tap under the start point.
  const p=gp(e);
  if(_tapStart){
    const dx=p.x-_tapStart.x,dy=p.y-_tapStart.y;
    if(Math.hypot(dx,dy)>TAP_THRESHOLD){
      _tapStart=null;
      if(zoomLevel>1.001){
        // Promote to a 1-finger pan. _onePanLast keeps the previous
        // touchmove position so we can apply incremental deltas; without
        // it the canvas would jump by the full from-touchstart delta on
        // the first move and feel jittery.
        _onePanLast={x:p.x,y:p.y};
      }
    }
  }else if(_onePanLast){
    // Active 1-finger pan — apply delta from previous position.
    panX+=p.x-_onePanLast.x;
    panY+=p.y-_onePanLast.y;
    _onePanLast={x:p.x,y:p.y};
    _clampPan();
  }
  mx=p.x;my=p.y;
},{passive:false});

C.addEventListener('touchend',e=>{
  if(e.touches.length===0&&_tapStart){
    // Only fire tap on lift if movement stayed within threshold and no pinch
    // ever started (touchstart with 2 fingers nulls _tapStart).
    const r=C.getBoundingClientRect();
    const t=e.changedTouches[0];
    const x=(t.clientX-r.left)/r.width*W,y=(t.clientY-r.top)/r.height*H;
    const dx=x-_tapStart.x,dy=y-_tapStart.y;
    if(Math.hypot(dx,dy)<TAP_THRESHOLD){
      tapX=x;tapY=y;tapped=true;
    }
  }
  if(e.touches.length<2){
    // Pinch ended (could be transitioning to 1 finger or to 0).
    // Reset pinch tracking. The remaining finger (if any) is NOT promoted
    // to a tap or pan — user has to lift fully and tap fresh.
    _pinchStartDist=0;_pinchStartMid=null;_pinchStartWorld=null;
  }
  if(e.touches.length===0){_tapStart=null;_onePanLast=null;}
});

C.addEventListener('touchcancel',()=>{
  // Phone call interrupt, gesture timeout, etc — drop everything cleanly.
  _pinchStartDist=0;_pinchStartMid=null;_pinchStartWorld=null;_tapStart=null;_onePanLast=null;
});

function buildPatternCenters(pattern,rows,cols,numClusters,rng){
  const centers=[];
  const cR=(rows-1)/2,cC=(cols-1)/2;
  const maxRad=Math.max(2,Math.min(rows,cols)*.47);
  const push=(r,c)=>centers.push({
    r:Math.max(1,Math.min(rows-2,Math.round(r))),
    c:Math.max(1,Math.min(cols-2,Math.round(c)))
  });

  if(pattern.id==='spiral'){
    // Spiral: attractors crawl around the center with increasing radius.
    for(let i=0;i<numClusters;i++){
      const t=i/Math.max(1,numClusters-1);
      const a=t*Math.PI*5.4+rng()*.5;
      const rad=maxRad*(.12+.82*t);
      push(cR+Math.sin(a)*rad,cC+Math.cos(a)*rad);
    }
  }else if(pattern.id==='mosaic'){
    // Mosaic: evenly spaced anchors produce short repeated blocks.
    const bands=Math.max(2,Math.round(Math.sqrt(numClusters)));
    for(let r=0;r<bands&&centers.length<numClusters;r++){
      for(let c=0;c<bands&&centers.length<numClusters;c++){
        push((r+.5)/bands*rows,(c+.5)/bands*cols);
      }
    }
  }else if(pattern.id==='piton'){
    // Big pitons: few central anchors make dominant snakes per board.
    const n=Math.max(2,Math.round(numClusters*.45));
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2+rng()*.45;
      const rad=maxRad*(.12+.26*rng());
      push(cR+Math.sin(a)*rad,cC+Math.cos(a)*rad);
    }
  }else if(pattern.id==='diagonal'){
    // Diagonal weave: alternating diagonal anchors across the grid.
    for(let i=0;i<numClusters;i++){
      const t=(i+.5)/numClusters;
      const flip=i%2===0;
      push(t*rows,flip?t*cols:(1-t)*cols);
    }
  }else if(pattern.id==='rings'){
    // Concentric rings: nested radius bands around the center.
    const ringCount=Math.max(2,Math.min(5,Math.round(Math.sqrt(numClusters))));
    for(let i=0;i<numClusters;i++){
      const ring=i%ringCount;
      const a=(i/ringCount)*Math.PI*.9+rng()*.35;
      const rad=maxRad*(.18+.75*(ring/(ringCount-1||1)));
      push(cR+Math.sin(a)*rad,cC+Math.cos(a)*rad);
    }
  }else if(pattern.id==='maze'){
    // Maze rows: alternating horizontal lanes like compact zigzag rows.
    for(let i=0;i<numClusters;i++){
      const row=(i+.5)/numClusters*rows;
      const c=(i%2===0)?.25*cols:.75*cols;
      push(row,c+(rng()-.5)*cols*.12);
    }
  }else if(pattern.id==='rays'){
    // Center rays: spoke anchors radiate from center to edges.
    const spokes=8;
    for(let i=0;i<numClusters;i++){
      const spoke=i%spokes;
      const a=spoke/spokes*Math.PI*2;
      const rad=maxRad*(.2+.72*((Math.floor(i/spokes)+1)/(Math.ceil(numClusters/spokes)+1)));
      push(cR+Math.sin(a)*rad,cC+Math.cos(a)*rad);
    }
  }else{
    for(let i=0;i<numClusters;i++){
      const baseR=floor((i+.5)/numClusters*rows);
      const baseC=floor((.3+.4*rng())*cols);
      push(baseR,baseC);
    }
  }
  return centers;
}

function patternCellBias(r,c,d,rows,cols,isHead){
  const pattern=_levelPattern;
  if(!pattern)return 0;
  const id=pattern.id;
  const cR=(rows-1)/2,cC=(cols-1)/2;
  const rr=r-cR,cc=c-cC;
  const rad=Math.sqrt(rr*rr+cc*cc);
  const maxRad=Math.max(1,Math.sqrt(cR*cR+cC*cC));
  let s=0;

  if(id==='spiral'){
    const a=Math.atan2(rr,cc);
    const spiral=(a+Math.PI)/(Math.PI*2)+rad/maxRad*1.65;
    s+=Math.cos(spiral*Math.PI*2)*1.8;
  }else if(id==='mosaic'){
    const tile=4;
    const nearR=Math.min(r%tile,tile-r%tile);
    const nearC=Math.min(c%tile,tile-c%tile);
    s+=(2.5-Math.min(nearR,nearC))*(isHead?1.5:.75);
  }else if(id==='piton'){
    s+=(1-rad/maxRad)*(isHead?5.5:2.2);
  }else if(id==='diagonal'){
    const band1=Math.abs((r/(rows-1||1))-(c/(cols-1||1)));
    const band2=Math.abs((r/(rows-1||1))-(1-c/(cols-1||1)));
    s+=(1-Math.min(band1,band2))*3.5;
    if((d===0||d===2)&&Math.abs(rr)>Math.abs(cc)*.65)s+=.9;
    if((d===1||d===3)&&Math.abs(cc)>Math.abs(rr)*.65)s+=.9;
  }else if(id==='rings'){
    const bands=4;
    const x=(rad/maxRad)*bands;
    const near=Math.abs(x-Math.round(x));
    s+=(.5-near)*5.2;
  }else if(id==='maze'){
    const rowBand=Math.abs((r%4)-1.5);
    s+=(1.5-rowBand)*1.8;
    if(d===0||d===2)s+=isHead?1.2:2.0;
  }else if(id==='rays'){
    const ang=Math.atan2(rr,cc);
    const spoke=Math.round(ang/(Math.PI/4))*(Math.PI/4);
    s+=Math.cos(ang-spoke)*2.8;
    if(isHead){
      const outward=(Math.abs(cc)>Math.abs(rr))?(cc>=0?0:2):(rr>=0?3:1);
      if(d===outward)s+=3.5;
    }
  }
  return s;
}

// Check all achievements against current state. Unlocks new ones, queues popups.
function checkAchievements(ctx){
  for(const a of ACHIEVEMENTS){
    if(achUnlocked[a.id])continue;
    if(a.check(ctx)){
      achUnlocked[a.id]=1;
      coins+=a.reward;
      totalCoinsEarned+=a.reward;
      achPopup={id:a.id,t:0};

      sfx.achievement();

// Daily streak: bump when playing on a new day
function updateStreak(){
  const today=getDailySeed();
  if(lastPlayDay===today)return;
  if(lastPlayDay===today-1)streakDays++;
  else streakDays=1;
  lastPlayDay=today;
  save();
}

// Currency sinks — expensive so players run out and watch ads
const HINT_COST=100;
const CONTINUE_COST=100;
const SKIP_COST=200;
const AD_COIN_REWARD=60;  // rewarded ad payout (30s view)
const DAILY_REWARD=100;   // first daily completion of the day (was 50)
const WEEKLY_REWARD=150;  // first weekly completion (was 200, rebalanced so the
                          // ad path stays competitive — 60 coins for 30s view)

// IAP-free build: there is no Remove Ads purchase. `adsRemoved` is hard-coded
// false so any old code paths still gate correctly. If real StoreKit IAP
// lands later, restore the localStorage read here.
const adsRemoved=false;
// (Interstitial cadence now lives in showInterstitialAd — wall-clock
// 5-7 min randomized window persisted in localStorage. The old `gt`-
// based cooldown constants were removed in v1.0.20.)
let adRewardCallback=null; // callback after rewarded ad completes

// Real AdMob integration via @capacitor-community/admob
// Per-platform ad unit IDs. iOS IDs are placeholders — Google's official test
// IDs that always serve a test ad. Replace with real iOS unit IDs from the
// AdMob console when ready (search for "REPLACE_IOS_" below).
const _isIOS=()=>typeof Capacitor!=='undefined'&&Capacitor.getPlatform&&Capacitor.getPlatform()==='ios';
const REWARDED_ID =()=>_isIOS()
  ? 'ca-app-pub-1164170950110129/3890476871'  /* iOS Rewarded — real */
  : 'ca-app-pub-1164170950110129/7243043308';  /* Android Rewarded — real */
const INTERSTITIAL_ID=()=>_isIOS()
  ? 'ca-app-pub-1164170950110129/8951231862'  /* iOS Interstitial — real */
  : 'ca-app-pub-1164170950110129/6672197661';  /* Android Interstitial — real */

let admobReady=false;
let _rewardedPrepared=false;
let _interstitialPrepared=false;
// Dev/QA toggle for AdMob test mode. Production never has the flag set, so
// this returns false and real ads serve as before. To verify ad-loading UX
// on a real device without burning real impressions, attach Safari Web
// Inspector / chrome://inspect, run `localStorage.ae_admob_test='1'` and
// relaunch the app. If we ever see this flag on in production (e.g. set
// accidentally by a debug build), we record a warning so it shows up in
// post-mortem next launch.
function _admobTestMode(){
  try{
    const on = localStorage.getItem('ae_admob_test')==='1';
    if(on) _devWarn('admob.testMode','test ads enabled via ae_admob_test');
    return on;
  }catch(e){return false;}
}
function _logAdErr(stage,e){
  // Persist the latest AdMob failure separately from the general _devWarn ring
  // buffer — Settings -> About surfaces this single field for quick triage of
  // "no ads on device X" reports.
  try{localStorage.setItem('ae_admob_err',stage+': '+String((e&&e.message)||e));}catch(_){/* localStorage unusable */}
  _devWarn('admob:'+stage,e);
}
async function initAdMob(){
  try{
    if(typeof Capacitor==='undefined'||!Capacitor.Plugins.AdMob)return;
    const AdMob=Capacitor.Plugins.AdMob;
    // Defensive: if initAdMob() ever runs twice (resume-from-background flow,
    // future refactor, retry path) the listeners would stack and reward
    // callbacks would fire N times. Strip any prior listeners up front.
    try{await AdMob.removeAllListeners()}catch(e){_devWarn('admob.removeAllListeners',e);}

    // On iOS: explicitly request ATT permission FIRST, BEFORE initializing AdMob.
    // Apple rejected v1.0 because the ATT prompt was missing. The plugin's
    // built-in `requestTrackingAuthorization: true` flag inside .initialize()
    // doesn't reliably show the prompt on iPadOS 26+. Calling the dedicated
    // method explicitly works, and we wait for the user response before init
    // so SDK telemetry never goes out before the user has answered.
    if(_isIOS()){
      try{
        const status=await AdMob.trackingAuthorizationStatus();
        if(status&&status.status==='notDetermined'){
          await AdMob.requestTrackingAuthorization();
        }
      }catch(e){/* method may not exist in older plugin versions — fall through */}
    }

    await AdMob.initialize({
      initializeForTesting:_admobTestMode(),
      requestTrackingAuthorization:false  // already handled explicitly above
    });

    // CRITICAL: mark SDK ready as soon as initialize() succeeds. The PREVIOUS
    // build only flipped this flag after both prepareRewardVideoAd AND
    // prepareInterstitial succeeded — and on a fresh AdMob account or with
    // a transient "no fill" response, prepare throws → admobReady stays
    // false forever → showRewardedAd silently grants the reward without
    // ever attempting to show an ad. That's the bug shipped in 1.0.6.
    admobReady=true;

    // Prepare ads in the background. On failure we'll lazily re-prepare in
    // showRewardedAd / showInterstitialAd.
    AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()})
      .then(()=>{_rewardedPrepared=true})
      .catch(e=>_logAdErr('prepareRewarded',e));
    AdMob.prepareInterstitial({adId:INTERSTITIAL_ID(),isTesting:_admobTestMode()})
      .then(()=>{_interstitialPrepared=true})
      .catch(e=>_logAdErr('prepareInterstitial',e));

    // Listen for reward — fired after the user watches the full rewarded ad.
    AdMob.addListener('onRewardedVideoAdReward',()=>{
      if(adRewardCallback)adRewardCallback();
      adRewardCallback=null;
    });
    // Re-prepare after close. Also clear adRewardCallback — if the user
    // dismissed without earning the reward, the callback must NOT fire later.
    AdMob.addListener('onRewardedVideoAdDismissed',()=>{
      adRewardCallback=null;
      _rewardedPrepared=false;
      AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()})
        .then(()=>{_rewardedPrepared=true}).catch(e=>_logAdErr('reprepareRewarded',e));
    });
    AdMob.addListener('onInterstitialAdDismissed',()=>{
      _interstitialPrepared=false;
      AdMob.prepareInterstitial({adId:INTERSTITIAL_ID(),isTesting:_admobTestMode()})
        .then(()=>{_interstitialPrepared=true}).catch(e=>_logAdErr('reprepareInterstitial',e));
    });
  }catch(e){_logAdErr('init',e)}
}

// Defer AdMob init until AFTER the splash screen has dismissed and the
// WebView is fully visible — Apple requires the ATT prompt to appear in the
// foreground after the app's UI is rendered, never during launch/splash.
function _scheduleAdMobInit(){
  // 1.5s gives the Capacitor splash time to fade and the WebView to attach.
  setTimeout(initAdMob,1500);
}
if(document.readyState==='complete') _scheduleAdMobInit();
else window.addEventListener('load',_scheduleAdMobInit);

let _adInFlight=false;
async function showRewardedAd(onReward){
  // Browser / no plugin — give reward immediately so dev/web testing works.
  // On a REAL device with admobReady=false, we now refuse instead of granting
  // the reward, so users can't farm coins by tapping when ads are down.
  if(typeof Capacitor==='undefined'||!Capacitor.Plugins.AdMob){
    if(onReward)onReward();
    return;
  }
  if(!admobReady){
    // SDK init didn't complete (rare). Tell user, don't grant.
    spawnFloater(W/2,H/2,t('adUnavailable'),TH.arrowBlock);
    return;
  }
  // Anti-double-tap: spammy taps on the rewarded button used to register
  // multiple concurrent showRewardedAd calls → multiple rewards on a single
  // ad view. Block while one ad is mid-flight.
  if(_adInFlight)return;
  _adInFlight=true;
  const AdMob=Capacitor.Plugins.AdMob;
  // Wrap the caller's reward in a one-shot so even if dismiss + reward
  // listeners both fire, the player only gets one payout.
  let rewardFired=false;
  const safeReward=()=>{if(rewardFired)return;rewardFired=true;if(onReward)onReward()};
  adRewardCallback=safeReward;
  try{
    if(!_rewardedPrepared){
      await AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()});
      _rewardedPrepared=true;
    }
    await AdMob.showRewardVideoAd();
    // Reward / dismiss listeners take it from here.
  }catch(e){
    _logAdErr('showRewarded',e);
    // Try ONE on-demand prepare+show retry — e.g., the cached ad expired.
    try{
      await AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()});
      _rewardedPrepared=true;
      await AdMob.showRewardVideoAd();
    }catch(e2){
      _logAdErr('showRewardedRetry',e2);
      // Genuinely no ad available — DO NOT grant reward (anti-farm). Tell
      // the user instead. Clear the pending callback so a future ad's
      // listener doesn't fire it.
      adRewardCallback=null;
      spawnFloater(W/2,H/2,t('adUnavailable'),TH.arrowBlock);
    }
  }finally{
    // Released after the ad closes (catch path) OR on the next tick after
    // showRewardVideoAd resolves — the dismiss listener runs separately so
    // we release the gate immediately. Worst case a second ad starts while
    // the first is still on screen, but iOS only ever shows one at a time.
    _adInFlight=false;
  }
}
// v1.0.20: interstitial back on with WALL-CLOCK cooldown.
//
// Each successful show records Date.now() in localStorage AND rolls a
// fresh random next-interval in the 5-7 minute range. The next call
// only fires once wall-clock time crossed that interval — regardless
// of whether the app was closed, a level was retried, the user idled,
// or anything else. Fixes the v1.0.17 bug where the cooldown ran on
// `gt` (per-session game-clock) and reset to 0 on every relaunch,
// which is what made ads feel like they fired after every single game.
//
// First-ever call seeds the timestamp to "now" and returns without
// showing — so a brand-new install never sees an ad in the opening
// minutes when impressions matter least and friction matters most.
const INTERSTITIAL_MIN_MS = 5 * 60 * 1000;   // 5 min
const INTERSTITIAL_MAX_MS = 7 * 60 * 1000;   // 7 min
function _rollNextInterstitialInterval(){
  return INTERSTITIAL_MIN_MS + floor(Math.random() * (INTERSTITIAL_MAX_MS - INTERSTITIAL_MIN_MS));
}
async function showInterstitialAd(){
  if(adsRemoved)return;
  const now = Date.now();
  let lastTs = +localStorage.getItem('ae_inter_last') || 0;
  let nextInterval = +localStorage.getItem('ae_inter_next') || INTERSTITIAL_MIN_MS;
  // First-ever call: seed the timer so the first real ad lands ~5-7 min
  // from now, not immediately on a fresh install.
  if (lastTs === 0) {
    _safeSet('ae_inter_last', String(now));
    _safeSet('ae_inter_next', String(_rollNextInterstitialInterval()));
    return;
  }
  if (now - lastTs < nextInterval) return;
  if (!admobReady || typeof Capacitor === 'undefined' || !Capacitor.Plugins.AdMob) return;
  // Commit the cooldown window NOW, the instant the gate opens — BEFORE we
  // touch the native show. This is the fix for the "ad before every level"
  // bug: AdMob.showInterstitial() can reject *after* the ad has already been
  // displayed (no-fill retry, frequency-cap error, plugin quirk). If we only
  // stamped after a clean resolve, that throw would skip the stamp, leave
  // lastTs stale, and every subsequent level would re-open the gate and fire
  // again. Rate-limiting is the contract here; losing one impression on a
  // rare failed show is a fine price for never spamming the player.
  _safeSet('ae_inter_last', String(now));
  _safeSet('ae_inter_next', String(_rollNextInterstitialInterval()));
  const AdMob = Capacitor.Plugins.AdMob;
  try {
    if (!_interstitialPrepared) {
      await AdMob.prepareInterstitial({ adId: INTERSTITIAL_ID(), isTesting: _admobTestMode() });
      _interstitialPrepared = true;
    }
    await AdMob.showInterstitial();
    // Consumed — onInterstitialAdDismissed re-prepares the next one.
    _interstitialPrepared = false;
  } catch (e) {
    _logAdErr('showInterstitial', e);
  }
}
function useHint(){
  if(coins<HINT_COST||hintTime>0)return false;
  for(let i=0;i<arrows.length;i++){
    if(arrows[i].alive&&canEscape(i)){
      hintArrow=i;
      hintTime=2.5;
      coins-=HINT_COST;
      hintUsedThisLevel=true; // disqualifies this level from "no hint" stat
      save();
      sfx.tap();haptic(15);
      return true;
    }
  }
  return false;
}

// Continue from game over — spend coins to restore hearts, keep arrow progress
function continueFromGameover(){
  if(coins<CONTINUE_COST)return false;
  coins-=CONTINUE_COST;
  undosLeft=3;
  save();
  S='play';
  sfx.tap();haptic(10);
  return true;
}

// Skip current level for a fat coin cost — marks 1 star and advances.
// Disabled for daily/weekly: those are challenge modes with fixed seeds and
// no `level` progression — skipping them would bump the global `level` while
// leaving `isDaily`/`isWeekly` flags set, breaking state on next entry.
function skipLevel(){
  if(coins<SKIP_COST||isDaily||isWeekly)return false;
  coins-=SKIP_COST;
  stars[level]=max(stars[level]||0,1);
  totalStars=Object.values(stars).reduce((a,b)=>a+b,0);
  level++;
  save();
  sfx.complete();haptic(20);
  generateLevel(level);
  return true;
}

// Daily seed: one puzzle per day, same for everyone. Integer day number since epoch.
function getDailySeed(){return floor(Date.now()/86400000)}
function dailyDoneKey(){return'ae_daily_'+getDailySeed()}
function isDailyDone(){return localStorage.getItem(dailyDoneKey())==='1'}

// Weekly seed: one puzzle per ISO week. Harder than daily — uses lvl 60 difficulty.
function getWeeklySeed(){return floor(Date.now()/(7*86400000))}
function weeklyDoneKey(){return'ae_weekly_'+getWeeklySeed()}
function isWeeklyDone(){return localStorage.getItem(weeklyDoneKey())==='1'}

// ================================================================
//  LEVEL GENERATION
// ================================================================
function seededRandom(seed){
  let s=seed;
  return function(){s=(s*16807)%2147483647;return(s-1)/2147483646};
}

// Generate a level using the REAL mechanic: arrows are multi-cell random-walk paths.
// Solvability is guaranteed by placing arrows in REVERSE solve order:
//   arrow[0] will be removed first, arrow[N-1] last. Place them backward:
//   first place arrow[N-1] (unconstrained), then arrow[N-2] needs a clear escape
//   past arrow[N-1], etc. At solve time, each arrow's escape path is clear of
//   the arrows that haven't been removed yet.
function generateLevel(lvl,customSeed){
  const rng=seededRandom(customSeed!=null?customSeed:(lvl*7919+31337));
  hintArrow=-1;hintTime=0;wrongTapsInLevel=0;
  hintUsedThisLevel=false;
  levelRevealT=0;
  // Reset pinch/pan state. zoomLevel gets set after gridCols/gridRows are
  // known (auto-fit so big levels render at tappable cell size).
  panX=0;panY=0;_pinchStartDist=0;_panStart=null;
  _levelCells=new Set();
  function _recordCells(){for(const a of arrows)for(const [r,c] of a.cells)_levelCells.add(r+','+c);}
  updateStreak();

  // Handcrafted fast path: I designed specific levels by hand (tutorial
  // 1-10 + decorative milestones at 5, 10, 50, 100…). When the level
  // number has a hand-tuned layout, use it instead of procedural.
  // Daily/weekly bypass this — they pass customSeed.
  if(!FORCE_FRESH_LEVELS&&customSeed==null&&typeof window!=='undefined'
     &&window.HANDCRAFTED_LEVELS&&window.HANDCRAFTED_LEVELS[lvl]){
    const hc=window.HANDCRAFTED_LEVELS[lvl];
    gridCols=hc.cols;gridRows=hc.rows;
    arrows=hc.arrows.map(a=>({cells:a.c.map(c=>[c[0],c[1]]),dir:a.d,alive:true}));
    _recordCells();
    minMoves=arrows.length;
    moves=0;timer=0;undosLeft=3;
    _startZoomIntro();
    const key='ae_best_'+lvl;
    bestTime=+localStorage.getItem(key)||0;
    return;
  }

  // v1.0.19: Rush Hour IMPORTED branch removed entirely. If HANDCRAFTED
  // didn't claim this level, fall straight through to the procedural
  // generator below — no on-demand chunk fetches, no third-party
  // imported boards.

  // BAKED branch retired in v2 — IMPORTED chunks now cover lvl 11-6000
  // densely, with HANDCRAFTED owning lvl 1-10 (tutorial) plus milestones.
  // Kept the variable check as a no-op so the leftover comment block below
  // about "unsolvable baked level fall-through" still parses; the
  // condition will always evaluate to false because BAKED_LEVELS is no
  // longer loaded.
  if(false&&!FORCE_FRESH_LEVELS&&customSeed==null&&lvl>=1&&lvl<=500&&typeof window!=='undefined'&&window.BAKED_LEVELS){
    const baked=window.BAKED_LEVELS[lvl-1];
    if(baked){
      const _check=baked.arrows.map(a=>({cells:a.c.map(c=>[c[0],c[1]]),dir:a.d}));
      if(_isLevelSolvable(_check,baked.rows,baked.cols)){
        gridCols=baked.cols;gridRows=baked.rows;
        arrows=baked.arrows.map(a=>({cells:a.c.map(c=>[c[0],c[1]]),dir:a.d,alive:true}));
        _recordCells();
        minMoves=arrows.length;
        moves=0;timer=0;undosLeft=3;
        _startZoomIntro();
        const key='ae_best_'+lvl;
        bestTime=+localStorage.getItem(key)||0;
        return;
      }
      // Unsolvable baked level — fall through to procedural path below,
      // which has its own retry-on-deadlock loop.
    }
  }

  // Difficulty curve. Power-0.8 early ramp + cap at lvl 150. The previous
  // 26×34 grid looked sparse once 1-cell dots were removed. Competitor boards
  // read denser on mobile: fewer cells, thicker visible strands, less blank
  // background. Max grid is now 22×30.
  // coexisting, not one giant Warnsdorff snake. This generator therefore
  // rejects short "successful" paths during the main pass: if an arrow
  // cannot grow into a proper snake, we try another head/direction instead
  // of accepting a 2-cell scrap.
  // Slightly steeper than before: ramp caps at lvl 120 instead of 150 so
  // each 10-level block is felt; user feedback at lvl 67 said "more or
  // less normal now, just a touch harder per step" so we bring the max
  // grid (22×30) closer in by ~20%.
  const p=min(1,Math.pow((lvl-1)/74,.66));
  // Tutorial override: first 5 levels are deliberately tiny — 3-5 arrows
  // on a small grid so brand-new players grasp "tap a clear arrow" before
  // any chain dependency or pattern variety appears. Hand-picked sizes
  // produce the right "easy onboarding" curve regardless of what the
  // pow() difficulty formula would give.
  const TUT_OVERRIDES=[
    {cols:6,rows:8, maxLen:14, longMin:5},   // lvl 1: ~3-4 arrows
    {cols:7,rows:10,maxLen:18, longMin:6},   // lvl 2: ~4-5 arrows
    {cols:8,rows:12,maxLen:22, longMin:7},   // lvl 3: ~5-6 arrows
    {cols:10,rows:14,maxLen:26,longMin:8},   // lvl 4: ~6-8 arrows
    {cols:12,rows:16,maxLen:30,longMin:10},  // lvl 5: ~8-10 arrows
  ];
  const tut=lvl<=5?TUT_OVERRIDES[lvl-1]:null;
  // Grid 1.5× finer per user feedback. Tutorial uses the override above;
  // lvl 6+ uses the smooth ramp.
  const cols=tut?tut.cols:floor(lrp(14,32,p)+.5);
  const rows=tut?tut.rows:floor(lrp(19,42,p)+.5);
  const pattern=getLevelPattern(lvl);
  _levelPattern=pattern;
  const minLen=2;
  // Reduced max from 108 → 35 to match competitor's dense-maze look.
  const maxLen=tut?tut.maxLen:floor(lrp(15,60,p)*pattern.lenScale+.5);

  gridCols=cols;gridRows=rows;

  // Late-level scaling: once `p` saturates at lvl 75 the grid + length
  // are maxed out. Difficulty keeps climbing via TWO levers:
  //   • numClusters: 3 → 12 over lvls 75..1500, then +1 every 25 lvls
  //     (more cluster centers = more islands competing for the same
  //     snake heads = tighter corridors between them)
  //   • lateExtra: 0..1 over the same range — used below to scale
  //     longMin DOWN at high levels (shorter required min length =
  //     more arrows per board = more to track per tap)
  // Tutorial: NO chain blockers — pure "tap clear arrow" gameplay so
  // brand-new players grasp the basic rule before any dependencies.
  _maxBlockers=tut?0:1;
  // Late-game ramp (extended in v2): caps were 24 clusters / 2.5
  // lateExtra, which meant by lvl 3500 every parameter saturated and a
  // lvl-6000 board looked the same as a lvl-3500 one. User flagged
  // this. New ceiling pushes max clusters to 40 and lateExtra to 5.0,
  // both reached around lvl 8000-10000 — every 25-level block past
  // 1500 still adds a cluster, so a player grinding 50 levels feels
  // the difficulty shift rather than seeing a wall.
  let numClusters, lateExtra;
  if(lvl<=1500){
    const q=Math.max(0,(lvl-75)/1425);
    numClusters=floor(lrp(3,12,q)+.5);
    lateExtra=q;
  }else{
    numClusters=12+floor((lvl-1500)/25);
    lateExtra=1+(lvl-1500)/1500;
  }
  numClusters=Math.min(40,numClusters);
  lateExtra=Math.min(5.0,lateExtra);

  // Pattern centers: same cluster mechanic, different attractor layouts.
  // This is the visual variety layer (spiral, mosaic, pitons, diagonals,
  // rings, maze rows, rays). It changes where arrows prefer to grow, not
  // the solve rules.
  _clusterCenters=[];
  if(CLUSTERS_MODE){
    numClusters=Math.max(2,Math.round(numClusters*pattern.clusterScale));
    _clusterCenters=buildPatternCenters(pattern,rows,cols,numClusters,rng);
  }

  // occ[r][c] = arrow index that owns this cell, or -1
  const occ=[];
  for(let r=0;r<rows;r++){occ[r]=[];for(let c=0;c<cols;c++)occ[r][c]=-1}

  const placed=[];

  // ONE-PASS GENERATION: drop the old medium-gap pass — it was
  // visual noise between headline snakes. Each placed arrow is now a
  // substantial winding path the player can read end-to-end. Empty
  // cells get absorbed into snakes by Pass 3 below.
  // longMin shrinks at very late levels (lateExtra > 0) — gives MORE
  // arrows per board at lvl 1500+ so there's more to track even
  // though the grid stays maxed.
  //
  // v2.5: floor lowered 0.45 → 0.30 so lvl 6000+ procedural boards
  // stop looking sparse (user flagged lvl 8001 as "слишком пустой").
  // With lateExtra=5.0 this gives longMin ~= longMinBase × 0.30, i.e.
  // ~3× more distinct arrows packed into the same grid. Coupled with
  // the existing Pass-3 fill-coverage absorption, sparse "vertical
  // shaft" pockets get eaten by neighbouring snakes.
  let safety=3000;
  const longMinBase=floor(maxLen*lrp(.55,.70,p)*pattern.longMinScale);
  const longMin=tut?tut.longMin:max(10,floor(longMinBase*max(0.30,1-lateExtra*0.30)));
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,minLen,maxLen,placed,{minAcceptLen:longMin});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }

  // Pass 3: full-coverage absorption. Goal — eliminate the "scattered
  // single-cell dot" look the user complained about and fill empty cells
  // in the middle of the grid.
  //
  // Three sub-passes, each runs in a fixpoint loop so cascading absorption
  // fills chains of cells:
  //   3a. TAIL extension — empty cell adjacent to an arrow's tail joins
  //       that arrow's body (existing logic).
  //   3b. HEAD extension along escape line — the arrow's head consumes
  //       the cell immediately in front of it (which used to be on its
  //       escape line). This shortens the escape but keeps it valid.
  //   3c. 1-cell merge — leftover empty cells get a 1-cell arrow placed,
  //       then those 1-cell arrows get merged into adjacent multi-cell
  //       arrow tails wherever geometrically and game-logically valid.
  //
  // Every extension is gated by `_wouldBlockOtherEscape()` — adding a cell
  // to arrow A's body must not put it on the escape line of any arrow B
  // that was placed AFTER A. (B is solved before A in game order, so at
  // B's turn A is still alive and would block B's escape.)

  // Returns true iff (r,c) lies on the escape line of any arrow placed
  // after `currentIdx`. Those arrows solve before `currentIdx` in game,
  // so adding (r,c) to currentIdx's body would make them unreachable.
  const _wouldBlockOtherEscape=(r,c,currentIdx)=>{
    for(let j=currentIdx+1;j<placed.length;j++){
      const o=placed[j];
      const h=o.cells[o.cells.length-1];
      if(onEscapeLine(r,c,h[0],h[1],o.dir))return true;
    }
    return false;
  };

  // 3a. TAIL extension into empties.
  let absorbed=1;
  while(absorbed>0){
    absorbed=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(occ[r][c]!==-1)continue;
        for(let d=0;d<4;d++){
          const nr=r+DY[d],nc=c+DX[d];
          if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
          if(occ[nr][nc]===-1)continue;
          const arrowIdx=occ[nr][nc];
          const arrow=placed[arrowIdx];
          const tail=arrow.cells[0];
          if(tail[0]!==nr||tail[1]!==nc)continue;
          const head=arrow.cells[arrow.cells.length-1];
          if(onEscapeLine(r,c,head[0],head[1],arrow.dir))continue;
          if(_wouldBlockOtherEscape(r,c,arrowIdx))continue;
          arrow.cells.unshift([r,c]);
          occ[r][c]=arrowIdx;
          absorbed++;
          break;
        }
      }
    }
  }

  // 3b. HEAD extension along escape line. The cell directly in front of
  // each arrow's head is empty by construction (escape line check). We
  // pull that cell into the body, advancing the head one step toward the
  // grid edge. New escape line is shorter by one cell but still valid.
  let extended=1;
  while(extended>0){
    extended=0;
    for(let i=0;i<placed.length;i++){
      const a=placed[i];
      if(a.cells.length===1)continue; // 1-cell heads are absorbed via 3c
      const head=a.cells[a.cells.length-1];
      const fr=head[0]+DY[a.dir],fc=head[1]+DX[a.dir];
      if(fr<0||fr>=rows||fc<0||fc>=cols)continue; // already at edge
      if(occ[fr][fc]!==-1)continue; // not empty (shouldn't happen)
      if(_wouldBlockOtherEscape(fr,fc,i))continue;
      a.cells.push([fr,fc]);
      occ[fr][fc]=i;
      extended++;
    }
  }

  // 3c. Final small gap pass. We first try 3-8 cell arrows, then 2-5 cell
  // arrows. Single-cell arrows are disabled by default — visually a rare
  // empty cell reads better than a field of tiny arrow dots. Internal QA can
  // pass ?dots=1 to compare the old full-coverage behaviour.
  safety=3000;
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,3,8,placed,{minAcceptLen:3,braid:false});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }
  safety=3000;
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,2,5,placed,{minAcceptLen:2,braid:false});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }

  // Dense fill pass: after the main snakes are placed, keep trying modest
  // 2-4 cell arrows until no legal gap remains. This is intentionally not
  // "braidy"; its job is to remove empty holes without creating 1-cell dots.
  safety=5000;
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,2,4,placed,{minAcceptLen:2,braid:false});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }

  // Re-run absorption after the small gap passes. Those newly placed 2-8
  // cell arrows create fresh tails and fresh head escape-front cells, so a
  // second sweep can consume many cells that would otherwise become 1-cell
  // dots.
  absorbed=1;
  while(absorbed>0){
    absorbed=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(occ[r][c]!==-1)continue;
        for(let d=0;d<4;d++){
          const nr=r+DY[d],nc=c+DX[d];
          if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
          if(occ[nr][nc]===-1)continue;
          const arrowIdx=occ[nr][nc];
          const arrow=placed[arrowIdx];
          const tail=arrow.cells[0];
          if(tail[0]!==nr||tail[1]!==nc)continue;
          const head=arrow.cells[arrow.cells.length-1];
          if(onEscapeLine(r,c,head[0],head[1],arrow.dir))continue;
          if(_wouldBlockOtherEscape(r,c,arrowIdx))continue;
          arrow.cells.unshift([r,c]);
          occ[r][c]=arrowIdx;
          absorbed++;
          break;
        }
      }
    }
  }
  extended=1;
  while(extended>0){
    extended=0;
    for(let i=0;i<placed.length;i++){
      const a=placed[i];
      if(a.cells.length===1)continue;
      const head=a.cells[a.cells.length-1];
      const fr=head[0]+DY[a.dir],fc=head[1]+DX[a.dir];
      if(fr<0||fr>=rows||fc<0||fc>=cols)continue;
      if(occ[fr][fc]!==-1)continue;
      if(_wouldBlockOtherEscape(fr,fc,i))continue;
      a.cells.push([fr,fc]);
      occ[fr][fc]=i;
      extended++;
    }
  }

  // 3d. Internal detours. If a straight segment has two empty cells beside
  // it, route the same arrow through those cells:
  //   A--B becomes A--sideA--sideB--B
  // This fills holes by making existing arrows more snake-like instead of
  // creating separate tiny arrows.
  let detoured=1;
  // Per-arrow detour budget: capped at 12% of original segments + 70%
  // skip rate, so ~3-4% of segments get detoured (was ~32%). User
  // explicitly asked for 80% LESS internal zigzag — the tight back-and-
  // forth bumps that made every snake coil around itself instead of
  // weaving past neighbours. Natural turns from Pass-1 growth survive
  // because they come from the seed walk, not this pass.
  const _detourBudget=new Array(placed.length);
  for(let i=0;i<placed.length;i++){
    _detourBudget[i]=Math.max(0, Math.floor((placed[i].cells.length-1)*0.12));
  }
  while(detoured>0){
    detoured=0;
    for(let i=0;i<placed.length;i++){
      const a=placed[i];
      if(a.cells.length<2)continue;
      if(_detourBudget[i]<=0)continue;
      // BUG FIX: detour cannot touch the LAST segment (k = cells.length-2).
      // The last segment cells[N-2]→cells[N-1] must be in arrow.dir so the
      // arrowhead glyph (which is tangent to the last segment) points the
      // direction the arrow will actually escape. A detour at the last
      // segment routes the path sideways and breaks that invariant — the
      // player taps an arrow that visually points UP and it flies LEFT.
      for(let k=0;k<a.cells.length-2;k++){
        // Skip ~70% of segments randomly. Combined with the 12% budget
        // above, this leaves only the rare detour where it most helps
        // chain crossing — most arrows pass through with their natural
        // walk-grown turns intact.
        if(rng()<0.70)continue;
        const p0=a.cells[k],p1=a.cells[k+1];
        const dr=p1[0]-p0[0],dc=p1[1]-p0[1];
        const sides=(dr!==0)?[[0,1],[0,-1]]:[[1,0],[-1,0]];
        let did=false;
        for(const[sr,sc] of sides){
          const r0=p0[0]+sr,c0=p0[1]+sc;
          const r1=p1[0]+sr,c1=p1[1]+sc;
          if(r0<0||r0>=rows||c0<0||c0>=cols)continue;
          if(r1<0||r1>=rows||c1<0||c1>=cols)continue;
          if(occ[r0][c0]!==-1||occ[r1][c1]!==-1)continue;
          const head=a.cells[a.cells.length-1];
          if(onEscapeLine(r0,c0,head[0],head[1],a.dir))continue;
          if(onEscapeLine(r1,c1,head[0],head[1],a.dir))continue;
          if(_wouldBlockOtherEscape(r0,c0,i)||_wouldBlockOtherEscape(r1,c1,i))continue;
          a.cells.splice(k+1,0,[r0,c0],[r1,c1]);
          occ[r0][c0]=i;occ[r1][c1]=i;
          detoured++;
          _detourBudget[i]--;
          did=true;
          break;
        }
        if(did)break;
      }
    }
  }

  if(ALLOW_DOT_FILL){
    safety=3000;
    while(safety-->0){
      const arrow=tryBuildArrow(occ,rows,cols,rng,1,1,placed);
      if(!arrow)break;
      for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
      placed.push(arrow);
    }
  }
  let merged=1;
  while(merged>0){
    merged=0;
    for(let i=placed.length-1;i>=0;i--){
      const a=placed[i];
      if(a.cells.length!==1)continue;
