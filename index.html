    if(drawBigBtn('BACK TO MENU',W/2,H*.67,220,50,TH.accent)){
      goto('menu',()=>{isDaily=false;isWeekly=false});
    }
  }else{
    if(drawBigBtn(t('nextLevel'),W/2,H*.67,200,50,TH.accent)){
      showInterstitialAd(); // timed interstitial every 5 min
      goto('play',()=>{level++;save();generateLevel(level)});
    }
    if(drawBtn(t('replay'),W/2,H*.74,140,36)){
      goto('play',()=>{generateLevel(level)});
    }
    if(drawBtn(t('home'),W/2,H*.80,140,36)){goto('menu')}
  }


}

      X.moveTo(cardX + 16, y + rowH);

}

// Per-achievement icon renderer. Categories share a vector glyph so the user
// recognises the achievement type at a glance (level → up-arrow, stars → star,
// perfect → trophy, daily → calendar, streak → flame, no-hint → lightbulb,
// speedrun → bolt). Drawn at logical coords centred on (cx,cy).
function drawAchIcon(id,cx,cy,sz,col){
  const c=col;
  X.save();X.translate(cx,cy);
  X.fillStyle=c;X.strokeStyle=c;X.lineWidth=1.5;X.lineJoin='round';X.lineCap='round';

  if(id.startsWith('lvl_')){
    // Up-arrow stack — three stacked triangles ("levelling up")
    for(let i=0;i<3;i++){
      const ay=sz*.55-i*sz*.45,al=sz*.55-i*sz*.15,a=.4-i*.1;
      X.fillStyle=c+(['','99','66','33'][i]||'');
      X.beginPath();X.moveTo(0,ay-al*.7);X.lineTo(al*.6,ay);X.lineTo(-al*.6,ay);X.closePath();X.fill();
    }
  }else if(id.startsWith('stars_')){
    // Star burst — center star + 4 small satellites
    const star=(s)=>{X.beginPath();
      for(let i=0;i<5;i++){const a1=i*TAU/5-PI/2,a2=a1+TAU/10;
        X.lineTo(cos(a1)*s,sin(a1)*s);X.lineTo(cos(a2)*s*.4,sin(a2)*s*.4)}
      X.closePath();X.fill();};
    X.fillStyle=c;star(sz*.7);
    X.fillStyle=c+'80';for(let i=0;i<4;i++){
      const a=i*PI/2+PI/4;X.save();X.translate(cos(a)*sz*.85,sin(a)*sz*.85);star(sz*.22);X.restore();
    }
  }else if(id.startsWith('perfect_')){
    // Trophy cup — bowl + handles + base
    X.fillStyle=c;
    X.beginPath();X.moveTo(-sz*.5,-sz*.5);X.lineTo(sz*.5,-sz*.5);
    X.lineTo(sz*.4,sz*.1);X.quadraticCurveTo(0,sz*.4,-sz*.4,sz*.1);X.closePath();X.fill();
    // Handles
    X.strokeStyle=c;X.lineWidth=2.5;
    X.beginPath();X.arc(-sz*.5,-sz*.25,sz*.18,PI/2,PI*1.5);X.stroke();
    X.beginPath();X.arc(sz*.5,-sz*.25,sz*.18,-PI/2,PI/2);X.stroke();
    // Base
    X.fillStyle=c;
    X.fillRect(-sz*.08,sz*.1,sz*.16,sz*.25);
    X.fillRect(-sz*.35,sz*.32,sz*.7,sz*.12);
  }else if(id.startsWith('daily_')){
    // Calendar with checkmark
    X.fillStyle=c;
    X.beginPath();X.roundRect(-sz*.55,-sz*.4,sz*1.1,sz*.95,sz*.12);X.fill();
    X.fillStyle='rgba(255,255,255,.85)';
    X.fillRect(-sz*.55,-sz*.4,sz*1.1,sz*.18);
    // Tear-tabs
    X.fillStyle=c;
    X.fillRect(-sz*.35,-sz*.55,sz*.1,sz*.25);
    X.fillRect(sz*.25,-sz*.55,sz*.1,sz*.25);
    // Check
    X.strokeStyle='rgba(255,255,255,.95)';X.lineWidth=2;
    X.beginPath();X.moveTo(-sz*.25,sz*.1);X.lineTo(-sz*.05,sz*.3);X.lineTo(sz*.3,-sz*.1);X.stroke();
  }else if(id.startsWith('streak_')){
    // Flame
    X.fillStyle=c;
    X.beginPath();
    X.moveTo(0,-sz*.6);
    X.bezierCurveTo(sz*.4,-sz*.2,sz*.55,sz*.1,sz*.3,sz*.4);
    X.bezierCurveTo(sz*.15,sz*.55,-sz*.15,sz*.55,-sz*.3,sz*.4);
    X.bezierCurveTo(-sz*.55,sz*.1,-sz*.4,-sz*.2,0,-sz*.6);
    X.fill();
    // Inner flame highlight
    X.fillStyle='rgba(255,255,255,.4)';
    X.beginPath();X.moveTo(0,-sz*.25);
    X.bezierCurveTo(sz*.18,sz*.0,sz*.22,sz*.2,sz*.05,sz*.35);
    X.bezierCurveTo(-sz*.1,sz*.3,-sz*.18,sz*.1,0,-sz*.25);
    X.fill();
  }else if(id.startsWith('no_hint_')){
    // Lightbulb
    X.fillStyle=c;
    X.beginPath();X.arc(0,-sz*.1,sz*.42,0,TAU);X.fill();
    X.fillRect(-sz*.22,sz*.25,sz*.44,sz*.12);
    X.fillRect(-sz*.18,sz*.4,sz*.36,sz*.08);
    X.strokeStyle='rgba(255,255,255,.6)';X.lineWidth=1;
    X.beginPath();X.moveTo(-sz*.15,-sz*.1);X.lineTo(-sz*.15,sz*.2);X.stroke();
    X.beginPath();X.moveTo(sz*.15,-sz*.1);X.lineTo(sz*.15,sz*.2);X.stroke();
  }else if(id==='speedrun'){
    // Lightning bolt
    X.fillStyle=c;
    X.beginPath();
    X.moveTo(sz*.1,-sz*.6);X.lineTo(-sz*.4,sz*.05);X.lineTo(-sz*.05,sz*.1);
    X.lineTo(-sz*.15,sz*.6);X.lineTo(sz*.4,-sz*.05);X.lineTo(sz*.05,-sz*.1);
    X.closePath();X.fill();
  }else{
    // Fallback: filled star
    X.fillStyle=c;
    X.beginPath();
    for(let i=0;i<5;i++){const a1=i*TAU/5-PI/2,a2=a1+TAU/10;
      X.lineTo(cos(a1)*sz*.7,sin(a1)*sz*.7);X.lineTo(cos(a2)*sz*.3,sin(a2)*sz*.3)}
    X.closePath();X.fill();
  }
  X.restore();
}

// --- ACHIEVEMENTS LIST ---
// Paginated: 9 cards per page so all 18 achievements are reachable in 2
// pages. Old version clipped at y > H-70 — silently hid 7 of 18 with no
// affordance (per audit).
const ACH_PER_PAGE=9;
function drawAchievements(){
  drawBg(true);
  txtP('ACHIEVEMENTS',W/2,62,22,TH.text);
  txt(achUnlockedCount()+' / '+ACHIEVEMENTS.length+' unlocked',W/2,86,12,TH.textSec);

  // Coins top-right
  drawCoin(W-50,64,7);
  txt(coins+'',W-40,64,13,TH.star,'left');

  // Page bounds
  const pageCount=max(1,Math.ceil(ACHIEVEMENTS.length/ACH_PER_PAGE));
  if(achPage>=pageCount)achPage=pageCount-1;
  if(achPage<0)achPage=0;
  const fromIdx=achPage*ACH_PER_PAGE;
  const toIdx=min(ACHIEVEMENTS.length,fromIdx+ACH_PER_PAGE);

  // v2 redesign: cards now use the same neutral surface tokens as
  // Settings / Levels / Stats. Done state is signalled by the BORDER
  // color (gold) and the icon tint, not by a background tint that
  // muddies on dark mode. Locked rows get a desaturated body so the
  // ladder of progress is still readable at a glance.
  const startY=110,cardH=56,cardGap=8,cardW=W-40,cardX=20;
  for(let i=fromIdx;i<toIdx;i++){
    const a=ACHIEVEMENTS[i];
    const y=startY+(i-fromIdx)*(cardH+cardGap);
    const done=!!achUnlocked[a.id];
    // Surface (neutral for both states; only the rim differs)
    X.fillStyle = done ? TH.surface : (darkMode ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.025)');
    X.beginPath();X.roundRect(cardX,y,cardW,cardH,12);X.fill();
    X.strokeStyle = done ? TH.star : TH.border;
    X.lineWidth = done ? 1.5 : 1;
    X.beginPath();X.roundRect(cardX,y,cardW,cardH,12);X.stroke();
    // Icon
    drawAchIcon(a.id,cardX+28,y+cardH/2,15,done?TH.star:TH.textDim);
    // Name + desc
    txt(a.name,cardX+58,y+19,12,done?TH.text:TH.textSec,'left','700');
    txt(a.desc,cardX+58,y+38,10,done?TH.textSec:TH.textDim,'left');
    // Reward — right-anchored
    const rewardStr='+'+a.reward;
    const rightEdge=cardX+cardW-14;
    txt(rewardStr,rightEdge,y+cardH/2,11,done?TH.star:TH.textDim,'right');
    const textApproxW=rewardStr.length*6.5;
    drawCoin(rightEdge-textApproxW-7,y+cardH/2,6);
  }

  // Pagination — chevron pills, matches drawLevels.
  if(pageCount>1){
    const pagY=H-95;
    if(achPage>0){
      const px=W/2-90, pw=40, ph=34;
      const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
      X.fillStyle=hv?TH.btnHover:TH.btnBg;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
      X.strokeStyle=TH.border;X.lineWidth=1;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
      _drawChevron(px,pagY,7,TH.text,'left');
      if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;achPage--}
    }
    txt((achPage+1)+' / '+pageCount,W/2,pagY,12,TH.textSec,'center','700');
    if(achPage<pageCount-1){
      const px=W/2+90, pw=40, ph=34;
      const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
      X.fillStyle=hv?TH.btnHover:TH.btnBg;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
      X.strokeStyle=TH.border;X.lineWidth=1;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
      _drawChevron(px,pagY,7,TH.text,'right');
      if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;achPage++}
    }
  }

  if(drawBtn(t('back'),W/2,H-50,140,38)){goto('menu')}
}

// Achievement unlock popup — animates at top of screen
function drawAchPopup(){
  if(!achPopup)return;
  achPopup.t+=dt;
  const dur=3.5;
  if(achPopup.t>=dur){achPopup=null;return}
  const a=ACHIEVEMENTS.find(x=>x.id===achPopup.id);
  if(!a){achPopup=null;return}
  const p=achPopup.t/dur;
  // Slide in (0-0.2), hold (0.2-0.85), slide out (0.85-1)
  let offY;
  if(p<.15)offY=-80+(p/.15)*80;
  else if(p>.85)offY=-((p-.85)/.15)*80;
  else offY=0;

  // py is safe-area aware — clears the Dynamic Island on every iPhone.
  const pw=320,ph=58,px=(W-pw)/2,py=Math.max(60,safeTop+20)+offY;
  // Subtle drop shadow via stacked fills (cheap) instead of shadowBlur
  // (expensive every frame on iOS WebKit).
  X.fillStyle='rgba(0,0,0,.10)';
  X.beginPath();X.roundRect(px,py+3,pw,ph,14);X.fill();
  X.fillStyle='rgba(0,0,0,.06)';
  X.beginPath();X.roundRect(px,py+6,pw,ph,14);X.fill();
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(px,py,pw,ph,14);X.fill();
  X.strokeStyle=TH.star+'80';X.lineWidth=2;
  X.beginPath();X.roundRect(px,py,pw,ph,14);X.stroke();
  // Star icon
  drawStar(px+28,py+ph/2,14,true);
  // Text
  txt('ACHIEVEMENT UNLOCKED',px+50,py+17,8,TH.star,'left','700');
  txtP(a.name,px+50,py+36,12,TH.text,'left');
  // Reward — inside the box
  drawCoin(px+pw-40,py+ph/2,7);
  txt('+'+a.reward,px+pw-28,py+ph/2,10,TH.star,'left');
}

// --- GAME OVER ---

// _drawPillBtn helper (drawBtn / drawBigBtn) — no more inline
// pill-renders with the old tinted alpha fill that read as muddy
// brown on dark mode. Buttons stack on a strict 60 px rhythm so
// no element drifts higher/lower than its neighbours.

  // Coins display top-right (drawn early so it sits behind anything else)
  drawCoin(W-50,64,7);
  txt(coins+'',W-40,64,13,TH.star,'left');

  // Broken-heart hero
  drawHeart(W/2,H*.18,56,true,true);

  // Title + subtitle
  txtP(t('gameOver'),W/2,H*.34,28,TH.text);
  txt(t('outOfHearts'),W/2,H*.40,13,TH.textSec);

  // Action stack — strict y-rhythm: header → 60px → btn → 60px → btn …
  let by = H*.50;

  // 1. Retry (primary, neutral fill, label in TH.text)
  if(drawBigBtn(t('retry'),W/2,by,220,52)){
    showInterstitialAd();
    goto('play',()=>{generateLevel(level)});
  }
  by += 64;

  // 2. Continue for coins
  const canContinue=coins>=CONTINUE_COST;
  const continueLabel=t('continueBtn')+'  '+CONTINUE_COST;
  if(drawBtn(continueLabel,W/2,by,220,44,canContinue?TH.star:null)){
    if(canContinue) continueFromGameover();
  }
  // Coin badge sits visually inside the right edge of the pill;
  // drawing it AFTER drawBtn means it's painted over the button
  // surface for correct layering.
  drawCoin(W/2+88,by,7);
  by += 56;

  // 3. Free continue via rewarded ad
  if(drawBtn(t('continueBtn')+' (Ad)',W/2,by,220,44,TH.success)){
    showRewardedAd(()=>{undosLeft=3;S='play'});
  }
  by += 56;

  // 4. Watch ad for coins — only when player can't afford option 2
  if(coins<CONTINUE_COST){
    const adLabel='+'+AD_COIN_REWARD+' '+t('coins').toUpperCase();
    if(drawBtn(adLabel,W/2,by,220,40,TH.star)){
      const cy=by;
      showRewardedAd(()=>{
        coins+=AD_COIN_REWARD;totalCoinsEarned+=AD_COIN_REWARD;save();
        spawnFloater(W/2,cy,'+'+AD_COIN_REWARD);
      });
    }
    by += 50;
  }

  // 5. Home — small neutral pill at the bottom
  if(drawBtn(t('home'),W/2,by+8,140,36)){goto('menu')}
}

// --- SETTINGS ---
let resetConfirm=false;
// ---------- Settings helpers (v2 redesign — iOS-style grouped lists) ----------
//
// Was: 5 big tinted-pill buttons stacked vertically, every one same
// shape/size, "Theme: Dark" / "Sound: ON" mashed together. Read like a
// raw HTML form. Now: section headers + grouped rows on a card surface,
// each row is icon + label + value/toggle/chevron. Direct lift from
// the iOS HIG settings pattern with our minimal stroke-icon vocabulary.

function _drawSectionHeader(text, y){
  txt(text.toUpperCase(), 30, y, 9, TH.textSec, 'left', '700');
}

// Single grouped-list card — pass an array of row renderers, returns the y
// below the card. Each row gets divider line between (except last).
//
// Card content is CLIPPED to the rounded outer shape so the hover row
// highlight, dividers, and any row content can't bleed past the
// corners. Without the clip, the corner rows show a rectangular hover
// rect that pokes outside the 16-px corner radius — user explicitly
// flagged this ("свечение по углам выходит за рамки").
function _drawSettingsCard(yTop, rows){
  const cardX = 20, cardW = W - 40;
  const rowH = 56;
  const cardH = rowH * rows.length;
  // Surface + outline (drawn BEFORE the clip so the stroke renders at
  // full thickness on the rim, not half-thickness inside it).
  X.fillStyle = TH.surface;
  X.beginPath(); X.roundRect(cardX, yTop, cardW, cardH, 16); X.fill();
  X.strokeStyle = TH.border; X.lineWidth = 1;
  X.beginPath(); X.roundRect(cardX, yTop, cardW, cardH, 16); X.stroke();
  // Clip subsequent draws to the card silhouette — the highlight in
  // _settingsRow stays a clean rect now (cheap, no per-row corner
  // detection), but the rounded clip eats whatever pokes past.
  X.save();
  X.beginPath(); X.roundRect(cardX, yTop, cardW, cardH, 16);
  X.clip();
  for (let i = 0; i < rows.length; i++) {
    const ry = yTop + i * rowH;
    rows[i](cardX, ry, cardW, rowH);
    if (i < rows.length - 1) {
      X.strokeStyle = TH.border;
      X.lineWidth = 0.7;
      X.beginPath();
      X.moveTo(cardX + 56, ry + rowH);
      X.lineTo(cardX + cardW - 16, ry + rowH);
      X.stroke();
    }
  }
  X.restore();
  return yTop + cardH;
}

// Hit-test wrapper — draws the row, returns whether it was tapped.
// Standalone rows (not inside a card — e.g. inline Cancel link, Back
// link) get a rounded-pill highlight via passing `inCard=false`. Rows
// inside a card pass `inCard=true` so the parent clip handles the
// corner trimming and we just paint a plain rect.
function _settingsRow(rx, ry, rw, rh, draw, inCard){
  const blocked = _inputBlocked();
  const hv = !blocked && mx >= rx && mx <= rx + rw && my >= ry && my <= ry + rh;
  if (hv) {
    X.fillStyle = darkMode ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.04)';
    X.beginPath();
    if (inCard === false) {
      // No surrounding clip → the highlight itself must be rounded.
      X.roundRect(rx, ry, rw, rh, rh / 2);
    } else {
      X.rect(rx, ry, rw, rh);
    }
    X.fill();
  }
  draw(rx, ry, rw, rh, hv);
  if (!blocked && tapped && tapX >= rx && tapX <= rx + rw && tapY >= ry && tapY <= ry + rh) {
    sfx.tap(); tapped = false;
    return true;
  }
  return false;
}

// iOS-style toggle switch. ON = filled accent track + thumb on right.
// OFF = grey track + thumb on left.
function _drawToggle(cx, cy, on){
  const tw = 44, th = 26, r = th / 2;
  const x = cx - tw / 2, y = cy - th / 2;
  X.fillStyle = on ? TH.accent : (darkMode ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.18)');
  X.beginPath(); X.roundRect(x, y, tw, th, r); X.fill();
  // Thumb — pure white circle for both states (matches iOS)
  const thumbX = on ? x + tw - r : x + r;
  X.fillStyle = '#ffffff';
  X.beginPath(); X.arc(thumbX, cy, r - 3, 0, TAU); X.fill();
  // Subtle thumb shadow
  X.fillStyle = 'rgba(0,0,0,.10)';
  X.beginPath(); X.arc(thumbX, cy + 1, r - 3, 0, TAU); X.fill('evenodd');
}

// Chevron glyph in any of 4 directions. `dir` = 'right' (default) /
// 'left' / 'up' / 'down'. Used for navigation rows (›), the Back link
// (‹), the update banner (↑), and any future drop-down toggles (∨).
function _drawChevron(cx, cy, sz, col, dir){
  X.save();
  X.strokeStyle = col || TH.textSec;
  X.lineWidth = 2;
  X.lineCap = 'round'; X.lineJoin = 'round';
  X.translate(cx, cy);
  // Rotate the canvas so we can write a single "right-pointing" path
  // and let the transform handle the other three directions.
  if (dir === 'left')      X.rotate(PI);
  else if (dir === 'up')   X.rotate(-PI/2);
  else if (dir === 'down') X.rotate(PI/2);
  X.beginPath();
  X.moveTo(-sz * 0.3, -sz * 0.5);
  X.lineTo( sz * 0.3, 0);
  X.lineTo(-sz * 0.3,  sz * 0.5);
  X.stroke();
  X.restore();
}

// Icon strip — minimal stroke glyphs matching the heart/star/coin family.
function _drawSettingsIcon(name, x, y, sz, col){
  X.save();
  X.strokeStyle = col;
  X.fillStyle = col;
  X.lineWidth = 1.6;
  X.lineCap = 'round'; X.lineJoin = 'round';
  if (name === 'globe') {
    X.beginPath(); X.arc(x, y, sz, 0, TAU); X.stroke();
    X.beginPath(); X.ellipse(x, y, sz * 0.45, sz, 0, 0, TAU); X.stroke();
    X.beginPath(); X.moveTo(x - sz, y); X.lineTo(x + sz, y); X.stroke();
  } else if (name === 'speaker') {
    X.beginPath();
    X.moveTo(x - sz * 0.6, y - sz * 0.35);
    X.lineTo(x - sz * 0.2, y - sz * 0.35);
    X.lineTo(x + sz * 0.2, y - sz * 0.7);
    X.lineTo(x + sz * 0.2, y + sz * 0.7);
    X.lineTo(x - sz * 0.2, y + sz * 0.35);
    X.lineTo(x - sz * 0.6, y + sz * 0.35);
    X.closePath(); X.fill();
    // Sound waves
    X.beginPath(); X.arc(x + sz * 0.5, y, sz * 0.45, -PI / 3, PI / 3); X.stroke();
    X.beginPath(); X.arc(x + sz * 0.5, y, sz * 0.75, -PI / 3, PI / 3); X.stroke();
  } else if (name === 'moon') {
    X.beginPath();
    X.arc(x, y, sz, PI * 0.25, PI * 1.75, false);
    X.arc(x + sz * 0.45, y - sz * 0.05, sz * 0.95, PI * 1.7, PI * 0.3, true);
    X.closePath(); X.fill();
  } else if (name === 'contrast') {
    X.beginPath(); X.arc(x, y, sz, 0, TAU); X.stroke();
    X.beginPath(); X.arc(x, y, sz, -PI / 2, PI / 2); X.fill();
  } else if (name === 'coin') {
    drawCoin(x, y, sz);
  } else if (name === 'trash') {
    X.beginPath();
    X.moveTo(x - sz * 0.55, y - sz * 0.55);
    X.lineTo(x + sz * 0.55, y - sz * 0.55);
    X.stroke();
    X.beginPath();
    X.moveTo(x - sz * 0.30, y - sz * 0.55);
    X.lineTo(x - sz * 0.30, y - sz * 0.85);
    X.lineTo(x + sz * 0.30, y - sz * 0.85);
    X.lineTo(x + sz * 0.30, y - sz * 0.55);
    X.stroke();
    // Body
    X.beginPath();
    X.roundRect(x - sz * 0.45, y - sz * 0.35, sz * 0.9, sz * 1.15, sz * 0.10);
    X.stroke();
    // Vertical lines inside
    X.beginPath();
    X.moveTo(x - sz * 0.20, y - sz * 0.18); X.lineTo(x - sz * 0.20, y + sz * 0.62);
    X.moveTo(x, y - sz * 0.18); X.lineTo(x, y + sz * 0.62);
    X.moveTo(x + sz * 0.20, y - sz * 0.18); X.lineTo(x + sz * 0.20, y + sz * 0.62);
    X.stroke();
  }
  X.restore();
}

function drawSettings(){
  drawBg(true);

  // Header
  txtP(t('settings'), W / 2, 64, 24, TH.text);

  let yCursor = 110;

  // ----- General -----
  _drawSectionHeader(t('settings'), yCursor);  // re-use settings token; could be a new "GENERAL" token if added later
  yCursor += 14;

  const curLang = LANGS.find(l => l.code === lang) || LANGS[0];

  yCursor = _drawSettingsCard(yCursor, [
    // Language → opens picker modal
    (rx, ry, rw, rh) => {
      if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
        _drawSettingsIcon('globe', rx + 28, ry + rh / 2, 11, TH.textSec);
        txt(t('language'), rx + 56, ry + rh / 2, 14, TH.text, 'left');
        txt(curLang.name, rx + rw - 36, ry + rh / 2, 13, TH.textSec, 'right');
        _drawChevron(rx + rw - 18, ry + rh / 2, 8);
      })) langPickerOpen = true;
    },
    // Sound toggle
    (rx, ry, rw, rh) => {
      if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
        _drawSettingsIcon('speaker', rx + 28, ry + rh / 2, 11, TH.textSec);
        txt(t('sound'), rx + 56, ry + rh / 2, 14, TH.text, 'left');
        _drawToggle(rx + rw - 32, ry + rh / 2, sndOn);
      })) {
        sndOn = !sndOn; _safeSet('ae_sound', sndOn ? '1' : '0');
      }
    },
    // Dark mode toggle
    (rx, ry, rw, rh) => {
      if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
        _drawSettingsIcon('moon', rx + 28, ry + rh / 2, 10, TH.textSec);
        txt(t('themeDark'), rx + 56, ry + rh / 2, 14, TH.text, 'left');
        _drawToggle(rx + rw - 32, ry + rh / 2, darkMode);
      })) {
        darkMode = !darkMode; _safeSet('ae_theme', darkMode ? 'dark' : 'light');
        applyTheme();
      }
    },
    // High Contrast toggle
    (rx, ry, rw, rh) => {
      if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
        _drawSettingsIcon('contrast', rx + 28, ry + rh / 2, 10, TH.textSec);
        txt(t('contrast'), rx + 56, ry + rh / 2, 14, TH.text, 'left');
        _drawToggle(rx + rw - 32, ry + rh / 2, highContrast);
      })) {
        highContrast = !highContrast; _safeSet('ae_contrast', highContrast ? 'high' : 'normal');
        applyTheme();
      }
    },
  ]);

  yCursor += 28;

  // ----- Coins -----
  _drawSectionHeader(t('coins'), yCursor);
  yCursor += 14;

  yCursor = _drawSettingsCard(yCursor, [
    (rx, ry, rw, rh) => {
      if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
        _drawSettingsIcon('coin', rx + 28, ry + rh / 2, 9);
        txt(t('watchAd'), rx + 56, ry + rh / 2, 14, TH.text, 'left');
        txt('+' + AD_COIN_REWARD, rx + rw - 36, ry + rh / 2, 14, TH.star, 'right');
        _drawChevron(rx + rw - 18, ry + rh / 2, 8, TH.star);
      })) {
        showRewardedAd(() => {
          coins += AD_COIN_REWARD; totalCoinsEarned += AD_COIN_REWARD; save();
          spawnFloater(W / 2, ry + rh / 2, '+' + AD_COIN_REWARD);
        });
      }
    },
    // Arrow Skins shop → goto('skins'). Icon previews the active skin's paint.
    (rx, ry, rw, rh) => {
      if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
        const _sk = _activeSkinDef();
        drawArrow(rx + 28, ry + rh / 2, 0, 26, _skinPaint(_sk, 1), 1);
        txt(t('skins'), rx + 56, ry + rh / 2, 14, TH.text, 'left');
        txt(_sk.name, rx + rw - 36, ry + rh / 2, 13, TH.textSec, 'right');
        _drawChevron(rx + rw - 18, ry + rh / 2, 8);
      })) goto('skins');
    },
  ]);

  yCursor += 28;

  // ----- Reset (DANGER) — confirm in place, no separate buttons -----
  if (!resetConfirm) {
    yCursor = _drawSettingsCard(yCursor, [
      (rx, ry, rw, rh) => {
        if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
          _drawSettingsIcon('trash', rx + 28, ry + rh / 2, 10, TH.arrowBlock);
          txt(t('resetProgress'), rx + 56, ry + rh / 2, 14, TH.arrowBlock, 'left');
        })) resetConfirm = true;
      },
    ]);
  } else {
    // Confirmation card — full-width row with the danger styling, plus a
    // small CANCEL link below to dismiss.
    yCursor = _drawSettingsCard(yCursor, [
      (rx, ry, rw, rh) => {
        if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
          _drawSettingsIcon('trash', rx + 28, ry + rh / 2, 10, TH.arrowBlock);
          txt(t('yesReset'), rx + 56, ry + rh / 2, 14, TH.arrowBlock, 'left');
        })) {
          const PROGRESS_KEYS = ['ae_level', 'ae_maxlevel', 'ae_coins', 'ae_stars', 'ae_ach',
            'ae_total_coins', 'ae_streakdays', 'ae_lastday', 'ae_perfects', 'ae_dailies',
            'ae_nohint', 'ae_fastest', 'ae_playtime', 'ae_noads', 'ae_skins', 'ae_skin'];
          for (const k of PROGRESS_KEYS) localStorage.removeItem(k);
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && (k.startsWith('ae_best_') || k.startsWith('ae_daily_') || k.startsWith('ae_weekly_')))
              localStorage.removeItem(k);
          }
          level = 1; maxLevel = 1; coins = STARTING_COINS; stars = {}; totalStars = 0;
          achUnlocked = {}; totalPerfect = 0; totalDailies = 0; noHintCount = 0;
          totalCoinsEarned = 0; streakDays = 0; totalPlayTime = 0; fastestLevel = 99999;
          lastPlayDay = 0; hintUsedThisLevel = false;
          ownedSkins = new Set(['classic']); activeSkin = 'classic';
          resetConfirm = false; save();
          goto('menu');
        }
      },
    ]);
    // Inline cancel link beneath — small, neutral, no card.
    yCursor += 6;
    if (_settingsRow(W / 2 - 60, yCursor, 120, 30, (rx, ry, rw, rh) => {
      txt(t('cancel'), rx + rw / 2, ry + rh / 2, 13, TH.textSec);
    }, false)) resetConfirm = false;
  }

  // Back arrow — left-pointing chevron in the top-left, paired with
  // the localized "BACK" label.
  if (_settingsRow(12, 36, 90, 44, (rx, ry, rw, rh) => {
    _drawChevron(rx + 16, ry + rh / 2, 7, TH.text, 'left');
    txt(t('back'), rx + 30, ry + rh / 2, 13, TH.text, 'left');
  }, false)) { resetConfirm = false; goto('menu'); }
}

// --- LANGUAGE PICKER MODAL ---
// Shown over any screen; absorbs all taps until the user picks a language or
// taps outside the panel. Lists every language in LANGS, current one marked.
//
// v2 redesign: matches the Settings card visual language. Panel is
// the TH.surface token, hairline TH.border outline, hover/selected
// rows use the same neutral tint as _settingsRow. No more bespoke
// rgba colour mixing per surface — every modal/card in the app reads
// from the same palette tokens so dark mode keeps its colour family
// consistent.
function drawLangPicker(){
  // Dim backdrop
  X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,0,W,H);
  const rowH=46;
  const panelW=300, panelH=Math.min(LANGS.length*rowH+78, H-100);
  const px=(W-panelW)/2, py=(H-panelH)/2;
  // Panel surface
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.fill();
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.stroke();
  // Title
  txtP(t('language'),W/2,py+30,18,TH.text);
  // Clip the row list to the rounded panel so hover highlights at the
  // first/last row don't poke past the corners — same trick as the
  // Settings cards.
  X.save();
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.clip();
  const startY=py+58, maxRows=Math.floor((panelH-72)/rowH);
  for(let i=0;i<Math.min(LANGS.length,maxRows);i++){
    const L=LANGS[i];
    const ry=startY+i*rowH;
    const sel=L.code===lang;
    const hv=mx>px&&mx<px+panelW&&my>=ry&&my<=ry+rowH;
    if(hv){
      X.fillStyle=darkMode?'rgba(255,255,255,.05)':'rgba(0,0,0,.04)';
      X.fillRect(px,ry,panelW,rowH);
    }
    txt(L.name, W/2, ry+rowH/2, 15, sel?TH.accent:TH.text);
    // Checkmark for selected language — small canvas-stroked tick to
    // match the rest of the icon family (no font fallback).
    if(sel){
      X.save();
      X.strokeStyle=TH.accent;X.lineWidth=2.2;X.lineCap='round';X.lineJoin='round';
      const ckx=px+panelW-26, cky=ry+rowH/2;
      X.beginPath();
      X.moveTo(ckx-7,cky);X.lineTo(ckx-2,cky+5);X.lineTo(ckx+7,cky-6);
      X.stroke();
      X.restore();
    }
    if(tapped && tapX>px && tapX<px+panelW && tapY>=ry && tapY<=ry+rowH){
      lang=L.code;_safeSet('ae_lang',lang);
      langPickerOpen=false;sfx.tap();haptic(8);tapped=false;
      X.restore();
      return;
    }
  }
  X.restore();
  // Close (taps outside panel) — checked LAST so row taps win
  if(tapped&&(tapX<px||tapX>px+panelW||tapY<py||tapY>py+panelH)){
    langPickerOpen=false;tapped=false;
  }
}

// --- LEVELS ---
// Paginated: 25 levels per page (5×5 grid). Unlimited pages. Each card shows
// the level number, stars earned, and lock state.
const LEVELS_PER_PAGE=25;
function drawLevels(){
  drawBg(true);

  // Header
  txtP(t('levels'),W/2,62,22,TH.text);

  const fromLv=levelsPage*LEVELS_PER_PAGE+1;
  const toLv=fromLv+LEVELS_PER_PAGE-1;
  txt(fromLv+' – '+toLv,W/2,72,12,TH.textSec);

  // Coins display top-right
  drawCoin(W-50,64,7);
  txt(coins+'',W-40,64,13,TH.star,'left');

  // Grid of 25 level cards (5×5)
  const cols=5,rows=5;
  const cellW=62,cellH=66;
  const gridW=cols*cellW,gridH=rows*cellH;
  const startX=(W-gridW)/2;
  const startY=100;

  for(let i=0;i<cols*rows;i++){
    const lv=fromLv+i;
    const r=floor(i/cols),c=i%cols;
    const x=startX+c*cellW+cellW/2;
    const y=startY+r*cellH+cellH/2;

    const unlocked=lv<=maxLevel;
    const current=lv===level;
    const done=stars[lv]>0;
    const s=stars[lv]||0;
    const hv=abs(mx-x)<26&&abs(my-y)<30;

    // Card background — neutral solid for ALL states; differentiation
    // comes from a subtle 2-px border accent on `current` and a star
    // tint on `done`. No more tinted rgba fills (that read as muddy
    // gold on dark mode). Locked cards use a desaturated surface so
    // they read as "not yet" without colour-noise.
    const cardW=52,cardH=56;
    if(unlocked){
      X.fillStyle = hv ? TH.btnHover : TH.btnBg;
    } else {
      X.fillStyle = darkMode ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.03)';
    }
    X.beginPath();X.roundRect(x-cardW/2,y-cardH/2,cardW,cardH,10);X.fill();
    // Border — accent only when this is the current level
    if (current) {
      X.strokeStyle = TH.accent; X.lineWidth = 2;
    } else {
      X.strokeStyle = TH.border; X.lineWidth = 1;
    }
    X.beginPath();X.roundRect(x-cardW/2,y-cardH/2,cardW,cardH,10);X.stroke();
    // Level number
    txtP(lv+'',x,y-8, unlocked?15:13, unlocked?TH.text:TH.textDim);
    // Stars (canvas-drawn glyphs, scaled small)
    for(let j=0;j<3;j++){
      const sx=x-10+j*10,sy=y+14;
      drawStar(sx,sy,4, done && j<s);
    }
    // Locked indicator — small horizontal dash under the level number
    if(!unlocked){
      X.strokeStyle=TH.textDim;X.lineWidth=1.2;X.lineCap='round';
      X.beginPath();X.moveTo(x-7,y+4);X.lineTo(x+7,y+4);X.stroke();
    }
    // Tap
    if(tapped&&abs(tapX-x)<cardW/2&&abs(tapY-y)<cardH/2&&unlocked){
      sfx.tap();tapped=false;
      goto('play',()=>{level=lv;isDaily=false;isWeekly=false;generateLevel(level)});
      return;
    }
  }

  // Pagination — chevron icons rather than ASCII arrows.
  const pagY=H-110;
  const hasPrev=levelsPage>0;
  if(hasPrev){
    const px=W*.28, pw=88, ph=36;
    const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
    X.fillStyle=hv?TH.btnHover:TH.btnBg;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
    X.strokeStyle=TH.border;X.lineWidth=1;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
    _drawChevron(px-18,pagY,7,TH.text,'left');
    txt('PREV',px+8,pagY,12,TH.text);
    if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;levelsPage--}
  }
  txt('PAGE '+(levelsPage+1),W/2,pagY,11,TH.textSec,'center','700');
  {
    const px=W*.72, pw=88, ph=36;
    const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
    X.fillStyle=hv?TH.btnHover:TH.btnBg;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
    X.strokeStyle=TH.border;X.lineWidth=1;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
    txt('NEXT',px-10,pagY,12,TH.text);
    _drawChevron(px+18,pagY,7,TH.text,'right');
    if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;levelsPage++}
  }

  // Back
  if(drawBtn(t('back'),W/2,H-55,140,36)){goto('menu')}
}

// ================================================================
//  MAIN LOOP
// ================================================================
let _lastT=0;
let fadingOut=false;
// --- SKINS SHOP ---
// 3-column grid of arrow skins. Each card previews the skin (a right-pointing
// arrow painted by it), its name, and a footer: EQUIPPED (active), EQUIP
// (owned → tap to equip), or a coin + price (tap to buy if affordable, dimmed
// otherwise). Buying auto-equips. Paid with the in-game coins earned in play /
// rewarded ads — NOT real money (that's the separate Remove Ads IAP).
function drawSkins(){
  drawBg(true);
  txtP(t('skins'),W/2,64,24,TH.text);
  // Coin balance, top-right — mirrors the play/complete/gameover screens.
  drawCoin(W-52,64,8);
  txt(coins+'',W-40,64,13,TH.star,'left');

  // 2 columns → big, easy-to-read cards. Card HEIGHT is derived from the
  // available vertical space so all rows always fit (never clips the bottom
  // row on shorter phones), then capped so cards stay roughly square on tall
  // screens instead of stretching into letterboxes.
  const cols=3, n=SKINS.length;
  const rows=Math.ceil(n/cols);
  const margin=16, gap=11, startY=104, bottomPad=20;
  const cardW=(W-margin*2-gap*(cols-1))/cols;
  const availH=H-startY-bottomPad;
  const cardH=Math.min((availH-gap*(rows-1))/rows, cardW*0.82);
  const lastRowCount=n-(rows-1)*cols; // cards on the final row

  for(let idx=0;idx<n;idx++){
    const sk=SKINS[idx];
    const cIdx=idx%cols, rIdx=floor(idx/cols);
    // Centre the final row when it isn't full (e.g. a lone 9th card).
    const rowCount=(rIdx===rows-1)?lastRowCount:cols;
    const rowW=rowCount*cardW+(rowCount-1)*gap;
    const rowLeft=(W-rowW)/2;
    const x=rowLeft+cIdx*(cardW+gap)+cardW/2;
    const y=startY+rIdx*(cardH+gap)+cardH/2;
    const owned=ownedSkins.has(sk.id);
    const active=sk.id===activeSkin;
    const afford=coins>=sk.price;
    const hv=abs(mx-x)<cardW/2&&abs(my-y)<cardH/2;

    const cardX=x-cardW/2, cardY=y-cardH/2;
    const pc=_skinPaint(sk,1); // paint function — gradient skins resolve at draw

    // Card surface. Equipped card gets a faint accent wash so it reads as
    // "selected" beyond just the border.
    X.fillStyle=hv?TH.btnHover:TH.btnBg;
    X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,16);X.fill();
    if(active){
      X.save();X.globalAlpha=0.07;X.fillStyle=TH.accent;
      X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,16);X.fill();X.restore();
    }
    X.strokeStyle=active?TH.accent:TH.border;X.lineWidth=active?2.5:1;
    X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,16);X.stroke();

    // Bold, game-style thick arrow — the hero of the card. drawArrowPolyline
    // gives the same rounded thick look as the arrows in play.
    const ay=y-cardH*0.12, aw=cardW*0.26;
    drawArrowPolyline([[x-aw,ay],[x+aw,ay]], cardW*0.50, pc, 1);

    // Name
    txtP(sk.name, x, y+cardH*0.17, 12, owned?TH.text:TH.textSec);

    // Status chip / price pill
    const chipY=y+cardH*0.37;
    if(active){
      txtP(t('equipped'), x, chipY, 9, TH.accent);
      // Corner check badge so "equipped" reads at a glance.
      const bx=cardX+cardW-13, by=cardY+13, br=8;
      X.fillStyle=TH.accent;X.beginPath();X.arc(bx,by,br,0,TAU);X.fill();
      X.strokeStyle='#fff';X.lineWidth=1.7;X.lineCap='round';X.lineJoin='round';
      X.beginPath();X.moveTo(bx-3.2,by+0.4);X.lineTo(bx-1,by+2.8);X.lineTo(bx+3.4,by-2.4);X.stroke();
    }else if(owned){
      txtP(t('equip'), x, chipY, 9, TH.textSec);
    }else{
      // Price pill — gold when affordable, muted when not.
      const pw=56, ph=20;
      X.save();X.globalAlpha=afford?0.14:0.06;X.fillStyle=afford?TH.star:TH.text;
      X.beginPath();X.roundRect(x-pw/2,chipY-ph/2,pw,ph,ph/2);X.fill();X.restore();
      drawCoin(x-13,chipY,5);
      txt(sk.price+'', x-2, chipY, 11, afford?TH.star:TH.textDim, 'left');
    }

    // Tap: active → no-op; owned → equip; else → buy (auto-equips) or reject.
    if(tapped&&hv){
      tapped=false;
      if(active){sfx.tap();}
      else if(owned){setActiveSkin(sk.id);sfx.tap();haptic(8);}
      else{
        const r=buySkin(sk.id);
        if(r==='bought'){sfx.tap();haptic(12);save();spawnFloater(x,y,'-'+sk.price,TH.star);}
        else{sfx.tap();spawnFloater(x,y-cardH*0.3,t('notEnough'),TH.arrowBlock);}
      }
    }
  }

  // Back chevron — identical pattern to Settings.
  if(_settingsRow(12,36,90,44,(rx,ry,rw,rh)=>{
    _drawChevron(rx+16,ry+rh/2,7,TH.text,'left');
    txt(t('back'),rx+30,ry+rh/2,13,TH.text,'left');
  },false)){goto('menu');}
}

function goto(newState,action){
  if(fadingOut)return;
  // Reset transient screen-local UI flags when leaving screens — avoids the
  // settings reset-confirm row appearing already-toggled when you come back.
  if(newState!=='settings')resetConfirm=false;
  fadingOut=true;
  pendingState={state:newState,action:action||null};
}
function loop(t){
  // Compute and publish frame delta to module scope so draw/animation code
  // anywhere can use `dt` (was hardcoded `1/60` in 7+ spots).
  dt=min((t-_lastT)/1000,.05);_lastT=t;gt+=dt;

  // Fade transition: fade-out then apply pending state then fade-in
  if(fadingOut){
    fadeAlpha=min(1,fadeAlpha+dt*5);
    if(fadeAlpha>=1){
      if(pendingState){
        if(pendingState.action)pendingState.action();
        S=pendingState.state;
        pendingState=null;
      }
      fadingOut=false;
    }
  }else if(fadeAlpha>0){
    fadeAlpha=max(0,fadeAlpha-dt*4);
  }

  // Render
  if(S==='menu')drawMenu();
  else if(S==='play')drawPlay();
  else if(S==='complete')drawComplete();
  else if(S==='gameover')drawGameOver();
  else if(S==='settings')drawSettings();
  else if(S==='levels')drawLevels();
  else if(S==='achievements')drawAchievements();
  else if(S==='stats')drawStats();
  else if(S==='skins')drawSkins();

  // Global: floating coin popups + achievement unlock popup
  drawFloaters();
  drawAchPopup();

  // Top-most overlays (block all underlying input)
  if(langPickerOpen)drawLangPicker();

  // Screen fade overlay
  if(fadeAlpha>0){
    X.fillStyle=darkMode?`rgba(26,26,46,${fadeAlpha})`:`rgba(245,242,237,${fadeAlpha})`;
    X.fillRect(0,0,W,H);
  }

  // Final tap reset — so modals/overlays drawn AFTER screen draws still get
  // a chance to handle the tap. Individual draw functions clearing `tapped`
  // would consume it before drawLangPicker runs.
  tapped=false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Register service worker for offline play + PWA install — but ONLY when
// running as a real web page, NOT inside the Capacitor WebView. Capacitor
// serves assets from the app bundle; a SW would intercept those fetches and
// can serve stale content across app updates (we burned a build on this).
if('serviceWorker' in navigator && typeof Capacitor==='undefined'){
  navigator.serviceWorker.register('sw.js').catch(e=>_devWarn('serviceWorker.register',e));
}
window._ae={
  generateLevel,
  get arrows(){return arrows},
  get gridCols(){return gridCols},
  get gridRows(){return gridRows},
  stats(lv){
    if(lv)generateLevel(lv);
    const lens=arrows.map(a=>a.cells.length).sort((a,b)=>b-a);
    const cells=lens.reduce((a,b)=>a+b,0);
    const owner={};
    arrows.forEach((a,i)=>a.cells.forEach(([r,c])=>{owner[r+','+c]=i}));
    let contacts=0;
    arrows.forEach((a,i)=>a.cells.forEach(([r,c])=>{
      for(let d=0;d<4;d++){
        const j=owner[(r+DY[d])+','+(c+DX[d])];
        if(j!=null&&j!==i)contacts++;
      }
    }));
    const sim=arrows.map(a=>({cells:a.cells.map(c=>[c[0],c[1]]),dir:a.dir,alive:true}));
    let solved=0;
    while(solved<sim.length){
      let idx=-1;
      for(let i=0;i<sim.length;i++){
        const a=sim[i];
        if(!a.alive)continue;
        const head=a.cells[a.cells.length-1];
        let cr=head[0]+DY[a.dir],cc=head[1]+DX[a.dir],blocked=false;
        while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols&&!blocked){
          for(let j=0;j<sim.length&&!blocked;j++){
            if(j===i||!sim[j].alive)continue;
            for(const[or,oc] of sim[j].cells){
              if(or===cr&&oc===cc){blocked=true;break}
            }
          }
          cr+=DY[a.dir];cc+=DX[a.dir];
        }
        if(!blocked){idx=i;break}
      }
      if(idx<0)break;
      sim[idx].alive=false;
      solved++;
    }
    return{
      level:lv||level,
      grid:gridCols+'x'+gridRows,
      arrows:lens.length,
      coverage:+(cells/(gridCols*gridRows)*100).toFixed(1),
      one:lens.filter(x=>x===1).length,
      two:lens.filter(x=>x===2).length,
      lt4:lens.filter(x=>x<4).length,
      avg:+(cells/lens.length).toFixed(1),
      max:lens[0]||0,
      braid:+(contacts/max(1,cells)).toFixed(2),
      top:lens.slice(0,10),
      solvable:solved===sim.length,
      solved
    };
  }
};
})(); // end IIFE
</script>
