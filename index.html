  // No search, no backtracking, and none is possible to want. What blocks
  // arrow i is other arrows' CELLS, and cells don't care which way an arrow
  // points — so an arrow's orientation only ever affects its OWN
  // removability, never anyone else's. Removal is monotone on top of that
  // (it only frees cells), so "removable given what's gone" is a monotone
  // closure: whatever order you peel in, you reach the same maximal set.
  // A stall is therefore proof that NO orientation assignment and NO
  // ordering can finish this board — measured on levels 301+, that is 96%
  // of them, which is why the shipped retry loop was burning 160 attempts
  // per level and still landing on the halved-difficulty fallback.
  //
  // So repair the board instead of re-rolling it: drop the survivor whose
  // cells block the most other survivors. That strictly frees cells, which
  // can only enable more picks, and each stall costs one arrow — bounded
  // by N, so this always terminates, always solvable, in one pass.
  while(alive.size){
    const choices=freeChoices();
    if(!choices.length){
      // An arrow that points into itself whichever end is the head can
      // never leave — drop it before anything innocent.
      let selfStuck=-1;
      for(const i of alive)if(deps[i][0].has(i)&&deps[i][1].has(i)){selfStuck=i;break}
      if(selfStuck>=0){alive.delete(selfStuck);dropped++;continue}
      const blockCount=new Map();

      for(const j of alive)
        for(let f=0;f<2;f++)
          for(const b of deps[j][f])
            if(b!==j&&alive.has(b))blockCount.set(b,(blockCount.get(b)||0)+1);

      let victim=-1,most=-1;
      for(const i of alive){
        const bc=blockCount.get(i)||0;
        if(bc>most){most=bc;victim=i}
      }
      if(victim<0)victim=alive.values().next().value;
      alive.delete(victim);
      dropped++;
      continue;
    }
    const covered=choices.filter(c=>!c.opens);
    const pool=covered.length?covered:choices;
    let chosen;
    if(rng()<bias){
      let best=-1;
      for(const c of pool)if(c.opp>best)best=c.opp;
      const top=pool.filter(c=>c.opp===best);
      chosen=top[(rng()*top.length)|0];
    }else chosen=pool[(rng()*pool.length)|0];
    orientation[chosen.i]=chosen.f;
    alive.delete(chosen.i);
    order.push(chosen.i);
  }
  if(order.length<2)return false;
  const surv=order;
  // Repair pass: flipping an arrow that is open at move 1 can only change
  // its own ray, so trading it for a blocked orientation is always safe to
  // TRY — _peelMetrics re-verifies solvability and the flip is reverted
  // unless initialOpen actually dropped. Keep one opener or the board is
  // unstartable. Dropped ids are absent from `surv`, so every `rem.has(b)`
  // on them reads false — exactly the "already gone" they will be in play.
  let m=_peelMetrics(deps,orientation,surv);
  let guard=0;
  while(m&&m.initialOpen>openMax&&guard++<24){
    const openers=m.open.slice();
    for(let i=openers.length-1;i>0;i--){
      const j=(rng()*(i+1))|0;
      const t=openers[i];openers[i]=openers[j];openers[j]=t;
    }
    let flipped=false;
    for(const i of openers){
      if(m.open.length<=1)break;
      if(placed[i].cells.length<2)continue; // no second orientation
      orientation[i]=1-orientation[i];
      const m2=_peelMetrics(deps,orientation,surv);
      if(m2&&m2.initialOpen<m.initialOpen){m=m2;flipped=true;break}
      orientation[i]=1-orientation[i];
    }
    if(!flipped)break;
  }
  if(!m)return false; // peel invariant broken — leave the board untouched
  for(const i of surv){
    if(orientation[i]===1&&placed[i].cells.length>=2)placed[i].cells.reverse();
    placed[i].dir=dirs[i][orientation[i]];
  }
  // Rewrite `placed` in REVERSE peel order (and without the dropped ones),
  // which is what the caller's `placed.reverse()` turns back into the solve
  // order it documents. The peel's order is a verified one, so that
  // invariant now actually holds instead of being inherited from a
  // placement pass whose merges could quietly break it.
  const kept=[];
  for(let k=order.length-1;k>=0;k--)kept.push(placed[order[k]]);
  placed.length=0;
  for(const a of kept)placed.push(a);
  // Deadlock repair costs board density, so it is worth knowing when a
  // packing pass starts producing boards that are mostly deadlock.
  if(dropped>N*0.35&&typeof _devWarn==='function')_devWarn('peel.dropped',dropped+'/'+N+' arrows dropped to break deadlocks');
  return true;
}

// ── v2.1 lock & key ─────────────────────────────────────────────────
// A locked arrow can't fly until its key arrow has gone, whatever its ray
// says. The lock goes on an arrow that is OPEN from the start — the one the
// eye goes to first — and the key on one buried a few waves deep, so the
// board asks for a plan instead of a scan. Easybrain ships four mechanics
// of this kind; we had one for 2000+ levels.
//
// Solvability: a lock adds one edge, "L waits for K". The dependency graph
// stays acyclic — and the board solvable — exactly when K does not itself
// wait on L, directly or through anything else. So every arrow that waits
// on L (the `waiting` set) is excluded as a key candidate. Removal stays
// monotone with locks (a cleared arrow or a gone key never comes back), so
// the greedy wave walk below is still an exact solvability test.
const LOCK_FROM_LEVEL=31;        // 30 is a picture level; locks start right after
const PAIR_COLORS=['#8a6fd1','#3c9d96']; // violet, teal — clear of every arrow skin
function _lockWaves(arr,deps){
  const N=arr.length,w=new Array(N).fill(-1);
  let left=N,k=0;
  while(left){
    const ready=[];
    for(let i=0;i<N;i++){
      if(w[i]>=0)continue;
      let ok=true;
      for(const b of deps[i])if(w[b]<0){ok=false;break}
      if(ok&&arr[i].lock!=null&&w[arr[i].lock]<0)ok=false;
      if(ok)ready.push(i);
    }
    if(!ready.length)return null;
    for(const i of ready)w[i]=k;
    left-=ready.length;k++;
  }
  return w;
}
// deps[i] = arrows sitting on i's escape ray. Cells never move, so this is
// static for a board; locks are layered on top via arr[i].lock.
function _staticDeps(arr,rows,cols){
  const occ=new Int16Array(rows*cols).fill(-1);
  arr.forEach((a,i)=>{for(const[r,c] of a.cells)occ[r*cols+c]=i});
  return arr.map((a,i)=>{
    const s=new Set(),h=a.cells[a.cells.length-1];
    let r=h[0]+DY[a.dir],c=h[1]+DX[a.dir];
    while(r>=0&&r<rows&&c>=0&&c<cols){const j=occ[r*cols+c];if(j>=0&&j!==i)s.add(j);r+=DY[a.dir];c+=DX[a.dir]}
    return s;
  });
}
function _assignLocks(arr,rows,cols,rng,pairs){
  const N=arr.length;
  if(N<6)return 0;
  const deps=_staticDeps(arr,rows,cols);
  let made=0;

  for(let p=0;p<pairs;p++){
    const w=_lockWaves(arr,deps);
    if(!w)break;
    let open0=0;
    const locks=[];
    for(let i=0;i<N;i++){
      if(w[i]!==0)continue;
      open0++;
      if(arr[i].lock==null&&arr[i].keyFor==null&&arr[i].cells.length>=2)locks.push(i);
    }
    if(open0<2||!locks.length)break; // never lock the last opener — the board would start stuck
    const L=locks[(rng()*locks.length)|0];
    const waiting=new Set([L]);
    for(let grew=true;grew;){
      grew=false;
      for(let i=0;i<N;i++){
        if(waiting.has(i))continue;
        let dep=arr[i].lock!=null&&waiting.has(arr[i].lock);
        if(!dep)for(const b of deps[i])if(waiting.has(b)){dep=true;break}
        if(dep){waiting.add(i);grew=true}
      }
    }
    let maxW=0;for(const x of w)if(x>maxW)maxW=x;
    const hi=max(2,Math.ceil(maxW*.6)); // deep enough to need a plan, not the very last move
    const keys=[];
    for(let i=0;i<N;i++){
      if(waiting.has(i)||arr[i].lock!=null||arr[i].keyFor!=null)continue;
      if(w[i]>=2&&w[i]<=hi)keys.push(i);
    }
    if(!keys.length)break;
    const K=keys[(rng()*keys.length)|0];
    arr[L].lock=K;arr[L].pair=p;arr[K].keyFor=L;arr[K].pair=p;
    made++;
  }
  // The construction above can't produce a cycle; this re-walk is the
  // contract test that a refactor of it never ships a stuck board.
  if(made&&!_lockWaves(arr,deps)){
    for(const a of arr){delete a.lock;delete a.keyFor;delete a.pair}
    _devWarn('assignLocks','lock graph cyclic — locks dropped');
    return 0;
  }
  return made;
}

// ── v2.1 bomb (countdown) arrows ─────────────────────────────────────
// Why our boards played "empty": removal is monotone, so there is no wrong
// order — "tap any free arrow, repeat" solves every board ever generated.
// Density only makes the SEARCH longer, never the THINKING harder. Arrows
// GO! ships a countdown arrow (prefab_gameplay_countdownarrow) and Easybrain
// stop points for exactly this reason: they make order matter.
//
// A bomb shows N; every successful removal of another arrow ticks it down,
// and at 0 the level is lost. Removing it costs at least |anc|+1 moves,
// where anc = every arrow it waits on, transitively (rays + lock keys), so
// N = |anc|+1+slack: solvable by construction, and with small slack every
// tap on an arrow outside anc — the tempting free ones — brings it closer.
// The puzzle becomes "what exactly is holding this one?".
const BOMB_FROM_LEVEL=16;
function _ancestors(arr,deps,x){
  const seen=new Set(),st=[x];
  while(st.length){
    const i=st.pop();
    const next=[...deps[i]];
    if(arr[i].lock!=null)next.push(arr[i].lock);
    for(const b of next)if(!seen.has(b)){seen.add(b);st.push(b)}
  }
  seen.delete(x);
  return seen;
}
// Earliest-deadline-first certificate: clear each bomb's whole ancestor set
// in countdown order; every bomb must still have ≥1 left when reached. A
// pass proves a winning order exists (EDF over full sets is conservative).
function _bombsFeasible(arr,deps,bombs){
  const done=new Set();
  for(const b of [...bombs].sort((p,q)=>arr[p].cd-arr[q].cd)){
    for(const x of _ancestors(arr,deps,b))done.add(x);
    if(done.size>=arr[b].cd)return false; // removals before b, all of which tick it
    done.add(b);
  }
  return true;
}
function _assignBombs(arr,rows,cols,rng,count,slack){
  const N=arr.length;
  if(N<8)return 0;
  const deps=_staticDeps(arr,rows,cols);
  const bombs=[];
  for(let k=0;k<count;k++){
    // A bomb is worth having when it sits deep (≥3 arrows over it) but its
    // ancestor set leaves plenty of the board OUT — those are the decoys.
    const cand=[];
    for(let i=0;i<N;i++){
      const a=arr[i];
      if(a.cd!=null||a.lock!=null||a.keyFor!=null||a.cells.length<2)continue;
      const n=_ancestors(arr,deps,i).size;
      if(n>=3&&n+1<=N*.6)cand.push({i,n});
    }
    if(!cand.length)break;
    const {i,n}=cand[(rng()*cand.length)|0];
    arr[i].cd=n+1+slack;
    bombs.push(i);
    if(!_bombsFeasible(arr,deps,bombs)){
      // a second bomb may need the first one's set cleared too — give it
      // exactly that much room, else drop it
      let need=0;const s=new Set();
      for(const b of bombs)if(b!==i){for(const x of _ancestors(arr,deps,b))s.add(x);s.add(b)}
      for(const x of _ancestors(arr,deps,i))s.add(x);
      need=s.size+1+slack;
      arr[i].cd=need;
      if(!_bombsFeasible(arr,deps,bombs)){delete arr[i].cd;bombs.pop();break}
    }
  }
  for(const b of bombs)arr[b].cdLeft=arr[b].cd;
  return bombs.length;
}

// Repeatedly find any arrow whose escape line has no alive blocker and
// "remove" it. If we reach zero arrows, the level is solvable. If we get


// stuck with arrows remaining, there's a cycle in the chain-dependency
// graph and the level is unwinnable — caller should regenerate.
function _isLevelSolvable(placed,rows,cols){
  // v2.0.1 perf: occupancy map instead of the old triple loop. The
  // previous version rescanned EVERY arrow's EVERY cell for EVERY ray
  // step — O(N²·cells) per removal round, ~100ms+ per check on 170-arrow
  // boards. With up to 40 generation retries that was the "freeze on
  // level entry" the 2.0 beta feedback reported. Map lookups make each
  // round O(N·ray).
  const N=placed.length;
  const occ=new Int16Array(rows*cols).fill(-1);
  for(let i=0;i<N;i++)for(const[r,c] of placed[i].cells)occ[r*cols+c]=i;
  const alive=new Array(N).fill(true);
  let removed=0;
  while(removed<N){
    let progress=false;
    for(let i=0;i<N;i++){
      if(!alive[i])continue;
      const head=placed[i].cells[placed[i].cells.length-1];
      const dir=placed[i].dir;
      let cr=head[0]+DY[dir],cc=head[1]+DX[dir];
      let clear=true;
      while(cr>=0&&cr<rows&&cc>=0&&cc<cols){
        const j=occ[cr*cols+cc];
        if(j>=0&&j!==i&&alive[j]){clear=false;break}
        cr+=DY[dir];cc+=DX[dir];
      }
      if(clear){alive[i]=false;removed++;progress=true;break}
    }
    if(!progress)return false;
  }
  return true;
}

// v2.0 quality gate for procedural boards (assumes solvable input).
// Builds the dependency graph once (occupancy map, O(N·ray)) and checks:
//   • initialOpen — how many arrows are tappable on move 1. Too many =
//     the board plays itself. Cap tightens with level.
//   • waves — dependency depth (how many "unlock rounds" the solve has).
//     Too shallow = no puzzle. Floor rises with level.
function _levelQualityOK(placed,rows,cols,lvl){
  const N=placed.length;
  if(N===0)return false;
  const occ=new Map();
  for(let i=0;i<N;i++)for(const[r,c] of placed[i].cells)occ.set(r*cols+c,i);
  const deps=[];
  for(let i=0;i<N;i++){
    const head=placed[i].cells[placed[i].cells.length-1];
    const dir=placed[i].dir;
    const s=new Set();
    let cr=head[0]+DY[dir],cc=head[1]+DX[dir];
    while(cr>=0&&cr<rows&&cc>=0&&cc<cols){
      const j=occ.get(cr*cols+cc);
      if(j!==undefined&&j!==i)s.add(j);
      cr+=DY[dir];cc+=DX[dir];
    }
    deps.push(s);
  }
  const rem=new Set();
  for(let i=0;i<N;i++)rem.add(i);
  let waves=0,initialOpen=0;
  while(rem.size){
    const ready=[];
    for(const i of rem){
      let ok=true;
      for(const b of deps[i])if(rem.has(b)){ok=false;break}
      if(ok)ready.push(i);
    }
    if(!ready.length)return true; // shouldn't happen (solvable input) — don't retry on it
    if(waves===0)initialOpen=ready.length;
    waves++;
    for(const i of ready)rem.delete(i);
  }
  const openCap=lvl<10?N:lvl<50?5:max(3,Math.ceil(N*0.10));
  const wavesMin=lvl<15?1:lvl<40?2:lvl<120?3:4;
  return initialOpen<=openCap&&waves>=wavesMin;
}

// ================================================================
//  GAME ACTIONS
// ================================================================
// Check if arrow[idx] can escape — head cell walks in arrow.dir to grid edge,
// path must not contain cells of any OTHER alive arrow.
function _isLocked(a){return a.lock!=null&&!!arrows[a.lock]&&arrows[a.lock].alive}
function canEscape(idx){
  const a=arrows[idx];
  if(!a||!a.alive)return false;
  if(_isLocked(a))return false; // hint + tutorial finger must not point at a lock
  const head=a.cells[a.cells.length-1];
  let cr=head[0]+DY[a.dir],cc=head[1]+DX[a.dir];
  while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols){
    for(let j=0;j<arrows.length;j++){
      if(j===idx||!arrows[j].alive)continue;
      for(const[or,oc] of arrows[j].cells){
        if(or===cr&&oc===cc)return false;
      }
    }
    cr+=DY[a.dir];cc+=DX[a.dir];
  }
  return true;
}

// Compute total arc length of an arrow path in pixels (cell-center to cell-center).
// Single-cell arrows get a synthetic body length so the animation has something to render.
function arrowBodyLen(a,cs){
  if(a.cells.length===1)return cs*.38;
  let len=0;
  for(let i=0;i<a.cells.length-1;i++){
    const dr=a.cells[i+1][0]-a.cells[i][0];
    const dc=a.cells[i+1][1]-a.cells[i][1];
    len+=sqrt(dr*dr+dc*dc)*cs;
  }
  return len;
}

// Build world-space extended path for an arrow: polyline through cell centers +
// a long straight extension in the exit direction past the head.
// Single-cell arrows get a synthetic tail point behind the head in backDir.
function buildArrowWorldPath(a,cs,gx,gy){
  const pts=[];
  for(const[r,c] of a.cells)pts.push([gx+c*cs+cs/2,gy+r*cs+cs/2]);
  if(pts.length===1){
    const bd=(a.dir+2)%4;
    const h=pts[0];
    pts.unshift([h[0]+DX[bd]*cs*.38,h[1]+DY[bd]*cs*.38]);
  }
  const head=pts[pts.length-1];
  pts.push([head[0]+DX[a.dir]*1600,head[1]+DY[a.dir]*1600]);
  return pts;
}

function tapArrowByIndex(idx){
  // Guard: block taps during the brief transition window after game-over /
  // level-complete (a setTimeout flips state in 500ms). Without this, the
  // user can tap further arrows in those 500ms and corrupt the post-state.
  if(inputLocked)return;
  const a=arrows[idx];
  if(!a||!a.alive)return;

  // v2.0 Zap booster: the armed tap removes ANY arrow — no escape-line
  // check needed because removal is monotone (it only ever unblocks
  // others). Doesn't count as a move and doesn't score in rush (bought,
  // not earned).
  if(zapArmed){
    zapArmed=false;
    a.alive=false;
    _flyOutArrow(a,idx);
    return;
  }

  // A lock is visible information, not a trap — tapping one costs no heart.
  // It points at its key instead, which teaches the rule in one tap.
  if(_isLocked(a)){_lockedTap(a,idx);return}

  if(canEscape(idx)){
    a.alive=false;
    moves++;
    if(gameMode==='rush')rushScore++;
    _comboTick();
    _bombTick();
    _flyOutArrow(a,idx);
  }else{
    _comboN=0;
    _blockedTap(a,idx);
  }
}

// Consecutive correct taps inside COMBO_WINDOW count up. From ×3 a counter
// floats above the board, pitch rising with it; words mark ×5/×8/×12. In
// rush a combo tap is worth an extra point — speed is what rush rewards.
function _comboTick(){
  _comboN=(gt-_comboAt<COMBO_WINDOW)?_comboN+1:1;
  _comboAt=gt;
  if(_comboN<3)return;
  const word=_comboN>=12?t('unstoppable'):_comboN>=8?t('amazing'):_comboN>=5?t('great'):'';
  let label='×'+_comboN+(word?'  '+word:'');
  if(gameMode==='rush'){rushScore++;label+='  +1';}
  // One live counter, not a stack: fast tapping spawned a new floater per
  // tap and they piled up on each other. Re-arm the existing one instead.
  const col=_comboN>=5?TH.star:TH.accent;
  const live=floaters.find(f=>f.combo);
  if(live){live.text=label;live.col=col;live.t=.2;}
  else floaters.push({x:W/2,y:H*.24,text:label,col,t:0,dur:1.4,combo:true});

  // (the rising pitch is the pluck itself — sfx.swoosh walks the scale)
}

// Every successful removal ticks each live bomb down; a bomb at 0 ends the
// level. Zap removals don't tick (they aren't moves) — a booster can buy a
// bomb time, which is what makes Zap worth its price on these boards.
let gameoverReason='hearts';   // 'hearts' | 'bomb' — game-over subtitle
function _bombTick(){
  for(let i=0;i<arrows.length;i++){
    const b=arrows[i];
    if(!b.alive||b.cd==null)continue;
    b.cdLeft--;
    if(b.cdLeft<=3&&b.cdLeft>0)haptic(6);
    if(b.cdLeft<=0){_bombExplode(i);return}
  }
}
function _bombExplode(i){
  const b=arrows[i];
  const cs=getCellSize(),gx=getGridX(),gy=getGridY();
  const head=b.cells[b.cells.length-1];
  shakeAnims.push({x:gx+head[1]*cs+cs/2,y:gy+head[0]*cs+cs/2,idx:i,t:0,dur:.5});
  _hurtT=.5;
  sfx.blocked();haptic([20,40,60]);
  spawnFloater(W/2,H*.24,t('boom'),TH.arrowBlock);
  inputLocked=true;
  gameoverReason='bomb';
  if(!isDaily&&!isWeekly){_streakLost=winStreak;winStreak=0;_safeSet('ae_win_streak',0);}
  setTimeout(()=>{S='gameover';sfx.gameover();inputLocked=false},700);
}
// A continue after an explosion buys every live bomb five more moves —
// otherwise the player would be back on a board with a bomb already at 0.
function _bombGrace(){
  for(const b of arrows)if(b.alive&&b.cd!=null)b.cdLeft=max(b.cdLeft,0)+5;
}

function _lockedTap(a,idx){

  _comboN=0;
  const cs=getCellSize(),gx=getGridX(),gy=getGridY();
  const head=a.cells[a.cells.length-1];
  shakeAnims.push({x:gx+head[1]*cs+cs/2,y:gy+head[0]*cs+cs/2,idx,t:0,dur:.2});
  sfx.blocked();haptic(8);
  spawnFloater(W/2,H*.24,t('locked'),PAIR_COLORS[a.pair||0]);
  // Pulse the key for a moment — unless a paid hint is showing, which wins.
  if(hintTime<=0){hintArrow=a.lock;hintTime=1.4}
}


// The escape animation + win detection, shared by normal taps and the Zap
// booster. `a.alive` must already be false.
function _flyOutArrow(a,idx){
  {
    const cs=getCellSize(),gx=getGridX(),gy=getGridY();
    const bodyLen=arrowBodyLen(a,cs);
    const extLen=1600;
    // Pre-build the polyline ONCE per anim (was rebuilt every frame in the
    // draw loop — main cause of lag during a chain of arrow exits).
    const path=buildArrowWorldPath(a,cs,gx,gy);
    anims.push({
      arrow:a,
      dir:a.dir,
      // Snappier exit (was 1.2s — felt sluggish vs competitor arrowsgo where
      // arrows shoot off in ~0.5s, giving the game its "kinetic" feel).
      t:0,dur:.55,
      col:arrowColor(a,idx),cs,gx,gy,
      bodyLen,totalDist:bodyLen+extLen,
      path,
    });
    sfx.swoosh(a.dir,a.cells.length);haptic(10);

    // A bomb that leaves (tap or Zap) is defused.
    if(a.cd!=null){spawnFloater(W/2,H*.30,t('defused'),TH.success);playSnd('coin',1.3);}

    // A key leaving opens its lock — on screen and in the ear.
    if(a.keyFor!=null&&arrows[a.keyFor]&&arrows[a.keyFor].alive){
      _unlockFx.push({idx:a.keyFor,t:0});
      playSnd('coin',1.15);haptic(15);
    }

    // Halfway cheer — once per board, on boards big enough to feel long.
    // Rush boards are cleared in seconds; a cheer there is just noise.
    if(!_halfShown&&gameMode!=='rush'&&arrows.length>=10){
      let left=0;for(const ar of arrows)if(ar.alive)left++;
      if(left>0&&left<=arrows.length/2){
        _halfShown=true;
        spawnFloater(W/2,H*.18,t('halfway'),TH.success);
      }
    }

    // Win check
    let allGone=true;
    for(const ar of arrows)if(ar.alive){allGone=false;break}
    if(allGone){
      inputLocked=true;
      // Drop-in-water ripple from the last-cleared arrow's head, animated
      // every frame in drawPlay so the player feels the level "click closed"
      // before the complete screen arrives.
      const head=a.cells[a.cells.length-1];
      _winWave={x:gx+head[1]*cs+cs/2,y:gy+head[0]*cs+cs/2,t:0,dur:gameMode==='rush'?0.6:gameMode==='zen'?1.0:1.6};
      // Zen: no complete screen — reward quietly, flow into the next board.
      if(gameMode==='zen'){
        zenCount++;zenTotal++;
        _safeSet('ae_zen_count',zenCount);_safeSet('ae_zen_total',zenTotal);
        // +5 coins per board, capped at 75/day so zen can't out-earn the
        // level track or devalue rewarded ads.
        const capKey='ae_zen_coins_'+getDailySeed();
        const got=+localStorage.getItem(capKey)||0;
        if(got<75){coins+=5;totalCoinsEarned+=5;_safeSet(capKey,got+5);_safeSet('ae_coins',coins);spawnFloater(W/2,H*.5,'+5',TH.star);}
        checkAchievements({zenTotal});
        setTimeout(()=>{inputLocked=false;sfx.complete();haptic(20);startZen();},1000);
        return;
      }
      // Rush: bank +5s instantly, jump straight to the next board.
      if(gameMode==='rush'){
        rushEndAt+=5;
        spawnFloater(W/2,H*.4,t('timeBonus'),TH.success);
        setTimeout(()=>{inputLocked=false;sfx.complete();haptic(15);startRushBoard();},600);
        return;
      }
      setTimeout(()=>{
        inputLocked=false;
        S='complete';
        completeEnterT=gt;
        sfx.complete();haptic(30);
        const s=max(1,undosLeft);
        const perfect=(s===3);
        let gained=0;
        _streakBonus=0;
        if(isWeekly){
          if(!isWeeklyDone()){
            gained=WEEKLY_REWARD;
            _safeSet(weeklyDoneKey(),'1');
          }
        }else if(isDaily){
          if(!isDailyDone()){
            gained=DAILY_REWARD;
            _safeSet(dailyDoneKey(),'1');
            totalDailies++;
          }
        }else{
          const firstClear=!(stars[level]>0); // before stars[] is written below
          const wasNewStars=(stars[level]||0)<s;
          stars[level]=max(stars[level]||0,s);
          maxLevel=max(maxLevel,level+1);  // beating level N unlocks N+1 — even if the player taps Home instead of Next
          totalStars=Object.values(stars).reduce((a,b)=>a+b,0);
          if(currentShape&&firstClear){shapeTotal++;_safeSet('ae_shape_total',shapeTotal);}
          // Win streak: consecutive classic wins without a game over left
          // unanswered. +2 coins per step past the first, capped at +10.
          winStreak++;_safeSet('ae_win_streak',winStreak);
          _streakBonus=min(winStreak-1,5)*2;
          gained=5+s*5+_streakBonus;

          const key='ae_best_'+level;
          const prev=+localStorage.getItem(key)||99999;
          if(timer<prev)_safeSet(key,floor(timer));
          bestTime=min(prev,floor(timer));
          if(undosLeft===3)streak++;else streak=0;
          if(wasNewStars&&perfect)totalPerfect++;
          if(wasNewStars&&!hintUsedThisLevel)noHintCount++;
          fastestLevel=min(fastestLevel,floor(timer));
        }
        coins+=gained;
        totalCoinsEarned+=gained;
        lastGained=gained;
        if(gained>0)spawnFloater(W/2,H*.58,'+'+gained);
        checkAchievements({
          level,stars:s,totalStars,streakDays,coins,perfect,isDaily,
          totalPerfect,totalDailies,noHintCount,fastestLevel,shapeTotal
        });
        save();
        spawnConfetti();
      },1600);
    }
  }
}

// Blocked-tap consequences, branched by mode. Shield (booster) eats the
// penalty in the modes that have one.
function _blockedTap(a,idx){
  // Blocked — shake the head cell, lose a heart (life)
  const cs=getCellSize(),gx=getGridX(),gy=getGridY();
  const head=a.cells[a.cells.length-1];
  const sx=gx+head[1]*cs+cs/2;
  const sy=gy+head[0]*cs+cs/2;
  shakeAnims.push({x:sx,y:sy,idx,t:0,dur:.2});
  sfx.blocked();haptic([5,30,5]);
  if(isTutorial()){
    // Tutorial mode (levels 1-TUTORIAL_LEVELS): wrong tap is a teaching
    // moment, not a punishment. Player sees the shake + blocked sfx,
    // then the highlighted next arrow re-pulses so they can try again.
    spawnFloater(sx,sy-cs*.6,'blocked',TH.arrowBlock);
  }else if(gameMode==='zen'){
    // Zen: mistakes are free — that's the whole point of the mode.
    spawnFloater(sx,sy-cs*.6,'blocked',TH.arrowBlock);
  }else if(gameMode==='rush'){
    // Rush: mistakes cost time, not hearts — Shield can eat the time hit.
    if(shieldArmed){shieldArmed=false;spawnFloater(sx,sy-cs*.6,t('shield')+'!',TH.success);}
    else{rushEndAt-=3;_hurtT=.25;spawnFloater(sx,sy-cs*.6,'-3s',TH.arrowBlock);}
  }else{
    if(shieldArmed){
      shieldArmed=false;
      spawnFloater(sx,sy-cs*.6,t('shield')+'!',TH.success);
    }else{
      undosLeft--;
      _hurtT=.25; // global 3px screen jolt — losing a heart should be FELT
      spawnFloater(sx,sy-cs*.6,'-1',TH.arrowBlock);
      if(undosLeft<=0){
        inputLocked=true;
        // The streak is held, not lost, until the player decides: a
        // continue (coins or ad) gives it back, anything else forfeits it.
        if(!isDaily&&!isWeekly){_streakLost=winStreak;winStreak=0;_safeSet('ae_win_streak',0);}
        gameoverReason='hearts';
        setTimeout(()=>{S='gameover';sfx.gameover();inputLocked=false},500);
      }
    }
  }
}

// First TUTORIAL_LEVELS regular levels are no-penalty teaching levels:
// wrong taps don't drain hearts and the next solvable arrow is always
// pulse-highlighted. Daily/weekly are excluded — those are challenges,
// not introductions.
// 4, not 5: level 5 is the first HARD level (isHardLevel), as in the genre —
// a finger pointing at the answer on the first boss board would defeat it.
const TUTORIAL_LEVELS=4;

function isTutorial(){
  // Zen/rush pass a difficulty NUMBER to generateLevel while the global
  // `level` still holds the player's classic progress (possibly 1-5) —
  // without the mode guard a brand-new player would see the tutorial
  // finger inside rush and get free mistakes there.
  return gameMode==='classic'&&level<=TUTORIAL_LEVELS&&!isDaily&&!isWeekly;
}

function spawnConfetti(){
  confetti=[];
  if(reducedMotion)return; // celebration confetti is purely decorative
  // v2 confetti: pure sparkle storm in the gold family. The grid markers
  // are 4-pointed sparkles, the win wave bursts them gold, and the
  // celebration confetti now matches — every gold particle is the same
  // visual vocabulary. Drops the rainbow + shape-soup of v1 which felt
  // off-brand against the minimal palette.
  const colors = [TH.star, TH.accent, '#f0c47a', '#ffe2a8', '#fffbe5'];
  // Wide overhead shower
  for(let i=0;i<60;i++){
    confetti.push({
      x:W/2+rnd(-W/2,W/2),y:-10+rnd(-30,0),
      vx:rnd(-2,2),vy:rnd(1,4),
      sz:rnd(5,11),rot:rnd(0,TAU),rv:rnd(-4,4),
      col:colors[floor(rnd(0,colors.length))],
      life:2+rnd(0,1.5),
    });
  }
  // Upward fountain from where the check mark lands
  for(let i=0;i<35;i++){
    confetti.push({
      x:W/2+rnd(-30,30),y:H*.18+rnd(-10,10),
      vx:rnd(-5,5),vy:rnd(-9,-3),
      sz:rnd(4,8),rot:rnd(0,TAU),rv:rnd(-6,6),
      col:colors[floor(rnd(0,colors.length))],
      life:1.5+rnd(0,1),
    });
  }
}

// ================================================================
//  GRID HELPERS
// ================================================================
// Cell size is sized to fit the fixed STAGE field (not the per-level grid).
// Stage stays the same on every level → cell size is constant; small levels
// just sit inside a sea of background dots. Cells ~12% smaller than before
// to match competitor dot-grid look.
// Stage extends a few cells past the level on every side so the player has
// room to pan/look around. The dot field rendered earlier is the level's
// occupied cells only — these stage paddings are pure breathing room.
const STAGE_PAD=0;
function _stageC(){return max(STAGE_COLS,gridCols+STAGE_PAD*2)}
function _stageR(){return max(STAGE_ROWS,gridRows+STAGE_PAD*2)}
// v3 layout: the board owns the band from just under the two-row header to
// near the bottom (the MOVES/TIME/coins strip is gone), and is centred in
// it both ways — it used to hug the top of its stage and leave a dead gap
// above the stats row.
const BOARD_TOP=.19,BOARD_H=.72;
function getCellSize(){return min((W-32)/_stageC(),(H*BOARD_H)/_stageR())}
function getGridX(){return floor((W-gridCols*getCellSize())/2)}
function getGridY(){return floor(H*BOARD_TOP+(H*BOARD_H-gridRows*getCellSize())/2)}


// ================================================================
//  DRAWING HELPERS
// ================================================================
// `font` is overloaded: a weight ('600'/'700') keeps Nunito; 'Poppins'
// switches to the display face at weight 700 WITH letter-spacing (the
// TH.letterSpacingTitle token, dead since v2.5, finally applied).
// ctx.letterSpacing needs Chrome 99+/Safari 17.4+; feature-detected so
// older WebKit simply renders untracked.
const _canTrack=(typeof CanvasRenderingContext2D!=='undefined')&&('letterSpacing' in CanvasRenderingContext2D.prototype);
function txt(t,x,y,sz,col,align,font){
  const disp=font==='Poppins';
  X.font=`${disp?'700':(font||'600')} ${sz}px ${disp?'Poppins':'Nunito'},sans-serif`;
  if(_canTrack&&disp)X.letterSpacing=(sz*TH.letterSpacingTitle).toFixed(2)+'px';
  X.fillStyle=col||TH.text;X.textAlign=align||'center';X.textBaseline='middle';
  X.fillText(t,x,y);
  if(_canTrack&&disp)X.letterSpacing='0px';
}
function txtP(t,x,y,sz,col,align){txt(t,x,y,sz,col,align,'700')}
// Display text: Poppins 700 + tracking — titles, level header, big scores.
// Poppins' em-box sits higher than Nunito's at textBaseline='middle', so
// display lines looked lifted next to Nunito neighbours ("буквы выше" in
// the 2.0 beta feedback). +4% of the size re-centres it optically.
function txtD(t,x,y,sz,col,align){txt(t,x,y+sz*.04,sz,col,align,'Poppins')}

function drawArrow(x,y,dir,sz,col,alpha){
  // Simple straight arrow (used for menu animation and flying arrows).
  // v2: paints a 1-px-offset shadow underneath the line + head before the
  // main strokes. Looks like a Monument-Valley-style "lit from above"
  // depth cue without using shadowBlur (which is a perf cliff on iOS).
  const angles=[0,-PI/2,PI,PI/2];
  const a=angles[dir];
  const len=sz*.30;
  const headW=sz*.11;
  const headL=sz*.13;
  X.save();X.translate(x,y);X.rotate(a);
  X.globalAlpha=alpha||1;
  // Resolve skin paint in the arrow's LOCAL space (tail at -len, head at +len),
  // so gradient skins run along the arrow after the translate/rotate above.
  const c=_resolvePaint(col,X,-len,0,len,0);
  const lw=max(1.8,sz*.035);
  // Long-shadow pass (skipped in reduced-motion / high-contrast — both add
  // visual noise that those modes are explicitly trying to remove)
  if (!reducedMotion) {
    X.strokeStyle=TH.arrowShadow;X.lineWidth=lw;X.lineCap='round';
    const off=max(0.6,sz*.012);
    X.beginPath();X.moveTo(-len+off,off);X.lineTo(len-headL+off,off);X.stroke();
    X.fillStyle=TH.arrowShadow;X.beginPath();
    X.moveTo(len+off,off);X.lineTo(len-headL+off,-headW+off);X.lineTo(len-headL+off,headW+off);
    X.closePath();X.fill();
  }
  // Main pass
  X.strokeStyle=c;X.lineWidth=lw;X.lineCap='round';
  X.beginPath();X.moveTo(-len,0);X.lineTo(len-headL,0);X.stroke();
  X.fillStyle=c;X.beginPath();
  X.moveTo(len,0);X.lineTo(len-headL,-headW);X.lineTo(len-headL,headW);
  X.closePath();X.fill();
  X.globalAlpha=1;
  X.restore();
}

// Extract a polyline segment from a path between arc positions sFrom and sTo.
// Used by the slide animation to render partial arrows as they travel.
function getPathSegment(path,sFrom,sTo){
  const pts=[];
  let acc=0,started=false;
  for(let i=0;i<path.length-1;i++){
    const x1=path[i][0],y1=path[i][1],x2=path[i+1][0],y2=path[i+1][1];
    const dx=x2-x1,dy=y2-y1;
    const segLen=sqrt(dx*dx+dy*dy);
    if(segLen===0)continue;
    const segEnd=acc+segLen;
    if(!started&&segEnd>sFrom){
      const t=max(0,(sFrom-acc)/segLen);
      pts.push([x1+dx*t,y1+dy*t]);
      started=true;
    }
    if(started){
      if(segEnd>=sTo){
        const t=(sTo-acc)/segLen;
        pts.push([x1+dx*t,y1+dy*t]);
        return pts;
      }
      pts.push([x2,y2]);
    }
    acc=segEnd;
  }
  return pts;
}

// Draw an arrow as a continuous polyline through a list of world-space points,
// with a triangular head at the end pointing in the direction of the last segment.
// Used for both static rendering and animation (via getPathSegment clipping).
function drawArrowPolyline(pts,sz,col,alpha){
  if(pts.length<2)return;
  // Thin lines scaled to cell size. Min 2px keeps lines visible at tiny cells.
  // Per competitor reference screenshots (Arrow Jam Go, Arrows Escape):
  // arrows visually fill ~25-30% of cell width so adjacent snakes form
  // contiguous-looking maze walls. Bumped .14 → .28.
  // v3: ink lines. A .25-cell stroke turned dense boards into a mass of
  // brown; at .15 the gaps between snakes read as clearly as the snakes,
  // so the eye can follow a single arrow through a weave. Heads stay big
  // enough to tap and to read direction at a glance.
  const thick=max(2.2,sz*.15);
  const headL=sz*.40,headW=sz*.29;

  X.save();
  X.globalAlpha=alpha==null?1:alpha;

  // Resolve skin paint along the arrow's tail→head span (gradient skins flow
  // from the first point to the head). Plain-colour cols pass through.
  const paint=_resolvePaint(col,X,pts[0][0],pts[0][1],pts[pts.length-1][0],pts[pts.length-1][1]);

  // Determine head direction from last body segment
  const last=pts[pts.length-1],prev=pts[pts.length-2];
  const hdx=last[0]-prev[0],hdy=last[1]-prev[1];
  const hlen=sqrt(hdx*hdx+hdy*hdy)||1;
  const nx=hdx/hlen,ny=hdy/hlen;

  // Pull line endpoint back by headL so triangle covers the line end cleanly
  const modPts=pts.slice();
  const k=min(1,headL/hlen);
  modPts[modPts.length-1]=[last[0]-nx*hlen*k,last[1]-ny*hlen*k];

  // Line body: thick stroke with ARC'd corners. lineJoin='round' alone
  // only gives a tiny radius (≈ stroke width / 2) so 90° turns still
  // read as sharp. arcTo at every interior vertex replaces each corner
  // with a real curve of `cornerR` radius — the path reads like a
  // soft pipe winding through cells, not a stair-step.
  // Optional per-skin render STYLE (carried on the paint function). The body
  // path is always built the same way (arcTo rounded corners → clean turns);
  // the style only changes how it's painted, so corners never break.
  const style=(typeof col==='function'&&col._style)||'solid';
  const cornerR=sz*0.16;
  X.lineCap='round';
  X.lineJoin='round';
  const bodyPath=()=>{
    X.beginPath();
    X.moveTo(modPts[0][0],modPts[0][1]);
    if(modPts.length<3){
      for(let i=1;i<modPts.length;i++)X.lineTo(modPts[i][0],modPts[i][1]);
    }else{
      for(let i=1;i<modPts.length-1;i++){
        X.arcTo(modPts[i][0],modPts[i][1],modPts[i+1][0],modPts[i+1][1],cornerR);
      }
      X.lineTo(modPts[modPts.length-1][0],modPts[modPts.length-1][1]);
    }
  };
  const pxv=-ny,pyv=nx;
  const tipX=last[0],tipY=last[1];
  const baseX=tipX-nx*headL,baseY=tipY-ny*headL;
  const headPath=(scale)=>{
    const hw=headW*(scale||1), hl=headL*(scale||1);
    const bx=tipX-nx*hl, by=tipY-ny*hl;
    X.beginPath();
    X.moveTo(tipX,tipY);
    X.lineTo(bx+pxv*hw,by+pyv*hw);
    X.lineTo(bx-pxv*hw,by-pyv*hw);
    X.closePath();
  };

  if(style==='glow'){
    // Neon tube: a soft colour halo (several low-alpha layers, wide→narrow, for
    // a smooth falloff — no shadowBlur, which is the iOS perf cliff), then the
    // coloured body, then a white-hot core line. Reads like a glowing neon sign.
    X.save();
    X.strokeStyle=paint;
    const halo=[[2.2,0.10],[1.8,0.15],[1.5,0.24],[1.25,0.36]];
    for(let q=0;q<halo.length;q++){X.globalAlpha=halo[q][1];X.lineWidth=thick*halo[q][0];bodyPath();X.stroke();}
    X.globalAlpha=0.28;X.fillStyle=paint;headPath(1.55);X.fill();
    X.restore();
    // Coloured body + head
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.fillStyle=paint;headPath(1);X.fill();
    // White-hot core
    X.save();X.globalAlpha=0.92;X.strokeStyle='#ecfdff';X.lineWidth=max(1.5,thick*0.32);bodyPath();X.stroke();X.restore();
  }else if(style==='outline'){
    // Line-art: stroke the body, then carve the centre with the bg colour to
    // leave a hollow outline; head is an outlined triangle.
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.strokeStyle=TH.bg;X.lineWidth=max(1,thick-max(3.5,thick*0.46));bodyPath();X.stroke();
    X.strokeStyle=paint;X.lineWidth=max(2,thick*0.42);X.lineJoin='round';headPath(1);X.stroke();
  }else if(style==='bevel'){
    // 3D: flat body + a light top-left highlight and dark bottom-right shadow
    // edge for volume.
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.fillStyle=paint;headPath(1);X.fill();
    const off=max(1,thick*0.16);
    X.save();X.globalAlpha=0.40;X.strokeStyle='#ffffff';X.lineWidth=max(1.5,thick*0.20);
    X.translate(-off,-off);bodyPath();X.stroke();X.restore();
    X.save();X.globalAlpha=0.30;X.strokeStyle='#000000';X.lineWidth=max(1.5,thick*0.20);
    X.translate(off,off);bodyPath();X.stroke();X.restore();
  }else{
    // v2.0 solid: one offset "long shadow" pass under the body+head —
    // the Monument-Valley depth cue drawArrow() already had, finally on
    // the board arrows too. v2.0.1: the path is built ONCE into a Path2D
    // and stroked twice — rebuilding it per pass doubled the historical
    // "path construction every frame" cost on 150-arrow boards.
    const bp=new Path2D();
    bp.moveTo(modPts[0][0],modPts[0][1]);
    if(modPts.length<3){
      for(let i=1;i<modPts.length;i++)bp.lineTo(modPts[i][0],modPts[i][1]);
    }else{
      for(let i=1;i<modPts.length-1;i++)bp.arcTo(modPts[i][0],modPts[i][1],modPts[i+1][0],modPts[i+1][1],cornerR);
      bp.lineTo(modPts[modPts.length-1][0],modPts[modPts.length-1][1]);
    }
    const hp=new Path2D();
    hp.moveTo(tipX,tipY);
    hp.lineTo(baseX+pxv*headW,baseY+pyv*headW);
    hp.lineTo(baseX-pxv*headW,baseY-pyv*headW);
    hp.closePath();
    // v3: flat — no offset shadow. On thin ink lines the shadow read as a
    // blur, and it was a second stroke per arrow per frame.
    X.strokeStyle=paint;X.lineWidth=thick;X.stroke(bp);

    X.fillStyle=paint;X.fill(hp);
  }

  X.globalAlpha=1;
  X.restore();
}

// Draw a static arrow (used in the grid) — full path from tail to head.
// Single-cell arrows synthesize a short tail behind the head so the arrowhead
// has something to sit on.
// Booster glyphs — shared by the in-game flyout and the unlock card.
// Drawn around (0,0) at unit scale k=1 (≈16px tall).
function _glyphBooster(kind,x,y,k,col){
  X.save();
  X.translate(x,y);X.scale(k,k);
  X.strokeStyle=col;X.fillStyle=col;X.lineWidth=1.8;X.lineCap='round';X.lineJoin='round';
  if(kind==='shield'){
    X.beginPath();X.moveTo(0,-7);X.lineTo(6,-5);X.lineTo(6,1);
    X.quadraticCurveTo(6,5,0,8);X.quadraticCurveTo(-6,5,-6,1);
    X.lineTo(-6,-5);X.closePath();X.stroke();
  }else if(kind==='zap'){
    X.beginPath();X.moveTo(2,-8);X.lineTo(-4,1);X.lineTo(0,1);
    X.lineTo(-2,8);X.lineTo(4,-1);X.lineTo(0,-1);X.closePath();X.stroke();
  }else{ // reveal — eye
    X.beginPath();X.ellipse(0,0,8,5,0,0,TAU);X.stroke();
    X.beginPath();X.arc(0,0,2.4,0,TAU);X.fill();
  }
  X.restore();
}
// Lock & key glyphs, drawn around (0,0) and scaled so `r` ≈ glyph radius.
function _glyphLock(x,y,r,col,open){
  X.save();X.translate(x,y);X.scale(r/7,r/7);
  X.fillStyle=col;X.strokeStyle=col;X.lineWidth=2;X.lineCap='round';
  X.beginPath();X.arc(0,open?-4.5:-2,3.4,PI,TAU);X.stroke();   // shackle — lifted when open
  X.beginPath();X.roundRect(-5,-1.5,10,7.5,1.8);X.fill();       // body
  X.restore();
}
function _glyphKey(x,y,r,col){
  X.save();X.translate(x,y);X.scale(r/7,r/7);X.rotate(-PI/4);
  X.strokeStyle=col;X.lineWidth=2;X.lineCap='round';
  X.beginPath();X.arc(-3.2,0,2.8,0,TAU);X.stroke();             // bow
  X.beginPath();X.moveTo(-.4,0);X.lineTo(6,0);                 // shaft
  X.moveTo(3.8,0);X.lineTo(3.8,2.6);X.moveTo(6,0);X.lineTo(6,2.6); // bits
  X.stroke();
  X.restore();
}
function _badge(x,y,r,col){
  X.fillStyle=col;
  X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
  X.strokeStyle=darkMode?'rgba(0,0,0,.35)':'rgba(255,255,255,.95)';X.lineWidth=1.5;
  X.beginPath();X.arc(x,y,r,0,TAU);X.stroke();
}
// A locked arrow wears its padlock on the body cell next to the head (the
// head itself stays readable); its key wears the key mid-body. Same colour
// per pair. Badges go once they stop meaning anything.
function _drawLockBadges(a,cs,gx,gy,alpha,shakeOff){
  const r=max(7,cs*.34),col=PAIR_COLORS[a.pair||0],dx=shakeOff||0;
  X.save();X.globalAlpha=alpha;
  if(_isLocked(a)){
    const c=a.cells[max(0,a.cells.length-2)];
    const x=gx+c[1]*cs+cs/2+dx,y=gy+c[0]*cs+cs/2;
    _badge(x,y,r,col);_glyphLock(x,y,r*.62,'#fff',false);
  }
  if(a.keyFor!=null&&arrows[a.keyFor]&&arrows[a.keyFor].alive){
    const c=a.cells[(a.cells.length-1)>>1];
    const x=gx+c[1]*cs+cs/2+dx,y=gy+c[0]*cs+cs/2;
    _badge(x,y,r,col);_glyphKey(x,y,r*.62,'#fff');
  }
  X.restore();
}
// Bomb: moves-left number on the body cell next to the head, with a fuse.
// Orange while there's room, red and pulsing for the last three moves.
// Warm orange/red read on both the light and the dark board.
function _bombGlyph(x,y,r,n){
  const hot=n<=3,col=hot?'#d94f3d':'#e07b39';
  _badge(x,y,r,col);
  X.strokeStyle=col;X.lineWidth=max(1.5,r*.16);X.lineCap='round';
  X.beginPath();X.moveTo(x+r*.55,y-r*.75);X.quadraticCurveTo(x+r*.9,y-r*1.25,x+r*1.18,y-r*1.05);X.stroke();
  X.fillStyle=TH.star;
  X.beginPath();X.arc(x+r*1.2,y-r*1.08,max(1.6,r*.2),0,TAU);X.fill();
  txtP(String(n),x,y+.5,max(9,r*1.05),'#fff');
}
function _drawBombBadge(a,cs,gx,gy,alpha,shakeOff){
  const c=a.cells[max(0,a.cells.length-2)];
  const pulse=(a.cdLeft<=3&&!reducedMotion)?1+.12*sin(gt*10):1;
  const x=gx+c[1]*cs+cs/2+(shakeOff||0),y=gy+c[0]*cs+cs/2;
  X.save();X.globalAlpha=alpha;
  _bombGlyph(x,y,max(9,cs*.42)*pulse,max(0,a.cdLeft));
  X.restore();
}
function drawArrowStatic(arrow,cs,gx,gy,col,alpha,shakeOff){

  const pts=[];
  for(const[r,c] of arrow.cells){
    let x=gx+c*cs+cs/2,y=gy+r*cs+cs/2;
    if(shakeOff){x+=shakeOff}
    pts.push([x,y]);
  }
  if(pts.length===1){
    const bd=(arrow.dir+2)%4;
    const h=pts[0];
    pts.unshift([h[0]+DX[bd]*cs*.38,h[1]+DY[bd]*cs*.38]);
  }
  drawArrowPolyline(pts,cs,col,alpha);
}

// Check if this button is currently being pressed (scale feedback)
function btnPressScale(x,y,w,h){
  if(!lastClick)return 1;
  const dt=gt-lastClick.t;
  if(dt>.18)return 1;
  if(abs(lastClick.x-x)>w/2||abs(lastClick.y-y)>h/2)return 1;
  // Ease-out over 0.18s: scale dips to 0.95 then back to 1.0
  const p=dt/.18;
  const dip=sin(p*PI);
  return 1-dip*.05;
}

// Background, cached to an offscreen canvas so gradients aren't rebuilt per
// frame (gradient allocation on iOS WebKit was a measured lag source).
let _bgCache=null,_bgCacheDark=null;
function _renderBg(dark){
  const cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  if(!x)return null;
  // v3 paper: near-flat, a whisper of warmth top→bottom for depth. The
  // Macaron peach/coral blobs are gone — they were most of the "pink" the
  // palette was criticised for — and so is any glow: a light patch behind
  // the title turned the corners grey.
  const bg=x.createLinearGradient(0,0,0,H);
  if(dark){bg.addColorStop(0,'#231d17');bg.addColorStop(1,'#1b1611');}
  else{bg.addColorStop(0,'#f8f2e8');bg.addColorStop(1,'#f1e8da');}
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  return cv;
}
// v2.0 film grain (Puffies/ADA reference): a cached 128×128 noise tile
// tiled at ~1.5-3% alpha. One-time ImageData build, zero per-frame
// allocation. Skipped under high contrast (it would read as dirt).
let _grainPat=null;
function _grain(){
  if(highContrast)return;
  if(!_grainPat){
    const cv=document.createElement('canvas');
    cv.width=128;cv.height=128;
    const gx=cv.getContext('2d');
    const img=gx.createImageData(128,128);
    for(let i=0;i<img.data.length;i+=4){
      const v=Math.random()<.5?0:255;
      img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;
      img.data[i+3]=Math.random()*28;
    }
    gx.putImageData(img,0,0);
    _grainPat=X.createPattern(cv,'repeat');
  }
  X.save();
  X.globalAlpha=darkMode?.05:.03;
  X.fillStyle=_grainPat;
  X.fillRect(0,0,W,H);
  X.restore();
}

// `plain` used to pick a variant without the Macaron blobs; v3 has one
// background for every screen, so it is accepted and ignored by callers'
// convenience (drawBg(true) on play/complete, drawBg() on menus).
function drawBg(){
  if(_bgCacheDirty||_bgCacheDark!==darkMode){
    _bgCache=_renderBg(darkMode);
    _bgCacheDark=darkMode;
    _bgCacheDirty=false;
  }
  if(_bgCache){X.drawImage(_bgCache,0,0,W,H);}
  else{X.fillStyle=TH.bg;X.fillRect(0,0,W,H);}
}

// True when a modal/overlay is on top — buttons under must NOT consume the
// tap (the overlay needs it). Also disables their hover state for clarity.
function _inputBlocked(){return langPickerOpen||loginRewardOpen||(!!_introCard&&S==='play')}

// Shared button rendering. v2.4: dropped the saturated 2-px coloured
// border — on dark mode the gold border against a nearly-black surface
// read as "chocolate brown" exactly like the old tinted fill it
// replaced. Now buttons are pure clean cards: solid neutral fill, a
// hairline neutral border, and the accent colour only appears as the
// label text on coloured-button variants. Reads as iOS "filled" or
// "tinted" button instead of a contrasty rectangle.
// v3 buttons — game buttons, not web-form pills. A solid face over a darker
// "lip" a few px below it; pressing sinks the face onto the lip, so a tap
// feels like pressing something physical. PRIMARY (drawBigBtn): solid
// accent face, white heavy label. SECONDARY (drawBtn): paper face, label
// in the given colour (or ink). The old translucent fill + hairline border
// read as a settings form — "кнопки мне не нравятся".
function _shade(hex,k){ // darken a #rrggbb by factor k (0..1)
  const n=parseInt(hex.slice(1),16);
  const r=floor(((n>>16)&255)*k),g=floor(((n>>8)&255)*k),b=floor((n&255)*k);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
// `tail` (optional) puts a price on the right end of the face, sinking with
// it: {coin:n} = coin + amount, {ad:1} = a "watch a video" glyph. The label
// shifts left to make room instead of a coin painted over its last letters.
function _drawPillBtn(label,x,y,w,h,color,fontFrac,primary,tail){
  const blocked=_inputBlocked();
  const hv=!blocked&&abs(mx-x)<w/2&&abs(my-y)<h/2;
  const pressed=btnPressScale(x,y,w,h)<.999;
  const lip=max(3,floor(h*.09));
  const r=min(16,h*.38);
  const face=primary?(color||TH.accent):(hv?TH.btnHover:TH.btnBg);
  const faceIsHex=typeof face==='string'&&face[0]==='#'&&face.length===7;
  const lipCol=faceIsHex?_shade(face,primary?.78:.9):TH.border;
  const top=y-h/2-lip/2;                       // face top when resting
  const sink=pressed?lip*.7:0;
  X.fillStyle=lipCol;
  X.beginPath();X.roundRect(x-w/2,top+lip,w,h,r);X.fill();
  X.fillStyle=face;
  X.beginPath();X.roundRect(x-w/2,top+sink,w,h,r);X.fill();
  if(primary&&hv&&!pressed){                   // hover: a faint lift highlight
    X.fillStyle='rgba(255,255,255,.08)';
    X.beginPath();X.roundRect(x-w/2,top,w,h,r);X.fill();
  }
  const c=color||TH.accent;
  const labelCol=primary?'#ffffff':((c===TH.accent)?TH.text:c);
  const cy=top+sink+h/2;
  let lx=x;
  if(tail){
    const tx=x+w/2-h*.42;                      // right anchor of the tail
    if(tail.coin!=null){
      const n=tail.coin+'',fs=floor(h*.34);
      X.font='800 '+fs+'px Nunito,sans-serif';
      const tw=X.measureText(n).width;
      drawCoin(tx-tw-h*.2,cy,h*.15);
      txt(n,tx,cy,fs,labelCol,'right','800');
      lx=x-(tw+h*.42)/2;
    }else if(tail.ad){
      const s=h*.2;                            // rounded screen + play mark
      X.strokeStyle=labelCol;X.lineWidth=max(1.5,h*.045);
      X.beginPath();X.roundRect(tx-s*2.4,cy-s*.8,s*2.4,s*1.6,s*.35);X.stroke();
      drawPlayIcon(tx-s*1.15,cy,s*.75,labelCol);
      lx=x-s*1.4;
    }
  }
  txt(label,lx,cy,floor(h*fontFrac),labelCol,'center',primary?'800':'700');
  if(!blocked&&tapped&&abs(tapX-x)<w/2&&abs(tapY-y)<h/2){sfx.tap();tapped=false;return true}
  return false;
}
function drawBtn(label,x,y,w,h,color,tail){
  return _drawPillBtn(label,x,y,w,h,color,0.38,false,tail);
}
function drawBigBtn(label,x,y,w,h,color){
  const r=_drawPillBtn(label,x,y,w,h,color,0.40,true);
  if(r)haptic(5);
  return r;
}

// Filled play-triangle icon (▶ replacement) — matches arrowsgo's look:
// a small solid triangle with rounded points sitting flush with the label.
function drawPlayIcon(x,y,sz,col){
  X.save();
  X.translate(x,y);
  X.fillStyle=col||TH.btnText;
  X.lineJoin='round';X.lineWidth=sz*.18;X.strokeStyle=X.fillStyle;
  X.beginPath();
  X.moveTo(-sz*.4,-sz*.55);
  X.lineTo(sz*.55,0);
  X.lineTo(-sz*.4,sz*.55);
  X.closePath();
  X.fill();X.stroke();
  X.restore();
}

function drawStar(x,y,sz,filled){
  X.save();X.translate(x,y);
  X.beginPath();
  for(let i=0;i<5;i++){
    const a1=i*TAU/5-PI/2,a2=a1+TAU/10;
    X.lineTo(cos(a1)*sz,sin(a1)*sz);
    X.lineTo(cos(a2)*sz*.4,sin(a2)*sz*.4);
  }
  X.closePath();
  if(filled){X.fillStyle=TH.star;X.fill()}
  else{X.strokeStyle=TH.star+'40';X.lineWidth=1;X.stroke()}
  X.restore();
}

// Render a heart icon for the lives indicator (top bar) and the broken-
// heart hero on Game Over. The shape is a single bezier path tuned so the
// two top lobes are visibly rounded, the valley between them is shallow
// (not a sharp V) and the bottom narrows to a point. Designed inside a
// 14×14 unit box centered on (x,y) — pass `sz` to scale.
//   full = true  → solid red fill + soft top-left highlight
//   full = false → empty pill (light fill, subtle outline) for "lost life"
//   broken = true → adds a zigzag crack down the middle (Game Over screen)
function drawHeart(x,y,sz,full,broken){
  X.save();
  X.translate(x,y);
  const s=sz/14;
  if(s!==1)X.scale(s,s);

  // Broken heart = two halves drawn separately, each rotated outward a
  // few degrees and meeting at a zigzag fracture line. Looks like 💔
  // (two real pieces) instead of a whole heart with a stripe on top.
  if(broken&&full){
    // Left half — tilted counter-clockwise, shifted slightly left/down.
    X.save();
    X.translate(-0.6,0.4);
    X.rotate(-0.11);
    X.beginPath();
    X.moveTo(0,10);
    X.lineTo(-0.7,8);
    X.lineTo(0.5,6);
    X.lineTo(-0.7,4);
    X.lineTo(0.5,2);
    X.lineTo(-0.7,0);
    X.lineTo(0,-2);
    X.bezierCurveTo(-2,-7,-8,-7,-8,-2);
    X.bezierCurveTo(-8,3,-4,6,0,10);
    X.closePath();
    X.fillStyle='#e05555';
    X.fill();
    // Highlight on the left lobe stays — half is still "polished".
    X.fillStyle='rgba(255,255,255,.32)';
    X.beginPath();
    X.ellipse(-3.6,-3.6,1.9,1.4,-0.5,0,TAU);
    X.fill();
    X.restore();
    // Right half — mirror, tilted clockwise.
    X.save();
    X.translate(0.6,0.4);
    X.rotate(0.11);
    X.beginPath();
    X.moveTo(0,10);
    X.lineTo(0.7,8);
    X.lineTo(-0.5,6);
    X.lineTo(0.7,4);
    X.lineTo(-0.5,2);
    X.lineTo(0.7,0);
    X.lineTo(0,-2);
    X.bezierCurveTo(2,-7,8,-7,8,-2);
    X.bezierCurveTo(8,3,4,6,0,10);
    X.closePath();
    X.fillStyle='#d04444'; // ever-so-slightly darker so you SEE two halves
    X.fill();
    X.restore();
    X.restore();
    return;
  }

  // Whole heart: single closed bezier — two lobes joining at a top valley,
  // narrowing to a point at the bottom. 14-unit coordinate box.
  X.beginPath();
  X.moveTo(0,-2);
  X.bezierCurveTo(-2,-7,-8,-7,-8,-2);
  X.bezierCurveTo(-8,3,-4,6,0,10);
  X.bezierCurveTo(4,6,8,3,8,-2);
  X.bezierCurveTo(8,-7,2,-7,0,-2);
  X.closePath();
  if(full){
    X.fillStyle='#e05555';
    X.fill();
    X.fillStyle='rgba(255,255,255,.32)';
    X.beginPath();
    X.ellipse(-3.6,-3.6,1.9,1.4,-0.5,0,TAU);
    X.fill();
  }else{
    X.fillStyle=darkMode?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)';
    X.fill();
    X.strokeStyle=darkMode?'rgba(255,255,255,.28)':'rgba(0,0,0,.22)';
    X.lineWidth=1.4/s;
    X.stroke();
  }
  X.restore();
}

// Render a proper-looking coin: yellow disk + dark inner ring + highlight shine
function drawCoin(x,y,r){
  // Outer shadow for depth
  X.fillStyle=darkMode?'rgba(0,0,0,.35)':'rgba(80,55,0,.25)';
  X.beginPath();X.arc(x+r*.12,y+r*.15,r,0,TAU);X.fill();
  // Main disk
  X.fillStyle=TH.star;
  X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
  // Inner ring
  X.strokeStyle=darkMode?'rgba(0,0,0,.45)':'rgba(120,85,0,.55)';
  X.lineWidth=max(.8,r*.18);
  X.beginPath();X.arc(x,y,r*.68,0,TAU);X.stroke();
  // Top-left highlight for coin shine
  X.fillStyle='rgba(255,255,255,.55)';
  X.beginPath();X.arc(x-r*.32,y-r*.32,r*.24,0,TAU);X.fill();
}

// Lightbulb icon — clean Heroicons-style outline. Filled bulb body
// with a small rectangular base; matches the visual weight of the
// drawHeart glyph next to it (same fill-with-tiny-stroke approach).
// Pass `sz` = nominal size of the heart it sits next to; the bulb
// uses sz as its overall glyph height.

// Hamburger / pause-menu glyph — three horizontal bars, rounded ends.
// Replaces the unicode "≡" which fell back to a different font on
// some Androids and showed at inconsistent weights between devices.
function drawHamburger(x, y, sz, col){
  X.save();
  X.strokeStyle = col;
  X.lineWidth = max(1.6, sz * 0.18);
  X.lineCap = 'round';
  const w = sz * 1.0;
  const dy = sz * 0.36;
  X.beginPath();
  X.moveTo(x - w/2, y - dy); X.lineTo(x + w/2, y - dy);
  X.moveTo(x - w/2, y);      X.lineTo(x + w/2, y);
  X.moveTo(x - w/2, y + dy); X.lineTo(x + w/2, y + dy);
  X.stroke();
  X.restore();
}

function drawLightbulb(x, y, sz, col){
  X.save();
  X.fillStyle=col;
  X.strokeStyle=col;
  X.lineWidth=max(1.2, sz*.10);
  X.lineCap='round';
  X.lineJoin='round';
  // Bulb body — a teardrop-ish round shape sitting above the base.
  // Drawn as a filled circle with a flat bottom, then a trapezoidal
  // neck connects to the base.
  const bulbR = sz*.55;
  const bulbCY = y - sz*.20;
  X.beginPath();
  X.arc(x, bulbCY, bulbR, 0, TAU);
  X.fill();
  // Neck connecting bulb to base
  X.beginPath();
  X.moveTo(x - sz*.25, bulbCY + bulbR*.85);
  X.lineTo(x - sz*.20, y + sz*.30);
  X.lineTo(x + sz*.20, y + sz*.30);
  X.lineTo(x + sz*.25, bulbCY + bulbR*.85);
  X.closePath();
  X.fill();
  // Base — small rectangular screw cap
  X.beginPath();
  X.roundRect(x - sz*.22, y + sz*.30, sz*.44, sz*.20, sz*.06);
  X.fill();
  // Filament — a soft inner highlight "smile" on the bulb
  X.strokeStyle=darkMode?'rgba(0,0,0,.30)':'rgba(255,255,255,.55)';
  X.lineWidth=max(.8, sz*.10);
  X.beginPath();
  X.arc(x, bulbCY + bulbR*.10, bulbR*.50, PI*.20, PI*.80, false);
  X.stroke();
  X.restore();
}
