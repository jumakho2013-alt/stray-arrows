      const ar=a.cells[0][0],ac=a.cells[0][1];
      for(let d=0;d<4;d++){
        const nr=ar+DY[d],nc=ac+DX[d];
        if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
        if(occ[nr][nc]===-1)continue;
        const otherIdx=occ[nr][nc];
        if(otherIdx===i)continue;
        const other=placed[otherIdx];
        if(other.cells.length<2)continue;
        const tail=other.cells[0];
        if(tail[0]!==nr||tail[1]!==nc)continue;
        const head=other.cells[other.cells.length-1];
        if(onEscapeLine(ar,ac,head[0],head[1],other.dir))continue;
        if(_wouldBlockOtherEscape(ar,ac,otherIdx))continue;
        other.cells.unshift([ar,ac]);
        occ[ar][ac]=otherIdx;
        placed.splice(i,1);
        // Re-index occ — every cell whose value > i decrements by 1
        for(let r2=0;r2<rows;r2++){
          for(let c2=0;c2<cols;c2++){
            if(occ[r2][c2]>i)occ[r2][c2]--;
          }
        }
        merged++;
        break;
      }
    }
  }

  // Solvability check: simulate "tap an arrow whose escape is clear" until
  // all are removed. The check is greedy (always pops the FIRST clear arrow
  // it finds), so a `false` here means "this greedy walk got stuck", not
  // "no walk exists" — there are seeds that fail the check yet are solvable
  // by a smarter player. We still retry on a `false` because the cheapest
  // fix is to find a seed where the greedy proof works.
  //
  // Two things changed from the previous 5-retry pass which shipped weekly
  // levels that players reported "won't solve":
  //   1. Bumped the cap to 30. The weekly seed is fixed for an entire week
  //      — if we lose to bad luck on 5 perturbations, a whole cohort gets
  //      a stuck board for 7 days. 30 attempts at micro-cost is worth it.
  //   2. Replaced the linear `+97*depth` perturbation with a Weyl-sequence
  //      step (`+ 0x9E3779B1 * (depth+1)`) so each retry lands in a far
  //      corner of seed space rather than walking 97 cells over. The
  //      previous step was small enough that bake/snake decisions often
  //      stayed identical across retries.
  const _retryDepth=arguments.length>=3?arguments[2]:0;
  const MAX_RETRIES=30;
  if(!_isLevelSolvable(placed,rows,cols)&&_retryDepth<MAX_RETRIES&&lvl>=1){
    const baseSeed=customSeed!=null?customSeed:(lvl*7919+31337);
    // 0x9E3779B1 ≈ 2^32 / phi — Knuth's golden-ratio multiplier, classic
    // tool for spreading sequential indices across a 32-bit space.
    const perturbed=(baseSeed+(0x9E3779B1*(_retryDepth+1))|0);
    return generateLevel(lvl,perturbed,_retryDepth+1);
  }
  if(_retryDepth>=MAX_RETRIES&&!_isLevelSolvable(placed,rows,cols)){
    // We exhausted retries and the greedy solver still can't crack the
    // board. For daily/weekly this is unacceptable — a whole cohort of
    // players gets a stuck puzzle for the day or week. Drop the
    // difficulty by half and retry with a fresh perturbed seed. lvl is
    // strictly halved (so lvl=120 weekly -> lvl=60 first attempt ->
    // lvl=30 if THAT also fails -> ...). At lvl<=2 generation cannot
    // realistically deadlock, so this terminates.
    if(typeof _devWarn==='function')_devWarn('generateLevel.retriesExhausted','lvl='+lvl+' seed='+customSeed+' -> falling back to lvl='+max(2,floor(lvl/2)));
    if(lvl>2){
      const fallbackLvl=max(2,floor(lvl/2));
      const fallbackSeed=(customSeed!=null?customSeed:(lvl*7919+31337))^0xCAFEBABE|0;
      return generateLevel(fallbackLvl,fallbackSeed,0);
    }
  }

  // Reverse so arrows[0] = first solved
  arrows=placed.reverse();
  for(const a of arrows)a.alive=true;
  _recordCells();

  minMoves=arrows.length;
  moves=0;
  timer=0;
  undosLeft=3;
  _startZoomIntro();

  const key='ae_best_'+lvl;
  bestTime=+localStorage.getItem(key)||0;
}

// Build the "primary snake" — one long winding arrow covering ~half of the
// grid via Warnsdorff's heuristic (move to the unvisited neighbour with
// fewest onward unvisited neighbours). The arrow head ends up on a grid
// edge so the escape line is outside the grid (automatic clear). The body
// trails through the interior in a snake pattern.
function buildPrimaryArrow(occ,rows,cols,rng){
  // Collect free edge cells; pick a random one as the HEAD (the cell the
  // player taps; arrow flies outward from there).
  const edges=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(occ[r][c]!==-1)continue;
      if(r===0||r===rows-1||c===0||c===cols-1)edges.push({r,c});
    }
  }
  if(!edges.length)return null;
  const start=edges[Math.floor(rng()*edges.length)];

  // Determine head's escape direction (outward from edge). For corner
  // cells either of two outward directions is valid — pick one.
  // DX=[1,0,-1,0], DY=[0,-1,0,1]  (right, up, left, down)
  let dir;
  if(start.r===0)dir=1;       // top edge → up
  else if(start.r===rows-1)dir=3; // bottom → down
  else if(start.c===0)dir=2;  // left → left
  else dir=0;                  // right → right

  // Warnsdorff fill from head inward.
  const path=[[start.r,start.c]];
  const visited=new Set();
  visited.add(start.r+','+start.c);
  // Aim for ~30% of cells. Higher fractions choke the filler passes —
  // the snake winds through every row/column, so other arrows can't
  // place an escape line that doesn't cross it, and the level ends up
  // as one solo snake (not playable). Floor at 8.
  const freeCells=rows*cols;
  const targetLen=Math.max(8,Math.floor(freeCells*.3));

  let curR=start.r,curC=start.c;
  while(path.length<targetLen){
    const opts=[];
    for(let d=0;d<4;d++){
      const nr=curR+DY[d],nc=curC+DX[d];
      if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
      if(occ[nr][nc]!==-1)continue;
      if(visited.has(nr+','+nc))continue;
      // Warnsdorff degree: count nr,nc's unvisited neighbours
      let deg=0;
      for(let dd=0;dd<4;dd++){
        const mr=nr+DY[dd],mc=nc+DX[dd];
        if(mr<0||mr>=rows||mc<0||mc>=cols)continue;
        if(occ[mr][mc]!==-1)continue;
        if(visited.has(mr+','+mc))continue;
        deg++;
      }
      opts.push({r:nr,c:nc,deg});
    }
    if(!opts.length)break;
    // Sort by degree ascending; tie-break with rng so different seeds
    // produce different paths even if degrees match.
    opts.sort((a,b)=>(a.deg-b.deg)||(rng()-.5));
    const pick=opts[0];
    path.push([pick.r,pick.c]);
    visited.add(pick.r+','+pick.c);
    curR=pick.r;curC=pick.c;
  }

  if(path.length<8)return null;

  // arrow.cells convention: cells[0]=tail, cells[N-1]=head. We grew from
  // head outward, so reverse.
  const cells=path.reverse();
  return {cells,dir};
}

// Build one arrow by EXHAUSTIVE candidate search.
// Special case: when minLen==1 && maxLen==1, build a single-cell arrow (just a
// head with a direction). Used in the gap-fill pass to plug isolated empties.
// `placed` (optional) is the array of arrows already placed — used for
// direction-variance penalty (#6: discourage clusters of same-direction
// arrows so the puzzle isn't solvable by "tap everything pointing east").
function tryBuildArrow(occ,rows,cols,rng,minLen,maxLen,placed,opts){
  opts=opts||{};
  const oneCell=(minLen===1&&maxLen===1);
  const minAcceptLen=opts.minAcceptLen||minLen;
  const braidMode=opts.braid!==false;
  const candidates=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(occ[r][c]!==-1)continue;
      for(let d=0;d<4;d++){
        // For multi-cell arrows we need a free cell behind the head too.
        if(!oneCell){
          const bd=(d+2)%4;
          const br=r+DY[bd],bc=c+DX[bd];
          if(br<0||br>=rows||bc<0||bc>=cols)continue;
          if(occ[br][bc]!==-1)continue;
        }
        // Escape line from head to grid edge. Allow up to 1 blocker — a
        // body cell of another arrow on this line creates a chain
        // dependency (tap blocker first, then this arrow flies). The
        // game's canEscape() already enforces this rule, so the
        // generator can use it as a placement-quality lever. Hard cap
        // at 1 keeps deadlock risk low; isLevelSolvable() at the end
        // verifies any seed before we ship it.
        let blockerCount=0;
        let escLen=0;
        let cr=r+DY[d],cc=c+DX[d];
        while(cr>=0&&cr<rows&&cc>=0&&cc<cols){
          if(occ[cr][cc]!==-1)blockerCount++;
          escLen++;
          cr+=DY[d];cc+=DX[d];
        }
        if(blockerCount>_maxBlockers)continue;
        // Score:
        //   +4.0 per neighbor already occupied → new arrows start attached to
        //        existing strands instead of spawning as separate islands.
        //   +2.0 per unique adjacent arrow → heads prefer busy knots, not just
        //        one flat parallel side.
        //   -2.0 if neighbor arrow has the SAME escape direction (#6 direction
        //        variance — prevents "all arrows point east" clusters that the
        //        player can solve by tap-spamming in one axis)
        //   -0.12 × Chebyshev distance from center → seed the first arrow near
        //        the middle of the grid so the cluster has room to expand
        //        outward in all directions (prevents hollow-center effect)
        let s=rng();
        const adjArrows=new Set();
        for(let dd=0;dd<4;dd++){
          const nr=r+DY[dd],nc=c+DX[dd];
          if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&occ[nr][nc]!==-1){
            s+=braidMode?7.0:3.5;
            adjArrows.add(occ[nr][nc]);
            if(placed&&placed[occ[nr][nc]]&&placed[occ[nr][nc]].dir===d)s-=8.0;
          }
        }
        if(braidMode)s+=adjArrows.size*2.0;
        const cR=(rows-1)/2,cC=(cols-1)/2;
        const distCenter=max(abs(r-cR),abs(c-cC));
        s-=distCenter*.12;
        // Variant D — chain mode bonus: prefer heads with LONG escape lines.
        // Each cell on the line is potential blocker once a later arrow's
        // body lands there, which creates a dependency chain at game time.
        // Weight bumped 0.5 → 1.5 (v1.0.15 tuning): heads with the longest
        // exit corridor are now strongly preferred, so subsequent arrows
        // routinely have something meaningful to BLOCK.
        if(CHAIN_MODE)s+=escLen*4;
        // Real-puzzle bonus: prefer heads whose exit is blocked by exactly
        // one already placed arrow. Solvability filtering rejects cycles,
        // but this makes the generator actively build locks instead of
        // mostly independent snakes.
        if(CHAIN_MODE&&placed&&placed.length>4){
          if(blockerCount===1)s+=10;
          else s-=4;
        }
        // Direction-variance bonus: every level should present all four
        // exit directions or the player can spam-tap a single column
        // and clear the board with no thinking. v2 strengthens the
        // bonus/penalty AND introduces a hard kick for any direction
        // that's been completely skipped — the first arrow in an unused
        // direction lands a +18 bonus so the algorithm reliably plants
        // one of each before piling onto the popular sides.
        if(placed&&placed.length>3){
          const dirCounts=[0,0,0,0];
          for(const o of placed)dirCounts[o.dir]++;
          let minC=dirCounts[0],maxC=dirCounts[0];
          for(let dd=1;dd<4;dd++){
            if(dirCounts[dd]<minC)minC=dirCounts[dd];
            if(dirCounts[dd]>maxC)maxC=dirCounts[dd];
          }
          // Hard kick for never-seen directions
          if(dirCounts[d]===0)s+=18;
          else if(dirCounts[d]===minC&&maxC>minC)s+=12;     // was +7
          else if(dirCounts[d]===maxC&&maxC>minC+1)s-=10;   // was -5
        }
        // Variant E — clusters mode penalty: arrow heads far from any
        // cluster center get strongly docked, so heads gather around the
        // chosen island centers and leave empty corridors between them.
        if(CLUSTERS_MODE&&_clusterCenters.length){
          let minD=Infinity;
          for(const cc of _clusterCenters){
            const dd=max(abs(r-cc.r),abs(c-cc.c));
            if(dd<minD)minD=dd;
          }
          s-=minD*.5;
        }
        s+=patternCellBias(r,c,d,rows,cols,true);
        candidates.push({hr:r,hc:c,dir:d,s});
      }
    }
  }
  if(candidates.length===0)return null;
  candidates.sort((a,b)=>b.s-a.s);

  // Single-cell arrow shortcut: return the best candidate immediately
  if(oneCell){
    const best=candidates[0];
    return{cells:[[best.hr,best.hc]],dir:best.dir};
  }

  for(const cand of candidates){
    const{hr,hc,dir}=cand;
    const bd=(dir+2)%4;
    const br0=hr+DY[bd],bc0=hc+DX[bd];

    // Always target the maximum length. Growth stops naturally when all
    // neighbors are blocked, so short paths only happen in tight corners.
    const targetLen=maxLen;
    const cells=[[br0,bc0],[hr,hc]];
    const used=new Set();
    used.add(hr+','+hc);
    used.add(br0+','+bc0);
    let br=br0,bc=bc0;
    let lastStepDir=bd;
    let straightRun=1;
    let turnCount=0; // #4: count direction changes during growth

    while(cells.length<targetLen){
      const opts=[];
      for(let d=0;d<4;d++){
        const nr=br+DY[d],nc=bc+DX[d];
        if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
        if(occ[nr][nc]!==-1)continue;
        if(used.has(nr+','+nc))continue;
        if(onEscapeLine(nr,nc,hr,hc,dir))continue;
        opts.push({r:nr,c:nc,d});
      }
      if(opts.length===0)break;
      // Hard cap: never extend a straight run past 2 cells. Without this,
      // arrows can grow long straight along the grid edge (no neighbors → no
      // proximity penalty) and the player solves the level by tapping the
      // outer ring in order. We physically refuse the option here.
      const filteredOpts=opts.filter(o=>!(o.d===lastStepDir&&straightRun>=2));
      const useOpts=filteredOpts.length?filteredOpts:opts; // fallback only if turn impossible
      const scored=useOpts.map(({r,c,d})=>{
        let s=rng();
        // Proximity bonus: high enough that later arrows weave through existing
        // strands instead of taking isolated open-space walks.
        let occupied=[false,false,false,false];
        const adjArrows=new Set();
        for(let dd=0;dd<4;dd++){
          const nr=r+DY[dd],nc=c+DX[dd];
          if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&occ[nr][nc]!==-1){
            s+=braidMode?6.0:4.0;
            occupied[dd]=true;
            adjArrows.add(occ[nr][nc]);
          }
        }
        if(braidMode)s+=adjArrows.size*1.8;
        // Sandwich bonus: occupied on OPPOSITE sides → path threads a corridor.
        // This is the "braid" signal: prefer cells that sit between strands.
        if(occupied[0]&&occupied[2])s+=braidMode?7.0:2.5;
        if(occupied[1]&&occupied[3])s+=braidMode?7.0:2.5;
        // Lane bonus: when moving horizontally, prefer having strands above or
        // below; when moving vertically, prefer strands left/right. It creates
        // long adjacent runs that read like woven ropes.
        if(braidMode&&(d===0||d===2)&&(occupied[1]||occupied[3]))s+=3.8;
        if(braidMode&&(d===1||d===3)&&(occupied[0]||occupied[2]))s+=3.8;
        // After a seed arrow exists, isolated cells are visually weak. Keep a
        // small escape hatch early in growth so the arrow can still leave a
        // pocket and become long, but otherwise pull it back into the knot.
        if(braidMode&&placed&&placed.length>0&&adjArrows.size===0&&cells.length>4)s-=3.0;
        if(d!==lastStepDir)s+=2.0;
        else if(straightRun>=2)s-=2.0;
        // Variant D — chain mode: STRONG bonus if this cell is on the escape
        // line of an already-placed arrow. That arrow solves AFTER this one
        // in game order; placing our body on its escape line means the player
        // can only solve it once we're removed → adds one link to the chain.
        if(CHAIN_MODE&&placed){
          let crossings=0;
          for(let j=0;j<placed.length;j++){
            const o=placed[j];
            const oh=o.cells[o.cells.length-1];
            if(onEscapeLine(r,c,oh[0],oh[1],o.dir))crossings++;
          }
          // Weight bumped 2.5 → 8 (v1.0.15 tuning). Crossing another
          // arrow's escape line is the single most-important property
          // for puzzle quality — every crossing translates to "tap A
          // before B" gameplay. With the previous 2.5 the bonus was
          // routinely outweighed by length / turn / center bonuses, so
          // arrows preferred isolated zigzag spirals to chain links.
          s+=crossings*20;
        }
        // Penetration bonus — body cells in TIGHT enclosed pockets get
        // a strong bonus. Counts how many of the 4 neighbours are walls
        // or already-placed body cells. ≥3 = the cell is inside a "U"
        // or "C" pocket of another arrow → exactly the empty interior
        // the user pointed out. Encourages snakes to wind INTO the
        // negative space of earlier-placed snakes instead of running
        // around them.
        let surroundedBy=0;
        for(let dd=0;dd<4;dd++){
          const nr2=r+DY[dd],nc2=c+DX[dd];
          if(nr2<0||nr2>=rows||nc2<0||nc2>=cols)surroundedBy++;
          else if(occ[nr2][nc2]!==-1)surroundedBy++;
        }
        if(surroundedBy>=3)s+=14;
        else if(surroundedBy>=2)s+=4;
        // Variant E — clusters mode: penalty for body cells far from nearest
        // cluster center, keeping the arrow inside its assigned island.
        if(CLUSTERS_MODE&&_clusterCenters.length){
          let minD=Infinity;
          for(const cc of _clusterCenters){
            const dd=max(abs(r-cc.r),abs(c-cc.c));
            if(dd<minD)minD=dd;
          }
          s-=minD*.4;
        }
        s+=patternCellBias(r,c,d,rows,cols,false);
        return{cell:[r,c],d,s};
      });
      scored.sort((a,b)=>b.s-a.s);
      const pick=scored[0];
      cells.unshift(pick.cell);
      used.add(pick.cell[0]+','+pick.cell[1]);
      br=pick.cell[0];bc=pick.cell[1];
      if(pick.d===lastStepDir)straightRun++;else{straightRun=1;lastStepDir=pick.d;turnCount++}
    }

    // #4 Min turn requirement: long arrows (>5 cells) must twist at least
    // twice. A 6-cell L-shape (1 turn) was visually flat and let the player
    // solve it by sliding their finger. Reject and try the next candidate.
    if(cells.length>5&&turnCount<2)continue;

    if(cells.length>=minAcceptLen)return{cells,dir};
  }
  return null;
}

// Is (r,c) on the escape line of an arrow with head (hr,hc) in direction dir?
function onEscapeLine(r,c,hr,hc,dir){
  let cr=hr+DY[dir],cc=hc+DX[dir];
  while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols){
    if(cr===r&&cc===c)return true;
    cr+=DY[dir];cc+=DX[dir];
  }
  return false;
}

// Repeatedly find any arrow whose escape line has no alive blocker and
// "remove" it. If we reach zero arrows, the level is solvable. If we get
// stuck with arrows remaining, there's a cycle in the chain-dependency
// graph and the level is unwinnable — caller should regenerate.
function _isLevelSolvable(placed,rows,cols){
  const N=placed.length;
  const alive=new Array(N).fill(true);
  let removed=0;
  while(removed<N){
    let progress=false;
    for(let i=0;i<N;i++){
      if(!alive[i])continue;
      const head=placed[i].cells[placed[i].cells.length-1];
      const dir=placed[i].dir;
      let cr=head[0]+DY[dir],cc=head[1]+DX[dir];
      let clear=true;
      while(cr>=0&&cr<rows&&cc>=0&&cc<cols&&clear){
        for(let j=0;j<N;j++){
          if(j===i||!alive[j])continue;
          for(const[or,oc] of placed[j].cells){
            if(or===cr&&oc===cc){clear=false;break}
          }
          if(!clear)break;
        }
        cr+=DY[dir];cc+=DX[dir];
      }
      if(clear){alive[i]=false;removed++;progress=true;break}
    }
    if(!progress)return false;
  }
  return true;
}

// ================================================================
//  GAME ACTIONS
// ================================================================
// Check if arrow[idx] can escape — head cell walks in arrow.dir to grid edge,
// path must not contain cells of any OTHER alive arrow.
function canEscape(idx){
  const a=arrows[idx];
  if(!a||!a.alive)return false;
  const head=a.cells[a.cells.length-1];
  let cr=head[0]+DY[a.dir],cc=head[1]+DX[a.dir];
  while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols){
    for(let j=0;j<arrows.length;j++){
      if(j===idx||!arrows[j].alive)continue;
      for(const[or,oc] of arrows[j].cells){
        if(or===cr&&oc===cc)return false;
      }
    }
    cr+=DY[a.dir];cc+=DX[a.dir];
  }
  return true;
}

// Compute total arc length of an arrow path in pixels (cell-center to cell-center).
// Single-cell arrows get a synthetic body length so the animation has something to render.
function arrowBodyLen(a,cs){
  if(a.cells.length===1)return cs*.38;
  let len=0;
  for(let i=0;i<a.cells.length-1;i++){
    const dr=a.cells[i+1][0]-a.cells[i][0];
    const dc=a.cells[i+1][1]-a.cells[i][1];
    len+=sqrt(dr*dr+dc*dc)*cs;
  }
  return len;
}

// Build world-space extended path for an arrow: polyline through cell centers +
// a long straight extension in the exit direction past the head.
// Single-cell arrows get a synthetic tail point behind the head in backDir.
function buildArrowWorldPath(a,cs,gx,gy){
  const pts=[];
  for(const[r,c] of a.cells)pts.push([gx+c*cs+cs/2,gy+r*cs+cs/2]);
  if(pts.length===1){
    const bd=(a.dir+2)%4;
    const h=pts[0];
    pts.unshift([h[0]+DX[bd]*cs*.38,h[1]+DY[bd]*cs*.38]);
  }
  const head=pts[pts.length-1];
  pts.push([head[0]+DX[a.dir]*1600,head[1]+DY[a.dir]*1600]);
  return pts;
}

function tapArrowByIndex(idx){
  // Guard: block taps during the brief transition window after game-over /
  // level-complete (a setTimeout flips state in 500ms). Without this, the
  // user can tap further arrows in those 500ms and corrupt the post-state.
  if(inputLocked)return;
  const a=arrows[idx];
  if(!a||!a.alive)return;

  if(canEscape(idx)){
    a.alive=false;
    moves++;

    const cs=getCellSize(),gx=getGridX(),gy=getGridY();
    const bodyLen=arrowBodyLen(a,cs);
    const extLen=1600;
    // Pre-build the polyline ONCE per anim (was rebuilt every frame in the
    // draw loop — main cause of lag during a chain of arrow exits).
    const path=buildArrowWorldPath(a,cs,gx,gy);
    anims.push({
      arrow:a,
      dir:a.dir,
      // Snappier exit (was 1.2s — felt sluggish vs competitor arrowsgo where
      // arrows shoot off in ~0.5s, giving the game its "kinetic" feel).
      t:0,dur:.55,
      col:arrowColor(a,idx),cs,gx,gy,
      bodyLen,totalDist:bodyLen+extLen,
      path,
    });
    sfx.swoosh(a.dir);haptic(10);

    // Win check
    let allGone=true;
    for(const ar of arrows)if(ar.alive){allGone=false;break}
    if(allGone){
      inputLocked=true;
      // Drop-in-water ripple from the last-cleared arrow's head, animated
      // every frame in drawPlay so the player feels the level "click closed"
      // before the complete screen arrives.
      const head=a.cells[a.cells.length-1];
      _winWave={x:gx+head[1]*cs+cs/2,y:gy+head[0]*cs+cs/2,t:0,dur:1.6};
      setTimeout(()=>{
        inputLocked=false;
        S='complete';
        completeEnterT=gt;
        sfx.complete();haptic(30);
        const s=max(1,undosLeft);
        const perfect=(s===3);
        let gained=0;
        if(isWeekly){
          if(!isWeeklyDone()){
            gained=WEEKLY_REWARD;
            _safeSet(weeklyDoneKey(),'1');
          }
        }else if(isDaily){
          if(!isDailyDone()){
            gained=DAILY_REWARD;
            _safeSet(dailyDoneKey(),'1');
            totalDailies++;
          }
        }else{
          const wasNewStars=(stars[level]||0)<s;
          stars[level]=max(stars[level]||0,s);
          totalStars=Object.values(stars).reduce((a,b)=>a+b,0);
          gained=5+s*5;
          const key='ae_best_'+level;
          const prev=+localStorage.getItem(key)||99999;
          if(timer<prev)_safeSet(key,floor(timer));
          bestTime=min(prev,floor(timer));
          if(undosLeft===3)streak++;else streak=0;
          if(wasNewStars&&perfect)totalPerfect++;
          if(wasNewStars&&!hintUsedThisLevel)noHintCount++;
          fastestLevel=min(fastestLevel,floor(timer));
        }
        coins+=gained;
        totalCoinsEarned+=gained;
        lastGained=gained;
        if(gained>0)spawnFloater(W/2,H*.58,'+'+gained);
        checkAchievements({
          level,stars:s,totalStars,streakDays,coins,perfect,isDaily,
          totalPerfect,totalDailies,noHintCount,fastestLevel
        });
        save();
        spawnConfetti();
      },1600);
    }
  }else{
    // Blocked — shake the head cell, lose a heart (life)
    const cs=getCellSize(),gx=getGridX(),gy=getGridY();
    const head=a.cells[a.cells.length-1];
    const sx=gx+head[1]*cs+cs/2;
    const sy=gy+head[0]*cs+cs/2;
    shakeAnims.push({x:sx,y:sy,idx,t:0,dur:.2});
    sfx.blocked();haptic([5,30,5]);
    if(isTutorial()){
      // Tutorial mode (levels 1-TUTORIAL_LEVELS): wrong tap is a teaching
      // moment, not a punishment. Player sees the shake + blocked sfx,
      // then the highlighted next arrow re-pulses so they can try again.
      spawnFloater(sx,sy-cs*.6,'blocked',TH.arrowBlock);
    }else{
      undosLeft--;
      spawnFloater(sx,sy-cs*.6,'-1',TH.arrowBlock);
      if(undosLeft<=0){
        inputLocked=true;
        setTimeout(()=>{S='gameover';sfx.gameover();inputLocked=false},500);
      }
    }
  }
}

// First TUTORIAL_LEVELS regular levels are no-penalty teaching levels:
// wrong taps don't drain hearts and the next solvable arrow is always
// pulse-highlighted. Daily/weekly are excluded — those are challenges,
// not introductions.
const TUTORIAL_LEVELS=5;
function isTutorial(){
  return level<=TUTORIAL_LEVELS&&!isDaily&&!isWeekly;
}


// ================================================================
//  CONFETTI
// ================================================================
function spawnConfetti(){
  confetti=[];
  if(reducedMotion)return; // celebration confetti is purely decorative
  // v2 confetti: pure sparkle storm in the gold family. The grid markers
  // are 4-pointed sparkles, the win wave bursts them gold, and the
  // celebration confetti now matches — every gold particle is the same
  // visual vocabulary. Drops the rainbow + shape-soup of v1 which felt
  // off-brand against the minimal palette.
  const colors = [TH.star, TH.accent, '#f0c47a', '#ffe2a8', '#fffbe5'];
  // Wide overhead shower
  for(let i=0;i<60;i++){
    confetti.push({
      x:W/2+rnd(-W/2,W/2),y:-10+rnd(-30,0),
      vx:rnd(-2,2),vy:rnd(1,4),
      sz:rnd(5,11),rot:rnd(0,TAU),rv:rnd(-4,4),
      col:colors[floor(rnd(0,colors.length))],
      life:2+rnd(0,1.5),
    });
  }
  // Upward fountain from where the check mark lands
  for(let i=0;i<35;i++){
    confetti.push({
      x:W/2+rnd(-30,30),y:H*.18+rnd(-10,10),
      vx:rnd(-5,5),vy:rnd(-9,-3),
      sz:rnd(4,8),rot:rnd(0,TAU),rv:rnd(-6,6),
      col:colors[floor(rnd(0,colors.length))],
      life:1.5+rnd(0,1),
    });
  }
}

// ================================================================
//  GRID HELPERS
// ================================================================
// Cell size is sized to fit the fixed STAGE field (not the per-level grid).
// Stage stays the same on every level → cell size is constant; small levels
// just sit inside a sea of background dots. Cells ~12% smaller than before
// to match competitor dot-grid look.
// Stage extends a few cells past the level on every side so the player has
// room to pan/look around. The dot field rendered earlier is the level's
// occupied cells only — these stage paddings are pure breathing room.
const STAGE_PAD=0;
function _stageC(){return max(STAGE_COLS,gridCols+STAGE_PAD*2)}
function _stageR(){return max(STAGE_ROWS,gridRows+STAGE_PAD*2)}
function getCellSize(){return min((W-32)/_stageC(),(H*.58)/_stageR())}
function getStageX(){return(W-_stageC()*getCellSize())/2}
function getStageY(){return H*.20}
function getGridX(){return getStageX()+floor((_stageC()-gridCols)/2)*getCellSize()}
function getGridY(){return getStageY()+floor((_stageR()-gridRows)/2)*getCellSize()}

// ================================================================
//  DRAWING HELPERS
// ================================================================
function txt(t,x,y,sz,col,align,font){
  X.font=`${font||'600'} ${sz}px ${font==='Poppins'?'Poppins':'Nunito'},sans-serif`;
  X.fillStyle=col||TH.text;X.textAlign=align||'center';X.textBaseline='middle';
  X.fillText(t,x,y);
}
function txtP(t,x,y,sz,col,align){txt(t,x,y,sz,col,align,'700')}

function drawArrow(x,y,dir,sz,col,alpha){
  // Simple straight arrow (used for menu animation and flying arrows).
  // v2: paints a 1-px-offset shadow underneath the line + head before the
  // main strokes. Looks like a Monument-Valley-style "lit from above"
  // depth cue without using shadowBlur (which is a perf cliff on iOS).
  const angles=[0,-PI/2,PI,PI/2];
  const a=angles[dir];
  const len=sz*.30;
  const headW=sz*.11;
  const headL=sz*.13;
  X.save();X.translate(x,y);X.rotate(a);
  X.globalAlpha=alpha||1;
  // Resolve skin paint in the arrow's LOCAL space (tail at -len, head at +len),
  // so gradient skins run along the arrow after the translate/rotate above.
  const c=_resolvePaint(col,X,-len,0,len,0);
  const lw=max(1.8,sz*.035);
  // Long-shadow pass (skipped in reduced-motion / high-contrast — both add
  // visual noise that those modes are explicitly trying to remove)
  if (!reducedMotion) {
    X.strokeStyle=TH.arrowShadow;X.lineWidth=lw;X.lineCap='round';
    const off=max(0.6,sz*.012);
    X.beginPath();X.moveTo(-len+off,off);X.lineTo(len-headL+off,off);X.stroke();
    X.fillStyle=TH.arrowShadow;X.beginPath();
    X.moveTo(len+off,off);X.lineTo(len-headL+off,-headW+off);X.lineTo(len-headL+off,headW+off);
    X.closePath();X.fill();
  }
  // Main pass
  X.strokeStyle=c;X.lineWidth=lw;X.lineCap='round';
  X.beginPath();X.moveTo(-len,0);X.lineTo(len-headL,0);X.stroke();
  X.fillStyle=c;X.beginPath();
  X.moveTo(len,0);X.lineTo(len-headL,-headW);X.lineTo(len-headL,headW);
  X.closePath();X.fill();
  X.globalAlpha=1;
  X.restore();
}

// Extract a polyline segment from a path between arc positions sFrom and sTo.
// Used by the slide animation to render partial arrows as they travel.
function getPathSegment(path,sFrom,sTo){
  const pts=[];
  let acc=0,started=false;
  for(let i=0;i<path.length-1;i++){
    const x1=path[i][0],y1=path[i][1],x2=path[i+1][0],y2=path[i+1][1];
    const dx=x2-x1,dy=y2-y1;
    const segLen=sqrt(dx*dx+dy*dy);
    if(segLen===0)continue;
    const segEnd=acc+segLen;
    if(!started&&segEnd>sFrom){
      const t=max(0,(sFrom-acc)/segLen);
      pts.push([x1+dx*t,y1+dy*t]);
      started=true;
    }
    if(started){
      if(segEnd>=sTo){
        const t=(sTo-acc)/segLen;
        pts.push([x1+dx*t,y1+dy*t]);
        return pts;
      }
      pts.push([x2,y2]);
    }
    acc=segEnd;
  }
  return pts;
}

// Draw an arrow as a continuous polyline through a list of world-space points,
// with a triangular head at the end pointing in the direction of the last segment.
// Used for both static rendering and animation (via getPathSegment clipping).
function drawArrowPolyline(pts,sz,col,alpha){
  if(pts.length<2)return;
  // Thin lines scaled to cell size. Min 2px keeps lines visible at tiny cells.
  // Per competitor reference screenshots (Arrow Jam Go, Arrows Escape):
  // arrows visually fill ~25-30% of cell width so adjacent snakes form
  // contiguous-looking maze walls. Bumped .14 → .28.
  const thick=max(2.5,sz*.25);
  const headL=sz*.40,headW=sz*.34;

  X.save();
  X.globalAlpha=alpha==null?1:alpha;

  // Resolve skin paint along the arrow's tail→head span (gradient skins flow
  // from the first point to the head). Plain-colour cols pass through.
  const paint=_resolvePaint(col,X,pts[0][0],pts[0][1],pts[pts.length-1][0],pts[pts.length-1][1]);

  // Determine head direction from last body segment
  const last=pts[pts.length-1],prev=pts[pts.length-2];
  const hdx=last[0]-prev[0],hdy=last[1]-prev[1];
  const hlen=sqrt(hdx*hdx+hdy*hdy)||1;
  const nx=hdx/hlen,ny=hdy/hlen;

  // Pull line endpoint back by headL so triangle covers the line end cleanly
  const modPts=pts.slice();
  const k=min(1,headL/hlen);
  modPts[modPts.length-1]=[last[0]-nx*hlen*k,last[1]-ny*hlen*k];

  // Line body: thick stroke with ARC'd corners. lineJoin='round' alone
  // only gives a tiny radius (≈ stroke width / 2) so 90° turns still
  // read as sharp. arcTo at every interior vertex replaces each corner
  // with a real curve of `cornerR` radius — the path reads like a
  // soft pipe winding through cells, not a stair-step.
  // Optional per-skin render STYLE (carried on the paint function). The body
  // path is always built the same way (arcTo rounded corners → clean turns);
  // the style only changes how it's painted, so corners never break.
  const style=(typeof col==='function'&&col._style)||'solid';
  const cornerR=sz*0.10;
  X.lineCap='round';
  X.lineJoin='round';
  const bodyPath=()=>{
    X.beginPath();
    X.moveTo(modPts[0][0],modPts[0][1]);
    if(modPts.length<3){
      for(let i=1;i<modPts.length;i++)X.lineTo(modPts[i][0],modPts[i][1]);
    }else{
      for(let i=1;i<modPts.length-1;i++){
        X.arcTo(modPts[i][0],modPts[i][1],modPts[i+1][0],modPts[i+1][1],cornerR);
      }
      X.lineTo(modPts[modPts.length-1][0],modPts[modPts.length-1][1]);
    }
  };
  const pxv=-ny,pyv=nx;
  const tipX=last[0],tipY=last[1];
  const baseX=tipX-nx*headL,baseY=tipY-ny*headL;
  const headPath=(scale)=>{
    const hw=headW*(scale||1), hl=headL*(scale||1);
    const bx=tipX-nx*hl, by=tipY-ny*hl;
    X.beginPath();
    X.moveTo(tipX,tipY);
    X.lineTo(bx+pxv*hw,by+pyv*hw);
    X.lineTo(bx-pxv*hw,by-pyv*hw);
    X.closePath();
  };

  if(style==='glow'){
    // Neon tube: a soft colour halo (several low-alpha layers, wide→narrow, for
    // a smooth falloff — no shadowBlur, which is the iOS perf cliff), then the
    // coloured body, then a white-hot core line. Reads like a glowing neon sign.
    X.save();
    X.strokeStyle=paint;
    const halo=[[2.2,0.10],[1.8,0.15],[1.5,0.24],[1.25,0.36]];
    for(let q=0;q<halo.length;q++){X.globalAlpha=halo[q][1];X.lineWidth=thick*halo[q][0];bodyPath();X.stroke();}
    X.globalAlpha=0.28;X.fillStyle=paint;headPath(1.55);X.fill();
    X.restore();
    // Coloured body + head
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.fillStyle=paint;headPath(1);X.fill();
    // White-hot core
    X.save();X.globalAlpha=0.92;X.strokeStyle='#ecfdff';X.lineWidth=max(1.5,thick*0.32);bodyPath();X.stroke();X.restore();
  }else if(style==='outline'){
    // Line-art: stroke the body, then carve the centre with the bg colour to
    // leave a hollow outline; head is an outlined triangle.
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.strokeStyle=TH.bg;X.lineWidth=max(1,thick-max(3.5,thick*0.46));bodyPath();X.stroke();
    X.strokeStyle=paint;X.lineWidth=max(2,thick*0.42);X.lineJoin='round';headPath(1);X.stroke();
  }else if(style==='bevel'){
    // 3D: flat body + a light top-left highlight and dark bottom-right shadow
    // edge for volume.
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.fillStyle=paint;headPath(1);X.fill();
    const off=max(1,thick*0.16);
    X.save();X.globalAlpha=0.40;X.strokeStyle='#ffffff';X.lineWidth=max(1.5,thick*0.20);
    X.translate(-off,-off);bodyPath();X.stroke();X.restore();
    X.save();X.globalAlpha=0.30;X.strokeStyle='#000000';X.lineWidth=max(1.5,thick*0.20);
    X.translate(off,off);bodyPath();X.stroke();X.restore();
  }else{
    X.strokeStyle=paint;X.lineWidth=thick;bodyPath();X.stroke();
    X.fillStyle=paint;headPath(1);X.fill();
  }

  X.globalAlpha=1;
  X.restore();
}

// Draw a static arrow (used in the grid) — full path from tail to head.
// Single-cell arrows synthesize a short tail behind the head so the arrowhead
// has something to sit on.
function drawArrowStatic(arrow,cs,gx,gy,col,alpha,shakeOff){
  const pts=[];
  for(const[r,c] of arrow.cells){
    let x=gx+c*cs+cs/2,y=gy+r*cs+cs/2;
    if(shakeOff){x+=shakeOff}
    pts.push([x,y]);
  }
  if(pts.length===1){
    const bd=(arrow.dir+2)%4;
    const h=pts[0];
    pts.unshift([h[0]+DX[bd]*cs*.38,h[1]+DY[bd]*cs*.38]);
  }
  drawArrowPolyline(pts,cs,col,alpha);
}

// Check if this button is currently being pressed (scale feedback)
function btnPressScale(x,y,w,h){
  if(!lastClick)return 1;
  const dt=gt-lastClick.t;
  if(dt>.18)return 1;
  if(abs(lastClick.x-x)>w/2||abs(lastClick.y-y)>h/2)return 1;
  // Ease-out over 0.18s: scale dips to 0.95 then back to 1.0
  const p=dt/.18;
  const dip=sin(p*PI);
  return 1-dip*.05;
}

// Background with soft gradient + colored light blobs. Cached to an offscreen
// canvas so we don't recreate 4 gradient objects per frame (was the main lag
// source — gradient allocation on iOS WebKit is expensive).
let _bgCache=null,_bgCacheDark=null;
// Two background variants:
//   • atmospheric — gradient + 3 colored blobs. Used on the MENU only,
//     gives the title a hero feel.
//   • plain — pure vertical gradient, no blobs. Used everywhere else
//     (Settings, Play, Levels, Complete, GameOver). Without this, the
//     blob glows pushed past card edges and made surfaces look "leaky"
//     — user explicitly flagged this on Settings.
let _bgCachePlain=null;
function _renderBg(dark, withBlobs){
  const cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  if(!x)return null;
  const bg=x.createLinearGradient(0,0,0,H);
  // Sunset Macaron gradient stops — peach cream → warm sand for light;
  // deep aubergine → richer aubergine for dark. Both stay warm-family
  // (no cold blue anywhere) so the in-game atmosphere reads as cosy
  // sunset rather than midnight cyber.
  if(dark){bg.addColorStop(0,'#4a3a37');bg.addColorStop(1,'#3a2c2a');}
  else{bg.addColorStop(0,'#fef4e6');bg.addColorStop(1,'#f0dec5');}
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  if(withBlobs){
    x.save();
    x.globalAlpha=dark?.35:.22;
    // Atmospheric blobs — all warm family. Coral, dusty amber, soft
    // pink. Dropped the previous cold-blue '#5a7aaa' which clashed
    // with the new Macaron palette.
    const b1=x.createRadialGradient(W*.85,H*.12,0,W*.85,H*.12,W*.7);
    b1.addColorStop(0, dark?'#e0a080':'#e8b896');b1.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=b1;x.fillRect(0,0,W,H);
    const b2=x.createRadialGradient(W*.1,H*.85,0,W*.1,H*.85,W*.8);
    b2.addColorStop(0, dark?'#c47863':'#e8a890');b2.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=b2;x.fillRect(0,0,W,H);
    const b3=x.createRadialGradient(W*.7,H*.55,0,W*.7,H*.55,W*.55);
    b3.addColorStop(0, dark?'#a66875':'#f0c8b8');b3.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=b3;x.fillRect(0,0,W,H);
    x.restore();
  }
  return cv;
}
function drawBg(plain){
  if(_bgCacheDirty||_bgCacheDark!==darkMode){
    _bgCache=_renderBg(darkMode,true);
    _bgCachePlain=_renderBg(darkMode,false);
    _bgCacheDark=darkMode;
    _bgCacheDirty=false;
  }
  const cache=plain?_bgCachePlain:_bgCache;
  if(cache){X.drawImage(cache,0,0,W,H);}
  else{X.fillStyle=darkMode?'#3a2c2a':'#f9e9d8';X.fillRect(0,0,W,H);}
}

// iOS 26 "Liquid Glass" overlay. Tuned separately for light & dark themes.
// Cached per (w, h, r, dark) — buttons of the same size share the same render,
// blitted via drawImage. This is the single biggest win for the menu screen
// where 6+ same-sized buttons are drawn 60×/sec. Cache is invalidated when
// theme toggles. Cache size is bounded by the small set of distinct sizes.
function _renderGlass(w,h,r,dark){
  const cv=document.createElement('canvas');
  cv.width=Math.ceil(w);cv.height=Math.ceil(h);
  const x=cv.getContext('2d');
  if(!x)return null;
  const rr=max(0,r-.5);
  x.save();
  x.beginPath();x.roundRect(0,0,w,h,r);x.clip();
  x.fillStyle=dark?'rgba(255,255,255,.18)':'rgba(255,255,255,.22)';
  x.fillRect(0,0,w,h);
  const g1=x.createLinearGradient(0,0,0,h*.5);
  g1.addColorStop(0,'rgba(255,255,255,'+(dark?'.95':'1')+')');
  g1.addColorStop(.35,'rgba(255,255,255,.25)');
  g1.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g1;x.fillRect(0,0,w,h*.5);
  const g2=x.createLinearGradient(0,h*.4,0,h);
  g2.addColorStop(0,'rgba(0,0,0,0)');
  g2.addColorStop(1,'rgba(0,0,0,'+(dark?'.4':'.11')+')');
  x.fillStyle=g2;x.fillRect(0,h*.4,w,h*.6);
  const g3=x.createLinearGradient(0,h*.78,0,h);
  g3.addColorStop(0,'rgba(255,255,255,0)');
  g3.addColorStop(1,'rgba(255,255,255,'+(dark?'.55':'.65')+')');
  x.fillStyle=g3;x.fillRect(0,h*.78,w,h*.22);
  x.restore();
  x.save();
  x.beginPath();x.rect(0,0,w,h*.5);x.clip();
  x.beginPath();x.roundRect(.75,.75,w-1.5,h-1.5,max(0,r-.75));
  x.strokeStyle='rgba(255,255,255,1)';x.lineWidth=1.5;x.stroke();
  x.restore();
  x.save();
  x.beginPath();x.rect(0,h*.6,w,h*.4);x.clip();
  x.beginPath();x.roundRect(.5,.5,w-1,h-1,rr);
  x.strokeStyle='rgba(255,255,255,'+(dark?'.7':'.8')+')';x.lineWidth=1;x.stroke();
  x.restore();
  return cv;
}
// True when a modal/overlay is on top — buttons under must NOT consume the
// tap (the overlay needs it). Also disables their hover state for clarity.
function _inputBlocked(){return langPickerOpen}

// Shared button rendering. v2.4: dropped the saturated 2-px coloured
// border — on dark mode the gold border against a nearly-black surface
// read as "chocolate brown" exactly like the old tinted fill it
// replaced. Now buttons are pure clean cards: solid neutral fill, a
// hairline neutral border, and the accent colour only appears as the
// label text on coloured-button variants. Reads as iOS "filled" or
// "tinted" button instead of a contrasty rectangle.
function _drawPillBtn(label,x,y,w,h,color,fontFrac){
  const blocked=_inputBlocked();
  const hv=!blocked&&abs(mx-x)<w/2&&abs(my-y)<h/2;
  const sc=btnPressScale(x,y,w,h);
  const dw=w*sc,dh=h*sc;
  const r=dh/2;
  const c=color||TH.accent;
  // Solid neutral fill — same on every button, regardless of `color`.
  X.fillStyle=hv?TH.btnHover:TH.btnBg;
  X.beginPath();X.roundRect(x-dw/2,y-dh/2,dw,dh,r);X.fill();
  // Hairline neutral border for definition. No coloured stroke.
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(x-dw/2,y-dh/2,dw,dh,r);X.stroke();
  // Tap ripple — subtle expanding ring from the click point during the
  // first 280 ms after a tap. Uses lastClick (set in the touch/mouse
  // handlers). Cost is one stroked ellipse per pressed button per
  // frame; only paints during the brief animation window.
  if(lastClick&&!reducedMotion){
    const dt2=gt-lastClick.t;
    if(dt2<.28&&abs(lastClick.x-x)<w/2&&abs(lastClick.y-y)<h/2){
      const p=dt2/.28;
      X.save();
      X.beginPath();X.roundRect(x-dw/2,y-dh/2,dw,dh,r);X.clip();
      X.strokeStyle=c;
      X.globalAlpha=(1-p)*.55;
      X.lineWidth=2;
      X.beginPath();
      X.arc(lastClick.x,lastClick.y,p*max(w,h)*.9,0,TAU);
      X.stroke();
      X.restore();
    }
  }
  // Label takes the button colour. Default colour (TH.accent) renders
  // as the text token on neutral buttons, so PLAY/etc. stay readable.
  const labelCol = (c === TH.accent) ? TH.text : c;
  txt(label,x,y,floor(h*fontFrac),labelCol);
  if(!blocked&&tapped&&abs(tapX-x)<w/2&&abs(tapY-y)<h/2){sfx.tap();tapped=false;return true}
  return false;
}
function drawBtn(label,x,y,w,h,color){
  return _drawPillBtn(label,x,y,w,h,color,0.38);
}
function drawBigBtn(label,x,y,w,h,color){
  const r=_drawPillBtn(label,x,y,w,h,color,0.40);
  if(r)haptic(5);
  return r;
}

// Filled play-triangle icon (▶ replacement) — matches arrowsgo's look:
// a small solid triangle with rounded points sitting flush with the label.
function drawPlayIcon(x,y,sz,col){
  X.save();
  X.translate(x,y);
  X.fillStyle=col||TH.btnText;
  X.lineJoin='round';X.lineWidth=sz*.18;X.strokeStyle=X.fillStyle;
  X.beginPath();
  X.moveTo(-sz*.4,-sz*.55);
  X.lineTo(sz*.55,0);
  X.lineTo(-sz*.4,sz*.55);
  X.closePath();
  X.fill();X.stroke();
  X.restore();
}

function drawStar(x,y,sz,filled){
  X.save();X.translate(x,y);
  X.beginPath();
  for(let i=0;i<5;i++){
    const a1=i*TAU/5-PI/2,a2=a1+TAU/10;
    X.lineTo(cos(a1)*sz,sin(a1)*sz);
    X.lineTo(cos(a2)*sz*.4,sin(a2)*sz*.4);
  }
  X.closePath();
  if(filled){X.fillStyle=TH.star;X.fill()}
  else{X.strokeStyle=TH.star+'40';X.lineWidth=1;X.stroke()}
  X.restore();
}

// Render a heart icon for the lives indicator (top bar) and the broken-
// heart hero on Game Over. The shape is a single bezier path tuned so the
// two top lobes are visibly rounded, the valley between them is shallow
// (not a sharp V) and the bottom narrows to a point. Designed inside a
// 14×14 unit box centered on (x,y) — pass `sz` to scale.
//   full = true  → solid red fill + soft top-left highlight
//   full = false → empty pill (light fill, subtle outline) for "lost life"
//   broken = true → adds a zigzag crack down the middle (Game Over screen)
function drawHeart(x,y,sz,full,broken){
  X.save();
  X.translate(x,y);
  const s=sz/14;
  if(s!==1)X.scale(s,s);

  // Broken heart = two halves drawn separately, each rotated outward a
  // few degrees and meeting at a zigzag fracture line. Looks like 💔
  // (two real pieces) instead of a whole heart with a stripe on top.
  if(broken&&full){
    // Left half — tilted counter-clockwise, shifted slightly left/down.
    X.save();
    X.translate(-0.6,0.4);
    X.rotate(-0.11);
    X.beginPath();
    X.moveTo(0,10);
    X.lineTo(-0.7,8);
    X.lineTo(0.5,6);
    X.lineTo(-0.7,4);
    X.lineTo(0.5,2);
    X.lineTo(-0.7,0);
    X.lineTo(0,-2);
    X.bezierCurveTo(-2,-7,-8,-7,-8,-2);
    X.bezierCurveTo(-8,3,-4,6,0,10);
    X.closePath();
    X.fillStyle='#e05555';
    X.fill();
    // Highlight on the left lobe stays — half is still "polished".
    X.fillStyle='rgba(255,255,255,.32)';
    X.beginPath();
    X.ellipse(-3.6,-3.6,1.9,1.4,-0.5,0,TAU);
    X.fill();
    X.restore();
    // Right half — mirror, tilted clockwise.
    X.save();
    X.translate(0.6,0.4);
    X.rotate(0.11);
    X.beginPath();
    X.moveTo(0,10);
    X.lineTo(0.7,8);
    X.lineTo(-0.5,6);
    X.lineTo(0.7,4);
    X.lineTo(-0.5,2);
    X.lineTo(0.7,0);
    X.lineTo(0,-2);
    X.bezierCurveTo(2,-7,8,-7,8,-2);
    X.bezierCurveTo(8,3,4,6,0,10);
    X.closePath();
    X.fillStyle='#d04444'; // ever-so-slightly darker so you SEE two halves
    X.fill();
    X.restore();
    X.restore();
    return;
  }

  // Whole heart: single closed bezier — two lobes joining at a top valley,
  // narrowing to a point at the bottom. 14-unit coordinate box.
  X.beginPath();
  X.moveTo(0,-2);
  X.bezierCurveTo(-2,-7,-8,-7,-8,-2);
  X.bezierCurveTo(-8,3,-4,6,0,10);
  X.bezierCurveTo(4,6,8,3,8,-2);
  X.bezierCurveTo(8,-7,2,-7,0,-2);
  X.closePath();
  if(full){
    X.fillStyle='#e05555';
    X.fill();
    X.fillStyle='rgba(255,255,255,.32)';
    X.beginPath();
    X.ellipse(-3.6,-3.6,1.9,1.4,-0.5,0,TAU);
    X.fill();
  }else{
    X.fillStyle=darkMode?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)';
    X.fill();
    X.strokeStyle=darkMode?'rgba(255,255,255,.28)':'rgba(0,0,0,.22)';
    X.lineWidth=1.4/s;
    X.stroke();
  }
  X.restore();
}

// Render a proper-looking coin: yellow disk + dark inner ring + highlight shine
function drawCoin(x,y,r){
  // Outer shadow for depth
  X.fillStyle=darkMode?'rgba(0,0,0,.35)':'rgba(80,55,0,.25)';
  X.beginPath();X.arc(x+r*.12,y+r*.15,r,0,TAU);X.fill();
  // Main disk
  X.fillStyle=TH.star;
  X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
  // Inner ring
  X.strokeStyle=darkMode?'rgba(0,0,0,.45)':'rgba(120,85,0,.55)';
  X.lineWidth=max(.8,r*.18);
  X.beginPath();X.arc(x,y,r*.68,0,TAU);X.stroke();
  // Top-left highlight for coin shine
  X.fillStyle='rgba(255,255,255,.55)';
  X.beginPath();X.arc(x-r*.32,y-r*.32,r*.24,0,TAU);X.fill();
}

// Lightbulb icon — clean Heroicons-style outline. Filled bulb body
// with a small rectangular base; matches the visual weight of the
// drawHeart glyph next to it (same fill-with-tiny-stroke approach).
// Pass `sz` = nominal size of the heart it sits next to; the bulb
// uses sz as its overall glyph height.

// Hamburger / pause-menu glyph — three horizontal bars, rounded ends.
// Replaces the unicode "≡" which fell back to a different font on
// some Androids and showed at inconsistent weights between devices.
function drawHamburger(x, y, sz, col){
  X.save();
  X.strokeStyle = col;
  X.lineWidth = max(1.6, sz * 0.18);
  X.lineCap = 'round';
  const w = sz * 1.0;
  const dy = sz * 0.36;
  X.beginPath();
  X.moveTo(x - w/2, y - dy); X.lineTo(x + w/2, y - dy);
  X.moveTo(x - w/2, y);      X.lineTo(x + w/2, y);
  X.moveTo(x - w/2, y + dy); X.lineTo(x + w/2, y + dy);
  X.stroke();
  X.restore();
}

function drawLightbulb(x, y, sz, col){
  X.save();
  X.fillStyle=col;
  X.strokeStyle=col;
  X.lineWidth=max(1.2, sz*.10);
  X.lineCap='round';
  X.lineJoin='round';
  // Bulb body — a teardrop-ish round shape sitting above the base.
  // Drawn as a filled circle with a flat bottom, then a trapezoidal
  // neck connects to the base.
  const bulbR = sz*.55;
  const bulbCY = y - sz*.20;
  X.beginPath();
  X.arc(x, bulbCY, bulbR, 0, TAU);
  X.fill();
  // Neck connecting bulb to base
  X.beginPath();
  X.moveTo(x - sz*.25, bulbCY + bulbR*.85);
  X.lineTo(x - sz*.20, y + sz*.30);
  X.lineTo(x + sz*.20, y + sz*.30);
  X.lineTo(x + sz*.25, bulbCY + bulbR*.85);
  X.closePath();
  X.fill();
  // Base — small rectangular screw cap
  X.beginPath();
  X.roundRect(x - sz*.22, y + sz*.30, sz*.44, sz*.20, sz*.06);
  X.fill();
  // Filament — a soft inner highlight "smile" on the bulb
  X.strokeStyle=darkMode?'rgba(0,0,0,.30)':'rgba(255,255,255,.55)';
  X.lineWidth=max(.8, sz*.10);
  X.beginPath();
  X.arc(x, bulbCY + bulbR*.10, bulbR*.50, PI*.20, PI*.80, false);
  X.stroke();
  X.restore();
}

// ================================================================
//  SCREENS
// ================================================================

// --- MENU ---
function drawMenu(){
  drawBg();

  // Animated background: many arrows drifting across the screen.
  // Skipped entirely when reducedMotion is on (decorative-only motion).
  if(!reducedMotion){
  if(!window._bgArrows){
    window._bgArrows=[];
    // v2: dimmer + fewer + slower. The previous 14 arrows at .08-.18
    // alpha read as "look at me, decoration!" — user wanted them to be
    // barely-perceptible texture, not a layer competing with the title.
    // Dropped count 14 -> 8, alpha 0.08-0.18 -> 0.03-0.07, speed
    // 12-35 -> 6-18 px/s.
    for(let i=0;i<8;i++)window._bgArrows.push({
      x:rnd(0,W),y:rnd(0,H),dir:rndI(0,3),sz:rnd(28,52),
      spd:rnd(6,18),life:rnd(0,1),dur:rnd(8,14),alpha:rnd(.03,.07)
    });
  }
  for(const a of window._bgArrows){
    a.life+=dt/a.dur;
    a.x+=DX[a.dir]*a.spd*dt;
    a.y+=DY[a.dir]*a.spd*dt;
    // Fade in first 20%, full middle, fade out last 20%
    const lp=a.life%1;
    const fade=lp<.2?lp/.2:(lp>.8?(1-lp)/.2:1);
    X.globalAlpha=a.alpha*fade;
    drawArrow(a.x,a.y,a.dir,a.sz,TH.arrow,a.alpha*fade);
    X.globalAlpha=1;
    // Reset when lifecycle ends or goes off screen
    if(a.life>=1||a.x<-60||a.x>W+60||a.y<-60||a.y>H+60){
      a.x=rnd(40,W-40);a.y=rnd(40,H-40);
      a.dir=rndI(0,3);a.sz=rnd(25,55);a.spd=rnd(12,35);
      a.life=0;a.dur=rnd(4,8);a.alpha=rnd(.08,.18);
    }
  }
  } // end !reducedMotion bg arrows

  // Title — moved further down (clear of dynamic island + breathing room
  // for the heavier stats panel below). v2: ARROWS line gets a slow gold→
  // deepGold→gold gradient flow (cycle TH.motionTitleCycle ms). Reduced-
  // motion players see the static accent. The phase is a function of gt
  // (game-clock seconds) so the gradient is in lockstep across re-renders.
  txtP(t('title1'),W/2,H*.16,36,TH.text);
  if (reducedMotion) {
    txtP(t('title2'),W/2,H*.22,36,TH.accent);
  } else {
    const phase = (gt * 1000 / TH.motionTitleCycle) % 1;
    // Smooth lerp between accent and accentDeep using a triangular wave so
    // the start and end of the cycle match (no visible "snap").
    const tri = Math.abs(phase * 2 - 1);
    const grad = X.createLinearGradient(W/2 - 80, 0, W/2 + 80, 0);
    grad.addColorStop(0, TH.accent);
    grad.addColorStop(0.5, tri < 0.5 ? TH.accentDeep : TH.accent);
    grad.addColorStop(1, TH.accent);
    txtP(t('title2'),W/2,H*.22,36,grad);
  }
  txt(t('tagline'),W/2,H*.265,12,TH.textSec);

  // Stats panel
  const spY=H*.33,spW=300,spH=66;
  X.fillStyle=TH.cardBg;
  X.beginPath();X.roundRect(W/2-spW/2,spY-spH/2,spW,spH,14);X.fill();
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(W/2-spW/2,spY-spH/2,spW,spH,14);X.stroke();
  const col1=W/2-spW/2+spW*.125,col2=W/2-spW/2+spW*.375,col3=W/2-spW/2+spW*.625,col4=W/2-spW/2+spW*.875;
  txtP(t('level'),col1,spY-13,8,TH.textSec);
  txtP(maxLevel+'',col1,spY+9,17,TH.text);
  txtP(t('stars'),col2,spY-13,8,TH.textSec);
  txtP(totalStars+'',col2,spY+9,17,TH.star);
  txtP(t('streak'),col3,spY-13,8,TH.textSec);
  txtP(streakDays+'d',col3,spY+9,17,TH.warning);
  txtP(t('trophy'),col4,spY-13,8,TH.textSec);
  txtP(achUnlockedCount()+'/'+ACHIEVEMENTS.length,col4,spY+9,13,TH.accent);

  // PLAY hero button — bigger than the secondary grid below, gold-tinted
  // fill (only place the accent colour appears as a SURFACE in the app),
  // with the play-triangle glyph and a subtle breathing pulse so it
  // visually invites the tap. Other buttons stay neutral; this is the
  // first thing the player sees and the primary action.
  {
    const bx=W/2, by=H*.58, bw=240, bh=64;
    const blocked=_inputBlocked();
    const hv=!blocked&&abs(mx-bx)<bw/2&&abs(my-by)<bh/2;
    const sc=btnPressScale(bx,by,bw,bh);
    const dw=bw*sc, dh=bh*sc;
    const r=dh/2;
    // Soft breathing tint — alpha drifts 0.92↔1.0 every 2.4 s. Skipped
    // when reducedMotion is on.
    const pulse = reducedMotion ? 1 : (.96 + .04 * sin(gt * 2.6));
    X.save();
    X.globalAlpha = pulse;
    // Gold-tinted fill that survives in dark mode (raised alpha so it
    // reads as "primary action" instead of muddy chocolate).
    X.fillStyle = hv ? TH.accent + 'E5' : TH.accent + 'CC';
    X.beginPath(); X.roundRect(bx-dw/2, by-dh/2, dw, dh, r); X.fill();
    // Hairline darker rim for definition
    X.strokeStyle = darkMode ? 'rgba(0,0,0,.30)' : 'rgba(0,0,0,.22)';
    X.lineWidth = 1.5;
    X.beginPath(); X.roundRect(bx-dw/2, by-dh/2, dw, dh, r); X.stroke();
    // Label — high-contrast text reads against the gold fill in both themes
    const labelCol = darkMode ? '#1a1a1a' : '#1a1a1a';
    txtP(t('play'), bx - 14, by, 26, labelCol);
    // Play-triangle glyph just to the right of the label
    drawPlayIcon(bx + bw*.30, by, 12, labelCol);
    X.restore();
    if (!blocked && tapped && abs(tapX-bx)<bw/2 && abs(tapY-by)<bh/2) {
      sfx.tap(); haptic(8); tapped = false;
      goto('play',()=>{isDaily=false;isWeekly=false;level=maxLevel;generateLevel(level)});
    }
  }

  // 2×2 grid of secondary buttons + achievements row
  const bW=138,bH=42,bGapX=16,bGapY=12;
  const gX=W/2,gY1=H*.70,gY2=gY1+bH+bGapY;
  // Row 1
  if(drawBtn(t('levels'),gX-bW/2-bGapX/2,gY1,bW,bH)){
    goto('levels',()=>{levelsPage=floor((level-1)/25)});
  }
  const dailyDone=isDailyDone();
  if(drawBtn(dailyDone?t('daily')+' ★':t('daily'),gX+bW/2+bGapX/2,gY1,bW,bH)){
    goto('play',()=>{isDaily=true;isWeekly=false;dailySeed=getDailySeed();generateLevel(40,dailySeed*31+7)});
    // Daily difficulty pinned at level 40 (medium) so each day is a similar
    // challenge — Wordle/NYT model. Seed varies, complexity stays constant.
  }
  // Row 2
  const weeklyDone=isWeeklyDone();
  if(drawBtn(weeklyDone?t('weekly')+' ★':t('weekly'),gX-bW/2-bGapX/2,gY2,bW,bH,TH.warning)){
    goto('play',()=>{isWeekly=true;isDaily=false;const ws=getWeeklySeed();generateLevel(120,ws*131+71)});
    // Weekly difficulty pinned at level 120 (hard) — bigger reward + bigger maze
  }
  if(drawBtn(t('stats'),gX+bW/2+bGapX/2,gY2,bW,bH)){goto('stats')}
  // Wide achievements button
  if(drawBtn(t('achievements')+' ('+achUnlockedCount()+'/'+ACHIEVEMENTS.length+')',W/2,gY2+bH+bGapY+8,bW*2+bGapX,bH)){
    goto('achievements',()=>{achPage=0});
  }

  // Settings gear top-right — y is safe-area-aware so it adapts to any
  // future iPhone with a larger notch / Dynamic Island inset.
  const gx=W-36,gy=Math.max(54,safeTop+18);
  const ghv=abs(mx-gx)<20&&abs(my-gy)<20;
  X.strokeStyle=ghv?TH.text:TH.textSec;X.lineWidth=1.5;
  X.beginPath();X.arc(gx,gy,10,0,TAU);X.stroke();
  X.fillStyle=ghv?TH.text:TH.textSec;
  X.beginPath();X.arc(gx,gy,3,0,TAU);X.fill();
  // Gear teeth
  for(let i=0;i<6;i++){const a=i*TAU/6+gt*.5;
    X.beginPath();X.arc(gx+cos(a)*10,gy+sin(a)*10,2,0,TAU);X.fill()}
  if(tapped&&abs(tapX-gx)<20&&abs(tapY-gy)<20){sfx.tap();tapped=false;goto('settings')}

  // Coins — nudged slightly below the gear for better visual balance.
  // The whole coin chip is a tappable entry to the Skins shop (tap-your-coins
  // -to-spend idiom); a small chevron hints it's interactive.
  const _topY=Math.max(55,safeTop+19);
  const _coinHv=mx>=20&&mx<=104&&abs(my-_topY)<16;
  drawCoin(36,_topY,7);
  txt(coins+'',52,_topY,13,TH.star,'left');
  _drawChevron(94,_topY,5,_coinHv?TH.accent:TH.textDim,'right');
  if(tapped&&mx>=20&&mx<=104&&abs(tapY-_topY)<16&&tapX>=20&&tapX<=104){
    sfx.tap();tapped=false;goto('skins');
  }

  // "Update available" nudge — when checkForUpdate() finds a newer App
  // Store version. v2 redesign: previously a quiet 28-px pill at the
  // bottom in 11-px text — players didn't notice it and many ran weeks
  // behind. New banner sits prominently UNDER the title, pulses softly,
  // and uses the warning colour token so it reads as "act on me, not
  // ignore me". Tap → opens the App Store directly.
  if(availableUpdate){
    const bY=H*.295,bW=300,bH=46;
    const hv=abs(mx-W/2)<bW/2&&abs(my-bY)<bH/2;
    // Slow breathing pulse: alpha drifts between 0.85 and 1.0 every 1.8 s.
    const pulse=.92+.08*sin(gt*3.5);
    X.save();
    X.globalAlpha=pulse;
    // Solid, saturated fill — warning amber on cream, gold on navy.
    // Stronger than the regular menu buttons so the eye lands here first.
    X.fillStyle=hv?TH.warning+'55':TH.warning+'40';
    X.beginPath();X.roundRect(W/2-bW/2,bY-bH/2,bW,bH,bH/2);X.fill();
    X.strokeStyle=TH.warning;X.lineWidth=2;
    X.beginPath();X.roundRect(W/2-bW/2,bY-bH/2,bW,bH,bH/2);X.stroke();
    // Up-pointing chevron + label. drawChevron is canvas-stroked so it
    // matches the rest of the glyph family rather than depending on a
    // unicode arrow that font fallback can render inconsistently.
    _drawChevron(W/2-bW*.40, bY, 9, TH.warning, 'up');
    txtP(t('updateAvailable')+'  v'+availableUpdate,W/2+bW*.04,bY,14,TH.text,'center');
    X.restore();
    if(tapped&&abs(tapX-W/2)<bW/2&&abs(tapY-bY)<bH/2){
      sfx.tap();haptic(8);openAppStore();tapped=false;
    }
  }

  txt(APP_VERSION,W/2,H*.96,10,TH.textDim);
}

// --- PLAY ---
function drawPlay(){
  drawBg(true);

  const cs=getCellSize(),gx=getGridX(),gy=getGridY();

  // Top app bar — y derives from device safe-area inset so the row sits
  // just below status bar / Dynamic Island on any iPhone (and Android too).
  // Floor at 65 so non-notched devices still get reasonable padding.
  const TOP_Y=Math.max(65,safeTop+25);

  // Pause/menu button (top-left). Same 44×36 pill but icon is now
  // canvas-drawn so it stays consistent across iOS / Android font
  // fallback differences (the previous unicode "≡" rendered at
  // different weights on different Androids).
  const phv=abs(mx-32)<24&&abs(my-TOP_Y)<24;
  X.fillStyle=phv?TH.btnHover:TH.btnBg;
  X.beginPath();X.roundRect(32-22,TOP_Y-18,44,36,18);X.fill();
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(32-22,TOP_Y-18,44,36,18);X.stroke();
  drawHamburger(32,TOP_Y,9,phv?TH.text:TH.textSec);
  if(tapped&&abs(tapX-32)<24&&abs(tapY-TOP_Y)<24){sfx.tap();tapped=false;goto('menu',()=>{isDaily=false;isWeekly=false});return}

  // Level title — bigger weight + slight letter-spacing for "Level N"
  // pill feel. Was 16 px regular which read as a placeholder; now 20 px
  // bold matches the hearts visually and looks deliberate. Stars below
  // bumped 7 -> 9 px and centred row width 60 -> 80 px so they
  // breathe instead of clumping into a single yellow dot at distance.
  txtP('LEVEL '+level,W/2,TOP_Y,20,TH.text);
  for(let i=0;i<3;i++){
    drawStar(W/2-26+i*26,TOP_Y+24,9,moves<=minMoves+i*1&&i<(moves<=minMoves?3:moves<=minMoves+2?2:1));
  }

  // Hearts = lives (top-right, vertically centered with menu button)
  for(let i=0;i<3;i++){
    drawHeart(W-26-i*24,TOP_Y,14,i<undosLeft,false);
  }

  // Hint glyph — same visual weight as a heart (no pill, no border),
  // sitting on the row beneath the hearts. Reads as part of the same
  // icon family rather than a competing button. Tap area is invisible
  // but the same 44×32 rect for finger comfort. Disabled state just
  // dims to textDim.
  {
    const hbX = W - 50, hbY = TOP_Y + 30;
    const canHint = coins >= HINT_COST && hintTime <= 0;
    const hv = abs(mx - hbX) < 36 && abs(my - hbY) < 18;
    const sc = btnPressScale(hbX, hbY, 60, 32);
    X.save();
    X.translate(hbX, hbY);
    X.scale(sc, sc);
    X.translate(-hbX, -hbY);
    const col = canHint ? (hv ? TH.text : TH.star) : TH.textDim;
    drawLightbulb(hbX - 22, hbY, 14, col);
    drawCoin(hbX - 2, hbY, 6);
    txtP(HINT_COST + '', hbX + 8, hbY, 12, canHint ? TH.star : TH.textDim, 'left');
    X.restore();
    if (tapped && abs(tapX - hbX) < 36 && abs(tapY - hbY) < 18) {
      if (canHint) useHint();
      tapped = false;
    }
  }

  // Advance level reveal animation (staggered fade-in of all arrows)
  if(levelRevealT<1)levelRevealT=min(1,levelRevealT+dt/.9);

  // Intro zoom: lerp zoomLevel from the wide start to the auto-fit target
  // with an easeOutCubic curve. The pull-in lasts _zoomIntroDur seconds.
  if(_zoomIntroT<1){
    _zoomIntroT=min(1,_zoomIntroT+dt/_zoomIntroDur);
    const e=1-Math.pow(1-_zoomIntroT,3);
    zoomLevel=_zoomFrom+(_zoomTarget-_zoomFrom)*e;
  }

  // === ZOOM/PAN BLOCK START ===
  // Wrap grid + arrows + tap detection + flying animations in a save/restore
  // pair so the player's pinch-zoom and pan affect everything that "belongs
  // to the puzzle" but leaves the UI bar (top hearts, hint/skip) untouched.
  // Pivot at grid center so a zoom doesn't throw the grid off-screen; pan
  // freely from there. _screenToWorld() / _clampPan() use the same pivot.
  const _zoomC=_gridCenter();
  X.save();
  X.translate(_zoomC.x+panX,_zoomC.y+panY);
  X.scale(zoomLevel,zoomLevel);
  X.translate(-_zoomC.x,-_zoomC.y);

  // v2.2: Removed the connecting grid lines — they read as "tablet
  // ruler" between the cell crosses and competed with the arrows. The
  // crosses below are now the sole structural cue for the grid; with
  // them at every cell centre the eye reconstructs the lattice without
  // needing the lines.

  // Soft 4-pointed sparkles at every cell centre — the "+" crosses
  // were too geometric (read as engineering tape) so we swap them for
  // a cartoon-sparkle silhouette: 4 outward arms with rounded tips
  // and concave bezier-smoothed valleys between them. The polar shape
  // r(θ) = inner + (outer - inner) * cos(2θ)^4 gives the right
  // "pinched waist between fat petals" look, like a stylised twinkle.
  const _dotR=max(2.4,cs*.10);
  function _drawSparkle(cx,cy,R){
    const inner=R*0.30;
    // 64 segments = smooth enough at any size, still cheap (one path
    // fill, no per-segment stroke cost).
    X.beginPath();
    for(let i=0;i<=64;i++){
      const θ=(i/64)*TAU-PI/2;
      const t=cos(2*θ);                       // -1..1, peaks at cardinals
      const k=t*t*t*t;                        // ^4 → very narrow waists
      const r=inner+(R-inner)*k;              // inner at diagonals, R at arm tips
      const px=cx+cos(θ)*r;
      const py=cy+sin(θ)*r;
      if(i===0)X.moveTo(px,py);
      else X.lineTo(px,py);
    }
    X.closePath();
    X.fill();
  }
  const _hasWave=!!_winWave;
  let _waveP=0,_waveX=0,_waveY=0,_waveSpeed=0;
  if(_hasWave){
    _winWave.t+=dt;
    _waveP=_winWave.t/_winWave.dur;
    _waveX=_winWave.x;_waveY=_winWave.y;
    // Wave front travels far enough to reach screen corners by p=1.
    _waveSpeed=max(W,H)*1.1;
    if(_waveP>=1)_winWave=null;
  }
  // Sparkles on EVERY cell. Empty cells get a fainter fill, occupied
  // get the full alpha (occupied loop below reuses the same helper).
  X.fillStyle=darkMode?'rgba(255,255,255,.10)':'rgba(0,0,0,.09)';
  for(let r=0;r<gridRows;r++){
    for(let c=0;c<gridCols;c++){
      _drawSparkle(gx+c*cs+cs/2,gy+r*cs+cs/2,_dotR*0.65);
    }
  }
  X.fillStyle=darkMode?'rgba(255,255,255,.20)':'rgba(0,0,0,.18)';
  // Occupied-cell dots (slightly stronger than empty cells). On level
  // completion the win wave passes through and turns each dot into a
  // tiny golden DIAMOND for the moment the wave front is on it — feels
  // like sparkles riding a ripple from where the last arrow flew out.
  // Off-wave the dot stays a neutral circle, so the magic moment is
  // strictly the celebration window (1.6 s) and nothing else.
  for(const k of _levelCells){
    const i=k.indexOf(',');
    const r=+k.slice(0,i),c=+k.slice(i+1);
    const cx=gx+c*cs+cs/2,cy=gy+r*cs+cs/2;
    let waveT=0;
    if(_hasWave){
      const dx=cx-_waveX,dy=cy-_waveY;
      const d=Math.sqrt(dx*dx+dy*dy);
      const arriveP=d/_waveSpeed;
      const wlocal=(_waveP-arriveP)/0.22; // window 22% of total dur
      if(wlocal>0&&wlocal<1)waveT=Math.sin(wlocal*PI); // 0..1 bell curve
    }
    if(waveT>0.05){
      // Sparkle phase: occupied-cell sparkle blooms gold and grows
      // 1.4× → 3.0× as the wave passes through. Same silhouette as
      // the rest of the grid, just bigger and saturated — so the
      // celebration reads as "the same dots became magical for a
      // second" rather than swapping in a different shape.
      const sz=_dotR*(1.4+waveT*1.6);
      const alpha=Math.min(1,0.5+waveT*0.6);
      X.save();
      X.globalAlpha=alpha;
      X.fillStyle=TH.star;
      _drawSparkle(cx,cy,sz);
      X.restore();
    } else {
      _drawSparkle(cx,cy,_dotR);
    }
  }

  // Draw all alive arrows as continuous paths through their cells
  for(let i=0;i<arrows.length;i++){
    const a=arrows[i];
    if(!a.alive)continue;

    // Reveal alpha: each arrow fades in with a small offset based on index
    let revealA=1;
    if(levelRevealT<1){
      const perArrowOffset=0.5/max(1,arrows.length);
      const start=i*perArrowOffset;
      revealA=clp((levelRevealT-start)/0.5,0,1);
      if(revealA<=0)continue;
    }

    // Check if shaking (blocked feedback on head cell)
    let shakeOff=0,isShaking=false;
    for(const sh of shakeAnims){
      if(sh.idx===i){
        const p=sh.t/sh.dur;
        shakeOff=sin(p*PI*6)*4*(1-p);
        isShaking=true;
      }
    }

    // Hint highlight: faster, brighter pulse. The previous version was
    // a quiet glow at 50-80% alpha that players said they couldn't even
    // notice on a busy board. We now (a) draw a soft golden cell tint
    // behind every cell of the hinted arrow, (b) add a thicker outer
    // halo via 4 stacked strokes, and (c) speed the cycle up to 1.6 s
    // so the eye is drawn to it. Still no shadowBlur — keeps iOS perf.
    const isHinted=i===hintArrow&&hintTime>0;
    if(isHinted&&!reducedMotion){
      const pulse=.5+.5*sin(gt*4);               // ~1.6 s cycle (was 2.5 s)
      X.save();
      // Cell tint behind the hinted arrow — a soft gold wash that
      // marks WHERE on the board the player should look. Subtle in the
      // trough of the pulse, brightens at the peak.
      X.fillStyle=TH.star;
      X.globalAlpha=(.10+pulse*.18)*revealA;     // 0.10..0.28
      for(const [r,c] of a.cells){
        X.beginPath();
        X.roundRect(gx+c*cs+cs*.08,gy+r*cs+cs*.08,cs*.84,cs*.84,cs*.18);
        X.fill();
      }
      // Halo stack — 3 layers from outer-faint to inner-strong gives
      // the impression of a glow without the cost of shadowBlur.
      X.globalAlpha=(.30+pulse*.20)*revealA;     // 0.30..0.50
      drawArrowStatic(a,cs,gx,gy,TH.star,1,shakeOff);
      X.globalAlpha=(.55+pulse*.30)*revealA;     // 0.55..0.85
      drawArrowStatic(a,cs,gx,gy,TH.star,1,shakeOff);
      X.globalAlpha=(.85+pulse*.15)*revealA;     // 0.85..1.00
      drawArrowStatic(a,cs,gx,gy,TH.star,1,shakeOff);
      X.restore();
    }

    const col=isShaking?TH.arrowBlock:(isHinted?TH.star:arrowColor(a,i));
    drawArrowStatic(a,cs,gx,gy,col,revealA,shakeOff);
  }

  // Tick down hint timer
  if(hintTime>0){hintTime-=dt;if(hintTime<=0)hintArrow=-1}

  // Tutorial — first TUTORIAL_LEVELS regular levels permanently highlight
  // the next solvable arrow until the level is cleared. Combined with the
  // no-penalty wrong-tap handling in tapArrowByIndex(), this gives new
  // players room to learn the "clear path" rule without losing hearts.
  if(isTutorial()&&levelRevealT>=1){
    let tutIdx=-1;
    for(let i=0;i<arrows.length;i++){
      if(arrows[i].alive&&canEscape(i)){tutIdx=i;break}
    }

    if(tutIdx>=0){
      const pulse=.5+.5*sin(gt*4);
      const ta=arrows[tutIdx];
      const head=ta.cells[ta.cells.length-1];
      const hx=gx+head[1]*cs+cs/2,hy=gy+head[0]*cs+cs/2;

      // Pulse via alpha — much cheaper than shadowBlur on iOS WebKit.
      X.save();
      X.globalAlpha=.45+pulse*.4;
      drawArrowStatic(ta,cs,gx,gy,TH.star,1,0);
      X.restore();

      // Short dashed line (5-6 dashes) + small arrowhead at end
      const dir=ta.dir;
      const lineLen=min(cs*2.5,60);
      const endX=hx+DX[dir]*lineLen,endY=hy+DY[dir]*lineLen;
      X.strokeStyle=TH.star;
      X.lineWidth=2;
      X.globalAlpha=.3+pulse*.4;
      X.setLineDash([6,4]);
      X.beginPath();
      X.moveTo(hx+DX[dir]*cs*.5,hy+DY[dir]*cs*.5);
      X.lineTo(endX,endY);
      X.stroke();
      X.setLineDash([]);
      const aLen=8,aW=5;
      X.fillStyle=TH.star;
      X.beginPath();
      X.moveTo(endX+DX[dir]*aLen,endY+DY[dir]*aLen);
      X.lineTo(endX-DY[dir]*aW,endY+DX[dir]*aW);
      X.lineTo(endX+DY[dir]*aW,endY-DX[dir]*aW);
      X.closePath();X.fill();
      X.globalAlpha=1;

      // Finger pointer — animated taps over the suggested arrow's head.
      // 1.4s loop: hover (scale=1) → tap (scale=0.78) → release (scale=1)
      // with a fading ring on the down-stroke. Reads like a real demo without
      // freezing the player out of the game (they can still tap whenever).
      const tapCycle=1.4;
      const tt=(gt%tapCycle)/tapCycle; // 0..1
      // Down-stroke 0..0.25, hold 0.25..0.4, release 0.4..0.55, idle 0.55..1
      let tapScale=1;
      let ringP=-1;
      if(tt<0.25){tapScale=1-(tt/0.25)*0.22;ringP=tt/0.25;}
      else if(tt<0.40){tapScale=0.78;ringP=1;}
      else if(tt<0.55){tapScale=0.78+((tt-0.40)/0.15)*0.22;}
      const fX=hx,fY=hy;
      // Tap ring: expanding circle that fades, only during the press window.
      if(ringP>=0){
        X.save();
        X.globalAlpha=(1-ringP)*0.6;
        X.strokeStyle=TH.star;
        X.lineWidth=2;
        X.beginPath();X.arc(fX,fY,cs*0.4+ringP*cs*0.5,0,TAU);X.stroke();
        X.restore();
      }
      // Pointer body — a soft dark circle (the "fingertip") with a smaller
      // bright dot (the touch point). Offset slightly down-right so it
      // doesn't sit dead-centre on the arrow head it's pointing at.
      X.save();
      X.translate(fX+cs*0.12,fY+cs*0.12);
      X.scale(tapScale,tapScale);
      X.globalAlpha=0.85;
      X.fillStyle=darkMode?'rgba(255,255,255,.92)':'rgba(40,30,20,.85)';
      X.beginPath();X.arc(0,0,cs*0.32,0,TAU);X.fill();
      X.fillStyle=TH.accent;
      X.beginPath();X.arc(0,0,cs*0.18,0,TAU);X.fill();
      X.restore();

      // Text — only at start of level so it doesn't keep nagging.
      if(moves===0){
        txt('Tap this arrow',W/2,TOP_Y+44,14,TH.star,'center','700');
        txt('It has a clear path to the edge',W/2,TOP_Y+62,11,darkMode?'#aaa':'#666');
      }
    }
  }

  // Tap detection — find the alive arrow whose nearest cell center is closest
  // to the tap point (within a generous radius). Tap arrives in screen coords
  // but arrow cells are stored in world coords, so we invert the active
  // zoom/pan transform first via _screenToWorld(). When zoom=1 this is a
  // no-op so non-zoomed gameplay is unaffected.
  if(tapped){
    const w=_screenToWorld(tapX,tapY);
    let bestIdx=-1,bestDist=cs*.85;
    for(let i=0;i<arrows.length;i++){
      const a=arrows[i];
      if(!a.alive)continue;
      for(const[r,c] of a.cells){
        const ax=gx+c*cs+cs/2,ay=gy+r*cs+cs/2;
        const d=sqrt((w.x-ax)*(w.x-ax)+(w.y-ay)*(w.y-ay));
        if(d<bestDist){bestDist=d;bestIdx=i;}
      }
    }
    if(bestIdx>=0){tapArrowByIndex(bestIdx);tapped=false;}
  }

  // Slide animations: whole arrow path traces itself along its own route,
  // then continues straight off-screen past the head.
  for(let i=anims.length-1;i>=0;i--){
    const an=anims[i];
    an.t+=dt;
    if(an.t>=an.dur){anims.splice(i,1);continue}

    // Use pre-built path cached on anim creation (rebuilt every frame before).
    const path=an.path;

    const p=an.t/an.dur;
    const ep=p<.5?2*p*p:1-2*(1-p)*(1-p); // ease-in-out: smooth start and end
    const tailPos=ep*an.totalDist;
    const headPos=tailPos+an.bodyLen;
    const pts=getPathSegment(path,tailPos,headPos);

    const alpha=p>.85?1-(p-.85)/.15:1;
    drawArrowPolyline(pts,an.cs,an.col,alpha);
  }

  // Shake animations
  for(let i=shakeAnims.length-1;i>=0;i--){
    shakeAnims[i].t+=dt;
    if(shakeAnims[i].t>=shakeAnims[i].dur)shakeAnims.splice(i,1);
  }

  X.restore(); // === ZOOM/PAN BLOCK END === — UI below stays in screen coords

  // Bottom stats row. v2: bumped font 11 -> 13, switched key numbers
  // (moves count, time) to bold so they're scannable at a glance, and
  // added small label-on-top format (LABEL above number) so the row
  // stops reading like a debug printf and starts reading like a stat
  // strip. Layout: [MOVES] [TIME] [COIN+N] across thirds of the width.
  const sy1=H*.87;
  const tm=floor(timer),mm=floor(tm/60),ss=tm%60;
  const _stat=(x,label,value,valColor)=>{
    txt(label,x,sy1-7,9,TH.textDim);
    txtP(value,x,sy1+7,14,valColor||TH.text);
  };
  _stat(W*.22,'MOVES',moves+'/'+minMoves,moves>minMoves?TH.warning:TH.text);
  _stat(W*.50,'TIME',mm+':'+(ss<10?'0':'')+ss);
  // Coin badge — coin icon + count, both vertically centred inside a tiny pill
  {
    const cx=W*.78,cy=sy1;
    drawCoin(cx-12,cy,7);
    txtP(coins+'',cx+2,cy,14,TH.star,'left');
  }

  // Bottom action row removed in v2 — Hint moved up to the top-left
  // pill, Skip dropped entirely. Bottom of the play area is now
  // completely empty so the player's thumb has unobstructed room to
  // pan/zoom and tap arrows along the lower rows of the grid.

  // Update timers
  timer+=dt;
  totalPlayTime+=dt;


}

// --- COMPLETE ---
function drawComplete(){
  drawBg(true);

  // Confetti — every particle is now a 4-pointed sparkle (the same r(θ)
  // shape used by grid markers and the win wave). Particles still have
  // life/velocity/gravity tuned at 60fps; the path data is procedurally
  // sampled into a single fill so it stays cheap to render.
  const _frameScale=dt*60;
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];
    p.x+=p.vx*_frameScale;p.y+=p.vy*_frameScale;p.vy+=.08*_frameScale;p.rot+=p.rv*.02*_frameScale;p.life-=dt;
    if(p.life<=0){confetti.splice(i,1);continue}
    X.globalAlpha=clp(p.life,0,1);
    X.fillStyle=p.col;
    X.save();X.translate(p.x,p.y);X.rotate(p.rot);
    // 4-pointed sparkle silhouette (8 sample points — cheap; full 32-pt
    // version is reserved for the static grid where it doesn't redraw
    // per frame). Inner radius 30% gives that pinched-waist look.
    const R=p.sz/2,inner=R*.30;
    X.beginPath();
    for(let k=0;k<8;k++){
      const θ=k*PI/4-PI/2;
      const t=Math.cos(2*θ);
      const r=inner+(R-inner)*(t*t*t*t);
      const px=Math.cos(θ)*r,py=Math.sin(θ)*r;
      if(k===0)X.moveTo(px,py);
      else X.lineTo(px,py);
    }
    X.closePath();X.fill();
    X.restore();
    X.globalAlpha=1;
  }

  // Elapsed since the screen appeared — drives the staggered animations.
  // Falls back to "fully past" if completeEnterT was never set (very old
  // saves, dev hot-reload).
  const tNow = completeEnterT > 0 ? max(0, gt - completeEnterT) : 99;

  // Hero check-circle. Pops in with a small bounce: scale 0 → 1.1 → 1
  // over the first 380 ms.
  const checkP = clp(tNow / 0.38, 0, 1);
  const checkScale = checkP < 0.7
    ? lrp(0, 1.1, checkP / 0.7)
    : lrp(1.1, 1.0, (checkP - 0.7) / 0.3);
  X.save();
  X.translate(W/2, H*.18);
  X.scale(checkScale, checkScale);
  X.strokeStyle = TH.success; X.lineWidth = 3; X.lineCap = 'round';
  X.beginPath(); X.arc(0, 0, 28, 0, TAU); X.stroke();
  X.beginPath();
  X.moveTo(-12, 0); X.lineTo(-3, 10); X.lineTo(14, -8);
  X.stroke();
  X.restore();

  const title = isWeekly ? 'WEEKLY DONE' : (isDaily ? 'DAILY COMPLETE' : 'LEVEL ' + level);
  // Title fades in slightly delayed
  X.save();
  X.globalAlpha = clp((tNow - 0.2) / 0.4, 0, 1);
  txtP(title, W/2, H*.27, 24, TH.text);
  X.restore();

  // Stars — staggered fly-in. Each star gets a 350 ms window starting
  // 0.45 s after entry, separated by 180 ms. Inside the window, the
  // star scales from 0 → 1.4 → 1 with a fade. Skipped for daily/weekly
  // (those are unconditionally 3-star).
  const s = (isDaily || isWeekly) ? 3 : (stars[level] || 1);
  if (!isDaily && !isWeekly) {
    for (let i = 0; i < 3; i++) {
      const stagger = 0.45 + i * 0.18;
      const dur = 0.35;
      const p = clp((tNow - stagger) / dur, 0, 1);
      if (p <= 0) continue;
      const sc = p < 0.6 ? lrp(0, 1.4, p / 0.6) : lrp(1.4, 1.0, (p - 0.6) / 0.4);
      X.save();
      X.translate(W/2 - 36 + i * 36, H*.34);
      X.scale(sc, sc);
      X.globalAlpha = clp(p * 1.5, 0, 1);
      drawStar(0, 0, 14, i < s);
      X.restore();
    }
  }

  // Stats card — grouped row in the same visual language as Settings.
  // 3 stats live on one card, big bold values, small label above.
  {
    const cy = H * 0.46;
    const cardX = 28, cardW = W - 56, cardH = 70;
    X.fillStyle = TH.surface;
    X.beginPath(); X.roundRect(cardX, cy - cardH/2, cardW, cardH, 14); X.fill();
    X.strokeStyle = TH.border; X.lineWidth = 1;
    X.beginPath(); X.roundRect(cardX, cy - cardH/2, cardW, cardH, 14); X.stroke();
    const tm = floor(timer), mm = floor(tm/60), ss = tm % 60;
    const stat = (x, label, value, valColor) => {
      txt(label, x, cy - 12, 9, TH.textSec, 'center', '700');
      txtP(value, x, cy + 12, 18, valColor || TH.text);
    };
    stat(cardX + cardW * 0.20, 'ARROWS', minMoves + '');
    stat(cardX + cardW * 0.50, 'HEARTS', undosLeft + '/3', undosLeft === 3 ? TH.success : TH.text);
    stat(cardX + cardW * 0.80, 'TIME', mm + ':' + (ss < 10 ? '0' : '') + ss);
  }
  if (!isDaily && !isWeekly && bestTime > 0) {
    txt('Best: ' + floor(bestTime) + 's', W/2, H*.53, 11, TH.textDim);
  }

  // Reward — prominent gold pill that scales in like a celebration prize.
  if ((isDaily || isWeekly) && lastGained === 0) {
    txt('Already claimed today', W/2, H*.60, 12, TH.textDim);
  } else {
    const rp = clp((tNow - 1.0) / 0.45, 0, 1);
    const rScale = rp < 0.7 ? lrp(0, 1.15, rp / 0.7) : lrp(1.15, 1.0, (rp - 0.7) / 0.3);
    X.save();
    X.translate(W/2, H*.60);
    X.scale(rScale, rScale);
    X.globalAlpha = clp(rp * 2, 0, 1);
    const rw = 130, rh = 36;
    X.fillStyle = TH.star + 'CC';
    X.beginPath(); X.roundRect(-rw/2, -rh/2, rw, rh, rh/2); X.fill();
    drawCoin(-rw/2 + 22, 0, 9);
    txtP('+' + lastGained, 8, 0, 18, '#1a1a1a');
    X.restore();
  }

  // Buttons — daily/weekly return to menu; normal level goes to next
  if(isDaily||isWeekly){
