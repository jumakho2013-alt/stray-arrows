let _lastT=0;
// --- SKINS SHOP ---
// 3-column grid of arrow skins. Each card previews the skin (a right-pointing
// arrow painted by it), its name, and a footer: EQUIPPED (active), EQUIP
// (owned → tap to equip), or a coin + price (tap to buy if affordable, dimmed
// otherwise). Buying auto-equips. Paid with the in-game coins earned in play /
// rewarded ads — NOT real money (that's the separate Remove Ads IAP).
function drawSkins(){
  drawBg(true);
  const hdrBottom=_screenHeader(t('skins'),null,()=>goto('menu'));

  // 2 columns → big, easy-to-read cards. Card HEIGHT is derived from the
  // available vertical space so all rows always fit (never clips the bottom
  // row on shorter phones), then capped so cards stay roughly square on tall
  // screens instead of stretching into letterboxes.
  const cols=3, n=SKINS.length;
  const rows=Math.ceil(n/cols);
  const margin=16, gap=11, topY=hdrBottom+4, bottomPad=20+safeBottom;
  const cardW=(W-margin*2-gap*(cols-1))/cols;
  const availH=H-topY-bottomPad;
  const cardH=Math.min((availH-gap*(rows-1))/rows, cardW*0.82);
  // Top-aligned under the header like every other v3 sub-screen; centring
  // left a band of empty paper between the title and the first row.
  const startY=topY+8;
  const lastRowCount=n-(rows-1)*cols; // cards on the final row

  for(let idx=0;idx<n;idx++){
    const sk=SKINS[idx];
    const cIdx=idx%cols, rIdx=floor(idx/cols);
    // Centre the final row when it isn't full (e.g. a lone 9th card).
    const rowCount=(rIdx===rows-1)?lastRowCount:cols;
    const rowW=rowCount*cardW+(rowCount-1)*gap;
    const rowLeft=(W-rowW)/2;
    const x=rowLeft+cIdx*(cardW+gap)+cardW/2;
    const y=startY+rIdx*(cardH+gap)+cardH/2;
    const owned=ownedSkins.has(sk.id);
    const active=sk.id===activeSkin;
    const afford=coins>=sk.price;
    const hv=abs(mx-x)<cardW/2&&abs(my-y)<cardH/2;

    const cardX=x-cardW/2, cardY=y-cardH/2;
    const pc=_skinPaint(sk,1); // paint function — gradient skins resolve at draw

    // Card surface. Equipped card gets a faint accent wash so it reads as
    // "selected" beyond just the border.
    X.fillStyle=hv?TH.btnHover:TH.btnBg;
    X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,16);X.fill();
    if(active){
      X.save();X.globalAlpha=0.07;X.fillStyle=TH.accent;
      X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,16);X.fill();X.restore();
    }
    X.strokeStyle=active?TH.accent:TH.border;X.lineWidth=active?2.5:1;
    X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,16);X.stroke();

    // Bold, game-style thick arrow — the hero of the card. drawArrowPolyline
    // gives the same rounded thick look as the arrows in play.
    const ay=y-cardH*0.12, aw=cardW*0.26;
    drawArrowPolyline([[x-aw,ay],[x+aw,ay]], cardW*0.50, pc, 1);

    // Name
    txtP(sk.name, x, y+cardH*0.17, 12, owned?TH.text:TH.textSec);

    // Status chip / price pill
    const chipY=y+cardH*0.37;
    if(active){
      txtP(t('equipped'), x, chipY, 9, TH.accent);
      // Corner check badge so "equipped" reads at a glance.
      const bx=cardX+cardW-13, by=cardY+13, br=8;
      X.fillStyle=TH.accent;X.beginPath();X.arc(bx,by,br,0,TAU);X.fill();
      X.strokeStyle='#fff';X.lineWidth=1.7;X.lineCap='round';X.lineJoin='round';
      X.beginPath();X.moveTo(bx-3.2,by+0.4);X.lineTo(bx-1,by+2.8);X.lineTo(bx+3.4,by-2.4);X.stroke();
    }else if(owned){
      txtP(t('equip'), x, chipY, 9, TH.textSec);
    }else{
      // Price pill — gold when affordable, muted when not.
      const pw=56, ph=20;
      X.save();X.globalAlpha=afford?0.14:0.06;X.fillStyle=afford?TH.star:TH.text;
      X.beginPath();X.roundRect(x-pw/2,chipY-ph/2,pw,ph,ph/2);X.fill();X.restore();
      drawCoin(x-13,chipY,5);
      txt(sk.price+'', x-2, chipY, 11, afford?TH.star:TH.textDim, 'left');
    }

    // Tap: active → no-op; owned → equip; else → buy (auto-equips) or reject.
    if(tapped&&hv){
      tapped=false;
      if(active){sfx.tap();}
      else if(owned){setActiveSkin(sk.id);sfx.tap();haptic(8);}
      else{
        const r=buySkin(sk.id);
        if(r==='bought'){sfx.tap();haptic(12);save();spawnFloater(x,y,'-'+sk.price,TH.star);}
        else{sfx.tap();spawnFloater(x,y-cardH*0.3,t('notEnough'),TH.arrowBlock);}
      }
    }
  }
}

// ── v2.0 screen transitions ─────────────────────────────────────────
// Directional slide+fade (220ms): goto() snapshots the OLD frame (still
// on the canvas from the last rAF), applies the new state IMMEDIATELY,
// and the loop draws the snapshot on top sliding 24px away (left for
// forward navigation, right for back) while fading — revealing the live
// new screen underneath. Replaces the old fade-to-solid-colour, which
// still carried pre-Macaron navy values. reducedMotion → pure 120ms
// crossfade, no slide.
let _transT=1,_transDur=.22,_transDir=1,_transSnap=null,_transPending=null;
const _SCREEN_RANK={menu:0,levels:1,settings:1,stats:1,achievements:1,skins:1,play:2,complete:3,gameover:3,rushend:3};
function _transActive(){return _transT<1||!!_transPending}
function goto(newState,action){
  if(_transActive())return;
  // Reset transient screen-local UI flags when leaving screens — avoids the
  // settings reset-confirm row appearing already-toggled when you come back.
  if(newState!=='settings')resetConfirm=false;
  // v2.0: returning to the menu always exits zen/rush — every play entry
  // point goes through the menu, so this is the single reset choke point.
  if(newState==='menu'){gameMode='classic';_genOverride=null;_rushEnding=false;}
  // A tap that triggered a transition must not leak into the next screen
  // (button at the same coords on the target screen would fire instantly).
  tapped=false;
  if(!_transSnap)_transSnap=document.createElement('canvas');
  _transSnap.width=C.width;_transSnap.height=C.height;
  _transSnap.getContext('2d').drawImage(C,0,0);
  _transDir=(_SCREEN_RANK[newState]||0)>=(_SCREEN_RANK[S]||0)?1:-1;
  _transDur=reducedMotion?.12:.22;
  // v2.0.1: run the action on the NEXT frame, not synchronously in the tap
  // handler. Heavy actions (generateLevel on a 170-arrow board) froze the
  // frame right at the click — the "game lags" beta feedback. Deferring one
  // frame lets the snapshot cover the screen first, so the hitch hides
  // behind a static image instead of a stuck button press.
  _transPending={action:action||null,state:newState};
}
function loop(t){
  // Compute and publish frame delta to module scope so draw/animation code
  // anywhere can use `dt` (was hardcoded `1/60` in 7+ spots).
  dt=min((t-_lastT)/1000,.05);_lastT=t;gt+=dt;

  // v2.0 hurt shake: 3px global jolt while _hurtT runs (heart / time
  // loss). Wraps the whole screen render; skipped under reducedMotion.
  const _shakeAmp=(_hurtT>0&&!reducedMotion)?(_hurtT/.25)*3:0;
  if(_hurtT>0)_hurtT=max(0,_hurtT-dt);
  if(_shakeAmp>0){
    X.save();
    X.translate((Math.random()*2-1)*_shakeAmp,(Math.random()*2-1)*_shakeAmp);
  }

  // v2.1 intro card owns the tap while it's up — take it before anything
  // underneath renders, so neither the board nor the HUD can consume it.
  if(_introCard&&S==='play'){_cardTap=tapped?{x:tapX,y:tapY}:null;tapped=false;}

  // Render
  if(S==='menu')drawMenu();
  else if(S==='play')drawPlay();
  else if(S==='complete')drawComplete();
  else if(S==='gameover')drawGameOver();
  else if(S==='rushend')drawRushEnd();
  else if(S==='settings')drawSettings();
  else if(S==='levels')drawLevels();
  else if(S==='achievements')drawAchievements();
  else if(S==='stats')drawStats();
  else if(S==='skins')drawSkins();

  // Global: floating coin popups + achievement unlock popup
  drawFloaters();
  drawAchPopup();

  // v2.0: auto-open the daily reward calendar once per session when the
  // menu is idle (no transition in progress) and today's claim is available.
  if(S==='menu'&&!_loginAutoShown&&!_transActive()&&_loginClaimableToday()){
    _loginAutoShown=true;loginRewardOpen=true;
  }

  // Top-most overlays (block all underlying input)
  if(loginRewardOpen)drawLoginReward();
  if(_introCard&&S==='play')drawIntroCard();
  if(langPickerOpen)drawLangPicker();

  // End of hurt-shake wrap — overlays above shake with the screen; the
  // transition snapshot below must NOT (it's the previous screen).
  if(_shakeAmp>0)X.restore();

  // v2.0 transition overlay: the old screen slides + fades away.
  // A pending goto applies HERE, one frame after the snapshot was taken:
  // this frame still shows the old screen at full alpha, so a slow action
  // (level generation) stalls behind a static image, invisibly.
  if(_transPending){
    const p=_transPending;_transPending=null;
    X.drawImage(_transSnap,0,0,_transSnap.width,_transSnap.height,0,0,W,H);
    if(p.action)p.action();
    S=p.state;
    _transT=0;
  }else if(_transT<1){
    _transT=min(1,_transT+dt/_transDur);
    const p=1-Math.pow(1-_transT,3); // easeOutCubic
    X.save();
    X.globalAlpha=1-p;
    const off=reducedMotion?0:-24*p*_transDir;
    X.drawImage(_transSnap,0,0,_transSnap.width,_transSnap.height,off,0,W,H);
    X.restore();
  }

  // Final tap reset — so modals/overlays drawn AFTER screen draws still get
  // a chance to handle the tap. Individual draw functions clearing `tapped`
  // would consume it before drawLangPicker runs.
  tapped=false;
  requestAnimationFrame(loop);
}

// v2.0 splash→menu cross-fade: seed the transition system with a frame
// that matches the native splash (bg + coral snake-arrow) so the first
// menu render fades in from it instead of popping.
(function _bootFade(){
  try{
    _transSnap=document.createElement('canvas');
    _transSnap.width=C.width||W;_transSnap.height=C.height||H;
    const k=_transSnap.width/W;
    const sx=_transSnap.getContext('2d');
    sx.scale(k,k);
    // Matches the NATIVE splash (resources/splash*, still the pre-v3
    // colours) so the hand-off is seamless; the menu then fades in over it.
    sx.fillStyle=darkMode?'#3a2c2a':'#f9e9d8';
    sx.fillRect(0,0,W,H);
    sx.strokeStyle=darkMode?'#f0a890':'#d68f7a';
    sx.lineWidth=14;sx.lineCap='round';sx.lineJoin='round';
    sx.beginPath();
    sx.moveTo(W/2-45,H/2+55);sx.lineTo(W/2-45,H/2-5);
    sx.lineTo(W/2+22,H/2-5);sx.lineTo(W/2+22,H/2-30);
    sx.stroke();
    sx.fillStyle=sx.strokeStyle;
    sx.beginPath();
    sx.moveTo(W/2+22,H/2-55);sx.lineTo(W/2+6,H/2-32);sx.lineTo(W/2+38,H/2-32);
    sx.closePath();sx.fill();
    _transDur=.25;_transDir=1;_transT=0;
  }catch(e){_devWarn('bootFade',e);_transT=1;}
})();
requestAnimationFrame(loop);

// Register service worker for offline play + PWA install — but ONLY when
// running as a real web page, NOT inside the Capacitor WebView. Capacitor
// serves assets from the app bundle; a SW would intercept those fetches and
// can serve stale content across app updates (we burned a build on this).
// v2.0.1: NEVER register the SW on localhost — during development it kept
// serving a stale index.html against fresh assets ("опять заглючило"),
// because the cache name only changes on version bumps, not per edit.
if('serviceWorker' in navigator && typeof Capacitor==='undefined'
   && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
  navigator.serviceWorker.register('sw.js').catch(e=>_devWarn('serviceWorker.register',e));
}
window._ae={
  generateLevel,
  // Rush is the one generation path that can't be reached through
  // generateLevel alone — its grid comes from the module-level
  // `_genOverride`, which is deliberately not a parameter (arguments[2] is
  // taken by _retryDepth). Exposing the real function rather than
  // re-deriving its parameters keeps the test honest as it changes.
  rushBoard(){startRushBoard()},
  // Plays one tap through the real input path (locks, combo, penalties,
  // win) — lets QA scripts solve a board without mapping screen coords.
  tap(i){tapArrowByIndex(i)},
  // QA: run the chained generator on a bare grid, no game state touched.
  chained(R,C,seed,cfg){return _buildChained(R,C,seededRandom(seed),cfg)},

  get hearts(){return undosLeft},
  get state(){return S},
  get combo(){return _comboN},
  get winStreak(){return winStreak},

  get arrows(){return arrows},
  get gridCols(){return gridCols},
  get gridRows(){return gridRows},
  stats(lv){
    if(lv)generateLevel(lv);
    const lens=arrows.map(a=>a.cells.length).sort((a,b)=>b-a);
    const cells=lens.reduce((a,b)=>a+b,0);
    const owner={};
    arrows.forEach((a,i)=>a.cells.forEach(([r,c])=>{owner[r+','+c]=i}));
    let contacts=0;
    arrows.forEach((a,i)=>a.cells.forEach(([r,c])=>{
      for(let d=0;d<4;d++){
        const j=owner[(r+DY[d])+','+(c+DX[d])];
        if(j!=null&&j!==i)contacts++;
      }
    }));
    const sim=arrows.map(a=>({cells:a.cells.map(c=>[c[0],c[1]]),dir:a.dir,alive:true}));
    let solved=0;
    while(solved<sim.length){
      let idx=-1;
      for(let i=0;i<sim.length;i++){
        const a=sim[i];
        if(!a.alive)continue;
        const head=a.cells[a.cells.length-1];
        let cr=head[0]+DY[a.dir],cc=head[1]+DX[a.dir],blocked=false;
        while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols&&!blocked){
          for(let j=0;j<sim.length&&!blocked;j++){
            if(j===i||!sim[j].alive)continue;
            for(const[or,oc] of sim[j].cells){
              if(or===cr&&oc===cc){blocked=true;break}
            }
          }
          cr+=DY[a.dir];cc+=DX[a.dir];
        }
        if(!blocked){idx=i;break}
      }
      if(idx<0)break;
      sim[idx].alive=false;
      solved++;
    }
    return{
      level:lv||level,
      grid:gridCols+'x'+gridRows,
      arrows:lens.length,
      coverage:+(cells/(gridCols*gridRows)*100).toFixed(1),
      one:lens.filter(x=>x===1).length,
      two:lens.filter(x=>x===2).length,
      lt4:lens.filter(x=>x<4).length,
      avg:+(cells/lens.length).toFixed(1),
      max:lens[0]||0,
      braid:+(contacts/max(1,cells)).toFixed(2),
      top:lens.slice(0,10),
      solvable:solved===sim.length,
      solved
    };
  }
};
})(); // end IIFE
</script>
