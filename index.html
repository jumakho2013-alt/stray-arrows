  ? 'ca-app-pub-1164170950110129/3890476871'  /* iOS Rewarded — real */
  : 'ca-app-pub-1164170950110129/7243043308';  /* Android Rewarded — real */
const INTERSTITIAL_ID=()=>_isIOS()
  ? 'ca-app-pub-1164170950110129/8951231862'  /* iOS Interstitial — real */
  : 'ca-app-pub-1164170950110129/6672197661';  /* Android Interstitial — real */

let admobReady=false;
let _rewardedPrepared=false;
let _interstitialPrepared=false;
// Dev/QA toggle for AdMob test mode. Production never has the flag set, so
// this returns false and real ads serve as before. To verify ad-loading UX
// on a real device without burning real impressions, attach Safari Web
// Inspector / chrome://inspect, run `localStorage.ae_admob_test='1'` and
// relaunch the app. If we ever see this flag on in production (e.g. set
// accidentally by a debug build), we record a warning so it shows up in
// post-mortem next launch.
function _admobTestMode(){
  // Debug builds always serve test ads. Capacitor sets Capacitor.DEBUG from
  // the APK's FLAG_DEBUGGABLE (Android) / the DEBUG configuration (iOS), so
  // it is false in every store build — but a side-loaded dev build must
  // never request real impressions on the production ad units.
  if(typeof window!=='undefined'&&window.Capacitor&&window.Capacitor.DEBUG===true)return true;
  try{
    const on = localStorage.getItem('ae_admob_test')==='1';
    if(on) _devWarn('admob.testMode','test ads enabled via ae_admob_test');
    return on;
  }catch(e){return false;}
}

function _logAdErr(stage,e){
  // Persist the latest AdMob failure separately from the general _devWarn ring
  // buffer — Settings -> About surfaces this single field for quick triage of
  // "no ads on device X" reports.
  try{localStorage.setItem('ae_admob_err',stage+': '+String((e&&e.message)||e));}catch(_){/* localStorage unusable */}
  _devWarn('admob:'+stage,e);
}
async function initAdMob(){
  try{
    if(typeof Capacitor==='undefined'||!Capacitor.Plugins.AdMob)return;
    const AdMob=Capacitor.Plugins.AdMob;
    // Defensive: if initAdMob() ever runs twice (resume-from-background flow,
    // future refactor, retry path) the listeners would stack and reward
    // callbacks would fire N times. Strip any prior listeners up front.
    try{await AdMob.removeAllListeners()}catch(e){_devWarn('admob.removeAllListeners',e);}

    // On iOS: explicitly request ATT permission FIRST, BEFORE initializing AdMob.
    // Apple rejected v1.0 because the ATT prompt was missing. The plugin's
    // built-in `requestTrackingAuthorization: true` flag inside .initialize()
    // doesn't reliably show the prompt on iPadOS 26+. Calling the dedicated
    // method explicitly works, and we wait for the user response before init
    // so SDK telemetry never goes out before the user has answered.
    if(_isIOS()){
      try{
        const status=await AdMob.trackingAuthorizationStatus();
        if(status&&status.status==='notDetermined'){
          await AdMob.requestTrackingAuthorization();
        }
      }catch(e){/* method may not exist in older plugin versions — fall through */}
    }

    await AdMob.initialize({
      initializeForTesting:_admobTestMode(),
      requestTrackingAuthorization:false  // already handled explicitly above
    });

    // CRITICAL: mark SDK ready as soon as initialize() succeeds. The PREVIOUS
    // build only flipped this flag after both prepareRewardVideoAd AND
    // prepareInterstitial succeeded — and on a fresh AdMob account or with
    // a transient "no fill" response, prepare throws → admobReady stays
    // false forever → showRewardedAd silently grants the reward without
    // ever attempting to show an ad. That's the bug shipped in 1.0.6.
    admobReady=true;

    // Prepare ads in the background. On failure we'll lazily re-prepare in
    // showRewardedAd / showInterstitialAd.
    AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()})
      .then(()=>{_rewardedPrepared=true})
      .catch(e=>_logAdErr('prepareRewarded',e));
    AdMob.prepareInterstitial({adId:INTERSTITIAL_ID(),isTesting:_admobTestMode()})
      .then(()=>{_interstitialPrepared=true})
      .catch(e=>_logAdErr('prepareInterstitial',e));

    // Listen for reward — fired after the user watches the full rewarded ad.
    AdMob.addListener('onRewardedVideoAdReward',()=>{
      if(adRewardCallback)adRewardCallback();
      adRewardCallback=null;
    });
    // Re-prepare after close. Also clear adRewardCallback — if the user
    // dismissed without earning the reward, the callback must NOT fire later.
    AdMob.addListener('onRewardedVideoAdDismissed',()=>{
      adRewardCallback=null;
      _rewardedPrepared=false;
      AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()})
        .then(()=>{_rewardedPrepared=true}).catch(e=>_logAdErr('reprepareRewarded',e));
    });
    AdMob.addListener('onInterstitialAdDismissed',()=>{
      _interstitialPrepared=false;
      AdMob.prepareInterstitial({adId:INTERSTITIAL_ID(),isTesting:_admobTestMode()})
        .then(()=>{_interstitialPrepared=true}).catch(e=>_logAdErr('reprepareInterstitial',e));
    });
  }catch(e){_logAdErr('init',e)}
}

// ===== Remove Ads — In-App Purchase (cordova-plugin-purchase / CdvPurchase) =====
// One non-consumable product, no backend. All guarded with `typeof CdvPurchase`
// so web/preview (where the plugin doesn't exist) simply no-ops.
//
// STORE SETUP (the one part that can't live in code — do this in your accounts):
//   • App Store Connect → your app → In-App Purchases → create a
//     NON-CONSUMABLE with Product ID exactly `remove_ads`, price tier $2.99.
//   • Google Play Console → Monetize → In-app products → create product id
//     `remove_ads`, price $2.99, set Active.
// Until those exist the button shows "unavailable" on device (and no price).
const REMOVE_ADS_ID='remove_ads';
let _removeAdsPrice='';   // localized price string from the store (e.g. "$2.99")
let _iapBusy=false;       // a purchase/restore is in flight
let _iapBusyTimer=0;
// Set the in-flight flag with a self-clearing safety timeout, so the button
// can never latch dead if the StoreKit sheet is dismissed without firing any
// approved/finished/error callback (rare, OS-dependent).
function _iapSetBusy(){_iapBusy=true;clearTimeout(_iapBusyTimer);_iapBusyTimer=setTimeout(()=>{_iapBusy=false;},60000);}
function _iapPlatform(){const CP=CdvPurchase;return _isIOS()?CP.Platform.APPLE_APPSTORE:CP.Platform.GOOGLE_PLAY;}
function initIAP(){
  try{
    if(typeof CdvPurchase==='undefined')return;            // plugin absent (web)
    const CP=CdvPurchase, store=CP.store, plat=_iapPlatform();
    store.register([{id:REMOVE_ADS_ID,type:CP.ProductType.NON_CONSUMABLE,platform:plat}]);
    store.when()
      .productUpdated(()=>{const p=store.get(REMOVE_ADS_ID,plat);if(p&&p.pricing&&p.pricing.price)_removeAdsPrice=p.pricing.price;})
      // No backend / receipt validator → grant entitlement locally on approval
      // and finish() the transaction immediately. (Relying on .verified() would
      // never fire without a store.validator, so the user would be charged but
      // never granted, and StoreKit would keep re-presenting the unfinished
      // transaction. This is the documented no-backend local flow.)
      .approved(tx=>{
        // Grant the entitlement ONLY for a store-confirmed, fully-paid purchase of
        // our exact product — never on a bare "approved fired" signal.
        //   • tx.isPending === true  → payment not settled yet (deferred / Ask-to-Buy):
        //     do NOT grant and do NOT finish; .approved fires again once it settles.
        //   • tx.products is the store-verified list of purchased product ids; require
        //     REMOVE_ADS_ID to be present so an unrelated transaction can't grant.
        if(tx&&tx.isPending){_iapBusy=false;return;}
        const ours=!!(tx&&Array.isArray(tx.products)&&tx.products.some(p=>p&&p.id===REMOVE_ADS_ID));
        if(!ours){try{tx&&tx.finish&&tx.finish();}catch(e){_logAdErr('finishOther',e);}_iapBusy=false;return;}
        const was=adsRemoved;
        _setAdsRemoved(true);_iapBusy=false;
        try{tx.finish();}catch(e){_logAdErr('finish',e);}
        if(!was)spawnFloater(W/2,H*0.5,t('adsRemovedMsg'),TH.success);
      })
      // Reflects restores / already-owned on relaunch.
      .receiptUpdated(()=>{const p=store.get(REMOVE_ADS_ID,plat);if(p&&p.owned)_setAdsRemoved(true);})
      // Authoritative reconcile once ALL platform receipts have loaded (fires even
      // when the user never purchased). This is the only moment "not owned" is
      // definitive, so it's the safe place to RECLAIM a local flag that was never
      // backed by a real purchase — genuine owners keep their entitlement.
      // Conservative: only revoke when the product is loaded AND store says not owned;
      // if ownership is unknown (product not loaded), leave the flag untouched so a
      // real buyer is never wrongly shown ads. Store entitlement is cached on-device
      // by StoreKit/Play Billing, so this stays correct even offline. Never runs on web.
      .receiptsReady(()=>{
        try{
          const p=store.get(REMOVE_ADS_ID,plat);
          if(!p)return;                                   // ownership unknown — never revoke on uncertainty
          if(p.owned){ if(!adsRemoved)_setAdsRemoved(true); }   // real owner / restore — keep
          else if(adsRemoved){ _setAdsRemoved(false); }         // local flag not backed by a purchase — reclaim
        }catch(e){_logAdErr('reconcile',e);}
      })
      .finished(()=>{_iapBusy=false;});
    store.error(e=>{_iapBusy=false;_logAdErr('iap',e);});
    store.initialize([plat]);
  }catch(e){_logAdErr('initIAP',e);}
}
function buyRemoveAds(){
  if(adsRemoved||_iapBusy)return;
  if(typeof CdvPurchase==='undefined'){spawnFloater(W/2,H*0.5,t('iapUnavailable'),TH.arrowBlock);return;}
  try{
    const store=CdvPurchase.store, p=store.get(REMOVE_ADS_ID,_iapPlatform());
    const offer=p&&p.getOffer&&p.getOffer();
    if(!offer){spawnFloater(W/2,H*0.5,t('iapUnavailable'),TH.arrowBlock);return;}
    _iapSetBusy();
    Promise.resolve(store.order(offer)).catch(e=>{_iapBusy=false;_logAdErr('order',e);});
  }catch(e){_iapBusy=false;_logAdErr('buyRemoveAds',e);}
}
function restorePurchases(){
  if(typeof CdvPurchase==='undefined'){spawnFloater(W/2,H*0.5,t('iapUnavailable'),TH.arrowBlock);return;}
  try{
    _iapSetBusy();
    Promise.resolve(CdvPurchase.store.restorePurchases()).catch(e=>_logAdErr('restore',e)).finally(()=>{_iapBusy=false;});
  }catch(e){_iapBusy=false;_logAdErr('restore',e);}
}

// Defer AdMob init until AFTER the splash screen has dismissed and the
// WebView is fully visible — Apple requires the ATT prompt to appear in the
// foreground after the app's UI is rendered, never during launch/splash.
function _scheduleAdMobInit(){
  // 1.5s gives the Capacitor splash time to fade and the WebView to attach.
  setTimeout(()=>{initAdMob();initIAP();},1500);
}
if(document.readyState==='complete') _scheduleAdMobInit();
else window.addEventListener('load',_scheduleAdMobInit);

let _adInFlight=false;
async function showRewardedAd(onReward){
  // Browser / no plugin — give reward immediately so dev/web testing works.
  // On a REAL device with admobReady=false, we now refuse instead of granting
  // the reward, so users can't farm coins by tapping when ads are down.
  if(typeof Capacitor==='undefined'||!Capacitor.Plugins.AdMob){
    if(onReward)onReward();
    return;
  }
  if(!admobReady){
    // SDK init didn't complete (rare). Tell user, don't grant.
    spawnFloater(W/2,H/2,t('adUnavailable'),TH.arrowBlock);
    return;
  }
  // Anti-double-tap: spammy taps on the rewarded button used to register
  // multiple concurrent showRewardedAd calls → multiple rewards on a single
  // ad view. Block while one ad is mid-flight.
  if(_adInFlight)return;
  _adInFlight=true;
  const AdMob=Capacitor.Plugins.AdMob;
  // Wrap the caller's reward in a one-shot so even if dismiss + reward
  // listeners both fire, the player only gets one payout.
  let rewardFired=false;
  const safeReward=()=>{if(rewardFired)return;rewardFired=true;if(onReward)onReward()};
  adRewardCallback=safeReward;
  try{
    if(!_rewardedPrepared){
      await AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()});
      _rewardedPrepared=true;
    }
    await AdMob.showRewardVideoAd();
    // Reward / dismiss listeners take it from here.
  }catch(e){
    _logAdErr('showRewarded',e);
    // Try ONE on-demand prepare+show retry — e.g., the cached ad expired.
    try{
      await AdMob.prepareRewardVideoAd({adId:REWARDED_ID(),isTesting:_admobTestMode()});
      _rewardedPrepared=true;
      await AdMob.showRewardVideoAd();
    }catch(e2){
      _logAdErr('showRewardedRetry',e2);
      // Genuinely no ad available — DO NOT grant reward (anti-farm). Tell
      // the user instead. Clear the pending callback so a future ad's
      // listener doesn't fire it.
      adRewardCallback=null;
      spawnFloater(W/2,H/2,t('adUnavailable'),TH.arrowBlock);
    }
  }finally{
    // Released after the ad closes (catch path) OR on the next tick after
    // showRewardVideoAd resolves — the dismiss listener runs separately so
    // we release the gate immediately. Worst case a second ad starts while
    // the first is still on screen, but iOS only ever shows one at a time.
    _adInFlight=false;
  }
}
// v1.0.20: interstitial back on with WALL-CLOCK cooldown.
//
// Each successful show records Date.now() in localStorage AND rolls a
// fresh random next-interval in the 5-7 minute range. The next call
// only fires once wall-clock time crossed that interval — regardless
// of whether the app was closed, a level was retried, the user idled,
// or anything else. Fixes the v1.0.17 bug where the cooldown ran on
// `gt` (per-session game-clock) and reset to 0 on every relaunch,
// which is what made ads feel like they fired after every single game.
//
// First-ever call seeds the timestamp to "now" and returns without
// showing — so a brand-new install never sees an ad in the opening
// minutes when impressions matter least and friction matters most.
const INTERSTITIAL_MIN_MS = 5 * 60 * 1000;   // 5 min
const INTERSTITIAL_MAX_MS = 7 * 60 * 1000;   // 7 min
function _rollNextInterstitialInterval(){
  return INTERSTITIAL_MIN_MS + floor(Math.random() * (INTERSTITIAL_MAX_MS - INTERSTITIAL_MIN_MS));
}
async function showInterstitialAd(){
  if(adsRemoved)return;
  const now = Date.now();
  let lastTs = +localStorage.getItem('ae_inter_last') || 0;
  let nextInterval = +localStorage.getItem('ae_inter_next') || INTERSTITIAL_MIN_MS;
  // First-ever call: seed the timer so the first real ad lands ~5-7 min
  // from now, not immediately on a fresh install.
  if (lastTs === 0) {
    _safeSet('ae_inter_last', String(now));
    _safeSet('ae_inter_next', String(_rollNextInterstitialInterval()));
    return;
  }
  if (now - lastTs < nextInterval) return;
  if (!admobReady || typeof Capacitor === 'undefined' || !Capacitor.Plugins.AdMob) return;
  // Commit the cooldown window NOW, the instant the gate opens — BEFORE we
  // touch the native show. This is the fix for the "ad before every level"
  // bug: AdMob.showInterstitial() can reject *after* the ad has already been
  // displayed (no-fill retry, frequency-cap error, plugin quirk). If we only
  // stamped after a clean resolve, that throw would skip the stamp, leave
  // lastTs stale, and every subsequent level would re-open the gate and fire
  // again. Rate-limiting is the contract here; losing one impression on a
  // rare failed show is a fine price for never spamming the player.
  _safeSet('ae_inter_last', String(now));
  _safeSet('ae_inter_next', String(_rollNextInterstitialInterval()));
  const AdMob = Capacitor.Plugins.AdMob;
  try {
    if (!_interstitialPrepared) {
      await AdMob.prepareInterstitial({ adId: INTERSTITIAL_ID(), isTesting: _admobTestMode() });
      _interstitialPrepared = true;
    }
    await AdMob.showInterstitial();
    // Consumed — onInterstitialAdDismissed re-prepares the next one.
    _interstitialPrepared = false;
  } catch (e) {
    _logAdErr('showInterstitial', e);
  }
}
// With a bomb live the useful move is one that digs toward it — a hint that
// points at any free arrow would spend the player's countdown for them.
// Works on an alive-mask so the Reveal simulation can use it too. Returns a
// free arrow from the most urgent bomb's live ancestor set (the bomb itself
// once free), or -1 when there's no bomb or nothing free toward it.
function _bombTarget(alive){
  let b=-1;
  for(let i=0;i<arrows.length;i++)
    if(alive[i]&&arrows[i].cd!=null&&(b<0||arrows[i].cdLeft<arrows[b].cdLeft))b=i;
  if(b<0)return -1;
  const occ=new Int16Array(gridRows*gridCols).fill(-1);
  arrows.forEach((a,i)=>{for(const[r,c] of a.cells)occ[r*gridCols+c]=i});
  const holders=(i)=>{
    const a=arrows[i],out=[];
    if(a.lock!=null&&alive[a.lock])out.push(a.lock);
    const h=a.cells[a.cells.length-1];
    let r=h[0]+DY[a.dir],c=h[1]+DX[a.dir];
    while(r>=0&&r<gridRows&&c>=0&&c<gridCols){const j=occ[r*gridCols+c];if(j>=0&&j!==i&&alive[j])out.push(j);r+=DY[a.dir];c+=DX[a.dir]}
    return out;
  };
  const seen=new Set([b]),st=[b];
  while(st.length){for(const j of holders(st.pop()))if(!seen.has(j)){seen.add(j);st.push(j)}}
  for(const i of seen)if(!holders(i).length)return i;
  return -1;
}
function useHint(){
  if(coins<HINT_COST||hintTime>0)return false;
  const toBomb=_bombTarget(arrows.map(a=>a.alive));
  for(let i=0;i<arrows.length;i++){
    if(toBomb>=0&&i!==toBomb)continue;
    if(arrows[i].alive&&canEscape(i)){
      hintArrow=i;
      hintTime=2.5;
      coins-=HINT_COST;
      hintUsedThisLevel=true; // disqualifies this level from "no hint" stat
      save();
      sfx.tap();haptic(15);
      return true;
    }
  }
  return false;
}

// ── v2.0 boosters ────────────────────────────────────────────────────
// Inventory (login-reward grants) is consumed before coins. Returns true
// if the booster activated.
function useBooster(kind){
  const inv=kind==='shield'?bstShield:kind==='zap'?bstZap:bstReveal;
  if(kind==='shield'&&shieldArmed)return;      // already armed
  if(kind==='zap'&&zapArmed){
    // Tap again = cancel target mode; refund whatever paid for it.
    zapArmed=false;boosterMenuOpen=false;
    if(_zapPaid==='inv'){bstZap++;_safeSet('ae_bst_zap',bstZap);}
    else{coins+=BOOST_COSTS.zap;_safeSet('ae_coins',coins);}
    boostersUsed=max(0,boostersUsed-1);_safeSet('ae_boost_used',boostersUsed);
    return;
  }
  if(inv>0){
    if(kind==='shield'){bstShield--;_safeSet('ae_bst_shield',bstShield);}
    else if(kind==='zap'){bstZap--;_safeSet('ae_bst_zap',bstZap);_zapPaid='inv';}
    else{bstReveal--;_safeSet('ae_bst_reveal',bstReveal);}
  }else if(coins>=BOOST_COSTS[kind]){
    coins-=BOOST_COSTS[kind];
    _safeSet('ae_coins',coins);
    if(kind==='zap')_zapPaid='coins';
  }else{
    spawnFloater(W/2,H*.3,t('notEnough'),TH.arrowBlock);
    return;
  }
  boostersUsed++;_safeSet('ae_boost_used',boostersUsed);
  checkAchievements({boostersUsed});
  save();
  sfx.tap();haptic(12);
  if(kind==='shield'){
    shieldArmed=true;
  }else if(kind==='zap'){
    zapArmed=true;
  }else{
    // Reveal: greedy 3-step solve simulation on a scratch alive-mask —
    // the same escape rule as canEscape but against the mask, so the
    // 1/2/3 badges form a genuinely playable order.
    revealList=[];
    const alive=arrows.map(x=>x.alive);
    for(let step=0;step<3;step++){
      let found=_bombTarget(alive);
      for(let i=0;i<arrows.length&&found<0;i++){

        if(!alive[i])continue;
        const ar=arrows[i];
        if(ar.lock!=null&&alive[ar.lock])continue; // locked until its key is gone in this simulation
        const head=ar.cells[ar.cells.length-1];
        let cr=head[0]+DY[ar.dir],cc=head[1]+DX[ar.dir],clear=true;
        while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols&&clear){
          for(let j=0;j<arrows.length&&clear;j++){
            if(j===i||!alive[j])continue;
            for(const[or,oc] of arrows[j].cells){
              if(or===cr&&oc===cc){clear=false;break}
            }
          }
          cr+=DY[ar.dir];cc+=DX[ar.dir];
        }
        if(clear)found=i;
      }
      if(found<0)break;
      revealList.push(found);
      alive[found]=false;
    }
    revealUntil=gt+4;
  }
  boosterMenuOpen=false;
}

// Continue from game over — spend coins to restore hearts, keep arrow progress
function _restoreStreak(){
  if(_streakLost){winStreak=_streakLost;_streakLost=0;_safeSet('ae_win_streak',winStreak);}
}
function continueFromGameover(){
  if(coins<CONTINUE_COST)return false;
  coins-=CONTINUE_COST;
  undosLeft=3;
  _restoreStreak();
  _bombGrace();
  save();
  S='play';
  sfx.tap();haptic(10);
  return true;
}

// ── v2.0 mode starters ───────────────────────────────────────────────
// Zen: endless, no hearts. Difficulty drifts lvl 22→42 across boards then
// loops; customSeed bypasses the handcrafted table so every board is fresh.
function startZen(){
  gameMode='zen';isDaily=false;isWeekly=false;
  generateLevel(22+floor((zenCount%40)*0.5),777000+zenCount*7919);
}
// Rush: 75-second time attack on small fixed-size boards at easy (lvl-12)
// difficulty. Each escaped arrow = +1 score, board clear = +5s, blocked
// tap = −3s. Score→coins on expiry (floor(score/2), cap 40 — stays below
// the 60-coin rewarded ad so ads keep their value).
function startRush(){
  gameMode='rush';isDaily=false;isWeekly=false;
  rushScore=0;rushEndAt=gt+75;_lastRushTick=-1;_rushEnding=false;
  rushBoardIdx=0;
  startRushBoard();
}
function startRushBoard(){
  // v2.0.1: every board must LOOK different and ramp up — the old rush
  // pinned an 11×14 grid at lvl-12 forever, so each board was the same
  // full-rectangle maze ("рывок один и тот же"). Now the grid size cycles
  // and difficulty climbs with each board cleared. Seed keys off the board
  // index (huge multiplier) so it's unique even within one millisecond.
  rushBoardIdx++;
  const tier=Math.min(rushBoardIdx,12);
  const h=(rushBoardIdx*2654435761)>>>0;   // well-spread hash of the board index
  const cols=9+(h%6);                       // 9..14 — widths spread, not alternating
  const rows=12+((h>>3)%6);                 // 12..17 — heights spread
  _genOverride={cols,rows,maxLen:12+tier};
  generateLevel(Math.min(10+tier*3,120),(h^((Date.now()%1000000007)|0))>>>0);
  _genOverride=null;
}

// Daily seed: one puzzle per day, same for everyone. Integer day number since epoch.
function getDailySeed(){return floor(Date.now()/86400000)}
function dailyDoneKey(){return'ae_daily_'+getDailySeed()}
// Daily difficulty pinned at level 40 (medium) so each day is a similar
// challenge — Wordle/NYT model. Seed varies, complexity stays constant.
function startDailyBoard(){isDaily=true;isWeekly=false;dailySeed=getDailySeed();generateLevel(40,dailySeed*31+7)}

function isDailyDone(){return localStorage.getItem(dailyDoneKey())==='1'}

// Weekly seed: one puzzle per ISO week. Harder than daily — uses lvl 60 difficulty.
function getWeeklySeed(){return floor(Date.now()/(7*86400000))}
function weeklyDoneKey(){return'ae_weekly_'+getWeeklySeed()}
// Weekly difficulty pinned at level 120 (hard) — bigger reward, bigger maze.
function startWeeklyBoard(){isWeekly=true;isDaily=false;generateLevel(120,getWeeklySeed()*131+71)}
// Rebuild the board the player is on. Game-over Retry used to call
// generateLevel(level) unconditionally, so losing a daily and retrying
// swapped in the player's CLASSIC level with isDaily still set — a
// different board, paid out as the daily on a win.
function replayCurrentBoard(){
  if(isDaily)startDailyBoard();
  else if(isWeekly)startWeeklyBoard();
  else generateLevel(level);
}

function isWeeklyDone(){return localStorage.getItem(weeklyDoneKey())==='1'}

// ================================================================
//  LEVEL GENERATION
// ================================================================
// Park-Miller. It is only a valid generator for a seed in [1, m-1], and
// callers hand it whatever a 32-bit `|0` produced — the retry perturbation
// `(baseSeed + 0x9E3779B1*(depth+1))|0` is negative about half the time.
// JS's `%` keeps the sign of the dividend, so one negative seed made the
// ENTIRE stream negative, and the generator quietly stopped generating:
// every `rng() < p` read as true and every `floor(rng()*n)` index
// collapsed to 0. Boards that needed a retry — which is most of them once
// the quality gate is on — were built from a dead RNG. Normalise first.
function seededRandom(seed){
  const m=2147483647;
  let s=seed%m;
  if(s<0)s+=m;
  if(s===0)s=1; // m is prime, so s can never reach 0 again after this
  return function(){s=(s*16807)%m;return(s-1)/(m-1)};
}

// Generate a level using the REAL mechanic: arrows are multi-cell random-walk paths.
// Placement lays arrows down in REVERSE solve order — arrow[N-1] first and
// unconstrained, then each earlier one needing a clear escape past the ones
// already down. That alone never survived the packing passes: absorption and
// re-merging rewrite bodies and heads, and measured at level 301 it left 167
// boards in 168 unsolvable. So placement is now treated as a way to arrange
// CELLS, and `_peelOrient` derives every direction afterwards from a solve it
// actually simulates — which is what makes the board solvable, sets its
// difficulty, and re-establishes the reverse-solve-order contract below.
function generateLevel(lvl,customSeed){
  const rng=seededRandom(customSeed!=null?customSeed:(lvl*7919+31337));
  hintArrow=-1;hintTime=0;wrongTapsInLevel=0;
  hintUsedThisLevel=false;
  levelRevealT=0;
  // Reset pinch/pan state. zoomLevel gets set after gridCols/gridRows are
  // known (auto-fit so big levels render at tappable cell size).
  panX=0;panY=0;_pinchStartDist=0;_panStart=null;
  _levelCells=new Set();
  function _recordCells(){for(const a of arrows)for(const [r,c] of a.cells)_levelCells.add(r+','+c);}
  updateStreak();

  // Shape fast path: since v2.1 the file holds only the picture levels, one
  // every 5th level from 25 to 2225 — every other level, the tutorial
  // included, is generated below. Daily/weekly bypass this (they pass
  // customSeed).

  if(!FORCE_FRESH_LEVELS&&customSeed==null&&typeof window!=='undefined'
     &&window.HANDCRAFTED_LEVELS&&window.HANDCRAFTED_LEVELS[lvl]){
    const hc=window.HANDCRAFTED_LEVELS[lvl];
    currentShape=hc.t||null;
    currentHard=false;   // pictures are the breathers between hard levels

    _shapeRevealT=currentShape?0:1;
    gridCols=hc.cols;gridRows=hc.rows;
    arrows=hc.arrows.map(a=>({cells:a.c.map(c=>[c[0],c[1]]),dir:a.d,alive:true}));
    _recordCells();
    _shapeCells=currentShape?[..._levelCells].map(k=>{const p=k.split(',');return[+p[0],+p[1]]}):null;
    minMoves=arrows.length;
    moves=0;timer=0;undosLeft=3;
    _resetBoosterState();
    _resetRunFx();
    _startZoomIntro();

    const key='ae_best_'+lvl;
    bestTime=+localStorage.getItem(key)||0;
    return;
  }

  // If HANDCRAFTED didn't claim this level, fall straight through to the
  // procedural generator below. (Rush Hour IMPORTED branch removed in
  // v1.0.19; BAKED branch removed in v2.0 — handcrafted + procedural only.)
  currentShape=null;
  _shapeRevealT=1;
  currentHard=false;

  // v2.2: the classic track, daily and weekly use the chained generator —
  // one or two tappable arrows per step instead of three to six. Zen and
  // rush keep the older packer: their boards are meant to flow, not stall.
  if(gameMode==='classic'&&!_genOverride){
    const spec=_chainSpec(isWeekly?50:lvl);   // weekly: the level-50 hard spec, 15×20

    const P=_buildChained(spec.rows,spec.cols,rng,spec.cfg);
    const dims=_cropBoard(P,spec.rows,spec.cols);
    gridCols=dims.cols;gridRows=dims.rows;
    arrows=P.map(a=>({cells:a.cells,dir:a.dir,alive:true}));
    currentHard=spec.hard||isWeekly;
    _recordCells();
    _shapeCells=null;
    minMoves=arrows.length;
    moves=0;timer=0;undosLeft=3;
    _resetBoosterState();
    _resetRunFx();
    _startZoomIntro();
    bestTime=+localStorage.getItem('ae_best_'+lvl)||0;
    return;
  }

  // Difficulty curve. Power-0.8 early ramp + cap at lvl 150. The previous
  // 26×34 grid looked sparse once 1-cell dots were removed. Competitor boards
  // read denser on mobile: fewer cells, thicker visible strands, less blank
  // background. Max grid is now 22×30.
  // coexisting, not one giant Warnsdorff snake. This generator therefore
  // rejects short "successful" paths during the main pass: if an arrow
  // cannot grow into a proper snake, we try another head/direction instead
  // of accepting a 2-cell scrap.
  // Slightly steeper than before: ramp caps at lvl 120 instead of 150 so
  // each 10-level block is felt; user feedback at lvl 67 said "more or
  // less normal now, just a touch harder per step" so we bring the max
  // grid (22×30) closer in by ~20%.
  const p=min(1,Math.pow((lvl-1)/74,.66));
  // Tutorial override: first 5 levels are deliberately tiny — 3-5 arrows
  // on a small grid so brand-new players grasp "tap a clear arrow" before
  // any chain dependency or pattern variety appears. Hand-picked sizes
  // produce the right "easy onboarding" curve regardless of what the
  // pow() difficulty formula would give.
  const TUT_OVERRIDES=[
    {cols:6,rows:8, maxLen:14, longMin:5},   // lvl 1: ~3-4 arrows
    {cols:7,rows:10,maxLen:18, longMin:6},   // lvl 2: ~4-5 arrows
    {cols:8,rows:12,maxLen:22, longMin:7},   // lvl 3: ~5-6 arrows
    {cols:10,rows:14,maxLen:26,longMin:8},   // lvl 4: ~6-8 arrows
    {cols:12,rows:16,maxLen:30,longMin:10},  // lvl 5: ~8-10 arrows
  ];
  const tut=lvl<=5?TUT_OVERRIDES[lvl-1]:null;
  // Grid 1.5× finer per user feedback. Tutorial uses the override above;
  // lvl 6+ uses the smooth ramp. _genOverride (rush mode's small boards)
  // wins over both — it's a module-level override, NOT a parameter,
  // because arguments[2] is already taken by _retryDepth.
  const cols=_genOverride?_genOverride.cols:(tut?tut.cols:floor(lrp(14,32,p)+.5));
  const rows=_genOverride?_genOverride.rows:(tut?tut.rows:floor(lrp(19,42,p)+.5));
  const pattern=getLevelPattern(lvl);
  _levelPattern=pattern;
  const minLen=2;
  // Reduced max from 108 → 35 to match competitor's dense-maze look.
  const maxLen=_genOverride?_genOverride.maxLen:(tut?tut.maxLen:floor(lrp(15,60,p)*pattern.lenScale+.5));

  gridCols=cols;gridRows=rows;

  // Late-level scaling: once `p` saturates at lvl 75 the grid + length
  // are maxed out. Difficulty keeps climbing via TWO levers:
  //   • numClusters: 3 → 12 over lvls 75..1500, then +1 every 25 lvls
  //     (more cluster centers = more islands competing for the same
  //     snake heads = tighter corridors between them)
  //   • lateExtra: 0..1 over the same range — used below to scale
  //     longMin DOWN at high levels (shorter required min length =
  //     more arrows per board = more to track per tap)
  // Tutorial: NO chain blockers — pure "tap clear arrow" gameplay so
  // brand-new players grasp the basic rule before any dependencies.
  // v2.0: chain depth now SCALES with level (was a constant 1) — the
  // "levels aren't strong" feedback traced to every escape being at most
  // one arrow away from clear. Mid-game allows 2-deep locks, late-game 3.
  _maxBlockers=tut?0:(lvl<25?1:lvl<120?2:3);
  // Late-game ramp (extended in v2): caps were 24 clusters / 2.5
  // lateExtra, which meant by lvl 3500 every parameter saturated and a
  // lvl-6000 board looked the same as a lvl-3500 one. User flagged
  // this. New ceiling pushes max clusters to 40 and lateExtra to 5.0,
  // both reached around lvl 8000-10000 — every 25-level block past
  // 1500 still adds a cluster, so a player grinding 50 levels feels
  // the difficulty shift rather than seeing a wall.
  let numClusters, lateExtra;
  if(lvl<=1500){
    // v2.0: ramp starts at lvl 40 (was 75) and peaks at 14 clusters
    // (was 12) — mid-game boards pick up density much sooner.
    const q=Math.max(0,(lvl-40)/1100);
    numClusters=floor(lrp(4,14,q)+.5);
    lateExtra=q;
  }else{
    numClusters=12+floor((lvl-1500)/25);
    lateExtra=1+(lvl-1500)/1500;
  }
  numClusters=Math.min(40,numClusters);
  lateExtra=Math.min(5.0,lateExtra);

  // Pattern centers: same cluster mechanic, different attractor layouts.
  // This is the visual variety layer (spiral, mosaic, pitons, diagonals,
  // rings, maze rows, rays). It changes where arrows prefer to grow, not
  // the solve rules.
  _clusterCenters=[];
  if(CLUSTERS_MODE){
    numClusters=Math.max(2,Math.round(numClusters*pattern.clusterScale));
    _clusterCenters=buildPatternCenters(pattern,rows,cols,numClusters,rng);
  }

  // occ[r][c] = arrow index that owns this cell, or -1
  const occ=[];
  for(let r=0;r<rows;r++){occ[r]=[];for(let c=0;c<cols;c++)occ[r][c]=-1}

  const placed=[];

  // ONE-PASS GENERATION: drop the old medium-gap pass — it was
  // visual noise between headline snakes. Each placed arrow is now a
  // substantial winding path the player can read end-to-end. Empty
  // cells get absorbed into snakes by Pass 3 below.
  // longMin shrinks at very late levels (lateExtra > 0) — gives MORE
  // arrows per board at lvl 1500+ so there's more to track even
  // though the grid stays maxed.
  //
  // v2.5: floor lowered 0.45 → 0.30 so lvl 6000+ procedural boards
  // stop looking sparse (user flagged lvl 8001 as "слишком пустой").
  // With lateExtra=5.0 this gives longMin ~= longMinBase × 0.30, i.e.
  // ~3× more distinct arrows packed into the same grid. Coupled with
  // the existing Pass-3 fill-coverage absorption, sparse "vertical
  // shaft" pockets get eaten by neighbouring snakes.
  let safety=3000;
  const longMinBase=floor(maxLen*lrp(.55,.70,p)*pattern.longMinScale);
  const longMin=tut?tut.longMin:max(8,floor(longMinBase*max(0.30,1-lateExtra*0.30)));
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,minLen,maxLen,placed,{minAcceptLen:longMin});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }

  // Pass 3: full-coverage absorption. Goal — eliminate the "scattered
  // single-cell dot" look the user complained about and fill empty cells
  // in the middle of the grid.
  //
  // Three sub-passes, each runs in a fixpoint loop so cascading absorption
  // fills chains of cells:
  //   3a. TAIL extension — empty cell adjacent to an arrow's tail joins
  //       that arrow's body (existing logic).
  //   3b. HEAD extension along escape line — the arrow's head consumes
  //       the cell immediately in front of it (which used to be on its
  //       escape line). This shortens the escape but keeps it valid.
  //   3c. 1-cell merge — leftover empty cells get a 1-cell arrow placed,
  //       then those 1-cell arrows get merged into adjacent multi-cell
  //       arrow tails wherever geometrically and game-logically valid.
  //
  // Every extension is gated by `_wouldBlockOtherEscape()` — adding a cell
  // to arrow A's body must not put it on the escape line of any arrow B
  // that was placed AFTER A. (B is solved before A in game order, so at
  // B's turn A is still alive and would block B's escape.)

  // Returns true iff (r,c) lies on the escape line of any arrow placed
  // after `currentIdx`. Those arrows solve before `currentIdx` in game,
  // so adding (r,c) to currentIdx's body would make them unreachable.
  //
  // …unless the peel runs. It re-derives every direction from scratch after
  // the packing passes and repairs any deadlock by dropping arrows, so the
  // placement order this gate protects stops being load-bearing — and the
  // gate is by far the most expensive thing in generation: an O(N) scan
  // sitting inside a fixpoint loop over every empty cell × 4 directions,
  // ~2.4 s on a level-301 board. Tutorial boards skip the peel and keep it.
  const _peelActive=!tut;
  const _wouldBlockOtherEscape=(r,c,currentIdx)=>{
    if(_peelActive)return false;
    for(let j=currentIdx+1;j<placed.length;j++){
      const o=placed[j];
      const h=o.cells[o.cells.length-1];
      if(onEscapeLine(r,c,h[0],h[1],o.dir))return true;
    }
    return false;
  };

  // Absorption used to be bounded only as a SIDE EFFECT of the gate above:
  // on a packed board most extensions failed the escape-line test, so
  // arrows stopped growing on their own. Retiring the gate removed that
  // brake, and the passes ran to completion — a 10×10 rush board came back
  // as seven 13-to-20-cell serpents covering 97 of 100 cells. maxLen was
  // always the intended ceiling; enforce it directly instead of relying on
  // a gate that happened to say no.
  const _absorbCap=max(6,maxLen);

  // 3a. TAIL extension into empties.
  let absorbed=1;
  while(absorbed>0){
    absorbed=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(occ[r][c]!==-1)continue;
        for(let d=0;d<4;d++){
          const nr=r+DY[d],nc=c+DX[d];
          if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
          if(occ[nr][nc]===-1)continue;
          const arrowIdx=occ[nr][nc];
          const arrow=placed[arrowIdx];
          if(arrow.cells.length>=_absorbCap)continue;
          const tail=arrow.cells[0];
          if(tail[0]!==nr||tail[1]!==nc)continue;
          const head=arrow.cells[arrow.cells.length-1];
          if(onEscapeLine(r,c,head[0],head[1],arrow.dir))continue;
          if(_wouldBlockOtherEscape(r,c,arrowIdx))continue;
          arrow.cells.unshift([r,c]);
          occ[r][c]=arrowIdx;
          absorbed++;
          break;
        }
      }
    }
  }

  // 3b. HEAD extension along escape line. The cell directly in front of
  // each arrow's head is empty by construction (escape line check). We
  // pull that cell into the body, advancing the head one step toward the
  // grid edge. New escape line is shorter by one cell but still valid.
  let extended=1;
  while(extended>0){
    extended=0;
    for(let i=0;i<placed.length;i++){
      const a=placed[i];
      if(a.cells.length===1)continue; // 1-cell heads are absorbed via 3c
      if(a.cells.length>=_absorbCap)continue;
      const head=a.cells[a.cells.length-1];
      const fr=head[0]+DY[a.dir],fc=head[1]+DX[a.dir];
      if(fr<0||fr>=rows||fc<0||fc>=cols)continue; // already at edge
      if(occ[fr][fc]!==-1)continue; // not empty (shouldn't happen)
      if(_wouldBlockOtherEscape(fr,fc,i))continue;
      a.cells.push([fr,fc]);
      occ[fr][fc]=i;
      extended++;
    }
  }

  // 3c. Final small gap pass. We first try 3-8 cell arrows, then 2-5 cell
  // arrows. Single-cell arrows are disabled by default — visually a rare
  // empty cell reads better than a field of tiny arrow dots. Internal QA can
  // pass ?dots=1 to compare the old full-coverage behaviour.
  safety=3000;
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,3,8,placed,{minAcceptLen:3,braid:false});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }
  safety=3000;
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,2,5,placed,{minAcceptLen:2,braid:false});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }

  // Dense fill pass: after the main snakes are placed, keep trying modest
  // 2-4 cell arrows until no legal gap remains. This is intentionally not
  // "braidy"; its job is to remove empty holes without creating 1-cell dots.
  safety=5000;
  while(safety-->0){
    const arrow=tryBuildArrow(occ,rows,cols,rng,2,4,placed,{minAcceptLen:2,braid:false});
    if(!arrow)break;
    for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
    placed.push(arrow);
  }

  // Re-run absorption after the small gap passes. Those newly placed 2-8
  // cell arrows create fresh tails and fresh head escape-front cells, so a
  // second sweep can consume many cells that would otherwise become 1-cell
  // dots.
  absorbed=1;
  while(absorbed>0){
    absorbed=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(occ[r][c]!==-1)continue;
        for(let d=0;d<4;d++){
          const nr=r+DY[d],nc=c+DX[d];
          if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
          if(occ[nr][nc]===-1)continue;
          const arrowIdx=occ[nr][nc];
          const arrow=placed[arrowIdx];
          if(arrow.cells.length>=_absorbCap)continue;
          const tail=arrow.cells[0];
          if(tail[0]!==nr||tail[1]!==nc)continue;
          const head=arrow.cells[arrow.cells.length-1];
          if(onEscapeLine(r,c,head[0],head[1],arrow.dir))continue;
          if(_wouldBlockOtherEscape(r,c,arrowIdx))continue;
          arrow.cells.unshift([r,c]);
          occ[r][c]=arrowIdx;
          absorbed++;
          break;
        }
      }
    }
  }
  extended=1;
  while(extended>0){
    extended=0;
    for(let i=0;i<placed.length;i++){
      const a=placed[i];
      if(a.cells.length===1)continue;
      if(a.cells.length>=_absorbCap)continue;
      const head=a.cells[a.cells.length-1];
      const fr=head[0]+DY[a.dir],fc=head[1]+DX[a.dir];
      if(fr<0||fr>=rows||fc<0||fc>=cols)continue;
      if(occ[fr][fc]!==-1)continue;
      if(_wouldBlockOtherEscape(fr,fc,i))continue;
      a.cells.push([fr,fc]);
      occ[fr][fc]=i;
      extended++;
    }
  }

  // 3d. Internal detours. If a straight segment has two empty cells beside
  // it, route the same arrow through those cells:
  //   A--B becomes A--sideA--sideB--B
  // This fills holes by making existing arrows more snake-like instead of
  // creating separate tiny arrows.
  let detoured=1;
  // Per-arrow detour budget: capped at 12% of original segments + 70%
  // skip rate, so ~3-4% of segments get detoured (was ~32%). User
  // explicitly asked for 80% LESS internal zigzag — the tight back-and-
  // forth bumps that made every snake coil around itself instead of
  // weaving past neighbours. Natural turns from Pass-1 growth survive
  // because they come from the seed walk, not this pass.
  const _detourBudget=new Array(placed.length);
  for(let i=0;i<placed.length;i++){
    _detourBudget[i]=Math.max(0, Math.floor((placed[i].cells.length-1)*0.12));
  }
  while(detoured>0){
    detoured=0;
    for(let i=0;i<placed.length;i++){
      const a=placed[i];
      if(a.cells.length<2)continue;
      if(a.cells.length+2>_absorbCap)continue; // a detour costs two cells
      if(_detourBudget[i]<=0)continue;
      // BUG FIX: detour cannot touch the LAST segment (k = cells.length-2).
      // The last segment cells[N-2]→cells[N-1] must be in arrow.dir so the
      // arrowhead glyph (which is tangent to the last segment) points the
      // direction the arrow will actually escape. A detour at the last
      // segment routes the path sideways and breaks that invariant — the
      // player taps an arrow that visually points UP and it flies LEFT.
      for(let k=0;k<a.cells.length-2;k++){
        // Skip ~70% of segments randomly. Combined with the 12% budget
        // above, this leaves only the rare detour where it most helps
        // chain crossing — most arrows pass through with their natural
        // walk-grown turns intact.
        if(rng()<0.70)continue;
        const p0=a.cells[k],p1=a.cells[k+1];
        const dr=p1[0]-p0[0],dc=p1[1]-p0[1];
        const sides=(dr!==0)?[[0,1],[0,-1]]:[[1,0],[-1,0]];
        let did=false;
        for(const[sr,sc] of sides){
          const r0=p0[0]+sr,c0=p0[1]+sc;
          const r1=p1[0]+sr,c1=p1[1]+sc;
          if(r0<0||r0>=rows||c0<0||c0>=cols)continue;
          if(r1<0||r1>=rows||c1<0||c1>=cols)continue;
          if(occ[r0][c0]!==-1||occ[r1][c1]!==-1)continue;
          const head=a.cells[a.cells.length-1];
          if(onEscapeLine(r0,c0,head[0],head[1],a.dir))continue;
          if(onEscapeLine(r1,c1,head[0],head[1],a.dir))continue;
          if(_wouldBlockOtherEscape(r0,c0,i)||_wouldBlockOtherEscape(r1,c1,i))continue;
          a.cells.splice(k+1,0,[r0,c0],[r1,c1]);
          occ[r0][c0]=i;occ[r1][c1]=i;
          detoured++;
          _detourBudget[i]--;
          did=true;
          break;
        }
        if(did)break;
      }
    }
  }

  if(ALLOW_DOT_FILL){
    safety=3000;
    while(safety-->0){
      const arrow=tryBuildArrow(occ,rows,cols,rng,1,1,placed);
      if(!arrow)break;
      for(const[r,c] of arrow.cells)occ[r][c]=placed.length;
      placed.push(arrow);
    }
  }
  let merged=1;
  while(merged>0){
    merged=0;
    for(let i=placed.length-1;i>=0;i--){
      const a=placed[i];
      if(a.cells.length!==1)continue;
      const ar=a.cells[0][0],ac=a.cells[0][1];
      for(let d=0;d<4;d++){
        const nr=ar+DY[d],nc=ac+DX[d];
        if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
        if(occ[nr][nc]===-1)continue;
        const otherIdx=occ[nr][nc];
        if(otherIdx===i)continue;
        const other=placed[otherIdx];
        if(other.cells.length<2)continue;
        if(other.cells.length>=_absorbCap)continue;
        const tail=other.cells[0];
        if(tail[0]!==nr||tail[1]!==nc)continue;
        const head=other.cells[other.cells.length-1];
        if(onEscapeLine(ar,ac,head[0],head[1],other.dir))continue;
        if(_wouldBlockOtherEscape(ar,ac,otherIdx))continue;
        other.cells.unshift([ar,ac]);
        occ[ar][ac]=otherIdx;
        placed.splice(i,1);
        // Re-index occ — every cell whose value > i decrements by 1
        for(let r2=0;r2<rows;r2++){
          for(let c2=0;c2<cols;c2++){
            if(occ[r2][c2]>i)occ[r2][c2]--;
          }
        }
        merged++;
        break;
      }
    }
  }

  // v2.0.1: derive every direction from the solve order instead of keeping
  // the ones growth happened to pick (see _peelOrient). Runs BEFORE the
  // solvability check on purpose — a successful peel is a constructive
  // certificate, so it turns most of the retry loop below into a no-op
  // rather than adding work on top of it. On a dead end `placed` comes back
  // untouched and the retry path handles the board exactly as before.
  // Tutorial boards are excluded: levels 1-5 teach the tap, and a deliberate
  // one-opener board reads as "nothing works" to someone still learning.
  let _peelOk=false;
  if(!tut){
    const _openMax=lvl<15?max(3,Math.ceil(placed.length*0.15)):lvl<500?3:lvl<1200?4:5;
    const _bias=lvl<50?0.6:lvl<500?0.75:0.85;
    _peelOk=_peelOrient(placed,rows,cols,rng,_openMax,_bias);
  }

  // Solvability check: simulate "tap an arrow whose escape is clear" until
  // all are removed. The check is greedy (always pops the FIRST clear arrow
  // it finds), so a `false` here means "this greedy walk got stuck", not
  // "no walk exists" — there are seeds that fail the check yet are solvable
  // by a smarter player. We still retry on a `false` because the cheapest
  // fix is to find a seed where the greedy proof works.
  //
  // Two things changed from the previous 5-retry pass which shipped weekly
  // levels that players reported "won't solve":
  //   1. Bumped the cap to 30. The weekly seed is fixed for an entire week
  //      — if we lose to bad luck on 5 perturbations, a whole cohort gets
  //      a stuck board for 7 days. 30 attempts at micro-cost is worth it.
  //   2. Replaced the linear `+97*depth` perturbation with a Weyl-sequence
  //      step (`+ 0x9E3779B1 * (depth+1)`) so each retry lands in a far
  //      corner of seed space rather than walking 97 cells over. The
  //      previous step was small enough that bake/snake decisions often
  //      stayed identical across retries.
  const _retryDepth=arguments.length>=3?arguments[2]:0;
  const MAX_RETRIES=30;
  // v2.0 quality gate: a solvable board can still be BORING — too many
  // arrows tappable from the start, no dependency depth. Retry those too,
  // but only while _retryDepth<10; past that accept any solvable board so
  // daily/weekly generation time stays bounded and the lvl-halving escape
  // hatch below keeps its guarantees.
  // Quality gate only below lvl 400 — late-game boards are organically
  // deep (100+ arrows, dense chains), and each extra retry on them costs
  // real milliseconds at level entry.
  const _solvableHere=_isLevelSolvable(placed,rows,cols);
  // A re-roll used to be the only lever on quality, so it was worth ten of
  // them. Now the peel optimises the board it is handed — a re-roll is just
  // another throw of the same dice at the same expected quality, and each
  // throw is a few hundred ms of packing. Two, then take what we have.
  const _qCap=_peelOk?2:10;
  const _qualityHere=_solvableHere&&(lvl>400||_retryDepth>=_qCap||_levelQualityOK(placed,rows,cols,lvl));
  if((!_solvableHere||!_qualityHere)&&_retryDepth<MAX_RETRIES&&lvl>=1){
    const baseSeed=customSeed!=null?customSeed:(lvl*7919+31337);
    // 0x9E3779B1 ≈ 2^32 / phi — Knuth's golden-ratio multiplier, classic
    // tool for spreading sequential indices across a 32-bit space.
    const perturbed=(baseSeed+(0x9E3779B1*(_retryDepth+1))|0);
    return generateLevel(lvl,perturbed,_retryDepth+1);
  }
  if(_retryDepth>=MAX_RETRIES&&!_isLevelSolvable(placed,rows,cols)){
    // We exhausted retries and the greedy solver still can't crack the
    // board. For daily/weekly this is unacceptable — a whole cohort of
    // players gets a stuck puzzle for the day or week. Drop the
    // difficulty by half and retry with a fresh perturbed seed. lvl is
    // strictly halved (so lvl=120 weekly -> lvl=60 first attempt ->
    // lvl=30 if THAT also fails -> ...). At lvl<=2 generation cannot
    // realistically deadlock, so this terminates.
    if(typeof _devWarn==='function')_devWarn('generateLevel.retriesExhausted','lvl='+lvl+' seed='+customSeed+' -> falling back to lvl='+max(2,floor(lvl/2)));
    if(lvl>2){
      const fallbackLvl=max(2,floor(lvl/2));
      const fallbackSeed=(customSeed!=null?customSeed:(lvl*7919+31337))^0xCAFEBABE|0;
      return generateLevel(fallbackLvl,fallbackSeed,0);
    }
  }

  // Reverse so arrows[0] = first solved
  arrows=placed.reverse();
  for(const a of arrows)a.alive=true;
  _recordCells();

  // Locks on most classic boards from LOCK_FROM_LEVEL on — not every one,
  // so they stay a twist rather than the new normal. The first one is
  // guaranteed: that's the board the explainer card introduces them on.
  // Daily/weekly/zen/rush are left as tuned (shared seeds, endless flows).
  if(gameMode==='classic'&&!isDaily&&!isWeekly&&lvl>=LOCK_FROM_LEVEL
     &&(lvl===LOCK_FROM_LEVEL||rng()<.6)){
    _assignLocks(arrows,rows,cols,rng,lvl<150?1:2);
  }
  // Bombs: half the classic boards from BOMB_FROM_LEVEL, the first one
  // guaranteed (its explainer card shows there). Slack — spare moves over
  // the minimum — shrinks with progress: 3, then 2 from 60, 1 from 150.
  if(gameMode==='classic'&&!isDaily&&!isWeekly&&lvl>=BOMB_FROM_LEVEL
     &&(lvl===BOMB_FROM_LEVEL||rng()<.5)){
    _assignBombs(arrows,rows,cols,rng,lvl<120?1:2,lvl<60?3:lvl<150?2:1);
  }

  minMoves=arrows.length;
  moves=0;
  timer=0;
  undosLeft=3;
  _resetBoosterState();
  _resetRunFx();
  _startZoomIntro();

  const key='ae_best_'+lvl;
  bestTime=+localStorage.getItem(key)||0;
}

// Build the "primary snake" — one long winding arrow covering ~half of the
// grid via Warnsdorff's heuristic (move to the unvisited neighbour with
// fewest onward unvisited neighbours). The arrow head ends up on a grid
// edge so the escape line is outside the grid (automatic clear). The body
// trails through the interior in a snake pattern.
function buildPrimaryArrow(occ,rows,cols,rng){
  // Collect free edge cells; pick a random one as the HEAD (the cell the
  // player taps; arrow flies outward from there).
  const edges=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(occ[r][c]!==-1)continue;
      if(r===0||r===rows-1||c===0||c===cols-1)edges.push({r,c});
    }
  }
  if(!edges.length)return null;
  const start=edges[Math.floor(rng()*edges.length)];

  // Determine head's escape direction (outward from edge). For corner
  // cells either of two outward directions is valid — pick one.
  // DX=[1,0,-1,0], DY=[0,-1,0,1]  (right, up, left, down)
  let dir;
  if(start.r===0)dir=1;       // top edge → up
  else if(start.r===rows-1)dir=3; // bottom → down
  else if(start.c===0)dir=2;  // left → left
  else dir=0;                  // right → right

  // Warnsdorff fill from head inward.
  const path=[[start.r,start.c]];
  const visited=new Set();
  visited.add(start.r+','+start.c);
  // Aim for ~30% of cells. Higher fractions choke the filler passes —
  // the snake winds through every row/column, so other arrows can't
  // place an escape line that doesn't cross it, and the level ends up
  // as one solo snake (not playable). Floor at 8.
  const freeCells=rows*cols;
  const targetLen=Math.max(8,Math.floor(freeCells*.3));

  let curR=start.r,curC=start.c;
  while(path.length<targetLen){
    const opts=[];
    for(let d=0;d<4;d++){
      const nr=curR+DY[d],nc=curC+DX[d];
      if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
      if(occ[nr][nc]!==-1)continue;
      if(visited.has(nr+','+nc))continue;
      // Warnsdorff degree: count nr,nc's unvisited neighbours
      let deg=0;
      for(let dd=0;dd<4;dd++){
        const mr=nr+DY[dd],mc=nc+DX[dd];
        if(mr<0||mr>=rows||mc<0||mc>=cols)continue;
        if(occ[mr][mc]!==-1)continue;
        if(visited.has(mr+','+mc))continue;
        deg++;
      }
      opts.push({r:nr,c:nc,deg});
    }
    if(!opts.length)break;
    // Sort by degree ascending; tie-break with rng so different seeds
    // produce different paths even if degrees match.
    opts.sort((a,b)=>(a.deg-b.deg)||(rng()-.5));
    const pick=opts[0];
    path.push([pick.r,pick.c]);
    visited.add(pick.r+','+pick.c);
    curR=pick.r;curC=pick.c;
  }

  if(path.length<8)return null;

  // arrow.cells convention: cells[0]=tail, cells[N-1]=head. We grew from
  // head outward, so reverse.
  const cells=path.reverse();
  return {cells,dir};
}

// Build one arrow by EXHAUSTIVE candidate search.
// Special case: when minLen==1 && maxLen==1, build a single-cell arrow (just a
// head with a direction). Used in the gap-fill pass to plug isolated empties.
// `placed` (optional) is the array of arrows already placed — used for
// direction-variance penalty (#6: discourage clusters of same-direction
// arrows so the puzzle isn't solvable by "tap everything pointing east").
function tryBuildArrow(occ,rows,cols,rng,minLen,maxLen,placed,opts){
  opts=opts||{};
  const oneCell=(minLen===1&&maxLen===1);
  const minAcceptLen=opts.minAcceptLen||minLen;
  const braidMode=opts.braid!==false;
  const candidates=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(occ[r][c]!==-1)continue;
      for(let d=0;d<4;d++){
        // For multi-cell arrows we need a free cell behind the head too.
        if(!oneCell){
          const bd=(d+2)%4;
          const br=r+DY[bd],bc=c+DX[bd];
          if(br<0||br>=rows||bc<0||bc>=cols)continue;
          if(occ[br][bc]!==-1)continue;
        }
        // Escape line from head to grid edge. Allow up to 1 blocker — a
        // body cell of another arrow on this line creates a chain
        // dependency (tap blocker first, then this arrow flies). The
        // game's canEscape() already enforces this rule, so the
        // generator can use it as a placement-quality lever. Hard cap
        // at 1 keeps deadlock risk low; isLevelSolvable() at the end
        // verifies any seed before we ship it.
        let blockerCount=0;
        let escLen=0;
        let cr=r+DY[d],cc=c+DX[d];
        while(cr>=0&&cr<rows&&cc>=0&&cc<cols){
          if(occ[cr][cc]!==-1)blockerCount++;
          escLen++;
          cr+=DY[d];cc+=DX[d];
        }
        if(blockerCount>_maxBlockers)continue;
        // Score:
        //   +4.0 per neighbor already occupied → new arrows start attached to
        //        existing strands instead of spawning as separate islands.
        //   +2.0 per unique adjacent arrow → heads prefer busy knots, not just
        //        one flat parallel side.
        //   -2.0 if neighbor arrow has the SAME escape direction (#6 direction
        //        variance — prevents "all arrows point east" clusters that the
        //        player can solve by tap-spamming in one axis)
        //   -0.12 × Chebyshev distance from center → seed the first arrow near
        //        the middle of the grid so the cluster has room to expand
        //        outward in all directions (prevents hollow-center effect)
        let s=rng();
        const adjArrows=new Set();
        for(let dd=0;dd<4;dd++){
          const nr=r+DY[dd],nc=c+DX[dd];
          if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&occ[nr][nc]!==-1){
            s+=braidMode?7.0:3.5;
            adjArrows.add(occ[nr][nc]);
            if(placed&&placed[occ[nr][nc]]&&placed[occ[nr][nc]].dir===d)s-=8.0;
          }
        }
        if(braidMode)s+=adjArrows.size*2.0;
        const cR=(rows-1)/2,cC=(cols-1)/2;
        const distCenter=max(abs(r-cR),abs(c-cC));
        s-=distCenter*.12;
        // Variant D — chain mode bonus: prefer heads with LONG escape lines.
        // Each cell on the line is potential blocker once a later arrow's
        // body lands there, which creates a dependency chain at game time.
        // Weight bumped 0.5 → 1.5 (v1.0.15 tuning): heads with the longest
        // exit corridor are now strongly preferred, so subsequent arrows
        // routinely have something meaningful to BLOCK.
        if(CHAIN_MODE)s+=escLen*4;
        // Real-puzzle bonus: prefer heads whose exit is blocked by already
        // placed arrows. Solvability filtering rejects cycles, but this
        // makes the generator actively build locks instead of mostly
        // independent snakes. v2.0: deeper locks (up to _maxBlockers)
        // score progressively HIGHER — a 3-deep lock beats a 1-deep one.
        if(CHAIN_MODE&&placed&&placed.length>4){
          if(blockerCount>=1&&blockerCount<=_maxBlockers)s+=10+blockerCount*4;
          else if(blockerCount===0)s-=4;
        }
        // Direction-variance bonus: every level should present all four
        // exit directions or the player can spam-tap a single column
        // and clear the board with no thinking. v2 strengthens the
        // bonus/penalty AND introduces a hard kick for any direction
        // that's been completely skipped — the first arrow in an unused
        // direction lands a +18 bonus so the algorithm reliably plants
        // one of each before piling onto the popular sides.
        if(placed&&placed.length>3){
          const dirCounts=[0,0,0,0];
          for(const o of placed)dirCounts[o.dir]++;
          let minC=dirCounts[0],maxC=dirCounts[0];
          for(let dd=1;dd<4;dd++){
            if(dirCounts[dd]<minC)minC=dirCounts[dd];
            if(dirCounts[dd]>maxC)maxC=dirCounts[dd];
          }
          // Hard kick for never-seen directions
          if(dirCounts[d]===0)s+=18;
          else if(dirCounts[d]===minC&&maxC>minC)s+=12;     // was +7
          else if(dirCounts[d]===maxC&&maxC>minC+1)s-=10;   // was -5
        }
        // Variant E — clusters mode penalty: arrow heads far from any
        // cluster center get strongly docked, so heads gather around the
        // chosen island centers and leave empty corridors between them.
        if(CLUSTERS_MODE&&_clusterCenters.length){
          let minD=Infinity;
          for(const cc of _clusterCenters){
            const dd=max(abs(r-cc.r),abs(c-cc.c));
            if(dd<minD)minD=dd;
          }
          s-=minD*.5;
        }
        s+=patternCellBias(r,c,d,rows,cols,true);
        candidates.push({hr:r,hc:c,dir:d,s});
      }
    }
  }
  if(candidates.length===0)return null;
  candidates.sort((a,b)=>b.s-a.s);

  // Single-cell arrow shortcut: return the best candidate immediately
  if(oneCell){
    const best=candidates[0];
    return{cells:[[best.hr,best.hc]],dir:best.dir};
  }

  for(const cand of candidates){
    const{hr,hc,dir}=cand;
    const bd=(dir+2)%4;
    const br0=hr+DY[bd],bc0=hc+DX[bd];

    // Always target the maximum length. Growth stops naturally when all
    // neighbors are blocked, so short paths only happen in tight corners.
    const targetLen=maxLen;
    const cells=[[br0,bc0],[hr,hc]];
    const used=new Set();
    used.add(hr+','+hc);
    used.add(br0+','+bc0);
    let br=br0,bc=bc0;
    let lastStepDir=bd;
    let straightRun=1;
    let turnCount=0; // #4: count direction changes during growth

    while(cells.length<targetLen){
      const opts=[];
      for(let d=0;d<4;d++){
        const nr=br+DY[d],nc=bc+DX[d];
        if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
        if(occ[nr][nc]!==-1)continue;
        if(used.has(nr+','+nc))continue;
        if(onEscapeLine(nr,nc,hr,hc,dir))continue;
        opts.push({r:nr,c:nc,d});
      }
      if(opts.length===0)break;
      // Hard cap: never extend a straight run past 2 cells. Without this,
      // arrows can grow long straight along the grid edge (no neighbors → no
      // proximity penalty) and the player solves the level by tapping the
      // outer ring in order. We physically refuse the option here.
      const filteredOpts=opts.filter(o=>!(o.d===lastStepDir&&straightRun>=2));
      const useOpts=filteredOpts.length?filteredOpts:opts; // fallback only if turn impossible
      const scored=useOpts.map(({r,c,d})=>{
        let s=rng();
        // Proximity bonus: high enough that later arrows weave through existing
        // strands instead of taking isolated open-space walks.
        let occupied=[false,false,false,false];
        const adjArrows=new Set();
        for(let dd=0;dd<4;dd++){
          const nr=r+DY[dd],nc=c+DX[dd];
          if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&occ[nr][nc]!==-1){
            s+=braidMode?6.0:4.0;
            occupied[dd]=true;
            adjArrows.add(occ[nr][nc]);
          }
        }
        if(braidMode)s+=adjArrows.size*1.8;
        // Sandwich bonus: occupied on OPPOSITE sides → path threads a corridor.
        // This is the "braid" signal: prefer cells that sit between strands.
        if(occupied[0]&&occupied[2])s+=braidMode?7.0:2.5;
        if(occupied[1]&&occupied[3])s+=braidMode?7.0:2.5;
        // Lane bonus: when moving horizontally, prefer having strands above or
        // below; when moving vertically, prefer strands left/right. It creates
        // long adjacent runs that read like woven ropes.
        if(braidMode&&(d===0||d===2)&&(occupied[1]||occupied[3]))s+=3.8;
        if(braidMode&&(d===1||d===3)&&(occupied[0]||occupied[2]))s+=3.8;
        // After a seed arrow exists, isolated cells are visually weak. Keep a
        // small escape hatch early in growth so the arrow can still leave a
        // pocket and become long, but otherwise pull it back into the knot.
        if(braidMode&&placed&&placed.length>0&&adjArrows.size===0&&cells.length>4)s-=3.0;
        if(d!==lastStepDir)s+=2.0;
        else if(straightRun>=2)s-=2.0;
        // Variant D — chain mode: STRONG bonus if this cell is on the escape
        // line of an already-placed arrow. That arrow solves AFTER this one
        // in game order; placing our body on its escape line means the player
        // can only solve it once we're removed → adds one link to the chain.
        if(CHAIN_MODE&&placed){
          let crossings=0;
          for(let j=0;j<placed.length;j++){
            const o=placed[j];
            const oh=o.cells[o.cells.length-1];
            if(onEscapeLine(r,c,oh[0],oh[1],o.dir))crossings++;
          }
          // Weight bumped 2.5 → 8 (v1.0.15 tuning). Crossing another
          // arrow's escape line is the single most-important property
          // for puzzle quality — every crossing translates to "tap A
          // before B" gameplay. With the previous 2.5 the bonus was
          // routinely outweighed by length / turn / center bonuses, so
          // arrows preferred isolated zigzag spirals to chain links.
          s+=crossings*20;
        }
        // Penetration bonus — body cells in TIGHT enclosed pockets get
        // a strong bonus. Counts how many of the 4 neighbours are walls
        // or already-placed body cells. ≥3 = the cell is inside a "U"
        // or "C" pocket of another arrow → exactly the empty interior
        // the user pointed out. Encourages snakes to wind INTO the
        // negative space of earlier-placed snakes instead of running
        // around them.
        let surroundedBy=0;
        for(let dd=0;dd<4;dd++){
          const nr2=r+DY[dd],nc2=c+DX[dd];
          if(nr2<0||nr2>=rows||nc2<0||nc2>=cols)surroundedBy++;
          else if(occ[nr2][nc2]!==-1)surroundedBy++;
        }
        if(surroundedBy>=3)s+=14;
        else if(surroundedBy>=2)s+=4;
        // Variant E — clusters mode: penalty for body cells far from nearest
        // cluster center, keeping the arrow inside its assigned island.
        if(CLUSTERS_MODE&&_clusterCenters.length){
          let minD=Infinity;
          for(const cc of _clusterCenters){
            const dd=max(abs(r-cc.r),abs(c-cc.c));
            if(dd<minD)minD=dd;
          }
          s-=minD*.4;
        }
        s+=patternCellBias(r,c,d,rows,cols,false);
        return{cell:[r,c],d,s};
      });
      scored.sort((a,b)=>b.s-a.s);
      const pick=scored[0];
      cells.unshift(pick.cell);
      used.add(pick.cell[0]+','+pick.cell[1]);
      br=pick.cell[0];bc=pick.cell[1];
      if(pick.d===lastStepDir)straightRun++;else{straightRun=1;lastStepDir=pick.d;turnCount++}
    }

    // #4 Min turn requirement: long arrows (>5 cells) must twist at least
    // twice. A 6-cell L-shape (1 turn) was visually flat and let the player
    // solve it by sliding their finger. Reject and try the next candidate.
    if(cells.length>5&&turnCount<2)continue;

    if(cells.length>=minAcceptLen)return{cells,dir};
  }
  return null;
}

// Is (r,c) on the escape line of an arrow with head (hr,hc) in direction dir?
function onEscapeLine(r,c,hr,hc,dir){
  let cr=hr+DY[dir],cc=hc+DX[dir];
  while(cr>=0&&cr<gridRows&&cc>=0&&cc<gridCols){
    if(cr===r&&cc===c)return true;
    cr+=DY[dir];cc+=DX[dir];
  }
  return false;
}

// ── v2.2 chained generator ───────────────────────────────────────────
// Field study of Arrows GO! (levels 1-5 played on device, 2026-10-12): at
// almost every step of a solve exactly ONE arrow is tappable — ~1.5 on
// average, 1 at the start of level 4 — while ours offered 2.7-6 (up to 12).
// With monotone removal there is never a wrong order, so "how many arrows
// can I tap right now" IS the difficulty: one means searching a tangled
// board for the single way in; six means tapping anything.
//
// Construction runs in reverse solve order: the first arrow placed leaves
// last. A new arrow must (a) have its own escape ray clear of everything
// already placed — those all leave after it, so it is solvable by
// construction — and (b) lie across the rays of every arrow that is
// currently free, so that once it is down, it is the only way in. Covering
// several rays at once forces the arrow to meander around its neighbours,
// which is where the "intricate" look comes from: the long outer snake
// wrapping their level 4 is just the last arrow placed.
//
// `branch` is the difficulty knob: the most free arrows a placement may
// leave uncovered + 1. 1 = a single path through the whole board.
function _chainDir(p,h){const dr=h[0]-p[0],dc=h[1]-p[1];return dc===1?0:dr===-1?1:dc===-1?2:3}
// Self-avoiding random walk over empty cells, biased to keep turning so
// arrows bend around each other instead of running straight.
function _chainWalk(occ,R,C,start,L,rng,turn){
  const path=[[(start/C)|0,start%C]];
  const used=new Set([start]);
  let d=(rng()*4)|0;
  while(path.length<L){
    const [r,c]=path[path.length-1];
    const opts=[];
    for(let k=0;k<4;k++){
      const nr=r+DY[k],nc=c+DX[k];
      if(nr<0||nr>=R||nc<0||nc>=C)continue;
      const id=nr*C+nc;
      if(occ[id]>=0||used.has(id))continue;
      if(k===(d+2)%4)continue;
      opts.push(k);
    }
    if(!opts.length)break;
    // Hug: prefer steps next to cells that are already taken. A walk out
    // in open space ends up wrapping empty pockets nothing can ever fill
    // (no head inside one has a way out); hugging packs the board tight.
    let k=-1,bestS=-1;
    for(const o of opts){
      const nr=r+DY[o],nc=c+DX[o];
      let nb=0;
      for(let q=0;q<4;q++){const ar=nr+DY[q],ac=nc+DX[q];if(ar<0||ar>=R||ac<0||ac>=C||occ[ar*C+ac]>=0)nb++}
      const s=nb*1.2+(o===d?(1-turn)*2:turn*2)+rng()*1.5;
      if(s>bestS){bestS=s;k=o}
    }
    d=k;

    const nr=r+DY[k],nc=c+DX[k];
    used.add(nr*C+nc);path.push([nr,nc]);
  }
  return path;
}
// Guided path: start on one free arrow's ray, then repeatedly BFS through
// empty cells to the nearest cell on a ray not yet covered and walk there.
// A random walk almost never crosses three rays; this crosses them on
// purpose — and bends around whatever is in between to do it.
function _chainGuided(occ,R,C,start,rayOf,F,maxLen,rng){
  const path=[[(start/C)|0,start%C]];
  const used=new Set([start]);
  const cov=new Set(rayOf.get(start)||[]);
  while(cov.size<F.length&&path.length<maxLen){
    const [r0,c0]=path[path.length-1];
    const prev=new Map([[r0*C+c0,-1]]);
    const q=[r0*C+c0];let hit=-1;
    for(let qi=0;qi<q.length&&hit<0;qi++){
      const k=q[qi],r=(k/C)|0,c=k%C;
      const dirs=[0,1,2,3];

// Level schedule for the chained generator, after the Arrows GO! pattern:

// sawtooth's peaks; the normal ones between them are the breathers.
const HARD_COLOR='#8a4fc7';

  // Long-arrow boards (14+ cells) came out as a handful of snakes — eleven
  // taps on level 301 — which reads as easy however tangled it looks.

  // of the board each keep a free arrow of their own and the one-way-in feel
  // dissolves (measured: ~2.2 tappable per step at 16×12, ~3.5-4 at 26×20).
  if(hard)cols=min(16,Math.round(cols*1.3));

  const rows=Math.round(cols*1.3);
  const maxLen=clp(5+Math.floor(lvl/25),5,9)+(hard?3:0);

}

function _buildChained(R,C,rng,cfg){

    // guided path carries a pocket seed out to the rays it has to cover.

      // the body first and testing the head afterwards failed most tries —
      // a meandering path rarely ends facing open air.

  const onRayFrom=(r0,c0,from)=>{

// on level 10 — reads to a player as an empty level; Arrows GO! boards
// have no holes at all. Each hole gets the best of three moves:
//   · grow a neighbour's tail into it (that arrow's ray is untouched),
//   · advance a neighbour's head into it (the head turns to face the step),
//   · lay a new short arrow through it and the holes next to it,
//   · or, for a lone hole walled in by the middles of arrows, cut one of

// ── Constructive orientation: the peel ──────────────────────────────

// Measured on 16 procedural boards (lvl 301-319): 22 arrows, 6.3 of them
// tappable on move 1 — 29%. Shape levels over the same metric sit at
// 10-14%, and the whole difference is HOW the direction gets chosen:
// tryBuildArrow commits to a direction while it grows the body, so the
// dependency graph is a by-product of growth. gen-shape-levels.js instead
// places bodies first and derives every direction by simulating the solve,
// which lets it spend outward-facing orientations early and hoard the
// inward-facing ones for deep waves. Same technique, now on every board.
//
// The free variable is orientation: reversing a snake's cell order moves
// its head to the other end without moving a single cell, so no OTHER
// arrow's escape ray changes. 2^N configurations, searched here with the
// solve order as the guide.
function _peelDir(cells,flip){
  const n=cells.length;

// option: on screen the arrow would fly through itself. Putting `self` in
// its own blocker set makes the peel see it as blocked for as long as the
// arrow exists — i.e. never pickable — with no special case anywhere else.
// (canEscape ignores the arrow's own cells, so this must hold at
// generation time: 935 shipped picture-level arrows and ~5 per generated
// board pointed into themselves before this.)

    const j=occ[cr*cols+cc];

// Wave decomposition over the precomputed dependency sets. Cheap enough to
// call inside the repair loop because `deps` never has to be rebuilt —
// flipping one arrow only swaps which of ITS two sets is in play.
function _peelMetrics(deps,orientation,ids){

      if(ok)ready.push(i);

// only frees cells, so a clear arrow stays clear and _isLevelSolvable's
