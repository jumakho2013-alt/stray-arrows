// --- MENU ---
// v3 menu icons — one stroke family (2px-at-24, round caps) so the mode
// tiles and bottom bar read as one set. `s` ≈ icon height.
function _menuIcon(kind,x,y,s,col){
  const k=s/24;
  X.save();X.translate(x,y);X.scale(k,k);
  X.strokeStyle=col;X.fillStyle=col;X.lineWidth=2.2;X.lineCap='round';X.lineJoin='round';
  X.beginPath();
  if(kind==='calendar'){
    X.roundRect(-10,-8,20,18,3);X.moveTo(-10,-2);X.lineTo(10,-2);
    X.moveTo(-5,-11);X.lineTo(-5,-6);X.moveTo(5,-11);X.lineTo(5,-6);X.stroke();
    X.beginPath();X.arc(0,4,2.2,0,TAU);X.fill();
  }else if(kind==='trophy'){
    X.moveTo(-7,-10);X.lineTo(7,-10);X.lineTo(6,0);X.quadraticCurveTo(0,6,-6,0);X.closePath();
    X.moveTo(-7,-7);X.quadraticCurveTo(-12,-6,-9,-1);X.moveTo(7,-7);X.quadraticCurveTo(12,-6,9,-1);
    X.moveTo(0,3);X.lineTo(0,8);X.moveTo(-5,10);X.lineTo(5,10);X.stroke();
  }else if(kind==='leaf'){
    X.moveTo(-9,9);X.quadraticCurveTo(-10,-9,10,-10);X.quadraticCurveTo(9,8,-9,9);X.closePath();
    X.moveTo(-9,9);X.lineTo(4,-4);X.stroke();
  }else if(kind==='clock'){
    X.arc(0,2,9,0,TAU);X.moveTo(0,2);X.lineTo(0,-3);X.moveTo(0,2);X.lineTo(4,4);
    X.moveTo(-3,-10);X.lineTo(3,-10);X.moveTo(0,-10);X.lineTo(0,-7);X.stroke();
  }else if(kind==='grid'){
    for(const[ox,oy] of [[-9,-9],[1,-9],[-9,1],[1,1]])X.roundRect(ox,oy,8,8,2);
    X.stroke();
  }else if(kind==='bars'){
    X.moveTo(-8,10);X.lineTo(-8,1);X.moveTo(0,10);X.lineTo(0,-8);X.moveTo(8,10);X.lineTo(8,-3);X.stroke();
  }else if(kind==='medal'){
    X.moveTo(-5,-11);X.lineTo(-1,-3);X.moveTo(5,-11);X.lineTo(1,-3);X.stroke();
    X.beginPath();X.arc(0,3,7,0,TAU);X.stroke();
    X.beginPath();X.arc(0,3,2.5,0,TAU);X.fill();
  }
  X.restore();
}
function drawMenu(){
  drawBg();

  // Animated background: many arrows drifting across the screen.
  // Skipped entirely when reducedMotion is on (decorative-only motion).
  if(!reducedMotion){
  if(!window._bgArrows){
    window._bgArrows=[];
    // v2: dimmer + fewer + slower. The previous 14 arrows at .08-.18
    // alpha read as "look at me, decoration!" — user wanted them to be
    // barely-perceptible texture, not a layer competing with the title.
    // Dropped count 14 -> 8, alpha 0.08-0.18 -> 0.03-0.07, speed
    // 12-35 -> 6-18 px/s.
    for(let i=0;i<8;i++)window._bgArrows.push({
      x:rnd(0,W),y:rnd(0,H),dir:rndI(0,3),sz:rnd(28,52),
      spd:rnd(6,18),life:rnd(0,1),dur:rnd(8,14),alpha:rnd(.03,.07)
    });
  }
  for(const a of window._bgArrows){
    a.life+=dt/a.dur;
    a.x+=DX[a.dir]*a.spd*dt;
    a.y+=DY[a.dir]*a.spd*dt;
    // Fade in first 20%, full middle, fade out last 20%
    const lp=a.life%1;
    const fade=lp<.2?lp/.2:(lp>.8?(1-lp)/.2:1);
    X.globalAlpha=a.alpha*fade;
    drawArrow(a.x,a.y,a.dir,a.sz,TH.arrow,a.alpha*fade);
    X.globalAlpha=1;
    // Reset when lifecycle ends or goes off screen
    if(a.life>=1||a.x<-60||a.x>W+60||a.y<-60||a.y>H+60){
      // Same ranges as the spawn above — this used to respawn them at the
      // pre-v2 brightness and speed, undoing the "barely there" pass after
      // one cycle.
      a.x=rnd(40,W-40);a.y=rnd(40,H-40);
      a.dir=rndI(0,3);a.sz=rnd(28,52);a.spd=rnd(6,18);
      a.life=0;a.dur=rnd(8,14);a.alpha=rnd(.03,.07);
    }
  }
  } // end !reducedMotion bg arrows

  // Title — moved further down (clear of dynamic island + breathing room
  // for the heavier stats panel below). v2: ARROWS line gets a slow gold→
  // deepGold→gold gradient flow (cycle TH.motionTitleCycle ms). Reduced-
  // motion players see the static accent. The phase is a function of gt
  // (game-clock seconds) so the gradient is in lockstep across re-renders.
  txtD(t('title1'),W/2,H*.16,36,TH.text);
  if (reducedMotion) {
    txtD(t('title2'),W/2,H*.22,36,TH.accent);
  } else {
    const phase = (gt * 1000 / TH.motionTitleCycle) % 1;
    // Smooth lerp between accent and accentDeep using a triangular wave so
    // the start and end of the cycle match (no visible "snap").
    const tri = Math.abs(phase * 2 - 1);
    const grad = X.createLinearGradient(W/2 - 80, 0, W/2 + 80, 0);
    grad.addColorStop(0, TH.accent);
    grad.addColorStop(0.5, tri < 0.5 ? TH.accentDeep : TH.accent);
    grad.addColorStop(1, TH.accent);
    txtD(t('title2'),W/2,H*.22,36,grad);
  }
  txt(t('tagline'),W/2,H*.265,12,TH.textSec);

  // v3: the four-figure stats panel is gone from the menu — level lives on
  // the PLAY button, the rest on the Stats screen.

  // v2.0 showcase card: teases the NEXT shape milestone as a dotted
  // silhouette (no name — the mystery IS the pull). Tap → level select
  // at that page. Cached offscreen per level id.
  {
    // Scan forward for the next key carrying a shape id rather than
    // assuming the every-5th layout, so a future data change can't
    // desync the card. Cached per maxLevel: the scan is ~2k map hits and
    // this runs inside drawMenu.

    if(_showcaseNextFor!==maxLevel&&typeof window!=='undefined'&&window.HANDCRAFTED_LEVELS){
      _showcaseNextFor=maxLevel;_showcaseNextL=0;
      for(let l=Math.max(21,maxLevel);l<=2225;l++){
        const h=window.HANDCRAFTED_LEVELS[l];
        if(h&&h.t){_showcaseNextL=l;break;}
      }
    }
    const nextL=_showcaseNextL;
    const hcL=nextL?window.HANDCRAFTED_LEVELS[nextL]:null;
    if(hcL&&hcL.t){
      const scY=H*.355,scW=W-56,scH=84;
      const hv=abs(mx-W/2)<scW/2&&abs(my-scY)<scH/2;
      X.fillStyle=darkMode?'rgba(0,0,0,.30)':'rgba(61,43,31,.08)';
      X.beginPath();X.roundRect(W/2-scW/2,scY-scH/2+4,scW,scH,18);X.fill();
      X.fillStyle=hv?TH.btnHover:TH.surface;
      X.beginPath();X.roundRect(W/2-scW/2,scY-scH/2,scW,scH,18);X.fill();
      // Silhouette thumb (cached): arrow cells of the level as dots.
      // Cache key includes the theme so a dark/light toggle re-tints.
      const _sck=nextL+(darkMode?'d':'l');
      if(_showcaseCacheLvl!==_sck){
        _showcaseCacheLvl=_sck;
        _showcaseCache=document.createElement('canvas');
        _showcaseCache.width=76*2;_showcaseCache.height=56*2;
        const sc2=_showcaseCache.getContext('2d');
        sc2.scale(2,2);
        let minR=1e9,maxR=-1e9,minC=1e9,maxC=-1e9;
        for(const a of hcL.arrows)for(const[r,c] of a.c){
          if(r<minR)minR=r;if(r>maxR)maxR=r;
          if(c<minC)minC=c;if(c>maxC)maxC=c;
        }
        const w=maxC-minC+1,h=maxR-minR+1;
        const k=Math.min(76/w,56/h)*.92;
        const ox=(76-w*k)/2,oy=(56-h*k)/2;
        sc2.fillStyle=TH.accent;
        for(const a of hcL.arrows)for(const[r,c] of a.c){
          sc2.beginPath();
          sc2.arc(ox+(c-minC+.5)*k,oy+(r-minR+.5)*k,Math.max(.8,k*.32),0,TAU);
          sc2.fill();
        }
      }
      X.drawImage(_showcaseCache,W/2-scW/2+14,scY-28,76,56);
      // Copy
      txtP(t('nextShape'),W/2+22,scY-16,9,TH.textSec);
      txtP(t('levelWord')+' '+nextL,W/2+22,scY+2,16,TH.text);
      const away=nextL-maxLevel;
      txt(away>0?(away+' '+t('levelsAway')):'▶',W/2+22,scY+22,10,TH.accent);
      if(!_inputBlocked()&&tapped&&abs(tapX-W/2)<scW/2&&abs(tapY-scY)<scH/2){
        sfx.tap();tapped=false;
        goto('levels',()=>{levelsPage=floor((nextL-1)/25)});
      }
    }
  }

  // ── v3 PLAY hero: the one big primary button, carrying the level number
  // so the menu needs no separate stats panel. Lipped like every v3 button,
  // with a slow breathing scale (skipped under reduced motion).
  {
    const bx=W/2,by=H*.49,bw=W-72,bh=84,lip=6;
    const blocked=_inputBlocked();
    const hv=!blocked&&abs(mx-bx)<bw/2&&abs(my-by)<bh/2;
    const pressed=btnPressScale(bx,by,bw,bh)<.999;
    const breathe=reducedMotion?1:1+.012*sin(gt*2.4);
    X.save();X.translate(bx,by);X.scale(breathe,breathe);X.translate(-bx,-by);
    const top=by-bh/2-lip/2,sink=pressed?lip*.7:0;
    X.fillStyle=_shade(TH.accent,.78);
    X.beginPath();X.roundRect(bx-bw/2,top+lip,bw,bh,24);X.fill();
    X.fillStyle=TH.accent;
    X.beginPath();X.roundRect(bx-bw/2,top+sink,bw,bh,24);X.fill();
    if(hv&&!pressed){X.fillStyle='rgba(255,255,255,.08)';X.beginPath();X.roundRect(bx-bw/2,top,bw,bh,24);X.fill();}
    const cy=top+sink+bh/2;
    txt(t('play'),bx-10,cy-10,28,'#ffffff','center','900');
    drawPlayIcon(bx+bw*.30,cy-10,13,'#ffffff');
    txt(t('levelWord')+' '+maxLevel+(isHardLevel(maxLevel)?' · '+t('diffHard'):''),bx,cy+20,13,'rgba(255,255,255,.85)','center','700');
    X.restore();
    if(!blocked&&tapped&&abs(tapX-bx)<bw/2&&abs(tapY-by)<bh/2){
      sfx.tap();haptic(8);tapped=false;
      goto('play',()=>{isDaily=false;isWeekly=false;level=maxLevel;generateLevel(level)});
    }
  }

  // ── Mode tiles: four square, iconed, in one row. The 3×2 grid of
  // identical text pills read as a form; tiles with a picture read as
  // places to go. A done daily/weekly gets a check badge.
  {
    const modes=[
      {k:'daily',icon:'calendar',col:TH.accent,done:isDailyDone(),go:()=>goto('play',startDailyBoard)},
      {k:'weekly',icon:'trophy',col:TH.warning,done:isWeeklyDone(),go:()=>goto('play',startWeeklyBoard)},
      {k:'zen',icon:'leaf',col:TH.success,done:false,go:()=>goto('play',startZen)},
      {k:'rush',icon:'clock',col:HARD_COLOR,done:false,go:()=>goto('play',startRush)},
    ];
    const gap=10,tw=(W-48-gap*3)/4,th=tw,ty=H*.635,lip=4;
    const blocked=_inputBlocked();
    for(let i=0;i<4;i++){
      const m=modes[i],x=24+tw/2+i*(tw+gap);
      const hv=!blocked&&abs(mx-x)<tw/2&&abs(my-ty)<th/2;
      const pressed=btnPressScale(x,ty,tw,th)<.999;
      const top=ty-th/2-lip/2,sink=pressed?lip*.7:0;
      X.fillStyle=_shade(TH.btnBg,.9);
      X.beginPath();X.roundRect(x-tw/2,top+lip,tw,th,16);X.fill();
      X.fillStyle=hv?TH.btnHover:TH.btnBg;
      X.beginPath();X.roundRect(x-tw/2,top+sink,tw,th,16);X.fill();
      _menuIcon(m.icon,x,top+sink+th*.40,th*.32,m.col);
      txt(t(m.k),x,top+sink+th*.78,11,TH.text,'center','800');
      if(m.done){
        X.fillStyle=TH.success;X.beginPath();X.arc(x+tw/2-12,top+sink+12,7,0,TAU);X.fill();
        X.strokeStyle='#fff';X.lineWidth=1.8;X.lineCap='round';X.lineJoin='round';
        X.beginPath();X.moveTo(x+tw/2-15,top+sink+12);X.lineTo(x+tw/2-12.5,top+sink+14.5);X.lineTo(x+tw/2-8.5,top+sink+9.5);X.stroke();
      }
      if(!blocked&&tapped&&abs(tapX-x)<tw/2&&abs(tapY-ty)<th/2){sfx.tap();tapped=false;m.go();}
    }
  }

  // ── Bottom bar: levels · stats · achievements as icons with captions.
  {
    const items=[
      {k:'levels',icon:'grid',go:()=>goto('levels',()=>{levelsPage=floor((level-1)/25)})},
      {k:'stats',icon:'bars',go:()=>goto('stats')},
      {k:'achievements',icon:'medal',go:()=>goto('achievements',()=>{achPage=0}),badge:achUnlockedCount()+'/'+ACHIEVEMENTS.length},
    ];
    const by=H*.80,slot=(W-48)/3;
    const blocked=_inputBlocked();
    for(let i=0;i<3;i++){
      const it=items[i],x=24+slot/2+i*slot;
      const hv=!blocked&&abs(mx-x)<slot/2&&abs(my-by)<28;
      _menuIcon(it.icon,x,by-8,22,hv?TH.text:TH.textSec);
      txt(t(it.k)+(it.badge?' '+it.badge:''),x,by+20,10,hv?TH.text:TH.textSec,'center','700');
      if(!blocked&&tapped&&abs(tapX-x)<slot/2&&abs(tapY-by)<30){sfx.tap();tapped=false;it.go();}
    }
  }

  // Settings gear top-right — y is safe-area-aware so it adapts to any
  // future iPhone with a larger notch / Dynamic Island inset.
  const gx=W-36,gy=Math.max(54,safeTop+18);
  const ghv=abs(mx-gx)<20&&abs(my-gy)<20;
  X.strokeStyle=ghv?TH.text:TH.textSec;X.lineWidth=1.5;
  X.beginPath();X.arc(gx,gy,10,0,TAU);X.stroke();
  X.fillStyle=ghv?TH.text:TH.textSec;
  X.beginPath();X.arc(gx,gy,3,0,TAU);X.fill();
  // Gear teeth
  for(let i=0;i<6;i++){const a=i*TAU/6+gt*.5;
    X.beginPath();X.arc(gx+cos(a)*10,gy+sin(a)*10,2,0,TAU);X.fill()}
  if(tapped&&abs(tapX-gx)<20&&abs(tapY-gy)<20){sfx.tap();tapped=false;goto('settings')}

  // Coins — nudged slightly below the gear for better visual balance.
  // The whole coin chip is a tappable entry to the Skins shop (tap-your-coins
  // -to-spend idiom); a small chevron hints it's interactive.
  // v2.0.1: layout flows from the ACTUAL text width — a 5-digit balance
  // used to run straight into the chevron and calendar chip.
  const _topY=Math.max(55,safeTop+19);
  X.font='600 13px Nunito,sans-serif';
  const _coinTxtW=X.measureText(coins+'').width;
  const _chevX=52+_coinTxtW+12;
  const _coinHitR=_chevX+8;
  const _coinHv=mx>=20&&mx<=_coinHitR&&abs(my-_topY)<16;
  drawCoin(36,_topY,7);
  txt(coins+'',52,_topY,13,TH.star,'left');
  _drawChevron(_chevX,_topY,5,_coinHv?TH.accent:TH.textDim,'right');
  if(tapped&&tapX>=20&&tapX<=_coinHitR&&abs(tapY-_topY)<16){
    sfx.tap();tapped=false;goto('skins');
  }

  // v2.0: daily-reward calendar chip next to the coins. A pulsing dot
  // marks an unclaimed reward; tapping (re)opens the calendar modal.
  {
    const calX=_coinHitR+24,calHv=abs(mx-calX)<16&&abs(my-_topY)<16;
    X.save();
    X.strokeStyle=calHv?TH.text:TH.textSec;X.lineWidth=1.5;X.lineJoin='round';
    X.beginPath();X.roundRect(calX-8,_topY-7,16,14,3);X.stroke();
    X.beginPath();X.moveTo(calX-8,_topY-3);X.lineTo(calX+8,_topY-3);X.stroke();
    X.beginPath();X.moveTo(calX-4,_topY-10);X.lineTo(calX-4,_topY-7);
    X.moveTo(calX+4,_topY-10);X.lineTo(calX+4,_topY-7);X.stroke();
    if(_loginClaimableToday()){
      const pulse=.6+.4*sin(gt*4);
      X.fillStyle=TH.accent;X.globalAlpha=pulse;
      X.beginPath();X.arc(calX+8,_topY-8,3.4,0,TAU);X.fill();
    }
    X.restore();
    if(tapped&&abs(tapX-calX)<16&&abs(tapY-_topY)<16){
      sfx.tap();tapped=false;loginRewardOpen=true;
    }
  }

  // "Update available" nudge — when checkForUpdate() finds a newer App
  // Store version. v2 redesign: previously a quiet 28-px pill at the
  // bottom in 11-px text — players didn't notice it and many ran weeks
  // behind. New banner sits prominently UNDER the title, pulses softly,
  // and uses the warning colour token so it reads as "act on me, not
  // ignore me". Tap → opens the App Store directly.
  if(availableUpdate){
    const bY=H*.295,bW=300,bH=46;
    const hv=abs(mx-W/2)<bW/2&&abs(my-bY)<bH/2;
    // Slow breathing pulse: alpha drifts between 0.85 and 1.0 every 1.8 s.
    const pulse=.92+.08*sin(gt*3.5);
    X.save();
    X.globalAlpha=pulse;
    // Solid, saturated fill — warning amber on cream, gold on navy.
    // Stronger than the regular menu buttons so the eye lands here first.
    X.fillStyle=hv?TH.warning+'55':TH.warning+'40';
    X.beginPath();X.roundRect(W/2-bW/2,bY-bH/2,bW,bH,bH/2);X.fill();
    X.strokeStyle=TH.warning;X.lineWidth=2;
    X.beginPath();X.roundRect(W/2-bW/2,bY-bH/2,bW,bH,bH/2);X.stroke();
    // Up-pointing chevron + label. drawChevron is canvas-stroked so it
    // matches the rest of the glyph family rather than depending on a
    // unicode arrow that font fallback can render inconsistently.
    _drawChevron(W/2-bW*.40, bY, 9, TH.warning, 'up');
    txtP(t('updateAvailable')+'  v'+availableUpdate,W/2+bW*.04,bY,14,TH.text,'center');
    X.restore();
    if(tapped&&abs(tapX-W/2)<bW/2&&abs(tapY-bY)<bH/2){
      sfx.tap();haptic(8);openAppStore();tapped=false;
    }
  }

  txt(APP_VERSION,W/2,H*.96,10,TH.textDim);
  _grain();
}

// --- PLAY ---
function drawPlay(){
  drawBg(true);

  const cs=getCellSize(),gx=getGridX(),gy=getGridY();

  // Top app bar — y derives from device safe-area inset so the row sits
  // just below status bar / Dynamic Island on any iPhone (and Android too).
  // Floor at 65 so non-notched devices still get reasonable padding.
  const TOP_Y=Math.max(65,safeTop+25);

  // ── v3 header ────────────────────────────────────────────────────
  // Row 1: back · "Level N" · hint.  A hairline.  Row 2: lives · boosters.
  // Replaces the pill menu button, the star preview under the title and
  // the MOVES/TIME/coins strip at the bottom — three things competing with
  // the board for attention that the player never needed mid-solve.
  const ROW2=TOP_Y+48;

  // Back — a bare chevron with a full 44px hit area; no pill around it.
  {
    const hv=abs(mx-26)<22&&abs(my-TOP_Y)<22;
    X.save();
    X.strokeStyle=hv?TH.text:TH.textSec;X.lineWidth=2.6;X.lineCap='round';X.lineJoin='round';
    X.beginPath();X.moveTo(31,TOP_Y-9);X.lineTo(22,TOP_Y);X.lineTo(31,TOP_Y+9);X.stroke();
    X.restore();
    if(tapped&&abs(tapX-26)<22&&abs(tapY-TOP_Y)<22){sfx.tap();tapped=false;goto('menu',()=>{isDaily=false;isWeekly=false});return}
  }

  // Title row branches by mode: classic shows the level (+ HARD label),
  // zen a calm badge + lifetime boards, rush the countdown + live score.
  if(gameMode==='zen'){
    txtP(t('zen'),W/2,TOP_Y,19,TH.success);
    txt(t('boards')+': '+zenTotal,W/2,TOP_Y+18,11,TH.textSec);
  }else if(gameMode==='rush'){
    const rem=max(0,rushEndAt-gt);
    const warn=rem<10;
    txtD(floor(rem)+'s',W/2,TOP_Y,24,warn?TH.arrowBlock:TH.text);
    txt(t('score')+': '+rushScore,W/2,TOP_Y+18,11,TH.textSec);
    // Tick haptic each second under 10s — urgency you can feel.
    if(warn&&floor(rem)!==_lastRushTick){_lastRushTick=floor(rem);if(rem>0)haptic(5);}
    // Expiry → results screen. Guarded so the transition fires once.
    if(rem<=0&&!_rushEnding){
      _rushEnding=true;inputLocked=true;
      setTimeout(()=>{
        const earned=min(40,floor(rushScore/2));
        coins+=earned;totalCoinsEarned+=earned;lastGained=earned;
        _safeSet('ae_coins',coins);
        if(rushScore>rushBest){rushBest=rushScore;_safeSet('ae_rush_best',rushBest);}
        checkAchievements({rushBest});
        save();
        completeEnterT=gt;
        S='rushend';sfx.gameover();haptic(25);
        inputLocked=false;_rushEnding=false;
      },400);
    }
  }else{
    const title=isDaily?t('daily'):isWeekly?t('weekly'):t('levelWord')+' '+level;
    txtD(title,W/2,TOP_Y,19,currentHard?HARD_COLOR:TH.accent);
    // Hard levels say so, the way the genre does — the label turns a
    // difficulty spike from "this game got unfair" into "this one is the boss".
    if(currentHard)txt(t('hardLevel'),W/2,TOP_Y+18,10,HARD_COLOR,'center','800');
  }

  // Hint — bulb at the right of row 1, price underneath. Hidden in rush:
  // buying hints against a ticking clock reads as a coin trap, not help.
  if(gameMode!=='rush'){
    const hbX=W-28,hbY=TOP_Y;
    const canHint=coins>=HINT_COST&&hintTime<=0;
    const hv=abs(mx-hbX)<22&&abs(my-hbY)<22;
    drawLightbulb(hbX,hbY-2,13,canHint?(hv?TH.text:TH.accent):TH.textDim);
    txt(HINT_COST+'',hbX,hbY+17,9,canHint?TH.textSec:TH.textDim,'center','700');
    if(tapped&&abs(tapX-hbX)<22&&abs(tapY-hbY)<22){
      if(canHint)useHint();
      tapped=false;
    }
  }

  // Hairline under the header row.
  X.fillStyle=TH.border;
  X.fillRect(16,TOP_Y+30,W-32,1);

  // Lives — row 2, left. Classic only (zen/rush have no hearts).
  if(gameMode==='classic'){
    for(let i=0;i<3;i++)drawHeart(26+i*24,ROW2,12,i<undosLeft,false);
  }

  // Boosters — bolt at row 2, right, once something behind it is unlocked
  // for this mode. Accent while a shield/zap is armed.
  if(!isTutorial()&&_boostItems().length){
    const bcX=W-28,bcY=ROW2;
    const bhv=abs(mx-bcX)<22&&abs(my-bcY)<18;
    const armed=shieldArmed||zapArmed;
    X.save();
    X.strokeStyle=armed?TH.accent:(bhv?TH.text:TH.textSec);
    X.lineWidth=2;X.lineCap='round';X.lineJoin='round';
    X.beginPath();
    X.moveTo(bcX+3,bcY-9);X.lineTo(bcX-4,bcY+2);X.lineTo(bcX,bcY+2);
    X.lineTo(bcX-3,bcY+9);X.lineTo(bcX+4,bcY-2);X.lineTo(bcX,bcY-2);
    X.closePath();X.stroke();
    if(shieldArmed){X.fillStyle=TH.success;X.beginPath();X.arc(bcX+12,bcY-8,3.2,0,TAU);X.fill();}
    X.restore();
    if(tapped&&abs(tapX-bcX)<22&&abs(tapY-bcY)<18){
      sfx.tap();boosterMenuOpen=!boosterMenuOpen;tapped=false;
    }
  }

  // Advance level reveal animation (staggered fade-in of all arrows).
  // On shape levels the arrows hold back until the silhouette glow has
  // registered (~0.35s) — first you see the picture, then it materialises.
  if(levelRevealT<1&&(!currentShape||_shapeRevealT>0.35||reducedMotion))levelRevealT=min(1,levelRevealT+dt/.9);

  // Intro zoom: lerp zoomLevel from the wide start to the auto-fit target
  // with an easeOutCubic curve. The pull-in lasts _zoomIntroDur seconds.
  if(_zoomIntroT<1){
    _zoomIntroT=min(1,_zoomIntroT+dt/_zoomIntroDur);
    const e=1-Math.pow(1-_zoomIntroT,3);
    zoomLevel=_zoomFrom+(_zoomTarget-_zoomFrom)*e;
  }

  // === ZOOM/PAN BLOCK START ===
  // Wrap grid + arrows + tap detection + flying animations in a save/restore
  // pair so the player's pinch-zoom and pan affect everything that "belongs
  // to the puzzle" but leaves the UI bar (top hearts, hint/skip) untouched.
  // Pivot at grid center so a zoom doesn't throw the grid off-screen; pan
  // freely from there. _screenToWorld() / _clampPan() use the same pivot.
  const _zoomC=_gridCenter();
  X.save();
  X.translate(_zoomC.x+panX,_zoomC.y+panY);
  X.scale(zoomLevel,zoomLevel);
  X.translate(-_zoomC.x,-_zoomC.y);

  // v3: no backdrop under the board. The rounded "stage" card read as a
  // frame around the game ("рамка… некрасиво смотрится") — the arrows now
  // sit straight on the paper, the way the genre's best-looking boards do.

  // v2.0 shape-level silhouette reveal: for the first ~0.8s every cell of
  // the picture glows gold, so the player SEES the heart/cat/rocket before
  // the arrows materialise over it. Layered alpha, no shadowBlur.
  if(currentShape&&_shapeCells&&_shapeRevealT<1){
    _shapeRevealT=min(1,_shapeRevealT+dt/.8);
    const a=reducedMotion?(_shapeRevealT<.4?.12:0):(1-_shapeRevealT)*.22;
    if(a>0.005){
      X.save();
      X.fillStyle=TH.star;
      X.globalAlpha=a;
      for(const rc of _shapeCells){
        X.beginPath();
        X.roundRect(gx+rc[1]*cs+cs*.08,gy+rc[0]*cs+cs*.08,cs*.84,cs*.84,cs*.18);
        X.fill();
      }
      X.restore();
    }
  }

  // v2.2: Removed the connecting grid lines — they read as "tablet
  // ruler" between the cell crosses and competed with the arrows. The
  // crosses below are now the sole structural cue for the grid; with
  // them at every cell centre the eye reconstructs the lattice without
  // needing the lines.

  // Soft 4-pointed sparkles at every cell centre — the "+" crosses
  // were too geometric (read as engineering tape) so we swap them for
  // a cartoon-sparkle silhouette: 4 outward arms with rounded tips
  // and concave bezier-smoothed valleys between them. The polar shape
  // r(θ) = inner + (outer - inner) * cos(2θ)^4 gives the right
  // "pinched waist between fat petals" look, like a stylised twinkle.
  // v3 grid: plain round dots, small and quiet — graph paper, not
  // decoration. The sparkle silhouette stays for the win wave only.
  const _dotR=max(1.6,cs*.07);
  const _dot=(cx,cy,R)=>{X.beginPath();X.arc(cx,cy,R,0,TAU);X.fill()};
  function _drawSparkle(cx,cy,R){
    const inner=R*0.30;
    // 64 segments = smooth enough at any size, still cheap (one path
    // fill, no per-segment stroke cost).
    X.beginPath();
    for(let i=0;i<=64;i++){
      const θ=(i/64)*TAU-PI/2;
      const t=cos(2*θ);                       // -1..1, peaks at cardinals
      const k=t*t*t*t;                        // ^4 → very narrow waists
      const r=inner+(R-inner)*k;              // inner at diagonals, R at arm tips
      const px=cx+cos(θ)*r;
      const py=cy+sin(θ)*r;
      if(i===0)X.moveTo(px,py);
      else X.lineTo(px,py);
    }
    X.closePath();
    X.fill();
  }
  const _hasWave=!!_winWave;
  let _waveP=0,_waveX=0,_waveY=0,_waveSpeed=0;
  if(_hasWave){
    _winWave.t+=dt;
    _waveP=_winWave.t/_winWave.dur;
    _waveX=_winWave.x;_waveY=_winWave.y;
    // Wave front travels far enough to reach screen corners by p=1.
    _waveSpeed=max(W,H)*1.1;
    if(_waveP>=1)_winWave=null;
  }
  // Sparkles on EVERY cell. Empty cells get a fainter fill, occupied
  // get the full alpha (occupied loop below reuses the same helper).
  X.fillStyle=darkMode?'rgba(243,233,220,.09)':'rgba(61,43,31,.08)';
  for(let r=0;r<gridRows;r++){
    for(let c=0;c<gridCols;c++){
      _dot(gx+c*cs+cs/2,gy+r*cs+cs/2,_dotR*0.8);
    }
  }
  X.fillStyle=darkMode?'rgba(243,233,220,.18)':'rgba(61,43,31,.16)';
  // Occupied-cell dots (slightly stronger than empty cells). On level
  // completion the win wave passes through and turns each dot into a
  // tiny golden DIAMOND for the moment the wave front is on it — feels
  // like sparkles riding a ripple from where the last arrow flew out.
  // Off-wave the dot stays a neutral circle, so the magic moment is
  // strictly the celebration window (1.6 s) and nothing else.
  for(const k of _levelCells){
    const i=k.indexOf(',');
    const r=+k.slice(0,i),c=+k.slice(i+1);
    const cx=gx+c*cs+cs/2,cy=gy+r*cs+cs/2;
    let waveT=0;
    if(_hasWave){
      const dx=cx-_waveX,dy=cy-_waveY;
      const d=Math.sqrt(dx*dx+dy*dy);
      const arriveP=d/_waveSpeed;
      const wlocal=(_waveP-arriveP)/0.22; // window 22% of total dur
      if(wlocal>0&&wlocal<1)waveT=Math.sin(wlocal*PI); // 0..1 bell curve
    }
    if(waveT>0.05){
      // Sparkle phase: occupied-cell sparkle blooms gold and grows
      // 1.4× → 3.0× as the wave passes through. Same silhouette as
      // the rest of the grid, just bigger and saturated — so the
      // celebration reads as "the same dots became magical for a
      // second" rather than swapping in a different shape.
      const sz=_dotR*(1.4+waveT*1.6);
      const alpha=Math.min(1,0.5+waveT*0.6);
      X.save();
      X.globalAlpha=alpha;
      X.fillStyle=TH.star;
      _drawSparkle(cx,cy,sz);
      X.restore();
    } else {
      _dot(cx,cy,_dotR);
    }

  }

  // Draw all alive arrows as continuous paths through their cells
  for(let i=0;i<arrows.length;i++){
    const a=arrows[i];
    if(!a.alive)continue;

    // Reveal alpha: each arrow fades in with a small offset based on index
    let revealA=1;
    if(levelRevealT<1){
      const perArrowOffset=0.5/max(1,arrows.length);
      const start=i*perArrowOffset;
      revealA=clp((levelRevealT-start)/0.5,0,1);
      if(revealA<=0)continue;
    }

    // Check if shaking (blocked feedback on head cell)
    let shakeOff=0,isShaking=false;
    for(const sh of shakeAnims){
      if(sh.idx===i){
        const p=sh.t/sh.dur;
        shakeOff=sin(p*PI*6)*4*(1-p);
        isShaking=true;
      }
    }

    // Hint highlight: faster, brighter pulse. The previous version was
    // a quiet glow at 50-80% alpha that players said they couldn't even
    // notice on a busy board. We now (a) draw a soft golden cell tint
    // behind every cell of the hinted arrow, (b) add a thicker outer
    // halo via 4 stacked strokes, and (c) speed the cycle up to 1.6 s
    // so the eye is drawn to it. Still no shadowBlur — keeps iOS perf.
    const isHinted=i===hintArrow&&hintTime>0;
    if(isHinted&&!reducedMotion){
      const pulse=.5+.5*sin(gt*4);               // ~1.6 s cycle (was 2.5 s)
      X.save();
      // Cell tint behind the hinted arrow — a soft gold wash that
      // marks WHERE on the board the player should look. Subtle in the
      // trough of the pulse, brightens at the peak.
      X.fillStyle=TH.star;
      X.globalAlpha=(.10+pulse*.18)*revealA;     // 0.10..0.28
      for(const [r,c] of a.cells){
        X.beginPath();
        X.roundRect(gx+c*cs+cs*.08,gy+r*cs+cs*.08,cs*.84,cs*.84,cs*.18);
        X.fill();
      }
      // Halo stack — 3 layers from outer-faint to inner-strong gives
      // the impression of a glow without the cost of shadowBlur.
      X.globalAlpha=(.30+pulse*.20)*revealA;     // 0.30..0.50
      drawArrowStatic(a,cs,gx,gy,TH.star,1,shakeOff);
      X.globalAlpha=(.55+pulse*.30)*revealA;     // 0.55..0.85
      drawArrowStatic(a,cs,gx,gy,TH.star,1,shakeOff);
      X.globalAlpha=(.85+pulse*.15)*revealA;     // 0.85..1.00
      drawArrowStatic(a,cs,gx,gy,TH.star,1,shakeOff);
      X.restore();
    }

    const col=isShaking?TH.arrowBlock:(isHinted?TH.star:arrowColor(a,i));
    drawArrowStatic(a,cs,gx,gy,col,revealA,shakeOff);
    if(a.lock!=null||a.keyFor!=null)_drawLockBadges(a,cs,gx,gy,revealA,shakeOff);
    if(a.cd!=null)_drawBombBadge(a,cs,gx,gy,revealA,shakeOff);
  }

  // Padlock pops: when a key leaves, its lock's shackle lifts and the
  // badge swells and fades over half a second.
  for(let k=_unlockFx.length-1;k>=0;k--){
    const f=_unlockFx[k];
    f.t+=dt;
    const p=f.t/.5,a=arrows[f.idx];
    if(p>=1||!a||!a.alive){_unlockFx.splice(k,1);continue}
    const c=a.cells[max(0,a.cells.length-2)];
    const x=gx+c[1]*cs+cs/2,y=gy+c[0]*cs+cs/2,r=max(7,cs*.34)*(1+p*.7);
    X.save();X.globalAlpha=1-p;
    _badge(x,y,r,PAIR_COLORS[a.pair||0]);_glyphLock(x,y,r*.62,'#fff',true);
    X.restore();
  }

  // Tick down hint timer
  if(hintTime>0){hintTime-=dt;if(hintTime<=0)hintArrow=-1}

  // ── v2.0 Reveal booster: numbered 1/2/3 badges over the next solvable
  // arrows (greedy order computed at purchase). World coords — pans and
  // zooms with the board.
  if(gt<revealUntil){
    for(let k=0;k<revealList.length;k++){
      const ar=arrows[revealList[k]];
      if(!ar||!ar.alive)continue;
      const head=ar.cells[ar.cells.length-1];
      const bx=gx+head[1]*cs+cs/2,by=gy+head[0]*cs+cs/2;
      const fade=min(1,(revealUntil-gt)/.4); // quick fade-out at the end
      X.save();
      X.globalAlpha=fade;
      X.fillStyle=TH.star;
      X.beginPath();X.arc(bx,by-cs*.75,9,0,TAU);X.fill();
      X.strokeStyle=darkMode?'rgba(0,0,0,.35)':'rgba(255,255,255,.9)';
      X.lineWidth=1.5;
      X.beginPath();X.arc(bx,by-cs*.75,9,0,TAU);X.stroke();
      txtP(String(k+1),bx,by-cs*.75,11,darkMode?'#2a1f1d':'#fff');
      X.restore();
    }
  }

  // Tutorial — first TUTORIAL_LEVELS regular levels permanently highlight
  // the next solvable arrow until the level is cleared. Combined with the
  // no-penalty wrong-tap handling in tapArrowByIndex(), this gives new
  // players room to learn the "clear path" rule without losing hearts.
  if(isTutorial()&&levelRevealT>=1){
    let tutIdx=-1;
    for(let i=0;i<arrows.length;i++){
      if(arrows[i].alive&&canEscape(i)){tutIdx=i;break}
    }

    if(tutIdx>=0){
      const pulse=.5+.5*sin(gt*4);
      const ta=arrows[tutIdx];
      const head=ta.cells[ta.cells.length-1];
      const hx=gx+head[1]*cs+cs/2,hy=gy+head[0]*cs+cs/2;

      // Pulse via alpha — much cheaper than shadowBlur on iOS WebKit.
      X.save();
      X.globalAlpha=.45+pulse*.4;
      drawArrowStatic(ta,cs,gx,gy,TH.star,1,0);
      X.restore();

      // Short dashed line (5-6 dashes) + small arrowhead at end
      const dir=ta.dir;
      const lineLen=min(cs*2.5,60);
      const endX=hx+DX[dir]*lineLen,endY=hy+DY[dir]*lineLen;
      X.strokeStyle=TH.star;
      X.lineWidth=2;
      X.globalAlpha=.3+pulse*.4;
      X.setLineDash([6,4]);
      X.beginPath();
      X.moveTo(hx+DX[dir]*cs*.5,hy+DY[dir]*cs*.5);
      X.lineTo(endX,endY);
      X.stroke();
      X.setLineDash([]);
      const aLen=8,aW=5;
      X.fillStyle=TH.star;
      X.beginPath();
      X.moveTo(endX+DX[dir]*aLen,endY+DY[dir]*aLen);
      X.lineTo(endX-DY[dir]*aW,endY+DX[dir]*aW);
      X.lineTo(endX+DY[dir]*aW,endY-DX[dir]*aW);
      X.closePath();X.fill();
      X.globalAlpha=1;

      // Finger pointer — animated taps over the suggested arrow's head.
      // 1.4s loop: hover (scale=1) → tap (scale=0.78) → release (scale=1)
      // with a fading ring on the down-stroke. Reads like a real demo without
      // freezing the player out of the game (they can still tap whenever).
      const tapCycle=1.4;
      const tt=(gt%tapCycle)/tapCycle; // 0..1
      // Down-stroke 0..0.25, hold 0.25..0.4, release 0.4..0.55, idle 0.55..1
      let tapScale=1;
      let ringP=-1;
      if(tt<0.25){tapScale=1-(tt/0.25)*0.22;ringP=tt/0.25;}
      else if(tt<0.40){tapScale=0.78;ringP=1;}
      else if(tt<0.55){tapScale=0.78+((tt-0.40)/0.15)*0.22;}
      const fX=hx,fY=hy;
      // Tap ring: expanding circle that fades, only during the press window.
      if(ringP>=0){
        X.save();
        X.globalAlpha=(1-ringP)*0.6;
        X.strokeStyle=TH.star;
        X.lineWidth=2;
        X.beginPath();X.arc(fX,fY,cs*0.4+ringP*cs*0.5,0,TAU);X.stroke();
        X.restore();
      }
      // Pointer body — a soft dark circle (the "fingertip") with a smaller
      // bright dot (the touch point). Offset slightly down-right so it
      // doesn't sit dead-centre on the arrow head it's pointing at.
      X.save();
      X.translate(fX+cs*0.12,fY+cs*0.12);
      X.scale(tapScale,tapScale);
      X.globalAlpha=0.85;
      X.fillStyle=darkMode?'rgba(255,255,255,.92)':'rgba(40,30,20,.85)';
      X.beginPath();X.arc(0,0,cs*0.32,0,TAU);X.fill();
      X.fillStyle=TH.accent;
      X.beginPath();X.arc(0,0,cs*0.18,0,TAU);X.fill();
      X.restore();

      // Text — only at start of level so it doesn't keep nagging.
      if(moves===0){
        txt(t('tutTap'),W/2,TOP_Y+44,14,TH.star,'center','700');
        txt(t('tutWhy'),W/2,TOP_Y+62,11,TH.textSec);
      }
    }
  }

  // Tap detection — find the alive arrow whose nearest cell center is closest
  // to the tap point (within a generous radius). Tap arrives in screen coords
  // but arrow cells are stored in world coords, so we invert the active
  // zoom/pan transform first via _screenToWorld(). When zoom=1 this is a
  // no-op so non-zoomed gameplay is unaffected.
  if(tapped&&!boosterMenuOpen){ // flyout (drawn after this block) owns the tap while open
    const w=_screenToWorld(tapX,tapY);
    let bestIdx=-1,bestDist=cs*.85;
    for(let i=0;i<arrows.length;i++){
      const a=arrows[i];
      if(!a.alive)continue;
      for(const[r,c] of a.cells){
        const ax=gx+c*cs+cs/2,ay=gy+r*cs+cs/2;
        const d=sqrt((w.x-ax)*(w.x-ax)+(w.y-ay)*(w.y-ay));
        if(d<bestDist){bestDist=d;bestIdx=i;}
      }
    }
    if(bestIdx>=0){tapArrowByIndex(bestIdx);tapped=false;}
  }

  // Slide animations: whole arrow path traces itself along its own route,
  // then continues straight off-screen past the head.
  for(let i=anims.length-1;i>=0;i--){
    const an=anims[i];
    an.t+=dt;
    if(an.t>=an.dur){anims.splice(i,1);continue}

    // Use pre-built path cached on anim creation (rebuilt every frame before).
    const path=an.path;

    const p=an.t/an.dur;
    const ep=p<.5?2*p*p:1-2*(1-p)*(1-p); // ease-in-out: smooth start and end
    const tailPos=ep*an.totalDist;
    const headPos=tailPos+an.bodyLen;
    const pts=getPathSegment(path,tailPos,headPos);

    const alpha=p>.85?1-(p-.85)/.15:1;
    an._sparkPt=pts[0]; // trail emitter follows the tail
    drawArrowPolyline(pts,an.cs,an.col,alpha);
  }

  // Shake animations + v2.0 colorblind X-marker: the blocked state was
  // signalled by red alone (audit 05-05 #13) — an X glyph over the head
  // works in every theme and for every kind of colour vision.
  for(let i=shakeAnims.length-1;i>=0;i--){
    const sh=shakeAnims[i];
    sh.t+=dt;
    if(sh.t>=sh.dur){shakeAnims.splice(i,1);continue}
    const a=1-sh.t/sh.dur;
    const s=getCellSize()*.32;
    X.save();
    X.globalAlpha=a;
    X.lineCap='round';
    X.strokeStyle=darkMode?'rgba(0,0,0,.55)':'rgba(255,255,255,.95)';
    X.lineWidth=4.5;
    X.beginPath();X.moveTo(sh.x-s,sh.y-s);X.lineTo(sh.x+s,sh.y+s);
    X.moveTo(sh.x+s,sh.y-s);X.lineTo(sh.x-s,sh.y+s);X.stroke();
    X.strokeStyle=TH.arrowBlock;
    X.lineWidth=2.5;
    X.beginPath();X.moveTo(sh.x-s,sh.y-s);X.lineTo(sh.x+s,sh.y+s);
    X.moveTo(sh.x+s,sh.y-s);X.lineTo(sh.x-s,sh.y+s);X.stroke();
    X.restore();
  }

  // v2.0 exit particle trail: sparkles shed along the flying arrow's path.
  if(!reducedMotion){
    for(const an of anims){
      if(_trail.length>=60)break;
      if(an._sparkPt&&Math.random()<.5){
        _trail.push({x:an._sparkPt[0],y:an._sparkPt[1],t:0,dur:.4,sz:2.5+Math.random()*2.5,col:an.col});
      }
    }
  }
  for(let i=_trail.length-1;i>=0;i--){
    const p=_trail[i];
    p.t+=dt;
    if(p.t>=p.dur){_trail.splice(i,1);continue}
    const a=(1-p.t/p.dur)*.7;
    const s=p.sz*(1-p.t/p.dur*.5);
    X.save();
    X.globalAlpha=a;
    X.fillStyle=typeof p.col==='string'?p.col:TH.star;
    X.beginPath();
    // 4-point sparkle silhouette (same family as the confetti)
    X.moveTo(p.x,p.y-s);X.quadraticCurveTo(p.x+s*.25,p.y-s*.25,p.x+s,p.y);
    X.quadraticCurveTo(p.x+s*.25,p.y+s*.25,p.x,p.y+s);
    X.quadraticCurveTo(p.x-s*.25,p.y+s*.25,p.x-s,p.y);
    X.quadraticCurveTo(p.x-s*.25,p.y-s*.25,p.x,p.y-s);
    X.fill();
    X.restore();
  }

  X.restore(); // === ZOOM/PAN BLOCK END === — UI below stays in screen coords

  // ── v2.0 booster flyout + zap banner — drawn ABOVE the board (screen
  // coords). The board's tap detection is gated on !boosterMenuOpen, so
  // input naturally falls through to this block while the flyout is open.
  if(!isTutorial()){
    if(boosterMenuOpen){
      const items=_boostItems();

      const chipW=82,chipH=40,gap=8;
      const rowW=items.length*chipW+(items.length-1)*gap;
      const x0=W/2-rowW/2,fy=TOP_Y+86;   // below header row 2
      let consumed=false;
      for(let i=0;i<items.length;i++){
        const kind=items[i];
        const cx=x0+i*chipW+chipW/2;
        const hv2=abs(mx-cx)<chipW/2&&abs(my-fy)<chipH/2;
        X.fillStyle=hv2?TH.btnHover:(darkMode?'rgba(58,44,42,.96)':'rgba(254,244,230,.96)');
        X.beginPath();X.roundRect(cx-chipW/2,fy-chipH/2,chipW,chipH,12);X.fill();
        X.strokeStyle=TH.border;X.lineWidth=1;
        X.beginPath();X.roundRect(cx-chipW/2,fy-chipH/2,chipW,chipH,12);X.stroke();
        _glyphBooster(kind,cx-24,fy,1,TH.text);
        // Price / inventory badge
        const invN=kind==='shield'?bstShield:kind==='zap'?bstZap:bstReveal;
        if(invN>0){
          txtP('×'+invN,cx+14,fy,13,TH.success,'left');
        }else{
          const cost=BOOST_COSTS[kind];
          drawCoin(cx+8,fy,5);
          txt(cost+'',cx+16,fy,11,coins>=cost?TH.star:TH.textDim,'left');
        }
        if(tapped&&hv2){
          useBooster(kind);
          tapped=false;consumed=true;
        }
      }
      // Tap anywhere else closes the flyout AND swallows the tap so the
      // board underneath doesn't receive it next frame.
      if(tapped&&!consumed){
        boosterMenuOpen=false;tapped=false;
      }
    }

    // Zap target-mode banner
    if(zapArmed){
      const pulse=.7+.3*sin(gt*5);
      X.save();X.globalAlpha=pulse;
      txtP(t('tapAnyArrow'),W/2,TOP_Y+82,13,TH.warning);
      X.restore();
    }
  }

  // v3: no bottom stats strip — moves, time and coins mid-solve were noise
  // next to the board. Time still runs (best-time, complete screen); coins
  // show on the menu and wherever they're spent.

  // Update timers — the level clock stops while an intro card is up
  if(!_introCard)timer+=dt;
  totalPlayTime+=dt;


}

// --- COMPLETE ---
function drawComplete(){
  // v3 win screen. The moment worth making feel good: warm sunburst, three
  // big stars over a result card, one obvious "next" button. Replaces the
  // flat bg + check-circle + stats strip, which read like a form receipt.
  const tNow=completeEnterT>0?max(0,gt-completeEnterT):99;

  // Sky: accent-orange top fading into paper, rays turning slowly.
  const sky=X.createLinearGradient(0,0,0,H);
  if(darkMode){sky.addColorStop(0,'#7a3f1c');sky.addColorStop(.55,'#3a2a1e');sky.addColorStop(1,'#1e1914');}
  else{sky.addColorStop(0,'#e5823a');sky.addColorStop(.5,'#f5c79a');sky.addColorStop(1,'#f5eee3');}
  X.fillStyle=sky;X.fillRect(0,0,W,H);
  {
    const cx=W/2,cy=H*.2,R=max(W,H),n=14;
    const rot=reducedMotion?0:gt*.12;
    X.save();X.globalAlpha=darkMode?.07:.16;X.fillStyle='#ffffff';
    for(let i=0;i<n;i++){
      const a0=rot+i*TAU/n,a1=a0+TAU/n*.5;
      X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+cos(a0)*R,cy+sin(a0)*R);X.lineTo(cx+cos(a1)*R,cy+sin(a1)*R);X.closePath();X.fill();
    }
    X.restore();
  }

  // Confetti — sparkle particles (spawned by spawnConfetti on the win).
  const _frameScale=dt*60;
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];
    p.x+=p.vx*_frameScale;p.y+=p.vy*_frameScale;p.vy+=.08*_frameScale;p.rot+=p.rv*.02*_frameScale;p.life-=dt;
    if(p.life<=0){confetti.splice(i,1);continue}
    X.globalAlpha=clp(p.life,0,1);
    X.fillStyle=p.col;
    X.save();X.translate(p.x,p.y);X.rotate(p.rot);
    const R=p.sz/2,inner=R*.30;
    X.beginPath();
    for(let k=0;k<8;k++){
      const θ=k*PI/4-PI/2,tt=Math.cos(2*θ),r=inner+(R-inner)*(tt*tt*tt*tt);
      if(k===0)X.moveTo(Math.cos(θ)*r,Math.sin(θ)*r);else X.lineTo(Math.cos(θ)*r,Math.sin(θ)*r);
    }
    X.closePath();X.fill();X.restore();
    X.globalAlpha=1;
  }

  // Result rows first — the card is sized to them, not the other way.
  const tm=floor(timer),mm=floor(tm/60),ss=tm%60;
  const rows=[];
  if(!isDaily&&!isWeekly)rows.push([t('difficulty'),currentHard?t('diffHard'):t('diffNormal'),currentHard?HARD_COLOR:TH.text]);
  rows.push([t('time'),mm+':'+(ss<10?'0':'')+ss,TH.text]);
  rows.push([t('mistakes'),String(3-max(0,undosLeft)),undosLeft>=3?TH.success:TH.text]);
  if(!isDaily&&!isWeekly&&winStreak>=2)rows.push([t('winStreak'),'×'+winStreak+(_streakBonus?'  +'+_streakBonus:''),TH.accent]);
  const rh=32;

  // Card
  const cardX=24,cardW=W-48,cardY=H*.24,cardH=92+rows.length*rh+58,lip=5;
  X.fillStyle=darkMode?'rgba(0,0,0,.35)':'rgba(176,94,31,.22)';
  X.beginPath();X.roundRect(cardX,cardY+lip,cardW,cardH,22);X.fill();
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(cardX,cardY,cardW,cardH,22);X.fill();

  // Stars over the card's top edge, centre one higher and bigger. Each
  // pops in turn: 0 → 1.35 → 1 over 350 ms, 180 ms apart.
  const s=(isDaily||isWeekly)?3:(stars[level]||1);
  const starPos=[[W/2-74,cardY+2,28],[W/2,cardY-18,38],[W/2+74,cardY+2,28]];
  for(let i=0;i<3;i++){
    const p=clp((tNow-.25-i*.18)/.35,0,1);
    if(p<=0)continue;
    const sc=p<.6?lrp(0,1.35,p/.6):lrp(1.35,1,(p-.6)/.4);
    const[sx,sy,sz]=starPos[i];
    X.save();X.translate(sx,sy);X.scale(sc,sc);X.globalAlpha=clp(p*1.5,0,1);
    drawStar(0,0,sz,i<s);
    X.restore();
  }

  // Verdict
  const verdict=undosLeft>=3?t('flawless'):undosLeft===2?t('great'):t('cleared');
  txtD(verdict,W/2,cardY+52,24,TH.text);

  // Result rows — label left, value right, hairlines between.
  const rx0=cardX+24,rx1=cardX+cardW-24,ry0=cardY+92;
  for(let i=0;i<rows.length;i++){
    const y=ry0+i*rh;
    txt(rows[i][0],rx0,y,14,TH.textSec,'left','600');
    txt(rows[i][1],rx1,y,15,rows[i][2],'right','800');
    if(i<rows.length-1){X.fillStyle=TH.border;X.fillRect(rx0,y+rh/2,rx1-rx0,1);}
  }

  // Reward pill at the card's foot.
  const pillY=cardY+cardH-30;
  if((isDaily||isWeekly)&&lastGained===0){
    txt(t('claimedToday'),W/2,pillY,12,TH.textDim);
  }else{
    const rp=clp((tNow-1)/.45,0,1);
    const rs=rp<.7?lrp(0,1.15,rp/.7):lrp(1.15,1,(rp-.7)/.3);
    X.save();X.translate(W/2,pillY);X.scale(rs,rs);X.globalAlpha=clp(rp*2,0,1);
    const rw=124,rh2=34;
    X.fillStyle=darkMode?'rgba(246,196,90,.18)':'rgba(240,176,58,.20)';
    X.beginPath();X.roundRect(-rw/2,-rh2/2,rw,rh2,rh2/2);X.fill();
    drawCoin(-rw/2+22,0,9);
    txt('+'+lastGained,10,0,18,TH.text,'center','800');
    X.restore();
  }

  // Buttons — one primary, two quiet secondaries side by side.
  const by=cardY+cardH+lip+56;
  if(isDaily||isWeekly){
    if(drawBigBtn(t('backToMenu'),W/2,by,W-64,56)){
      goto('menu',()=>{isDaily=false;isWeekly=false});
    }
  }else{
    if(drawBigBtn(t('nextLevelBtn'),W/2,by,W-64,56,currentHard?HARD_COLOR:null)){
      showInterstitialAd(); // timed interstitial every 5 min
      goto('play',()=>{level++;save();generateLevel(level)});
    }
    const bw=(W-64-12)/2;
    if(drawBtn(t('replayBtn'),W/2-bw/2-6,by+72,bw,44)){
      goto('play',()=>{generateLevel(level)});
    }
    if(drawBtn(t('homeBtn'),W/2+bw/2+6,by+72,bw,44)){goto('menu')}
  }
}

// --- STATS ---
function drawStats(){
  drawBg(true);
  const top=_screenHeader(t('stats'),null,()=>goto('menu'));

  // Compute stats
  const totalLevelsDone=Object.keys(stars).length;
  const totalMinutes=floor(totalPlayTime/60);
  const totalHours=floor(totalMinutes/60);
  const playtimeStr=totalHours>0?(totalHours+t('uHour')+' '+(totalMinutes%60)+t('uMin')):(totalMinutes+t('uMin'));
  const fastestStr=fastestLevel<99999?(fastestLevel+t('uSec')):'—';

  const rows=[
    [t('stCurLevel'),level+''],
    [t('stLevelsDone'),totalLevelsDone+''],
    [t('stStars'),totalStars+''],
    [t('stPerfect'),totalPerfect+''],
    [t('stShapes'),shapeTotal+''],
    [t('stZen'),zenTotal+''],
    [t('stRushBest'),rushBest+''],
    [t('stBoosters'),boostersUsed+''],
    [t('stPlayTime'),playtimeStr],
    [t('stFastest'),fastestStr],
    [t('stCoins'),totalCoinsEarned+''],
    [t('stDailies'),totalDailies+''],
    [t('stStreak'),streakDays+' '+t('uDays')],
    [t('stNoHint'),noHintCount+''],
    [t('stAch'),achUnlockedCount()+'/'+ACHIEVEMENTS.length],
  ];

  // v2 redesign: rows now live inside a single grouped card with
  // hairline dividers — same visual language as Settings. Big bold
  // value on the right, label left, divider lines between rows.
  const startY = top, rowH = 36;
  const cardX = 20, cardW = W - 40;
  const visibleRows = Math.min(rows.length, Math.floor((H - startY - 24 - safeBottom) / rowH));
  const cardH = visibleRows * rowH;
  // Surface
  X.fillStyle = TH.surface;
  X.beginPath(); X.roundRect(cardX, startY, cardW, cardH, 14); X.fill();
  X.strokeStyle = TH.border; X.lineWidth = 1;
  X.beginPath(); X.roundRect(cardX, startY, cardW, cardH, 14); X.stroke();
  // Clip + content
  X.save();
  X.beginPath(); X.roundRect(cardX, startY, cardW, cardH, 14);
  X.clip();
  for (let i = 0; i < visibleRows; i++) {
    const y = startY + i * rowH;
    txt(rows[i][0], cardX + 16, y + rowH/2, 12, TH.textSec, 'left');
    txtP(rows[i][1], cardX + cardW - 16, y + rowH/2, 14, TH.text, 'right');
    if (i < visibleRows - 1) {
      X.strokeStyle = TH.border; X.lineWidth = 0.7;
      X.beginPath();
      X.moveTo(cardX + 16, y + rowH);
      X.lineTo(cardX + cardW - 16, y + rowH);
      X.stroke();
    }
  }
  X.restore();
}

// Per-achievement icon renderer. Categories share a vector glyph so the user
// recognises the achievement type at a glance (level → up-arrow, stars → star,
// perfect → trophy, daily → calendar, streak → flame, no-hint → lightbulb,
// speedrun → bolt). Drawn at logical coords centred on (cx,cy).
function drawAchIcon(id,cx,cy,sz,col){
  const c=col;
  X.save();X.translate(cx,cy);
  X.fillStyle=c;X.strokeStyle=c;X.lineWidth=1.5;X.lineJoin='round';X.lineCap='round';

  if(id.startsWith('lvl_')){
    // Up-arrow stack — three stacked triangles ("levelling up")
    for(let i=0;i<3;i++){
      const ay=sz*.55-i*sz*.45,al=sz*.55-i*sz*.15,a=.4-i*.1;
      X.fillStyle=c+(['','99','66','33'][i]||'');
      X.beginPath();X.moveTo(0,ay-al*.7);X.lineTo(al*.6,ay);X.lineTo(-al*.6,ay);X.closePath();X.fill();
    }
  }else if(id.startsWith('stars_')){
    // Star burst — center star + 4 small satellites
    const star=(s)=>{X.beginPath();
      for(let i=0;i<5;i++){const a1=i*TAU/5-PI/2,a2=a1+TAU/10;
        X.lineTo(cos(a1)*s,sin(a1)*s);X.lineTo(cos(a2)*s*.4,sin(a2)*s*.4)}
      X.closePath();X.fill();};
    X.fillStyle=c;star(sz*.7);
    X.fillStyle=c+'80';for(let i=0;i<4;i++){
      const a=i*PI/2+PI/4;X.save();X.translate(cos(a)*sz*.85,sin(a)*sz*.85);star(sz*.22);X.restore();
    }
  }else if(id.startsWith('perfect_')){
    // Trophy cup — bowl + handles + base
    X.fillStyle=c;
    X.beginPath();X.moveTo(-sz*.5,-sz*.5);X.lineTo(sz*.5,-sz*.5);
    X.lineTo(sz*.4,sz*.1);X.quadraticCurveTo(0,sz*.4,-sz*.4,sz*.1);X.closePath();X.fill();
    // Handles
    X.strokeStyle=c;X.lineWidth=2.5;
    X.beginPath();X.arc(-sz*.5,-sz*.25,sz*.18,PI/2,PI*1.5);X.stroke();
    X.beginPath();X.arc(sz*.5,-sz*.25,sz*.18,-PI/2,PI/2);X.stroke();
    // Base
    X.fillStyle=c;
    X.fillRect(-sz*.08,sz*.1,sz*.16,sz*.25);
    X.fillRect(-sz*.35,sz*.32,sz*.7,sz*.12);
  }else if(id.startsWith('daily_')){
    // Calendar with checkmark
    X.fillStyle=c;
    X.beginPath();X.roundRect(-sz*.55,-sz*.4,sz*1.1,sz*.95,sz*.12);X.fill();
    X.fillStyle='rgba(255,255,255,.85)';
    X.fillRect(-sz*.55,-sz*.4,sz*1.1,sz*.18);
    // Tear-tabs
    X.fillStyle=c;
    X.fillRect(-sz*.35,-sz*.55,sz*.1,sz*.25);
    X.fillRect(sz*.25,-sz*.55,sz*.1,sz*.25);
    // Check
    X.strokeStyle='rgba(255,255,255,.95)';X.lineWidth=2;
    X.beginPath();X.moveTo(-sz*.25,sz*.1);X.lineTo(-sz*.05,sz*.3);X.lineTo(sz*.3,-sz*.1);X.stroke();
  }else if(id.startsWith('streak_')){
    // Flame
    X.fillStyle=c;
    X.beginPath();
    X.moveTo(0,-sz*.6);
    X.bezierCurveTo(sz*.4,-sz*.2,sz*.55,sz*.1,sz*.3,sz*.4);
    X.bezierCurveTo(sz*.15,sz*.55,-sz*.15,sz*.55,-sz*.3,sz*.4);
    X.bezierCurveTo(-sz*.55,sz*.1,-sz*.4,-sz*.2,0,-sz*.6);
    X.fill();
    // Inner flame highlight
    X.fillStyle='rgba(255,255,255,.4)';
    X.beginPath();X.moveTo(0,-sz*.25);
    X.bezierCurveTo(sz*.18,sz*.0,sz*.22,sz*.2,sz*.05,sz*.35);
    X.bezierCurveTo(-sz*.1,sz*.3,-sz*.18,sz*.1,0,-sz*.25);
    X.fill();
  }else if(id.startsWith('no_hint_')){
    // Lightbulb
    X.fillStyle=c;
    X.beginPath();X.arc(0,-sz*.1,sz*.42,0,TAU);X.fill();
    X.fillRect(-sz*.22,sz*.25,sz*.44,sz*.12);
    X.fillRect(-sz*.18,sz*.4,sz*.36,sz*.08);
    X.strokeStyle='rgba(255,255,255,.6)';X.lineWidth=1;
    X.beginPath();X.moveTo(-sz*.15,-sz*.1);X.lineTo(-sz*.15,sz*.2);X.stroke();
    X.beginPath();X.moveTo(sz*.15,-sz*.1);X.lineTo(sz*.15,sz*.2);X.stroke();
  }else if(id==='speedrun'||id.startsWith('rush_')||id.startsWith('boost_')){
    // Lightning bolt (speed / rush / boosters share the energy motif)
    X.fillStyle=c;
    X.beginPath();
    X.moveTo(sz*.1,-sz*.6);X.lineTo(-sz*.4,sz*.05);X.lineTo(-sz*.05,sz*.1);
    X.lineTo(-sz*.15,sz*.6);X.lineTo(sz*.4,-sz*.05);X.lineTo(sz*.05,-sz*.1);
    X.closePath();X.fill();
  }else if(id.startsWith('login_')){
    // Gift box — login rewards
    X.fillStyle=c;
    X.beginPath();X.roundRect(-sz*.5,-sz*.15,sz,sz*.65,sz*.08);X.fill();
    X.fillRect(-sz*.55,-sz*.35,sz*1.1,sz*.22);
    X.strokeStyle='rgba(255,255,255,.85)';X.lineWidth=2;
    X.beginPath();X.moveTo(0,-sz*.35);X.lineTo(0,sz*.5);X.stroke();
    X.beginPath();X.arc(-sz*.14,-sz*.42,sz*.13,0,TAU);X.stroke();
    X.beginPath();X.arc(sz*.14,-sz*.42,sz*.13,0,TAU);X.stroke();
  }else if(id.startsWith('zen_')){
    // Lotus — three petals
    X.fillStyle=c;
    X.beginPath();X.ellipse(0,sz*.05,sz*.22,sz*.5,0,0,TAU);X.fill();
    X.fillStyle=c+'99';
    X.beginPath();X.ellipse(-sz*.3,sz*.15,sz*.2,sz*.42,-.5,0,TAU);X.fill();
    X.beginPath();X.ellipse(sz*.3,sz*.15,sz*.2,sz*.42,.5,0,TAU);X.fill();
  }else if(id.startsWith('shape_')){
    // Small heart — the signature shape level
    X.fillStyle=c;
    X.beginPath();
    X.moveTo(0,sz*.5);
    X.bezierCurveTo(-sz*.7,sz*.05,-sz*.45,-sz*.5,0,-sz*.15);
    X.bezierCurveTo(sz*.45,-sz*.5,sz*.7,sz*.05,0,sz*.5);
    X.fill();
  }else{
    // Fallback: filled star
    X.fillStyle=c;
    X.beginPath();
    for(let i=0;i<5;i++){const a1=i*TAU/5-PI/2,a2=a1+TAU/10;
      X.lineTo(cos(a1)*sz*.7,sin(a1)*sz*.7);X.lineTo(cos(a2)*sz*.3,sin(a2)*sz*.3)}
    X.closePath();X.fill();
  }
  X.restore();
}

// --- ACHIEVEMENTS LIST ---
// Paginated: 9 cards per page so all 18 achievements are reachable in 2
// pages. Old version clipped at y > H-70 — silently hid 7 of 18 with no
// affordance (per audit).
const ACH_PER_PAGE=9;
function drawAchievements(){
  drawBg(true);
  const top=_screenHeader(t('achievements'),achUnlockedCount()+' / '+ACHIEVEMENTS.length+' '+t('unlockedWord'),()=>goto('menu'));

  // Page bounds
  const pageCount=max(1,Math.ceil(ACHIEVEMENTS.length/ACH_PER_PAGE));
  if(achPage>=pageCount)achPage=pageCount-1;
  if(achPage<0)achPage=0;
  const fromIdx=achPage*ACH_PER_PAGE;
  const toIdx=min(ACHIEVEMENTS.length,fromIdx+ACH_PER_PAGE);

  // v2 redesign: cards now use the same neutral surface tokens as
  // Settings / Levels / Stats. Done state is signalled by the BORDER
  // color (gold) and the icon tint, not by a background tint that
  // muddies on dark mode. Locked rows get a desaturated body so the
  // ladder of progress is still readable at a glance.
  const startY=top+10,cardH=56,cardGap=8,cardW=W-40,cardX=20;
  for(let i=fromIdx;i<toIdx;i++){
    const a=ACHIEVEMENTS[i];
    const y=startY+(i-fromIdx)*(cardH+cardGap);
    const done=!!achUnlocked[a.id];
    // Surface (neutral for both states; only the rim differs)
    X.fillStyle = done ? TH.surface : (darkMode ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.025)');
    X.beginPath();X.roundRect(cardX,y,cardW,cardH,12);X.fill();
    X.strokeStyle = done ? TH.star : TH.border;
    X.lineWidth = done ? 1.5 : 1;
    X.beginPath();X.roundRect(cardX,y,cardW,cardH,12);X.stroke();
    // Icon
    drawAchIcon(a.id,cardX+28,y+cardH/2,15,done?TH.star:TH.textDim);
    // Name + desc
    txt(achName(a),cardX+58,y+19,12,done?TH.text:TH.textSec,'left','700');
    txt(achDesc(a),cardX+58,y+38,10,done?TH.textSec:TH.textDim,'left');
    // Reward — right-anchored
    const rewardStr='+'+a.reward;
    const rightEdge=cardX+cardW-14;
    txt(rewardStr,rightEdge,y+cardH/2,11,done?TH.star:TH.textDim,'right');
    const textApproxW=rewardStr.length*6.5;
    drawCoin(rightEdge-textApproxW-7,y+cardH/2,6);
  }

  // Pagination — chevron pills, matches drawLevels.
  if(pageCount>1){
    const pagY=H-56-safeBottom;
    if(achPage>0){
      const px=W/2-90, pw=40, ph=34;
      const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
      X.fillStyle=hv?TH.btnHover:TH.btnBg;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
      X.strokeStyle=TH.border;X.lineWidth=1;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
      _drawChevron(px,pagY,7,TH.text,'left');
      if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;achPage--}
    }
    txt((achPage+1)+' / '+pageCount,W/2,pagY,12,TH.textSec,'center','700');
    if(achPage<pageCount-1){
      const px=W/2+90, pw=40, ph=34;
      const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
      X.fillStyle=hv?TH.btnHover:TH.btnBg;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
      X.strokeStyle=TH.border;X.lineWidth=1;
      X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
      _drawChevron(px,pagY,7,TH.text,'right');
      if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;achPage++}
    }
  }

}

// Achievement unlock popup — animates at top of screen
function drawAchPopup(){
  if(!achPopup)return;
  achPopup.t+=dt;
  const dur=3.5;
  if(achPopup.t>=dur){achPopup=null;return}
  const a=ACHIEVEMENTS.find(x=>x.id===achPopup.id);
  if(!a){achPopup=null;return}
  const p=achPopup.t/dur;
  // Slide in (0-0.2), hold (0.2-0.85), slide out (0.85-1)
  let offY;
  if(p<.15)offY=-80+(p/.15)*80;
  else if(p>.85)offY=-((p-.85)/.15)*80;
  else offY=0;

  // py is safe-area aware — clears the Dynamic Island on every iPhone.
  const pw=320,ph=58,px=(W-pw)/2,py=Math.max(60,safeTop+20)+offY;
  // Subtle drop shadow via stacked fills (cheap) instead of shadowBlur
  // (expensive every frame on iOS WebKit).
  X.fillStyle='rgba(0,0,0,.10)';
  X.beginPath();X.roundRect(px,py+3,pw,ph,14);X.fill();
  X.fillStyle='rgba(0,0,0,.06)';
  X.beginPath();X.roundRect(px,py+6,pw,ph,14);X.fill();
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(px,py,pw,ph,14);X.fill();
  X.strokeStyle=TH.star+'80';X.lineWidth=2;
  X.beginPath();X.roundRect(px,py,pw,ph,14);X.stroke();
  // Star icon
  drawStar(px+28,py+ph/2,14,true);
  // Text
  txt(t('achUnlocked'),px+50,py+17,8,TH.star,'left','700');
  txtP(achName(a),px+50,py+36,12,TH.text,'left');
  // Reward — inside the box
  drawCoin(px+pw-40,py+ph/2,7);
  txt('+'+a.reward,px+pw-28,py+ph/2,10,TH.star,'left');
}

// --- SETTINGS ---
let resetConfirm=false;
// ---------- Settings helpers (v2 redesign — iOS-style grouped lists) ----------
//
// Was: 5 big tinted-pill buttons stacked vertically, every one same
// shape/size, "Theme: Dark" / "Sound: ON" mashed together. Read like a
// raw HTML form. Now: section headers + grouped rows on a card surface,
// each row is icon + label + value/toggle/chevron. Direct lift from
// the iOS HIG settings pattern with our minimal stroke-icon vocabulary.

function _drawSectionHeader(text, y){
  txt(text.toUpperCase(), 30, y, 9, TH.textSec, 'left', '700');
}

// Single grouped-list card — pass an array of row renderers, returns the y
// below the card. Each row gets divider line between (except last).
//
// Card content is CLIPPED to the rounded outer shape so the hover row
// highlight, dividers, and any row content can't bleed past the
// corners. Without the clip, the corner rows show a rectangular hover
// rect that pokes outside the 16-px corner radius — user explicitly
// flagged this ("свечение по углам выходит за рамки").
function _drawSettingsCard(yTop, rows){
  const cardX = 20, cardW = W - 40;
  const rowH = 56;
  const cardH = rowH * rows.length;
  // Surface + outline (drawn BEFORE the clip so the stroke renders at
  // full thickness on the rim, not half-thickness inside it).
  X.fillStyle = TH.surface;
  X.beginPath(); X.roundRect(cardX, yTop, cardW, cardH, 16); X.fill();
  X.strokeStyle = TH.border; X.lineWidth = 1;
  X.beginPath(); X.roundRect(cardX, yTop, cardW, cardH, 16); X.stroke();
  // Clip subsequent draws to the card silhouette — the highlight in
  // _settingsRow stays a clean rect now (cheap, no per-row corner
  // detection), but the rounded clip eats whatever pokes past.
  X.save();
  X.beginPath(); X.roundRect(cardX, yTop, cardW, cardH, 16);
  X.clip();
  for (let i = 0; i < rows.length; i++) {
    const ry = yTop + i * rowH;
    rows[i](cardX, ry, cardW, rowH);
    if (i < rows.length - 1) {
      X.strokeStyle = TH.border;
      X.lineWidth = 0.7;
      X.beginPath();
      X.moveTo(cardX + 56, ry + rowH);
      X.lineTo(cardX + cardW - 16, ry + rowH);
      X.stroke();
    }
  }
  X.restore();
  return yTop + cardH;
}

// Hit-test wrapper — draws the row, returns whether it was tapped.
// Standalone rows (not inside a card — e.g. inline Cancel link, Back
// link) get a rounded-pill highlight via passing `inCard=false`. Rows
// inside a card pass `inCard=true` so the parent clip handles the
// corner trimming and we just paint a plain rect.
function _settingsRow(rx, ry, rw, rh, draw, inCard){
  const blocked = _inputBlocked();
  const hv = !blocked && mx >= rx && mx <= rx + rw && my >= ry && my <= ry + rh;
  if (hv) {
    X.fillStyle = darkMode ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.04)';
    X.beginPath();
    if (inCard === false) {
      // No surrounding clip → the highlight itself must be rounded.
      X.roundRect(rx, ry, rw, rh, rh / 2);
    } else {
      X.rect(rx, ry, rw, rh);
    }
    X.fill();
  }
  draw(rx, ry, rw, rh, hv);
  if (!blocked && tapped && tapX >= rx && tapX <= rx + rw && tapY >= ry && tapY <= ry + rh) {
    sfx.tap(); tapped = false;
    return true;
  }
  return false;
}

// "No ads" glyph — a small ad-banner rectangle with a diagonal slash through it.
function _drawNoAdsIcon(cx, cy, col){
  X.save();
  X.strokeStyle = col; X.lineWidth = 1.7; X.lineCap = 'round'; X.lineJoin = 'round';
  X.beginPath(); X.roundRect(cx - 8, cy - 6, 16, 12, 3); X.stroke();
  X.beginPath(); X.moveTo(cx - 10, cy + 8); X.lineTo(cx + 10, cy - 8); X.stroke();
  X.restore();
}

// iOS-style toggle switch. ON = filled accent track + thumb on right.
// OFF = grey track + thumb on left.
function _drawToggle(cx, cy, on){
  const tw = 44, th = 26, r = th / 2;
  const x = cx - tw / 2, y = cy - th / 2;
  X.fillStyle = on ? TH.accent : (darkMode ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.18)');
  X.beginPath(); X.roundRect(x, y, tw, th, r); X.fill();
  // Thumb — pure white circle for both states (matches iOS)
  const thumbX = on ? x + tw - r : x + r;
  X.fillStyle = '#ffffff';
  X.beginPath(); X.arc(thumbX, cy, r - 3, 0, TAU); X.fill();
  // Subtle thumb shadow
  X.fillStyle = 'rgba(0,0,0,.10)';
  X.beginPath(); X.arc(thumbX, cy + 1, r - 3, 0, TAU); X.fill('evenodd');
}

// Chevron glyph in any of 4 directions. `dir` = 'right' (default) /
// 'left' / 'up' / 'down'. Used for navigation rows (›), the Back link
// (‹), the update banner (↑), and any future drop-down toggles (∨).
function _drawChevron(cx, cy, sz, col, dir){
  X.save();
  X.strokeStyle = col || TH.textSec;
  X.lineWidth = 2;
  X.lineCap = 'round'; X.lineJoin = 'round';
  X.translate(cx, cy);
  // Rotate the canvas so we can write a single "right-pointing" path
  // and let the transform handle the other three directions.
  if (dir === 'left')      X.rotate(PI);
  else if (dir === 'up')   X.rotate(-PI/2);
  else if (dir === 'down') X.rotate(PI/2);
  X.beginPath();
  X.moveTo(-sz * 0.3, -sz * 0.5);
  X.lineTo( sz * 0.3, 0);
  X.lineTo(-sz * 0.3,  sz * 0.5);
  X.stroke();
  X.restore();
}

// Icon strip — minimal stroke glyphs matching the heart/star/coin family.
function _drawSettingsIcon(name, x, y, sz, col){
  X.save();
  X.strokeStyle = col;
  X.fillStyle = col;
  X.lineWidth = 1.6;
  X.lineCap = 'round'; X.lineJoin = 'round';
  if (name === 'globe') {
    X.beginPath(); X.arc(x, y, sz, 0, TAU); X.stroke();
    X.beginPath(); X.ellipse(x, y, sz * 0.45, sz, 0, 0, TAU); X.stroke();
    X.beginPath(); X.moveTo(x - sz, y); X.lineTo(x + sz, y); X.stroke();
  } else if (name === 'speaker') {
    X.beginPath();
    X.moveTo(x - sz * 0.6, y - sz * 0.35);
    X.lineTo(x - sz * 0.2, y - sz * 0.35);
    X.lineTo(x + sz * 0.2, y - sz * 0.7);
    X.lineTo(x + sz * 0.2, y + sz * 0.7);
    X.lineTo(x - sz * 0.2, y + sz * 0.35);
    X.lineTo(x - sz * 0.6, y + sz * 0.35);
    X.closePath(); X.fill();
    // Sound waves
    X.beginPath(); X.arc(x + sz * 0.5, y, sz * 0.45, -PI / 3, PI / 3); X.stroke();
    X.beginPath(); X.arc(x + sz * 0.5, y, sz * 0.75, -PI / 3, PI / 3); X.stroke();
  } else if (name === 'moon') {
    X.beginPath();
    X.arc(x, y, sz, PI * 0.25, PI * 1.75, false);
    X.arc(x + sz * 0.45, y - sz * 0.05, sz * 0.95, PI * 1.7, PI * 0.3, true);
    X.closePath(); X.fill();
  } else if (name === 'contrast') {
    X.beginPath(); X.arc(x, y, sz, 0, TAU); X.stroke();
    X.beginPath(); X.arc(x, y, sz, -PI / 2, PI / 2); X.fill();
  } else if (name === 'coin') {
    drawCoin(x, y, sz);
  } else if (name === 'trash') {
    X.beginPath();
    X.moveTo(x - sz * 0.55, y - sz * 0.55);
    X.lineTo(x + sz * 0.55, y - sz * 0.55);
    X.stroke();
    X.beginPath();
    X.moveTo(x - sz * 0.30, y - sz * 0.55);
    X.lineTo(x - sz * 0.30, y - sz * 0.85);
    X.lineTo(x + sz * 0.30, y - sz * 0.85);
    X.lineTo(x + sz * 0.30, y - sz * 0.55);
    X.stroke();
    // Body
    X.beginPath();
    X.roundRect(x - sz * 0.45, y - sz * 0.35, sz * 0.9, sz * 1.15, sz * 0.10);
    X.stroke();
    // Vertical lines inside
    X.beginPath();
    X.moveTo(x - sz * 0.20, y - sz * 0.18); X.lineTo(x - sz * 0.20, y + sz * 0.62);
    X.moveTo(x, y - sz * 0.18); X.lineTo(x, y + sz * 0.62);
    X.moveTo(x + sz * 0.20, y - sz * 0.18); X.lineTo(x + sz * 0.20, y + sz * 0.62);
    X.stroke();
  }
  X.restore();
}

// v3 sub-screen header: the same bare back chevron as the in-game HUD,
// title centred, coin balance right. Stats, achievements and levels had a
// BACK pill at the bottom, settings and skins a "‹ BACK" label top-left —
// three back controls for one action. Returns the y where content may
// start (below the header, clear of a notch).
function _screenHeader(title,sub,onBack){
  const hy=max(62,safeTop+20);
  const blocked=_inputBlocked();
  const hv=!blocked&&abs(mx-26)<22&&abs(my-hy)<22;
  X.save();
  X.strokeStyle=hv?TH.text:TH.textSec;X.lineWidth=2.6;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.moveTo(31,hy-9);X.lineTo(22,hy);X.lineTo(31,hy+9);X.stroke();
  X.restore();
  txtP(title,W/2,hy,22,TH.text);
  if(sub)txt(sub,W/2,hy+24,12,TH.textSec);

  if(!blocked&&tapped&&abs(tapX-26)<24&&abs(tapY-hy)<24){sfx.tap();tapped=false;onBack()}
  return max(100,hy+38);
}

      (rx, ry, rw, rh) => {

    // small CANCEL link below to dismiss.
    yCursor = _drawSettingsCard(yCursor, [
      (rx, ry, rw, rh) => {
        if (_settingsRow(rx, ry, rw, rh, (rx, ry, rw, rh) => {
          _drawSettingsIcon('trash', rx + 28, ry + rh / 2, 10, TH.arrowBlock);
          txt(t('yesReset'), rx + 56, ry + rh / 2, 14, TH.arrowBlock, 'left');
        })) {
          const PROGRESS_KEYS = ['ae_level', 'ae_maxlevel', 'ae_coins', 'ae_stars', 'ae_ach',
            'ae_total_coins', 'ae_streakdays', 'ae_lastday', 'ae_perfects', 'ae_dailies',
            'ae_nohint', 'ae_fastest', 'ae_playtime', 'ae_skins', 'ae_skin'];
          // NOTE: ae_noads (Remove Ads purchase) is intentionally NOT reset —
          // a progress wipe must never revoke a real paid purchase.
          for (const k of PROGRESS_KEYS) localStorage.removeItem(k);
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && (k.startsWith('ae_best_') || k.startsWith('ae_daily_') || k.startsWith('ae_weekly_')))
              localStorage.removeItem(k);
          }
          level = 1; maxLevel = 1; coins = STARTING_COINS; stars = {}; totalStars = 0;
          achUnlocked = {}; totalPerfect = 0; totalDailies = 0; noHintCount = 0;
          totalCoinsEarned = 0; streakDays = 0; totalPlayTime = 0; fastestLevel = 99999;
          lastPlayDay = 0; hintUsedThisLevel = false;
          ownedSkins = new Set(['classic']); activeSkin = 'classic';
          resetConfirm = false; save();
          goto('menu');
        }
      },
    ]);
    // Inline cancel link beneath — small, neutral, no card.
    yCursor += 6;
    if (_settingsRow(W / 2 - 60, yCursor, 120, 30, (rx, ry, rw, rh) => {
      txt(t('cancel'), rx + rw / 2, ry + rh / 2, 13, TH.textSec);
    }, false)) resetConfirm = false;
  }
}

// --- LANGUAGE PICKER MODAL ---
// Shown over any screen; absorbs all taps until the user picks a language or
// taps outside the panel. Lists every language in LANGS, current one marked.
//
// v2 redesign: matches the Settings card visual language. Panel is
// the TH.surface token, hairline TH.border outline, hover/selected
// rows use the same neutral tint as _settingsRow. No more bespoke
// rgba colour mixing per surface — every modal/card in the app reads
// from the same palette tokens so dark mode keeps its colour family
// consistent.
function drawLangPicker(){
  // Dim backdrop
  X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,0,W,H);
  const rowH=46;
  const panelW=300, panelH=Math.min(LANGS.length*rowH+78, H-100);
  const px=(W-panelW)/2, py=(H-panelH)/2;
  // Panel surface
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.fill();
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.stroke();
  // Title
  txtP(t('language'),W/2,py+30,18,TH.text);
  // Clip the row list to the rounded panel so hover highlights at the
  // first/last row don't poke past the corners — same trick as the
  // Settings cards.
  X.save();
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.clip();
  const startY=py+58, maxRows=Math.floor((panelH-72)/rowH);
  for(let i=0;i<Math.min(LANGS.length,maxRows);i++){
    const L=LANGS[i];
    const ry=startY+i*rowH;
    const sel=L.code===lang;
    const hv=mx>px&&mx<px+panelW&&my>=ry&&my<=ry+rowH;
    if(hv){
      X.fillStyle=darkMode?'rgba(255,255,255,.05)':'rgba(0,0,0,.04)';
      X.fillRect(px,ry,panelW,rowH);
    }
    txt(L.name, W/2, ry+rowH/2, 15, sel?TH.accent:TH.text);
    // Checkmark for selected language — small canvas-stroked tick to
    // match the rest of the icon family (no font fallback).
    if(sel){
      X.save();
      X.strokeStyle=TH.accent;X.lineWidth=2.2;X.lineCap='round';X.lineJoin='round';
      const ckx=px+panelW-26, cky=ry+rowH/2;
      X.beginPath();
      X.moveTo(ckx-7,cky);X.lineTo(ckx-2,cky+5);X.lineTo(ckx+7,cky-6);
      X.stroke();
      X.restore();
    }
    if(tapped && tapX>px && tapX<px+panelW && tapY>=ry && tapY<=ry+rowH){
      lang=L.code;_safeSet('ae_lang',lang);
      langPickerOpen=false;sfx.tap();haptic(8);tapped=false;
      X.restore();
      return;
    }
  }
  X.restore();
  // Close (taps outside panel) — checked LAST so row taps win
  if(tapped&&(tapX<px||tapX>px+panelW||tapY<py||tapY>py+panelH)){
    langPickerOpen=false;tapped=false;
  }
}

// ── v2.0: Daily login reward modal ──────────────────────────────────
// Same overlay pattern as drawLangPicker: dim backdrop, TH.surface panel,
// input blocked underneath via _inputBlocked().
function _loginClaimableToday(){return loginLast!==getDailySeed()}
function claimLoginReward(){
  const today=getDailySeed();
  if(loginLast===today)return 0;              // already claimed today
  if(loginLast<today-1)loginCycle=0;          // missed a day → cycle resets
  const idx=loginCycle;
  const amount=LOGIN_REWARDS[idx];
  coins+=amount;totalCoinsEarned+=amount;
  if(idx===3){bstShield++;_safeSet('ae_bst_shield',bstShield);}
  if(idx===6){bstZap++;_safeSet('ae_bst_zap',bstZap);}
  loginTotal++;loginCycle=(idx+1)%7;loginLast=today;
  _safeSet('ae_coins',coins);
  _safeSet('ae_login_cycle',loginCycle);
  _safeSet('ae_login_last',loginLast);
  _safeSet('ae_login_total',loginTotal);
  checkAchievements({loginTotal,loginCycleDone:idx===6});
  save();
  return amount;
}
function drawLoginReward(){
  X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,0,W,H);
  const panelW=328,panelH=336;
  const px=(W-panelW)/2,py=(H-panelH)/2;
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.fill();
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(px,py,panelW,panelH,18);X.stroke();
  txtP(t('loginTitle'),W/2,py+30,18,TH.text);

  const claimable=_loginClaimableToday();
  // Effective card index for TODAY: a missed day shows the cycle reset.
  const effCycle=(claimable&&loginLast<getDailySeed()-1)?0:loginCycle;

  // 7 day-cards in a 4+3 grid
  const cw=68,ch=76,gapX=10,gapY=12;
  const gridW=4*cw+3*gapX;
  const x0=(W-gridW)/2,y0=py+52;
  for(let i=0;i<7;i++){
    const row=i<4?0:1;
    const col=i<4?i:i-4;
    const rowW=row===0?gridW:3*cw+2*gapX;
    const rx=(row===0?x0:(W-rowW)/2)+col*(cw+gapX);
    const ry=y0+row*(ch+gapY);
    // After claiming, loginCycle points at TOMORROW's card; a wrap to 0
    // right after day 7 means the whole week is done — show all claimed.
    const claimed=claimable?i<effCycle:(loginCycle===0?true:i<loginCycle);
    const isToday=claimable&&i===effCycle;
    // Card
    X.save();
    if(claimed)X.globalAlpha=.45;
    X.fillStyle=darkMode?'rgba(255,255,255,.07)':'rgba(255,255,255,.75)';
    X.beginPath();X.roundRect(rx,ry,cw,ch,12);X.fill();
    if(isToday){
      const pulse=.7+.3*sin(gt*4);
      X.strokeStyle=TH.accent;X.lineWidth=2;X.globalAlpha=pulse;
      X.beginPath();X.roundRect(rx+1,ry+1,cw-2,ch-2,11);X.stroke();
      X.globalAlpha=1;
    }else{
      X.strokeStyle=TH.border;X.lineWidth=1;
      X.beginPath();X.roundRect(rx,ry,cw,ch,12);X.stroke();
    }
    txt(t('day')+' '+(i+1),rx+cw/2,ry+14,10,claimed?TH.textDim:TH.textSec);
    drawCoin(rx+cw/2-(i===3||i===6?12:0),ry+38,8);
    // Day 4 bonus: shield glyph. Day 7: zap bolt. Tiny, next to the coin.
    if(i===3||i===6){
      const bx=rx+cw/2+13,by=ry+38;
      X.strokeStyle=TH.accentDeep;X.lineWidth=1.8;X.lineCap='round';X.lineJoin='round';
      if(i===3){ // shield
        X.beginPath();X.moveTo(bx,by-6);X.lineTo(bx+5,by-4);X.lineTo(bx+5,by+1);
        X.quadraticCurveTo(bx+5,by+5,bx,by+7);X.quadraticCurveTo(bx-5,by+5,bx-5,by+1);
        X.lineTo(bx-5,by-4);X.closePath();X.stroke();
      }else{ // bolt
        X.beginPath();X.moveTo(bx+2,by-7);X.lineTo(bx-3,by+1);X.lineTo(bx,by+1);
        X.lineTo(bx-2,by+7);X.lineTo(bx+3,by-1);X.lineTo(bx,by-1);X.closePath();X.stroke();
      }
    }
    txt('+'+LOGIN_REWARDS[i],rx+cw/2,ry+60,12,claimed?TH.textDim:TH.star);
    // Checkmark on claimed cards
    if(claimed){
      X.globalAlpha=1;
      // A badge on the corner, not a tick inside the card: inside, it sat
      // on the day number ("День ✓").
      const cx=rx+cw-5,cy=ry+5;
      X.fillStyle=TH.success;X.beginPath();X.arc(cx,cy,8,0,TAU);X.fill();
      X.strokeStyle='#ffffff';X.lineWidth=2;X.lineCap='round';X.lineJoin='round';
      X.beginPath();X.moveTo(cx-3.5,cy);X.lineTo(cx-1,cy+2.6);X.lineTo(cx+3.6,cy-2.6);X.stroke();
    }
    X.restore();
  }

  // Footer: play streak (reuses streakDays — the PLAY streak counter)
  txt(t('playStreak')+': '+streakDays,W/2,py+panelH-78,12,TH.textSec);

  // CLAIM button / come-back label. drawBigBtn is used for the VISUAL
  // only — its click handling is suppressed by _inputBlocked() while this
  // modal is open (correct for buttons UNDER the modal), so the tap is
  // handled with a raw hit-test here, same as drawLangPicker's rows.
  const by=py+panelH-38;
  if(claimable){
    drawBigBtn(t('claim'),W/2,by,200,44,TH.accent);
    if(tapped&&abs(tapX-W/2)<100&&abs(tapY-by)<22){
      const amount=claimLoginReward();
      if(amount){spawnFloater(W/2,py+panelH-78,'+'+amount,TH.star);sfx.fanfare();haptic(12);}
      tapped=false;
    }
  }else{
    txt(t('comeBack'),W/2,by,13,TH.textSec);
  }

  // Tap outside closes
  if(tapped&&(tapX<px||tapX>px+panelW||tapY<py||tapY>py+panelH)){
    loginRewardOpen=false;tapped=false;
  }
}

// --- v2.1 INTRO CARD ---
// One-time explainer over the board for a new mechanic or a newly unlocked
// booster. It owns every tap while up (stashed in loop() as _cardTap) and
// the level clock is paused underneath. A booster card hands over a free
// charge, so the button says what it gives.
function _wrapLines(text,maxW,sz){
  X.font=`600 ${sz}px Nunito,sans-serif`;
  const lines=[];let cur='';
  for(const w of text.split(' ')){
    const next=cur?cur+' '+w:w;
    if(cur&&X.measureText(next).width>maxW){lines.push(cur);cur=w}else cur=next;
  }
  if(cur)lines.push(cur);
  return lines;
}
function drawIntroCard(){
  const k=_introCard.kind,isMech=k==='lock'||k==='bomb';
  X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,0,W,H);
  const pw=308,ph=320,px=(W-pw)/2,py=(H-ph)/2;
  X.fillStyle=TH.surface;
  X.beginPath();X.roundRect(px,py,pw,ph,18);X.fill();
  X.strokeStyle=TH.border;X.lineWidth=1;
  X.beginPath();X.roundRect(px,py,pw,ph,18);X.stroke();

  const iy=py+62;
  if(k==='lock'){
    _badge(W/2-30,iy,24,PAIR_COLORS[0]);_glyphLock(W/2-30,iy,15,'#fff',false);
    _badge(W/2+30,iy,24,PAIR_COLORS[0]);_glyphKey(W/2+30,iy,15,'#fff');
  }else if(k==='bomb'){
    _bombGlyph(W/2-4,iy+4,24,5);
  }else{
    X.fillStyle=TH.star+'33';
    X.beginPath();X.arc(W/2,iy,30,0,TAU);X.fill();
    _glyphBooster(k,W/2,iy,2.1,TH.text);
  }
  txt(isMech?t('newMechanic'):t('newBooster'),W/2,py+112,11,TH.textSec,'center','700');
  txtD(t(isMech?k+'Title':k),W/2,py+138,22,TH.text);
  const lines=_wrapLines(t(k+'Body'),pw-48,14);
  for(let i=0;i<lines.length;i++)txt(lines[i],W/2,py+174+i*20,14,TH.textSec);

  // drawBigBtn is the visual only — its own click is suppressed by
  // _inputBlocked() while the card is up, same as the login modal.
  const by=py+ph-38;
  drawBigBtn(isMech?t('gotIt'):t('takeGift'),W/2,by,210,44,TH.accent);
  if(_cardTap&&abs(_cardTap.x-W/2)<105&&abs(_cardTap.y-by)<22){
    if(isMech)_safeSet('ae_intro_'+k,'1');
    else{
      _safeSet('ae_bintro_'+k,'1');
      if(k==='shield'){bstShield++;_safeSet('ae_bst_shield',bstShield);}
      else if(k==='zap'){bstZap++;_safeSet('ae_bst_zap',bstZap);}
      else{bstReveal++;_safeSet('ae_bst_reveal',bstReveal);}
      spawnFloater(W/2,by-44,'+1',TH.star);
    }
    sfx.fanfare();haptic(12);
    _introCard=null;
  }
  _cardTap=null;
}

// --- LEVELS ---
// Paginated: 25 levels per page (5×5 grid). Unlimited pages. Each card shows

// the level number, stars earned, and lock state.
const LEVELS_PER_PAGE=25;
function drawLevels(){
  drawBg(true);

  const fromLv=levelsPage*LEVELS_PER_PAGE+1;
  const toLv=fromLv+LEVELS_PER_PAGE-1;
  const gridTop=_screenHeader(t('levels'),fromLv+' – '+toLv,()=>goto('menu'));

  // Grid of 25 level cards (5×5), sized to the screen width — fixed 52px
  // tiles left a third of the screen empty under the grid.
  const cols=5,rows=5;
  const cellW=min(78,floor((W-30)/cols)),cellH=cellW+4;
  const gridW=cols*cellW;
  const startX=(W-gridW)/2;
  const startY=gridTop+4;

  for(let i=0;i<cols*rows;i++){
    const lv=fromLv+i;
    const r=floor(i/cols),c=i%cols;
    const x=startX+c*cellW+cellW/2;
    const y=startY+r*cellH+cellH/2;

    const unlocked=lv<=maxLevel;
    const current=lv===level;
    const done=stars[lv]>0;
    const s=stars[lv]||0;
    const cardW=cellW-10,cardH=cellH-12,lip=4;
    const hv=abs(mx-x)<cardW/2&&abs(my-y)<cardH/2;

    // v3 tiles share the button language: a solid face on a darker lip.
    // Current level = accent face; HARD levels show a purple number (and
    // lip) so the sawtooth is visible from the map, the way the genre
    // flags its boss levels ahead of time; locked = flat and faded.
    const hard=isHardLevel(lv)&&!(window.HANDCRAFTED_LEVELS&&window.HANDCRAFTED_LEVELS[lv]);
    const top=y-cardH/2-lip/2;
    if(unlocked){
      const face=current?TH.accent:(hv?TH.btnHover:TH.btnBg);
      const lipCol=current?_shade(TH.accent,.78):hard?_shade(HARD_COLOR,.85):_shade(TH.btnBg,.9);
      X.fillStyle=lipCol;X.beginPath();X.roundRect(x-cardW/2,top+lip,cardW,cardH,12);X.fill();
      X.fillStyle=face;X.beginPath();X.roundRect(x-cardW/2,top,cardW,cardH,12);X.fill();
    }else{
      X.fillStyle=darkMode?'rgba(255,255,255,.04)':'rgba(61,43,31,.04)';
      X.beginPath();X.roundRect(x-cardW/2,top+lip/2,cardW,cardH,12);X.fill();
    }
    const numCol=!unlocked?TH.textDim:current?'#ffffff':hard?HARD_COLOR:TH.text;
    txt(lv+'',x,top+cardH*.40,unlocked?19:15,numCol,'center','800');
    for(let j=0;j<3;j++){
      drawStar(x-12+j*12,top+cardH*.75,4.6,done&&j<s);
    }
    // Locked indicator — small horizontal dash under the level number
    if(!unlocked){
      X.strokeStyle=TH.textDim;X.lineWidth=1.2;X.lineCap='round';
      X.beginPath();X.moveTo(x-7,top+cardH*.58);X.lineTo(x+7,top+cardH*.58);X.stroke();
    }
    // Tap
    if(tapped&&abs(tapX-x)<cardW/2&&abs(tapY-y)<cardH/2&&unlocked){
      sfx.tap();tapped=false;
      goto('play',()=>{level=lv;isDaily=false;isWeekly=false;generateLevel(level)});
      return;
    }
  }

  // Pagination — chevron icons rather than ASCII arrows.
  const pagY=min(H-60-safeBottom,startY+rows*cellH+44);
  const hasPrev=levelsPage>0;
  if(hasPrev){
    const px=W*.28, pw=88, ph=36;
    const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
    X.fillStyle=hv?TH.btnHover:TH.btnBg;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
    X.strokeStyle=TH.border;X.lineWidth=1;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
    _drawChevron(px-18,pagY,7,TH.text,'left');
    txt(t('prevPage'),px+8,pagY,12,TH.text);
    if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;levelsPage--}
  }
  txt(t('pageWord')+' '+(levelsPage+1),W/2,pagY,11,TH.textSec,'center','700');
  {
    const px=W*.72, pw=88, ph=36;
    const hv=abs(mx-px)<pw/2&&abs(my-pagY)<ph/2;
    X.fillStyle=hv?TH.btnHover:TH.btnBg;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.fill();
    X.strokeStyle=TH.border;X.lineWidth=1;
    X.beginPath();X.roundRect(px-pw/2,pagY-ph/2,pw,ph,ph/2);X.stroke();
    txt(t('nextPage'),px-10,pagY,12,TH.text);
    _drawChevron(px+18,pagY,7,TH.text,'right');
    if(tapped&&abs(tapX-px)<pw/2&&abs(tapY-pagY)<ph/2){sfx.tap();tapped=false;levelsPage++}
  }

}
