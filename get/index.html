<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stray Arrows — get the game</title>
<meta name="description" content="Stray Arrows — the arrow maze puzzle. Free on the App Store and Google Play.">
<meta property="og:title" content="Stray Arrows">
<meta property="og:description" content="Untangle it — if you can. Free on the App Store and Google Play.">
<meta property="og:image" content="https://jumakho2013-alt.github.io/stray-arrows/get/share.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6ebdd">
<link rel="icon" href="icon.png">
<script>
// One link for the ad: an iPhone goes to the App Store, an Android phone to
// Google Play, at once. Anything else (a computer, an unknown browser) stays
// on this page and picks a store by hand. utm_* in the link are passed on to
// Google Play as the install referrer, so Play Console can count installs
// that came from a given ad.
(function () {
  var IOS = 'https://apps.apple.com/app/id6763406927';
  var PKG = 'com.strayarrows.puzzle';
  var q = location.search.slice(1), ref = [];
  q.split('&').forEach(function (kv) { if (/^utm_[a-z]+=/.test(kv)) ref.push(kv); });
  var PLAY = 'https://play.google.com/store/apps/details?id=' + PKG +
    (ref.length ? '&referrer=' + encodeURIComponent(ref.join('&')) : '');
  window.__stores = { ios: IOS, play: PLAY };
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  if (ios) { location.replace(IOS); return; }
  if (android) {
    // The Play Store app itself; the web page if the browser can't open it
    // (some in-app browsers can't), after a beat.
    var intent = 'intent://details?id=' + PKG + (ref.length ? '&referrer=' + encodeURIComponent(ref.join('&')) : '') +
      '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
    location.href = intent;
    setTimeout(function () { if (!document.hidden) location.replace(PLAY); }, 1200);
  }
})();
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f6ebdd;--bg2:#efd8bf;--text:#3b2a22;--sec:#7a6558;--accent:#d97a3a;--btn:#2b211c;--btnText:#fff;--ink:59,42,34}
  @media (prefers-color-scheme:dark){:root{--bg:#2a201d;--bg2:#1f1816;--text:#f3e9dc;--sec:#bba796;--accent:#f0a06a;--btn:#f3e9dc;--btnText:#2a201d;--ink:243,233,220}}
  html,body{height:100%}
  body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;min-height:100vh;overflow:hidden}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  main{position:relative;z-index:1;width:100%;max-width:400px;text-align:center;padding:34px 22px}
  /* a soft clearing behind the content, so the arrows never run under the words */
  main::before{content:"";position:absolute;inset:-60px -40px;z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,var(--bg) 62%,transparent)}
  img{width:144px;height:144px;border-radius:33px;box-shadow:0 16px 38px rgba(40,22,12,.32)}
  h1{margin-top:24px;font-size:48px;line-height:1.02;font-weight:800;letter-spacing:.04em}
  h1 span{display:block;color:var(--accent)}
  p{margin-top:14px;color:var(--sec);font-size:20px;font-weight:650}
  .btns{margin-top:32px;display:flex;flex-direction:column;gap:14px}
  a.store{display:flex;align-items:center;justify-content:center;height:72px;border-radius:20px;background:var(--btn);color:var(--btnText);
    text-decoration:none;box-shadow:0 10px 24px rgba(40,22,12,.22);transition:transform .15s ease}
  a.store:active{transform:scale(.97)}
  a.store small{display:block;font-size:14px;font-weight:600;opacity:.75;line-height:1.15}
  a.store b{display:block;font-size:25px;font-weight:800;line-height:1.1;letter-spacing:.01em}
  a.store:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .free{margin-top:20px;font-size:15px}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <img src="icon.png" alt="Stray Arrows icon">
  <h1>STRAY<span>ARROWS</span></h1>
  <p id="tag">Untangle it — if you can</p>
  <div class="btns">
    <a class="store" id="ios" href="https://apps.apple.com/app/id6763406927"><div><small id="ios-s">Download on the</small><b>App Store</b></div></a>
    <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.strayarrows.puzzle"><div><small id="play-s">Get it on</small><b>Google Play</b></div></a>
  </div>
  <p class="free" id="free">Free puzzle game</p>
</main>
<script>
  // the store buttons carry the ad's utm_* on to Google Play, as the redirect does
  if (window.__stores) document.getElementById('play').href = window.__stores.play;
  if (/^ru/i.test(navigator.language || '')) {
    document.documentElement.lang = 'ru';
    document.getElementById('tag').textContent = 'Распутай, если сможешь';
    document.getElementById('ios-s').textContent = 'Загрузите в';
    document.getElementById('play-s').textContent = 'Доступно в';
    document.getElementById('free').textContent = 'Бесплатная головоломка';
  }
</script>
<script>
// The game's menu backdrop, bigger: long tangled arrows on a grid, each a
// body sliding along its own winding path, fading in and out, every way.
(function () {
  var cv = document.getElementById('bg'), x = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, CS = 28, arrows = [], ink = '59,42,34';
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    CS = Math.max(24, Math.min(34, Math.round(Math.min(W, H) / 14)));
    ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || ink;
    var want = Math.round(W * H / 26000) + 8;
    arrows = []; for (var i = 0; i < want; i++) arrows.push(spawn(true));
  }
  function spawn(anywhere) {
    // a long walk on the grid that turns often and never doubles back
    var c = Math.floor(Math.random() * (W / CS + 4)) - 2, r = Math.floor(Math.random() * (H / CS + 4)) - 2;
    var d = Math.floor(Math.random() * 4), pts = [[c * CS + CS / 2, r * CS + CS / 2]], steps = 40 + Math.floor(Math.random() * 30);
    for (var s = 0; s < steps; s++) {
      if (Math.random() < .28) d = (d + (Math.random() < .5 ? 1 : 3)) % 4;
      c += DX[d]; r += DY[d]; pts.push([c * CS + CS / 2, r * CS + CS / 2]);
    }
    var len = (pts.length - 1) * CS, body = CS * (6 + Math.floor(Math.random() * 9));
    return { pts: pts, len: len, body: body, s: anywhere ? Math.random() * (len - body) : 0,
      v: CS * (1.1 + Math.random() * 1.4), a: .10 + Math.random() * .12 };
  }
  function seg(p, from, to) {   // the stretch of the path from `from` to `to` (px along it)
    var out = [], acc = 0;
    for (var i = 0; i < p.length - 1; i++) {
      var a = p[i], b = p[i + 1], l = CS, e = acc + l;
      if (e > from && acc < to) {
        var t0 = Math.max(0, (from - acc) / l), t1 = Math.min(1, (to - acc) / l);
        if (!out.length) out.push([a[0] + (b[0] - a[0]) * t0, a[1] + (b[1] - a[1]) * t0]);
        out.push([a[0] + (b[0] - a[0]) * t1, a[1] + (b[1] - a[1]) * t1]);
      }
      acc = e; if (acc >= to) break;
    }
    return out;
  }
  function draw(ar) {
    var pts = seg(ar.pts, ar.s, ar.s + ar.body); if (pts.length < 2) return;
    var life = ar.s / (ar.len - ar.body), fade = Math.min(1, life / .12, (1 - life) / .12);
    x.globalAlpha = Math.max(0, fade) * ar.a;
    x.strokeStyle = x.fillStyle = 'rgb(' + ink + ')';
    x.lineWidth = CS * .15; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]);
    var h = pts[pts.length - 1], q = pts[pts.length - 2], dx = h[0] - q[0], dy = h[1] - q[1], m = Math.hypot(dx, dy) || 1;
    dx /= m; dy /= m;
    var hl = CS * .46, hw = CS * .33, bx = h[0] - dx * hl, by = h[1] - dy * hl;
    x.lineTo(bx, by); x.stroke();
    x.beginPath(); x.moveTo(h[0], h[1]); x.lineTo(bx - dy * hw, by + dx * hw); x.lineTo(bx + dy * hw, by - dx * hw); x.closePath(); x.fill();
  }
  var last = 0;
  function frame(t) {
    var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < arrows.length; i++) {
      var ar = arrows[i];
      if (!still) ar.s += ar.v * dt;
      if (ar.s >= ar.len - ar.body) arrows[i] = ar = spawn(false);
      draw(ar);
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  size(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
