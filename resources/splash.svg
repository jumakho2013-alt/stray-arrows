<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!-- Stray Arrows splash — light (Sunset Macaron v2.5). Matches icon v3:
       warm peach bg, coral snake-arrow turning up, hero sparkle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef4e6"/>
      <stop offset="100%" stop-color="#f0dec5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="47%" r="42%">
      <stop offset="0%" stop-color="#e8a890" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#e8a890" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e8a890" stop-opacity="0"/>
    </radialGradient>
    <path id="sparkle" d="M 0,-100 C 25,-30 25,-25 100,0 C 25,25 25,30 0,100 C -25,30 -25,25 -100,0 C -25,-25 -25,-30 0,-100 Z"/>
  </defs>
  <rect width="2732" height="2732" fill="url(#bg)"/>
  <rect width="2732" height="2732" fill="url(#glow)"/>
  <g fill="#d68f7a" opacity="0.35">
    <use href="#sparkle" transform="translate(1950 900) scale(0.75)"/>
    <use href="#sparkle" transform="translate(820 1900) scale(0.55)"/>
  </g>
  <g fill="#e8b896" opacity="0.25">
    <use href="#sparkle" transform="translate(2000 1850) scale(0.40)"/>
    <use href="#sparkle" transform="translate(760 1000) scale(0.38)"/>
  </g>
  <!-- Hero arrow — dusty coral, turning up (same motif as the icon) -->
  <g stroke="#d68f7a" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="1060,1780 1060,1360 1540,1360 1540,1150"/>
  </g>
  <polygon points="1540,1000 1420,1150 1660,1150" fill="#d68f7a"/>
</svg>
