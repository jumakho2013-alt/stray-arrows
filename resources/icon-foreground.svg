<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Adaptive-icon FOREGROUND layer (Android). Composited over
    icon-background.svg by the OS, then masked to whatever shape
    the launcher decides (circle / squircle / teardrop / etc).
    Adaptive-icon spec: keep all important content inside the
    centre 660×660 safe zone; outer 182 px on each side may be
    cropped on aggressive masks.

    Hero composition: a single bold golden arrow + a 4-pointed
    sparkle anchored above its elbow. Same visual elements as the
    full icon.svg, scaled to fit the safe zone.
  -->
  <defs>
    <path id="sparkle" d="M 0,-100 C 25,-30 25,-25 100,0 C 25,25 25,30 0,100 C -25,30 -25,25 -100,0 C -25,-25 -25,-30 0,-100 Z"/>
  </defs>

  <!-- Hero arrow inside the 660-px safe zone (centre 182..842) -->
  <g stroke="#e2b35a" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="320,700 320,460 540,460 540,340"/>
  </g>
  <polygon points="540,256 470,340 610,340" fill="#e2b35a"/>

  <!-- Hero sparkle, big and bright, just below-right of the arrowhead -->
  <g fill="#f0c47a">
    <use href="#sparkle" transform="translate(640 640) scale(1.85)"/>
  </g>
  <!-- Tiny white highlight inside the sparkle -->
  <circle cx="618" cy="618" r="32" fill="#ffffff" opacity="0.40"/>

  <!-- One ambient mini-sparkle to balance the composition -->
  <g fill="#e2b35a" opacity="0.5">
    <use href="#sparkle" transform="translate(380 320) scale(0.30)"/>
  </g>
</svg>
